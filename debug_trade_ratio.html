<!DOCTYPE html>
<html>
<head>
    <title>Trade Ratio Debug Test</title>
</head>
<body>
    <h1>Trade Ratio Debug Test</h1>
    
    <div>
        <label>Default Ratio:</label>
        <input type="number" id="trade_ratio_default" value="1.0" min="0.1" max="5.0" step="0.1">
    </div>
    
    <div>
        <label>Test Group 1:</label>
        <input type="number" id="ratio_1" value="1.5" min="0.1" max="5.0" step="0.1">
    </div>
    
    <div>
        <label>Test Group 2:</label>
        <input type="number" id="ratio_2" value="2.0" min="0.1" max="5.0" step="0.1">
    </div>
    
    <button onclick="testSave()">Test Save</button>
    <button onclick="testDataCollection()">Test Data Collection</button>
    
    <div id="result"></div>
    
    <script>
        function testDataCollection() {
            const ratios = {};
            
            // Get default ratio
            ratios.default = parseFloat(document.getElementById('trade_ratio_default').value) || 1.0;
            
            // Get all group-specific ratios - find all ratio inputs directly
            const ratioInputs = document.querySelectorAll('input[id^="ratio_"]');
            
            ratioInputs.forEach(input => {
                if (input.id !== 'trade_ratio_default') {
                    const groupId = input.id.replace('ratio_', '');
                    const value = parseFloat(input.value);
                    console.log(`Processing input ${input.id}, value: ${input.value}, parsed: ${value}`);
                    if (!isNaN(value) && value >= 0.1 && value <= 5.0) {
                        ratios[groupId] = value;
                    }
                }
            });
            
            console.log('Test data collection result:', ratios);
            console.log('Found ratio inputs:', ratioInputs.length);
            
            document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(ratios, null, 2) + '</pre>';
            
            return ratios;
        }
        
        function testSave() {
            const ratios = testDataCollection();
            
            // Send data as form data
            const formData = new FormData();
            formData.append('action', 'save_trade_ratios');
            formData.append('ratios', JSON.stringify(ratios));
            
            console.log('Sending ratios:', ratios);
            console.log('FormData ratios value:', formData.get('ratios'));
            
            fetch('api/gamification_config.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(result => {
                console.log('Server response:', result);
                document.getElementById('result').innerHTML += '<br><strong>Server Response:</strong><pre>' + JSON.stringify(result, null, 2) + '</pre>';
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('result').innerHTML += '<br><strong>Error:</strong> ' + error.message;
            });
        }
    </script>
</body>
</html>
