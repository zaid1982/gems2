<!--Main layout-->

<main>
    <div class="container-fluid">
        <!--Section: Main panel-->
        <section class="mb-5 mt-lg-5 sectionPrsMain">
            <div class="card card-cascade narrower">
                <!--Section: Search Function & Chart-->
                <section>
                    <div class="row">
                        <!--Search Function-->
                        <div class="col-xl-12 col-lg-12 mr-0">
                            <div class="view view-cascade gradient-card-header rgba-cyan-strong z-depth-4">
                                <h2 class="h2-responsive mb-0">Reschedule PPM</h2>
                            </div>
                            <div class="card-body card-body-cascade">
                                <div class="card-body pt-3">
                                    <h6 class="pb-3">Search:</h6>
                                    <div class="row">
                                        <div class="col-md-12 select-outline">
                                            <select id="optPrsSiteId" class="mdb-select md-form md-outline colorful-select dropdown-info mt-0"></select>
                                            <label for="optPrsSiteId">Site</label>
                                        </div>
                                        <div class="col-md-2 select-outline">
                                            <select id="optPrsYear" class="mdb-select md-form md-outline colorful-select dropdown-info mt-0"></select>
                                            <label for="optPrsYear">Year</label>
                                        </div>
                                        <div class="col-md-4 select-outline">
                                            <select id="optPrsMonth" class="mdb-select md-form md-outline colorful-select dropdown-info mt-0"></select>
                                            <label for="optPrsMonth">Month</label>
                                        </div>
                                        <div class="col-md-6 select-outline">
                                            <select id="optPrsRescheduleStatus" class="mdb-select md-form md-outline colorful-select dropdown-info mt-0">
                                                <option value="" selected>All Status</option>
                                                <option value="Rescheduled">Rescheduled</option>
                                                <option value="Not Yet">Not Yet</option>
                                            </select>
                                            <label for="optPrsRescheduleStatus">Reschedule Status</label>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="md-form md-outline mt-0 mb-0">
                                                <input type="text" id="txtPrsListSearch" class="form-control">
                                                <label for="txtPrsListSearch" class="active">Keyword Search</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!--Chart-->
                        <!-- <<div class="col-xl-6 col-lg-12 mb-5">
                           div class="view view-cascade z-depth-4">
                                <div id="chartPrsLeaveByStatus" style="height: 440px; margin: 0"></div>
                            </div>
                        </div>-->
                    </div>
                </section>
                <!--Section: Table-->
                <section>
                    <div class="card card-cascade narrower z-depth-0">
                        <div class="view view-cascade gradient-card-header aqua-gradient narrower py-2 mx-4 mb-3 d-flex justify-content-between align-items-center z-depth-3">
                            <div>
                                <a tabindex="0" role="button" class="btn btn-outline-white btn-rounded btn-sm px-2"
                                   data-toggle="popover" data-trigger="focus" title="Track and Monitoring"
                                   data-content="Track current checkpoint for all transactions."><i class="fas fa-info mt-0 mx-1"></i></a>
                                <button type="button" id="btnDtPrsListRefresh" class="btn btn-outline-white btn-rounded btn-sm px-2" data-toggle="tooltip" data-placement="top" title="Refresh data"><i class="fas fa-sync mt-0"></i></button>
                            </div>
                            <a href="javascript:void(0);" class="text-white mx-3 pl-5">PPM List</a>
                            <div>
                                <div id="btnDtPrsListExport"></div>
                            </div>
                        </div>
                        <div class="px-4 pb-4">
                            <div class="table-responsive">
                                <table id="dtPrsList" class="table table-hover table-sm mb-0 display responsive" cellspacing="0" width="100%">
                                    <thead>
                                    <tr class="th-strong">
                                        <th scope="row" style="max-width: 30px">#</th>
                                        <th>Work Order No</th>
                                        <th>Asset No</th>
                                        <th>Asset Group</th>
                                        <th>Asset Category</th>
                                        <th>Asset Type</th>
                                        <th>Scheduled Date</th>
                                        <th>Final Date</th>
                                        <th>Frequency</th>
                                        <th>PPM Group</th>
                                        <th style="max-width: 80px">Reschedule Status</th>
                                        <th style="max-width: 70px">Status</th>
                                        <th style="width: 40px; min-width: 40px"></th>
                                    </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </section>
<!--        <div class="includeHtml" id="h-section_task_history"></div>-->

    </div>
    <div class="includeHtml" id="h-modal_change_password"></div>
    <div class="includeHtml" id="h-modal_pdf"></div>
    <div class="includeHtml" id="h-modal_ppm_reschedule"></div>

<!--Custom scripts-->
<script type="text/javascript">
    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let changePasswordClass_;
    let ppmRescheduleClass_;
    let modalPpmRescheduleClass_;

    document.addEventListener('DOMContentLoaded', function () {

        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                ppmRescheduleClass_ = new MainPpmReschedule();
                modalPpmRescheduleClass_ = new ModalPpmReschedule();

                const refSite_ = mzGetLocalArray('gems_site', versionLocal_, 'siteId', [], 'site');
                const refPpmGroup_ = mzGetLocalArray('gems_ppmGroup', versionLocal_, 'ppmGroupId', [], 'ppm_group');
                const refAssetGroup_ = mzGetLocalArray('gems_assetGroup', versionLocal_, 'assetGroupId', [], 'asset_group');
                const refAssetCategory_ = mzGetLocalArray('gems_assetCategory', versionLocal_, 'assetCategoryId', [], 'asset_category');
                const refAssetType_ = mzGetLocalArray('gems_assetType', versionLocal_, 'assetTypeId', [], 'asset_type');
                const refStatus_ = mzGetLocalArray('gems_status', versionLocal_, 'statusId');

                modalPpmRescheduleClass_.setClassFrom(ppmRescheduleClass_);
                modalPpmRescheduleClass_.init();

                ppmRescheduleClass_.setRefSite(refSite_);
                ppmRescheduleClass_.setRefPpmGroup(refPpmGroup_);
                ppmRescheduleClass_.setRefAssetGroup(refAssetGroup_);
                ppmRescheduleClass_.setRefAssetCategory(refAssetCategory_);
                ppmRescheduleClass_.setRefAssetType(refAssetType_);
                ppmRescheduleClass_.setRefStatus(refStatus_);
                ppmRescheduleClass_.setModalPpmRescheduleClass(modalPpmRescheduleClass_);
                ppmRescheduleClass_.init();
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }

            HideLoader();
        }, 300);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_ppm_reschedule.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_ppm_reschedule.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>
