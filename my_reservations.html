<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>GEMS 2.0</title>
  <link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
  <link rel="stylesheet" href="css/fontawesome-pro-6.5.1-web/css/all.min.css">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/mdb.min.css">
  <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/dataTables.bootstrap4.min.css"/>
  <link href="css/style.css" rel="stylesheet">
  <script type="text/javascript" src="js/jquery-3.7.0.min.js"></script>
  <script type="text/javascript" src="js/jquery-migrate-3.4.0.min.js"></script>
</head>
<body class="fixed-sn light-blue-skin">
<header>
  <div class="includeHtml" id="h-nav_left"></div>
  <div class="includeHtml" id="h-nav_top"></div>
</header>
<main>
  <div class="container-fluid">
    <section class="mb-5 mt-lg-5">
      <div class="page-header">
        <h2><i class="fas fa-clipboard-list mr-3"></i>My Reservations</h2>
        <p>Review and manage your space reservations</p>
      </div>

      <div class="main-content-card mb-4">
        <div class="card-header">
          <div class="header-title">Filters</div>
          <div class="d-flex align-items-center header-actions">
            <button id="btnMyResvRefresh" class="btn btn-outline-white btn-rounded btn-sm px-2" title="Refresh"><i class="fas fa-sync"></i></button>
          </div>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-md-4 select-outline">
              <select id="optMyResvSite" class="mdb-select md-form md-outline colorful-select mt-0"></select>
              <label for="optMyResvSite">Site</label>
            </div>
            <div class="col-md-4 select-outline">
              <select id="optMyResvStatus" class="mdb-select md-form md-outline colorful-select mt-0">
                <option value="">All Status</option>
                <option value="RESERVED">Reserved</option>
                <option value="CANCELED">Canceled</option>
              </select>
              <label for="optMyResvStatus">Status</label>
            </div>
            <div class="col-md-4">
              <div class="md-form md-outline mt-0">
                <input type="date" id="dtMyResvFrom" class="form-control">
                <label for="dtMyResvFrom" class="active">From</label>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <div class="md-form md-outline mt-0">
                <input type="date" id="dtMyResvTo" class="form-control">
                <label for="dtMyResvTo" class="active">To</label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="main-content-card">
        <div class="card-header">
          <div class="header-title">Reservations</div>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table id="dtMyResv" class="table table-hover mb-0 display responsive" width="100%">
              <thead>
                <tr class="th-strong">
                  <th style="width:4%">#</th>
                  <th>Space</th>
                  <th style="width:18%">Start</th>
                  <th style="width:18%">End</th>
                  <th style="width:12%">Status</th>
                  <th style="width:100px"></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- Cancel Modal -->
    <div class="modal fade" id="modalMyResvCancel" tabindex="-1" role="dialog" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header warning-color white-text"><h5 class="modal-title"><i class="fas fa-ban"></i> Cancel Reservation</h5><button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true" class="white-text">&times;</span></button></div>
          <div class="modal-body">
            <p>Provide an optional reason for cancellation:</p>
            <div class="md-form md-outline mt-0"><textarea id="txaMyResvReason" class="md-textarea form-control" rows="3"></textarea><label for="txaMyResvReason" class="active">Reason</label></div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">Close</button><button type="button" id="btnMyResvConfirmCancel" class="btn btn-warning btn-sm">Cancel Reservation</button></div>
        </div>
      </div>
    </div>

    <div class="includeHtml" id="h-modal_change_password"></div>
  </div>
</main>

<script type="text/javascript">$('.includeHtml').each(function(){ const id=$(this).attr('id'); $('#'+id).load('html/'+id.substr(2)+'.html?'+new Date().valueOf()); });</script>
<script type="text/javascript" src="js/popper.min.js"></script>
<script type="text/javascript" src="js/bootstrap.min.js"></script>
<script type="text/javascript" src="js/mdb.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.bootstrap4.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.html5.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.print.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/jszip.min.js"></script>
<script type="text/javascript" src="js/addons/moment.min.js"></script>
<script type="text/javascript" src="js/modules/toastr.js"></script>
<script type="text/javascript" src="js/common.js"></script>
<script type="text/javascript" src="js/pages/main_my_reservations.js"></script>
</body>
</html>
