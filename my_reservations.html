<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>GEMS 2.0</title>
  <link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
  <link rel="stylesheet" href="css/fontawesome-pro-6.5.1-web/css/all.min.css">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/mdb.min.css">
  <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/dataTables.bootstrap4.min.css"/>
  <link href="css/style.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-dark: #3730a3;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --light-bg: #f8fafc;
      --card-shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }
    .page-header {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 32px;
      border-radius: 16px;
      margin: 24px 0 16px 0;
      box-shadow: var(--card-shadow-lg);
      position: relative;
      overflow: hidden;
    }
    .page-header h2 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; position: relative; z-index: 1; }
    .page-header p { font-size: 1rem; opacity: 0.95; margin: 0; position: relative; z-index: 1; }
    .main-content-card { background:#fff; border-radius:.5rem; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    .main-content-card .card-header { background: linear-gradient(60deg,#26c6da,#00acc1); color:#fff; border-top-left-radius:.5rem; border-top-right-radius:.5rem; padding:.75rem 1rem; display:flex; align-items:center; justify-content:space-between; }
    .main-content-card .card-body { padding: 1rem 1.25rem; }
    .header-actions .btn { margin-left:.25rem; }
    .header-title { font-weight:600; font-size:1.1rem; letter-spacing:.2px; }
    /* Badges for status */
    .badge-modern { padding: 6px 10px; border-radius: 16px; font-size: .75rem; font-weight: 600; display:inline-block; }
    .badge-success-dark { background: rgba(16, 185, 129, 1); color: #fff; }
    .badge-warning { background: rgba(245, 158, 11, 0.9); color: #fff; }
    .badge-danger-dark { background: rgb(184, 51, 51); color: #fff; }
    .detail-grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .detail-item { padding:8px 10px; background:#f8fafc; border-radius:8px; }
    .detail-item .label { font-size:.75rem; color:#6b7280; text-transform:uppercase; letter-spacing:.04em; }
    .detail-item .value { font-size:.95rem; color:#111827; }
  </style>
  <script type="text/javascript" src="js/jquery-3.7.0.min.js"></script>
  <script type="text/javascript" src="js/jquery-migrate-3.4.0.min.js"></script>
</head>
<body class="fixed-sn light-blue-skin">
<header>
  <div class="includeHtml" id="h-nav_left"></div>
  <div class="includeHtml" id="h-nav_top"></div>
</header>
<main>
  <div class="container-fluid">
    <section class="mb-5 mt-lg-5">
      <div class="page-header">
        <h2><i class="fas fa-clipboard-list mr-3"></i>My Reservations</h2>
        <p>Review and manage your space reservations</p>
      </div>

      <div class="main-content-card mb-4">
        <div class="card-header">
          <div class="header-title">Filters</div>
          <div class="d-flex align-items-center header-actions">
            <button id="btnMyResvRefresh" class="btn btn-outline-white btn-rounded btn-sm px-2" data-toggle="tooltip" data-placement="top" title="Refresh data"><i class="fas fa-sync mt-0"></i></button>
          </div>
        </div>
        <div class="card-body">
          <div class="row pt-5">
            <!-- <div class="col-md-4 select-outline">
              <select id="optMyResvSite" class="mdb-select md-form md-outline colorful-select mt-0"></select>
              <label for="optMyResvSite">Site</label>
            </div>
            <div class="col-md-4 select-outline">
              <select id="optMyResvStatus" class="mdb-select md-form md-outline colorful-select mt-0">
                <option value="">All Status</option>
                <option value="RESERVED">Reserved</option>
                <option value="CANCELED">Canceled</option>
              </select>
              <label for="optMyResvStatus">Status</label>
            </div> -->
            <div class="col-md-4">
              <div class="md-form md-outline mt-0">
                <input type="date" id="dtMyResvFrom" class="form-control">
                <label for="dtMyResvFrom" class="active">From</label>
              </div>
            </div>
            <div class="col-md-4">
              <div class="md-form md-outline mt-0">
                <input type="date" id="dtMyResvTo" class="form-control">
                <label for="dtMyResvTo" class="active">To</label>
              </div>
            </div>
          </div>
          <div class="row">
            
          </div>
        </div>
      </div>

      <div class="main-content-card">
        <div class="card-header">
          <div class="header-title">Reservations</div>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table id="dtMyResv" class="table table-hover table-sm mb-0 display responsive" width="100%">
              <thead>
                <tr class="th-strong">
                  <th style="width:4%">#</th>
                  <th>Space</th>
                  <th style="width:18%">Start</th>
                  <th style="width:18%">End</th>
                  <th style="width:12%">Status</th>
                  <th style="width:100px"></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- Cancel Modal -->
    <div class="modal fade" id="modalMyResvCancel" tabindex="-1" role="dialog" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header warning-color white-text"><h5 class="modal-title"><i class="fas fa-ban"></i> Cancel Reservation</h5><button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true" class="white-text">&times;</span></button></div>
          <div class="modal-body">
            <p>Provide an optional reason for cancellation:</p>
            <div class="md-form md-outline mt-0"><textarea id="txaMyResvReason" class="md-textarea form-control" rows="3"></textarea><label for="txaMyResvReason" class="active">Reason</label></div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">Close</button><button type="button" id="btnMyResvConfirmCancel" class="btn btn-warning btn-sm">Cancel Reservation</button></div>
        </div>
      </div>
    </div>

    <!-- Details Modal -->
    <div class="modal fade" id="modalMyResvDetails" tabindex="-1" role="dialog" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header primary-color white-text">
            <h5 class="modal-title"><i class="fas fa-calendar-check"></i> Reservation Details</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true" class="white-text">&times;</span></button>
          </div>
          <div class="modal-body">
            <div class="mb-2">
              <div class="d-flex align-items-center justify-content-between">
                <div>
                  <strong>Space:</strong> <a id="lnkMyResvSpace" href="#" target="_blank"><span id="lblMyResvSpaceName">-</span></a>
                </div>
                <div id="lblMyResvStatus" class="badge-modern badge-success-dark">RESERVED</div>
              </div>
            </div>
            <div class="detail-grid">
              <div class="detail-item"><div class="label">Start</div><div id="lblMyResvStart" class="value">-</div></div>
              <div class="detail-item"><div class="label">End</div><div id="lblMyResvEnd" class="value">-</div></div>
              <div class="detail-item"><div class="label">Reservation #</div><div id="lblMyResvId" class="value">-</div></div>
              <div class="detail-item"><div class="label">Requester</div><div id="lblMyResvRequester" class="value">-</div></div>
              <div class="detail-item"><div class="label">Contact</div><div id="lblMyResvContact" class="value">-</div></div>
            </div>
            <div class="mt-3">
              <div class="label">Notes</div>
              <div id="lblMyResvNotes" class="value">-</div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">Close</button>
            <button type="button" id="btnMyResvDetailsCancel" class="btn btn-warning btn-sm"><i class="fas fa-ban mr-1"></i>Cancel Reservation</button>
          </div>
        </div>
      </div>
    </div>

    <div class="includeHtml" id="h-modal_change_password"></div>
  </div>
</main>

<script type="text/javascript">$('.includeHtml').each(function(){ const id=$(this).attr('id'); $('#'+id).load('html/'+id.substr(2)+'.html?'+new Date().valueOf()); });</script>
<script type="text/javascript" src="js/popper.min.js"></script>
<script type="text/javascript" src="js/bootstrap.min.js"></script>
<script type="text/javascript" src="js/mdb.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.bootstrap4.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.html5.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.print.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/jszip.min.js"></script>
<script type="text/javascript" src="js/addons/crypto.js"></script>
<script type="text/javascript" src="js/addons/moment.min.js"></script>
<script type="text/javascript" src="js/modules/toastr.js"></script>
<script type="text/javascript" src="js/common.js"></script>
<script type="text/javascript" src="js/pages/main_my_reservations.js"></script>
</body>
</html>
