<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>GEMS 2.0</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Material Design Bootstrap -->
    <link rel="stylesheet" href="css/mdb.css?5">
    <!-- DataTables.net -->
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/dataTables.bootstrap4.min.css"/>
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/button.dataTables.min.css"/>
    <!-- Your custom styles (optional) -->
    <link href="css/style.css?2" rel="stylesheet">
    <!-- Your custom styles (optional) -->
    <style>

    </style>
    <!-- JQuery -->
    <script type="text/javascript" src="js/jquery-3.4.0.min.js"></script>
</head>


<body class="fixed-sn light-blue-skin">
<!--Main Navigation-->
<header>
    <!-- Sidebar navigation -->
    <div class="includeHtml" id="h-nav_left"></div>
    <!-- Navbar -->
    <div class="includeHtml" id="h-nav_top"></div>
</header>
<!--Main layout-->
<main>
    <div class="container-fluid">
        <div id="mdb-lightbox-ui"></div>

        <section class="section mb-5 mt-lg-5 sectionInvMain">
            <div class="row">
                <div class="col-lg-10 col-xl-8">
                    <div class="card card-cascade cascading-admin-card user-card mt-4">
                        <div class="admin-up d-flex justify-content-start">
                            <i class="fas fa-warehouse rgba-cyan-strong py-4 z-depth-3"></i>
                            <div class="data">
                                <h3 class="font-weight-bold dark-grey-text ml-3">Inventory Management</h3>
                            </div>
                        </div>
                        <div class="card-body card-body-cascade pb-0">
                            <form id="formInvSearch">
                                <h6 class="pb-3 pt-2">Select Store:</h6>
                                <div class="row">
                                    <div class="col-md-12 select-outline mt-0 mb-2" id="optInvClient_">
                                        <select id="optInvClient" class="mdb-select md-form md-outline colorful-select my-0"></select>
                                        <label for="optInvClient" id="lblInvClient">Client *</label>
                                        <p class="font-small text-danger" id="optInvClientErr"></p>
                                    </div>
                                    <div class="col-md-12 select-outline mt-0 mb-2" id="optInvSite_">
                                        <select id="optInvSite" class="mdb-select md-form md-outline colorful-select my-0" data-stop-refresh="true"></select>
                                        <label for="optInvSite" id="lblInvSite">Site *</label>
                                        <p class="font-small text-danger" id="optInvSiteErr"></p>
                                    </div>
                                    <div class="col-md-12 select-outline mt-0 mb-2" id="optInvStore_">
                                        <select id="optInvStore" class="mdb-select md-form md-outline colorful-select my-0" data-stop-refresh="true"></select>
                                        <label for="optInvStore" id="lblInvStore">Store *</label>
                                        <p class="font-small text-danger" id="optInvStoreErr"></p>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="card-footer">
                            <button type="button" id="btnInvSearch" class="btn btn-outline-success btn-rounded waves-effect float-right" data-toggle="tooltip" title="View Inventory">
                                <i class="fas fa-search mr-1"></i> View
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="section mb-5 mt-lg-5 sectionInvMain" id="sectionInvResult">
            <div class="card card-cascade narrower">
                <div class="view view-cascade gradient-card-header aqua-gradient narrower py-2 mx-4 mb-3 d-flex justify-content-between align-items-center z-depth-3">
                    <div>
                        <button type="button" id="btnInvDataAdd"
                                class="btn btn-outline-white btn-rounded btn-sm px-2 material-tooltip-main"
                                data-toggle="tooltip" data-placement="top" title="Add Item"><i
                                class="fas fa-plus mt-0"></i></button>
                        <a tabindex="0" role="button" class="btn btn-outline-white btn-rounded btn-sm px-2"
                           data-toggle="popover" data-trigger="focus" title="Inventory Item List"
                           data-content="All records of registered Parts in the Inventory."><i
                                class="fas fa-info mt-0 mx-1"></i></a>
                    </div>
                    <a href="javascript:void(0);" class="text-white mx-3">Inventory Item List</a>
                    <div>
                        <button type="button" id="btnDtInvDataRefresh"
                                class="btn btn-outline-white btn-rounded btn-sm px-2" data-toggle="tooltip"
                                data-placement="top" title="Refresh data"><i class="fas fa-sync mt-0"></i></button>
                    </div>
                </div>
                <div class="m-2 py-3">
                    <div class="table-responsive">
                        <table id="dtInvData" class="table table-hover table-sm mb-0 display responsive">
                            <thead>
                            <tr class="th-strong">
                                <th>#</th>
                                <th>Asset Group</th>
                                <th>Item Type</th>
                                <th>Item Description</th>
                                <th>Total in Store</th>
                                <th>Total Locked</th>
                                <th>Total Available</th>
                                <th>Threshold</th>
                                <th>Minimum Order</th>
                                <th>Maximum Order</th>
                                <th>Remark</th>
                                <th>Status</th>
                                <th>&nbsp;</th>
                                <th>&nbsp;</th>
                                <th>Image</th>
                            </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
        <div class="includeHtml" id="h-section_part"></div>
    </div>

    <div class="includeHtml" id="h-modal_change_password"></div>
    <div class="includeHtml" id="h-modal_confirm_delete"></div>
    <div class="includeHtml" id="h-modal_part_add"></div>
</main>

<!-- SCRIPTS -->
<script type="text/javascript">
    $('.includeHtml').each(function () {
        const divId = $(this).attr('id');
        $('#' + divId).load('html/' + divId.substr(2) + '.html?' + new Date().valueOf());
    });
</script>

<!-- Bootstrap tooltips -->
<script type="text/javascript" src="js/popper.min.js"></script>
<!-- Bootstrap core JavaScript -->
<script type="text/javascript" src="js/bootstrap.js"></script>
<!-- MDB core JavaScript -->
<script type="text/javascript" src="js/mdb.min.js"></script>
<!-- Crypto JS -->
<script type="text/javascript" src="js/addons/crypto.js"></script>
<!-- DataTables.net -->
<script type="text/javascript" src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.bootstrap4.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.html5.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.print.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.colvis.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/jszip.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/pdfmake.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/vfs_fonts.js"></script>

<!--Custom scripts-->
<script type="text/javascript">
    $(function () {
        $("#mdb-lightbox-ui").load("mdb-addons/mdb-lightbox-ui.html");
    });

    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let changePasswordClass_;
    let modalConfirmDelete_;
    let modalPartAdd_;
    let sectionPartClass_;
    let inventoryClass_;

    document.addEventListener('DOMContentLoaded', function () {

        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                initPhotoSwipeFromDOM('.mdb-lightbox');
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                modalConfirmDelete_ = new ModalConfirmDelete();
                modalPartAdd_ = new ModalPartAdd();
                sectionPartClass_ = new SectionPart();
                inventoryClass_ = new MainInventory();

                const refStatus_ = mzGetLocalArray('gems_status', versionLocal_, 'statusId');
                const refClient_ = mzGetLocalArray('gems_client', versionLocal_, 'clientId', [], 'client');
                const refSite_ = mzGetLocalArray('gems_site', versionLocal_, 'siteId', [], 'site');
                const refStore_ = mzGetLocalArray('gems_store', versionLocal_, 'storeId', [], 'store');
                const refAssetGroup_ = mzGetLocalArray('gems_assetGroup', versionLocal_, 'assetGroupId', [], 'asset_group');
                const refItemType_ = mzGetLocalArray('gems_itemType', versionLocal_, 'itemTypeId', [], 'item_type');
                const refItem_ = mzGetLocalArray('gems_item', versionLocal_, 'itemId', [], 'item');
                const refUser_ = mzGetLocalArray('gems_user', versionLocal_, 'userId');

                modalPartAdd_.setRefAssetGroup(refAssetGroup_);
                modalPartAdd_.setRefItemType(refItemType_);
                modalPartAdd_.setRefItem(refItem_);
                modalPartAdd_.setClassFrom(inventoryClass_);
                modalPartAdd_.init();

                sectionPartClass_.setRefStatus(refStatus_);
                sectionPartClass_.setRefSite(refSite_);
                sectionPartClass_.setRefStore(refStore_);
                sectionPartClass_.setRefAssetGroup(refAssetGroup_);
                sectionPartClass_.setRefItemType(refItemType_);
                sectionPartClass_.setRefItem(refItem_);
                sectionPartClass_.setRefUser(refUser_);
                sectionPartClass_.setClassFrom(inventoryClass_);
                sectionPartClass_.init();

                inventoryClass_.setRefStatus(refStatus_);
                inventoryClass_.setRefClient(refClient_);
                inventoryClass_.setRefSite(refSite_);
                inventoryClass_.setRefStore(refStore_);
                inventoryClass_.setRefAssetGroup(refAssetGroup_);
                inventoryClass_.setRefItemType(refItemType_);
                inventoryClass_.setRefItem(refItem_);
                inventoryClass_.setSectionPartClass(sectionPartClass_);
                inventoryClass_.setModalPartAddClass(modalPartAdd_);
                inventoryClass_.init();
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }
            HideLoader();
        }, 200);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_confirm_delete.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_part_add.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/section_part.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_inventory.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>

</body>
</html>
