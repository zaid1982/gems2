<!--Custom scripts-->
<script type="text/javascript">
    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let changePasswordClass_;
    let sectionKpiPpnsClass_;
    let kpiPpnsClass_;

    document.addEventListener('DOMContentLoaded', function () {

        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                sectionKpiPpnsClass_ = new SectionKpiPpns();
                kpiPpnsClass_ = new MainKpiPpns();

                const refSite_ = mzGetLocalArray('gems_site', versionLocal_, 'siteId', [], 'site');
                const refStatus_ = mzGetLocalArray('gems_status', versionLocal_, 'statusId');
                const refUser_ = mzGetLocalArray('gems_user', versionLocal_, 'userId');
                const refPpmGroup_ = mzGetLocalArray('gems_ppmGroup', versionLocal_, 'ppmGroupId', [], 'ppm_group');
                const refAssetGroup_ = mzGetLocalArray('gems_assetGroup', versionLocal_, 'assetGroupId', [], 'asset_group');
                const refAssetCategory_ = mzGetLocalArray('gems_assetCategory', versionLocal_, 'assetCategoryId', [], 'asset_category');
                const refAssetType_ = mzGetLocalArray('gems_assetType', versionLocal_, 'assetTypeId', [], 'asset_type');

                sectionKpiPpnsClass_.setRefSite(refSite_);
                sectionKpiPpnsClass_.setRefStatus(refStatus_);
                sectionKpiPpnsClass_.setRefUser(refUser_);
                sectionKpiPpnsClass_.setRefPpmGroup(refPpmGroup_);
                sectionKpiPpnsClass_.setRefAssetGroup(refAssetGroup_);
                sectionKpiPpnsClass_.setRefAssetCategory(refAssetCategory_);
                sectionKpiPpnsClass_.setRefAssetType(refAssetType_);
                sectionKpiPpnsClass_.setClassFrom(kpiPpnsClass_);
                sectionKpiPpnsClass_.init();

                kpiPpnsClass_.setSectionKpiPpnsClass(sectionKpiPpnsClass_);
                kpiPpnsClass_.init();
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }

            HideLoader();
        }, 200);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/section_kpi_ppns.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_kpi_ppns.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>
