<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>GEMS 2.0</title>
    <!-- Browser icon -->
    <link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="css/fontawesome-pro-6.5.1-web/css/all.min.css">
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Material Design Bootstrap -->
    <link rel="stylesheet" href="css/mdb.css?4">
    <!-- DataTables.net -->
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/dataTables.bootstrap4.min.css"/>
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/button.dataTables.min.css"/>
    <!-- Your custom styles (optional) -->
    <link href="css/style.css?5" rel="stylesheet">
    <!-- JQuery -->
    <script type="text/javascript" src="js/jquery-3.7.0.min.js"></script>
    <!--JQuery Migrate-->
    <script type="text/javascript" src="js/jquery-migrate-3.4.0.min.js"></script>
</head>
<body class="fixed-sn wo-page">
<!--Main Navigation-->
<header>
    <!-- Sidebar navigation -->
    <div class="includeHtml" id="h-nav_left"></div>
    <!-- Navbar -->
    <div class="includeHtml" id="h-nav_top"></div>
</header>
<!--Main layout-->
<main>
    <div class="container-fluid" id="divWssPageWidth">
        <div id="mdb-lightbox-ui"></div>
        <div class="card theme-surface sectionWssMain wo-overview mt-2 mb-4">
            <div class="view view-cascade gradient-card-header wo-overview__header d-flex flex-column flex-md-row align-items-md-center">
                <h5 class="mb-2 mb-md-0 mr-md-4">
                    <i class="fa fa-file-alt mr-2"></i>Assign Work Order / Work Request
                </h5>
                <h6 class="mb-0">
                    <i class="fa fa-building mr-2"></i>Site: <span id="lblWssSiteName"></span>
                </h6>
            </div>
        </div>
        <div class="card theme-surface sectionWssMain wo-subnav mb-3">
            <div class="card-body py-3">
                <div class="d-flex flex-column flex-sm-row align-items-stretch wo-tab-group">
                    <button class="btn btn-rounded btnWssTab wo-tab-button" id="btnWssPending" type="button">
                        <i class="fas fa-tasks"></i><span class="mx-2">Pending Task</span><span class="badge badge-pill wo-tab-badge" id="badgeWssTotalPending">0</span>
                    </button>
                    <button class="btn btn-rounded btnWssTab wo-tab-button lighten-2" id="btnWssSubmitted" type="button">
                        <i class="fas fa-check"></i><span class="mx-2">Submitted Task</span><span class="badge badge-pill wo-tab-badge" id="badgeWssTotalSubmitted">0</span>
                    </button>
                </div>
            </div>
        </div>
        <section class="mb-3 sectionWssMain sectionWssTask sectionWssPending">
            <div class="row">
                <div class="col-md-12">
                    <div class="card theme-surface wo-card mb-4_5">
                        <div class="view view-cascade gradient-card-header wo-card-header d-flex align-items-center">
                            <i class="fas fa-tasks mr-2"></i>
                            <h4 class="mb-0">Pending Task List</h4>
                        </div>
                        <div class="card-body pt-4">
                            <div class="table-responsive">
                                <table id="dtWssPending" class="table table-custom-badge table-hover mb-0 display responsive">
                                    <thead>
                                    <tr class="th-strong">
                                        <th>#</th>
                                        <th>WO/WR No</th>
                                        <th>Location</th>
                                        <th>Type</th>
                                        <th>Complainant</th>
                                        <th>Received Time</th> <!--5-->
                                        <th>Status</th>
                                        <th style="width: 24px">&nbsp;</th>
                                    </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="mb-3 sectionWssMain sectionWssTask sectionWssSubmitted">
            <div class="row">
                <div class="col-md-12">
                    <div class="card theme-surface wo-card mb-4_5">
                        <div class="view view-cascade gradient-card-header wo-card-header d-flex align-items-center">
                            <i class="fas fa-check mr-2"></i>
                            <h4 class="mb-0">Submitted Task List</h4>
                        </div>
                        <div class="card-body pt-4">
                            <div class="table-responsive">
                                <table id="dtWssSubmitted" class="table table-custom-badge table-hover mb-0 display responsive">
                                    <thead>
                                    <tr class="th-strong">
                                        <th>#</th>
                                        <th>WO/WR No</th>
                                        <th>Location</th>
                                        <th>Type</th>
                                        <th>Complainant</th>
                                        <th>Severity</th> <!--5-->
                                        <th>Received Time</th>
                                        <th>Submitted Time</th>
                                        <th style="width: 30px; min-width: 30px">SLA</th>
                                        <th>Respond Duration</th>
                                        <th>Status</th> <!--10-->
                                        <th style="width: 40px; min-width: 40px">&nbsp;</th>
                                    </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <div class="includeHtml" id="h-section_wo"></div>
    </div>
    <div class="includeHtml" id="h-modal_change_password"></div>
    <div class="includeHtml" id="h-modal_pdf"></div>
    <div class="includeHtml" id="h-modal_wo_reject"></div>
</main>

<!-- SCRIPTS -->
<script type="text/javascript">
    $('.includeHtml').each(function () {
        const divId = $(this).attr('id');
        $('#' + divId).load('html/' + divId.substr(2) + '.html?' + new Date().valueOf());
    });
</script>

<!-- Bootstrap tooltips -->
<script type="text/javascript" src="js/popper.min.js"></script>
<!-- Bootstrap core JavaScript -->
<script type="text/javascript" src="js/bootstrap.js"></script>
<!-- MDB core JavaScript -->
<script type="text/javascript" src="js/mdb.min.js"></script>
<!-- Crypto JS -->
<script type="text/javascript" src="js/addons/crypto.js"></script>
<!-- DataTables.net -->
<script type="text/javascript" src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.bootstrap4.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.html5.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.print.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.colvis.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/jszip.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/pdfmake.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/vfs_fonts.js"></script>
<!-- Moment JavaScript -->
<script type="text/javascript" src="js/addons/moment.min.js"></script>

<!--Custom scripts-->
<script type="text/javascript">
    $(function () {
        $("#mdb-lightbox-ui").load("mdb-addons/mdb-lightbox-ui.html");
    });

    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let changePasswordClass_;
    let modalWoRejectClass_;
    let sectionWoClass_;
    let woAssignClass_;

    document.addEventListener('DOMContentLoaded', function () {
        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                initPhotoSwipeFromDOM('.mdb-lightbox');
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                modalWoRejectClass_ = new ModalWoReject();
                sectionWoClass_ = new SectionWo();
                woAssignClass_ = new MainWoAssign();

                const refStatus_ = mzGetLocalArrayV2('gems_status2', versionLocal_, 'status/ref');
                const refUser_ = mzGetLocalArrayV2('gems_user2', versionLocal_, 'user/ref');
                const refSite_ = mzGetLocalArrayV2('gems_site2', versionLocal_, 'site/ref');
                const refSeverity_ = mzGetLocalArray('gems_severity', versionLocal_, 'severityId', [], 'severity');
                const refPpmGroup_ = mzGetLocalArray('gems_ppmGroup', versionLocal_, 'ppmGroupId', [], 'ppm_group');

                const userInfo = mzGetProfile();
                $('#lblWssSiteName').text(refSite_[userInfo['siteId']]['siteName']);

                modalWoRejectClass_.setClassFrom(sectionWoClass_);
                modalWoRejectClass_.init();

                sectionWoClass_.setRefStatus(refStatus_);
                sectionWoClass_.setRefUser(refUser_);
                sectionWoClass_.setRefSite(refSite_);
                sectionWoClass_.setRefSeverity(refSeverity_);
                sectionWoClass_.setRefPpmGroup(refPpmGroup_);
                sectionWoClass_.setModalWoRejectClass(modalWoRejectClass_);
                sectionWoClass_.setClassFrom(woAssignClass_);
                sectionWoClass_.init();

                woAssignClass_.setRefStatus(refStatus_);
                woAssignClass_.setRefUser(refUser_);
                woAssignClass_.setRefSeverity(refSeverity_);
                woAssignClass_.setSectionWoClass(sectionWoClass_);
                woAssignClass_.init();
                woAssignClass_.genTablePending();
                woAssignClass_.assignTotalSubmitted();
            } catch (e) { toastr['error'](e.message, _ALERT_TITLE_ERROR); }
            HideLoader();
        }, 200);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_wo_reject.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/section_wo.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_wo_assign.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
</script>
</body>
</html>
