<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test PTW Supporting Documents Fix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h3>Test PTW Supporting Documents Loading Fix</h3>
        
        <div class="documents-section">
            <h6 class="mb-3"><strong>Required Documents Checklist</strong></h6>
            
            <div class="checkbox-grid">
                <div class="form-check checkbox-item">
                    <input type="checkbox" class="form-check-input" name="supportingDocs" value="calibration_certificate" id="docCalibrationCert">
                    <label class="form-check-label" for="docCalibrationCert">1. Calibration Certificate</label>
                </div>
                
                <div class="form-check checkbox-item">
                    <input type="checkbox" class="form-check-input" name="supportingDocs" value="load_chart" id="docLoadChart">
                    <label class="form-check-label" for="docLoadChart">2. Load Chart</label>
                </div>
                
                <div class="form-check checkbox-item">
                    <input type="checkbox" class="form-check-input" name="supportingDocs" value="toolbox_talk_record" id="docToolboxTalk">
                    <label class="form-check-label" for="docToolboxTalk">3. Toolbox Talk Record</label>
                </div>
                
                <div class="form-check checkbox-item">
                    <input type="checkbox" class="form-check-input" name="supportingDocs" value="safety_data_sheet" id="docSafetyDataSheet">
                    <label class="form-check-label" for="docSafetyDataSheet">4. Safety Data Sheet</label>
                </div>
                
                <div class="form-check checkbox-item">
                    <input type="checkbox" class="form-check-input" name="supportingDocs" value="job_method_statement" id="docJobMethodStatement">
                    <label class="form-check-label" for="docJobMethodStatement">5. Job Method Statement</label>
                </div>
                
                <div class="form-check checkbox-item">
                    <input type="checkbox" class="form-check-input" name="supportingDocs" value="job_hazard_analysis" id="docJobHazardAnalysis">
                    <label class="form-check-label" for="docJobHazardAnalysis">6. Job Hazard Analysis</label>
                </div>
                
                <div class="form-check checkbox-item">
                    <input type="checkbox" class="form-check-input" name="supportingDocs" value="certificate_of_fitness" id="docCertificateOfFitness">
                    <label class="form-check-label" for="docCertificateOfFitness">7. Certificate of Fitness</label>
                </div>
                
                <div class="form-check checkbox-item">
                    <input type="checkbox" class="form-check-input" name="supportingDocs" value="cidb_green_card" id="docCidbGreenCard">
                    <label class="form-check-label" for="docCidbGreenCard">8. CIDB Green Card</label>
                </div>
                
                <div class="form-check checkbox-item">
                    <input type="checkbox" class="form-check-input" name="supportingDocs" value="aesp_card" id="docAespCard">
                    <label class="form-check-label" for="docAespCard">9. AESP Card</label>
                </div>
                
                <div class="form-check checkbox-item">
                    <input type="checkbox" class="form-check-input" name="supportingDocs" value="competency_person_certificate" id="docCompetencyPersonCert">
                    <label class="form-check-label" for="docCompetencyPersonCert">10. Competency Person Certificate</label>
                </div>
                
                <div class="form-check checkbox-item">
                    <input type="checkbox" class="form-check-input" name="supportingDocs" value="contractor_checklist" id="docContractorChecklist">
                    <label class="form-check-label" for="docContractorChecklist">11. Contractor Checklist</label>
                </div>
                
                <div class="form-check checkbox-item">
                    <input type="checkbox" class="form-check-input" name="supportingDocs" value="medical_check_up" id="docMedicalCheckUp">
                    <label class="form-check-label" for="docMedicalCheckUp">12. Medical Check Up</label>
                </div>
                
                <div class="form-check checkbox-item">
                    <input type="checkbox" class="form-check-input" name="supportingDocs" value="hirarc_eaia" id="docHirarcEaia">
                    <label class="form-check-label" for="docHirarcEaia">13. HIRARC/EAIA</label>
                </div>
                
                <div class="form-check checkbox-item">
                    <input type="checkbox" class="form-check-input" name="supportingDocs" value="traffic_management_plan" id="docTrafficManagementPlan">
                    <label class="form-check-label" for="docTrafficManagementPlan">14. Traffic Management Plan</label>
                </div>
            </div>
        </div>
        
        <div class="mt-4">
            <button type="button" class="btn btn-primary" onclick="testAPIData()">Test API Data (Your Exact Data)</button>
            <button type="button" class="btn btn-success" onclick="testPartialData()">Test Partial Data</button>
            <button type="button" class="btn btn-secondary" onclick="clearAllCheckboxes()">Clear All</button>
        </div>
        
        <div class="mt-3">
            <div id="testResults" class="alert alert-info">Ready to test with your exact API data...</div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // The exact code from the updated populateFormWithData function
        function testAPIData() {
            // Your exact API data
            const data = {
                ptw_supporting_docs_checklist: "[\"calibration_certificate\",\"load_chart\",\"toolbox_talk_record\",\"safety_data_sheet\",\"job_method_statement\",\"job_hazard_analysis\",\"certificate_of_fitness\",\"cidb_green_card\",\"aesp_card\",\"competency_person_certificate\",\"contractor_checklist\",\"medical_check_up\",\"hirarc_eaia\",\"traffic_management_plan\"]"
            };
            
            loadSupportingDocuments(data);
        }
        
        function testPartialData() {
            // Test with partial data
            const data = {
                ptw_supporting_docs_checklist: "[\"calibration_certificate\",\"load_chart\",\"safety_data_sheet\"]"
            };
            
            loadSupportingDocuments(data);
        }
        
        function loadSupportingDocuments(data) {
            // Clear all first
            clearAllCheckboxes();
            
            let results = [];
            
            // Populate supporting documents checklist from ptw_supporting_docs_checklist
            if (data.ptw_supporting_docs_checklist) {
                try {
                    let supportingDocsData;
                    if (typeof data.ptw_supporting_docs_checklist === 'string') {
                        supportingDocsData = JSON.parse(data.ptw_supporting_docs_checklist);
                    } else if (Array.isArray(data.ptw_supporting_docs_checklist)) {
                        supportingDocsData = data.ptw_supporting_docs_checklist;
                    }
                    
                    console.log('Populating supporting documents checklist:', supportingDocsData);
                    results.push('✓ Parsed data successfully: ' + supportingDocsData.length + ' documents found');
                    
                    if (Array.isArray(supportingDocsData)) {
                        // Create reverse mapping from value to ID (same as in ptw_form.js)
                        const valueToIdMapping = {
                            'calibration_certificate': 'docCalibrationCert',
                            'load_chart': 'docLoadChart',
                            'toolbox_talk_record': 'docToolboxTalk',
                            'safety_data_sheet': 'docSafetyDataSheet',
                            'job_method_statement': 'docJobMethodStatement',
                            'job_hazard_analysis': 'docJobHazardAnalysis',
                            'certificate_of_fitness': 'docCertificateOfFitness',
                            'cidb_green_card': 'docCidbGreenCard',
                            'aesp_card': 'docAespCard',
                            'competency_person_certificate': 'docCompetencyPersonCert',
                            'contractor_checklist': 'docContractorChecklist',
                            'medical_check_up': 'docMedicalCheckUp',
                            'hirarc_eaia': 'docHirarcEaia',
                            'traffic_management_plan': 'docTrafficManagementPlan'
                        };
                        
                        let checkedCount = 0;
                        supportingDocsData.forEach(docValue => {
                            const checkboxId = valueToIdMapping[docValue];
                            if (checkboxId) {
                                const checkbox = document.getElementById(checkboxId);
                                if (checkbox && checkbox.type === 'checkbox') {
                                    checkbox.checked = true;
                                    checkedCount++;
                                    results.push('✓ Set supporting document checkbox: ' + checkboxId + ' for value: ' + docValue);
                                    console.log('✓ Set supporting document checkbox:', checkboxId, 'for value:', docValue);
                                } else {
                                    results.push('✗ Checkbox not found: ' + checkboxId + ' for value: ' + docValue);
                                    console.error('✗ Checkbox not found:', checkboxId, 'for value:', docValue);
                                }
                            } else {
                                results.push('✗ Unknown supporting document value: ' + docValue);
                                console.warn('✗ Unknown supporting document value:', docValue);
                            }
                        });
                        results.unshift(`Supporting docs loading complete: ${checkedCount}/${supportingDocsData.length} checkboxes checked`);
                        console.log(`Supporting docs loading complete: ${checkedCount}/${supportingDocsData.length} checkboxes checked`);
                    }
                } catch (error) {
                    results.push('✗ Error parsing ptw_supporting_docs_checklist: ' + error.message);
                    console.error('Error parsing ptw_supporting_docs_checklist:', error, 'Raw value:', data.ptw_supporting_docs_checklist);
                }
            }
            
            document.getElementById('testResults').innerHTML = `
                <h6>Test Results:</h6>
                ${results.map(result => `<div>${result}</div>`).join('')}
            `;
        }
        
        function clearAllCheckboxes() {
            document.querySelectorAll('input[name="supportingDocs"]').forEach(cb => cb.checked = false);
            document.getElementById('testResults').innerHTML = 'All checkboxes cleared. Ready to test...';
        }
    </script>
</body>
</html>
