<!DOCTYPE html>
<html>
<head>
    <title>PTW API Test</title>
    <script src="js/jquery-3.7.0.min.js"></script>
</head>
<body>
    <h2>PTW API Test Page</h2>
    <button id="testApiBtn">Test PTW API</button>
    <button id="checkRecordsBtn">Check Records</button>
    <div id="results"></div>
    
    <script>
        function logMessage(message) {
            console.log(message);
            document.getElementById('results').innerHTML += '<div>' + message + '</div>';
        }
        
        document.getElementById('testApiBtn').addEventListener('click', function() {
            logMessage('Testing PTW API...');
            
            const testData = {
                action: 'create_permit',
                description: 'Browser API test - welding work',
                work_area: 'Test Area Browser',
                work_type: 'HOT_WORK',
                valid_from: '2025-08-07',
                valid_to: '2025-08-08',
                risk_level: 'HIGH',
                applicant_name: 'Browser Test User',
                applicant_contact: '123-456-7890',
                applicant_department: 'Test Department',
                contractor_company: 'Test Company',
                remarks: 'API test from browser',
                status: 'PENDING_APPROVAL',
                workers: JSON.stringify([{name: 'Test Worker', ic: '123456789012'}]),
                checklist_data: JSON.stringify({hot_work: ['Fire safety checked']})
            };
            
            logMessage('Sending data: ' + JSON.stringify(testData));
            
            $.ajax({
                url: 'api/ptw.php',
                type: 'POST',
                data: testData,
                headers: {
                    'Authorization': 'Bearer fake_token_for_testing'
                },
                success: function(response) {
                    logMessage('✅ Success Response: ' + JSON.stringify(response));
                },
                error: function(xhr, status, error) {
                    logMessage('❌ Error: ' + error);
                    logMessage('Response Text: ' + xhr.responseText);
                }
            });
        });
        
        document.getElementById('checkRecordsBtn').addEventListener('click', function() {
            window.open('check_ptw_records.php', '_blank');
        });
    </script>
</body>
</html>
