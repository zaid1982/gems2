<!DOCTYPE html>
<html lang="en">
<head>
    <script src="maintenance-auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📁 Log Explorer - GEMS2 Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .main-content {
            padding: 30px;
        }

        .breadcrumb {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
        }

        .breadcrumb a {
            color: #3498db;
            text-decoration: none;
            cursor: pointer;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn.secondary {
            background: #95a5a6;
        }

        .btn.secondary:hover {
            background: #7f8c8d;
        }

        .btn.success {
            background: #27ae60;
        }

        .btn.success:hover {
            background: #229954;
        }

        .btn.danger {
            background: #e74c3c;
        }

        .btn.danger:hover {
            background: #c0392b;
        }

        .search-container {
            position: relative;
            flex: 1;
            min-width: 200px;
        }

        .search-input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .card:hover {
            border-color: #3498db;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(52, 152, 219, 0.1);
        }

        .card-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .card-info {
            color: #666;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .file-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .file-table th,
        .file-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e1e8ed;
        }

        .file-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #2c3e50;
        }

        .file-table tr:hover {
            background: #f8f9fa;
        }

        .file-actions {
            display: flex;
            gap: 8px;
        }

        .file-actions .btn {
            padding: 6px 12px;
            font-size: 12px;
        }

        .log-viewer {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            max-height: 600px;
            overflow-y: auto;
        }

        .log-content {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.4;
            color: #d4d4d4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .log-line {
            margin-bottom: 2px;
            padding: 2px 0;
            border-left: 3px solid transparent;
        }

        .log-line:hover {
            background: rgba(255,255,255,0.05);
            border-left-color: #3498db;
        }

        .log-line-number {
            color: #858585;
            margin-right: 10px;
            user-select: none;
            min-width: 50px;
            display: inline-block;
        }

        .search-highlight {
            background: #ff6b35;
            color: white;
            padding: 2px 4px;
            border-radius: 3px;
        }

        .viewer-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .viewer-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #3498db;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #27ae60;
            font-weight: 600;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #27ae60;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading::before {
            content: '⏳';
            font-size: 2em;
            display: block;
            margin-bottom: 10px;
        }

        .error {
            background: #fee;
            color: #c0392b;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
            margin-bottom: 20px;
        }

        .success {
            background: #eaffea;
            color: #27ae60;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #27ae60;
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .btn {
                justify-content: center;
            }
            
            .file-table {
                font-size: 14px;
            }
            
            .file-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📁 Log Explorer</h1>
            <p>Browse, download, and view log files with live monitoring capabilities</p>
        </div>

        <div class="main-content">
            <!-- Breadcrumb -->
            <div class="breadcrumb" id="breadcrumb">
                <span onclick="loadDirectories()">📁 Log Directory</span>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="btn" onclick="loadDirectories()">
                    🏠 Home
                </button>
                <button class="btn secondary" onclick="refreshCurrentView()">
                    🔄 Refresh
                </button>
                <div class="search-container" id="searchContainer" style="display: none;">
                    <input type="text" class="search-input" id="searchInput" placeholder="Search in current file...">
                    <button class="search-btn" onclick="searchInFile()">🔍</button>
                </div>
            </div>

            <!-- Main Content Area -->
            <div id="contentArea">
                <div class="loading">Loading directories...</div>
            </div>

            <!-- Log Viewer -->
            <div id="logViewer" class="hidden">
                <div class="viewer-info" id="fileInfo"></div>
                <div class="viewer-controls">
                    <button class="btn" onclick="viewFullFile()">📄 View Full</button>
                    <button class="btn" onclick="tailFile()">📊 Tail (50 lines)</button>
                    <button class="btn success" id="liveBtn" onclick="toggleLiveMode()">▶️ Start Live</button>
                    <button class="btn secondary" onclick="downloadCurrentFile()">⬇️ Download</button>
                    <button class="btn danger" onclick="closeViewer()">❌ Close</button>
                </div>
                <div class="log-viewer">
                    <div class="log-content" id="logContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentDirectory = '';
        let currentFile = '';
        let liveMode = false;
        let liveInterval = null;

        // Load directories on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadDirectories();
        });

        // Load log directories
        async function loadDirectories() {
            try {
                showLoading('Loading directories...');
                
                const response = await fetch('log_explorer.php?action=list_directories');
                const data = await response.json();
                
                if (data.success) {
                    renderDirectories(data.directories, data.log_dir);
                    currentDirectory = '';
                    currentFile = '';
                    updateBreadcrumb();
                    hideLogViewer();
                } else {
                    showError('Error loading directories: ' + data.error);
                }
            } catch (error) {
                showError('Failed to load directories: ' + error.message);
            }
        }

        // Load files in directory
        async function loadFiles(directory) {
            try {
                showLoading('Loading files...');
                
                const response = await fetch(`log_explorer.php?action=list_files&directory=${encodeURIComponent(directory)}`);
                const data = await response.json();
                
                if (data.success) {
                    renderFiles(data.files, directory);
                    currentDirectory = directory;
                    currentFile = '';
                    updateBreadcrumb();
                    hideLogViewer();
                } else {
                    showError('Error loading files: ' + data.error);
                }
            } catch (error) {
                showError('Failed to load files: ' + error.message);
            }
        }

        // View file content
        async function viewFile(filename, mode = 'full') {
            try {
                showLoading('Loading file content...');
                
                const action = mode === 'tail' ? 'tail_file' : 'view_file';
                const response = await fetch(`log_explorer.php?action=${action}&directory=${encodeURIComponent(currentDirectory)}&filename=${encodeURIComponent(filename)}&lines=100`);
                const data = await response.json();
                
                if (data.success) {
                    currentFile = filename;
                    renderLogContent(data.content, data.file_info, mode);
                    showLogViewer();
                    updateBreadcrumb();
                    document.getElementById('searchContainer').style.display = 'flex';
                } else {
                    showError('Error loading file: ' + data.error);
                }
            } catch (error) {
                showError('Failed to load file: ' + error.message);
            }
        }

        // Download file
        function downloadFile(filename) {
            const url = `log_explorer.php?action=download_file&directory=${encodeURIComponent(currentDirectory)}&filename=${encodeURIComponent(filename)}`;
            window.open(url, '_blank');
        }

        // Search in file
        async function searchInFile() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            if (!searchTerm || !currentFile) return;
            
            try {
                showLoading('Searching...');
                
                const response = await fetch(`log_explorer.php?action=search_logs&directory=${encodeURIComponent(currentDirectory)}&filename=${encodeURIComponent(currentFile)}&search=${encodeURIComponent(searchTerm)}&max_results=100`);
                const data = await response.json();
                
                if (data.success) {
                    renderSearchResults(data.results, data.search_term);
                } else {
                    showError('Search error: ' + data.error);
                }
            } catch (error) {
                showError('Search failed: ' + error.message);
            }
        }

        // Toggle live mode
        function toggleLiveMode() {
            if (liveMode) {
                stopLiveMode();
            } else {
                startLiveMode();
            }
        }

        // Start live mode
        function startLiveMode() {
            if (!currentFile) return;
            
            liveMode = true;
            const btn = document.getElementById('liveBtn');
            btn.innerHTML = '⏸️ Stop Live';
            btn.classList.remove('success');
            btn.classList.add('danger');
            
            // Show live indicator
            const indicator = document.createElement('div');
            indicator.id = 'liveIndicator';
            indicator.className = 'live-indicator';
            indicator.innerHTML = '<div class="live-dot"></div> Live Mode Active';
            document.querySelector('.viewer-controls').appendChild(indicator);
            
            // Update every 3 seconds
            liveInterval = setInterval(() => {
                tailFile(true);
            }, 3000);
            
            // Initial tail
            tailFile(true);
        }

        // Stop live mode
        function stopLiveMode() {
            liveMode = false;
            const btn = document.getElementById('liveBtn');
            btn.innerHTML = '▶️ Start Live';
            btn.classList.remove('danger');
            btn.classList.add('success');
            
            // Remove live indicator
            const indicator = document.getElementById('liveIndicator');
            if (indicator) {
                indicator.remove();
            }
            
            if (liveInterval) {
                clearInterval(liveInterval);
                liveInterval = null;
            }
        }

        // Quick action functions
        function viewFullFile() {
            if (currentFile) {
                viewFile(currentFile, 'full');
            }
        }

        function tailFile(isLive = false) {
            if (currentFile) {
                if (!isLive) stopLiveMode();
                viewFile(currentFile, 'tail');
            }
        }

        function downloadCurrentFile() {
            if (currentFile) {
                downloadFile(currentFile);
            }
        }

        function closeViewer() {
            stopLiveMode();
            hideLogViewer();
            document.getElementById('searchContainer').style.display = 'none';
            currentFile = '';
            updateBreadcrumb();
        }

        function refreshCurrentView() {
            if (currentFile) {
                viewFile(currentFile);
            } else if (currentDirectory) {
                loadFiles(currentDirectory);
            } else {
                loadDirectories();
            }
        }

        // Render functions
        function renderDirectories(directories, logDir) {
            const content = `
                <div class="success">
                    📁 Log Directory: <code>${logDir}</code>
                </div>
                <div class="grid">
                    ${directories.map(dir => `
                        <div class="card" onclick="loadFiles('${dir.name}')">
                            <div class="card-icon">📂</div>
                            <div class="card-title">${dir.name}</div>
                            <div class="card-info">
                                📄 ${dir.file_count} files<br>
                                🕒 Modified: ${dir.modified_formatted}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            document.getElementById('contentArea').innerHTML = content;
        }

        function renderFiles(files, directory) {
            const content = `
                <div class="success">
                    📂 Directory: <code>${directory}</code> (${files.length} files)
                </div>
                <table class="file-table">
                    <thead>
                        <tr>
                            <th>📄 File Name</th>
                            <th>📊 Size</th>
                            <th>🕒 Modified</th>
                            <th>⚡ Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${files.map(file => `
                            <tr>
                                <td>
                                    <strong>${file.name}</strong>
                                    ${file.extension === 'log' ? '<span style="color: #27ae60;">📜</span>' : ''}
                                </td>
                                <td>${file.size_formatted}</td>
                                <td>${file.modified_formatted}</td>
                                <td>
                                    <div class="file-actions">
                                        <button class="btn" onclick="viewFile('${file.name}')">👁️ View</button>
                                        <button class="btn secondary" onclick="downloadFile('${file.name}')">⬇️ Download</button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            document.getElementById('contentArea').innerHTML = content;
        }

        function renderLogContent(content, fileInfo, mode) {
            const info = `
                <strong>📄 ${fileInfo.name}</strong> 
                (${fileInfo.size_formatted}, Modified: ${fileInfo.modified_formatted})
                ${mode === 'tail' ? '<span style="color: #e74c3c;"> - Showing last 50 lines</span>' : ''}
            `;
            
            document.getElementById('fileInfo').innerHTML = info;
            
            const logLines = content.map((line, index) => {
                const lineNumber = mode === 'tail' ? '' : `<span class="log-line-number">${index + 1}</span>`;
                return `<div class="log-line">${lineNumber}${escapeHtml(line)}</div>`;
            }).join('');
            
            document.getElementById('logContent').innerHTML = logLines;
            
            // Auto-scroll to bottom in tail mode
            if (mode === 'tail') {
                const logViewer = document.querySelector('.log-viewer');
                logViewer.scrollTop = logViewer.scrollHeight;
            }
        }

        function renderSearchResults(results, searchTerm) {
            const content = results.map(result => {
                const lineNumber = `<span class="log-line-number">${result.line_number}</span>`;
                return `<div class="log-line">${lineNumber}${result.highlighted}</div>`;
            }).join('');
            
            document.getElementById('logContent').innerHTML = content || '<div style="color: #e74c3c; text-align: center; padding: 20px;">No results found</div>';
            
            // Update file info
            const info = document.getElementById('fileInfo').innerHTML + ` <span style="color: #e74c3c;">- Search results for "${searchTerm}" (${results.length} matches)</span>`;
            document.getElementById('fileInfo').innerHTML = info;
        }

        // UI helper functions
        function showLoading(message = 'Loading...') {
            document.getElementById('contentArea').innerHTML = `<div class="loading">${message}</div>`;
        }

        function showError(message) {
            const errorDiv = `<div class="error">❌ ${message}</div>`;
            document.getElementById('contentArea').innerHTML = errorDiv;
        }

        function showLogViewer() {
            document.getElementById('logViewer').classList.remove('hidden');
        }

        function hideLogViewer() {
            document.getElementById('logViewer').classList.add('hidden');
            stopLiveMode();
        }

        function updateBreadcrumb() {
            let breadcrumb = '<span onclick="loadDirectories()">📁 Log Directory</span>';
            
            if (currentDirectory) {
                breadcrumb += ` / <span onclick="loadFiles('${currentDirectory}')">${currentDirectory}</span>`;
            }
            
            if (currentFile) {
                breadcrumb += ` / <span style="color: #3498db;">${currentFile}</span>`;
            }
            
            document.getElementById('breadcrumb').innerHTML = breadcrumb;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Handle search on Enter key
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.target.id === 'searchInput') {
                searchInFile();
            }
        });
    </script>
</body>
</html>
