<!--
  Modal: modal_ppm_reschedule — Tabler/GEMS modal + form contract (P5-4).

  Loaded by pages/ppm_reschedule.html ONLY.
    gems-modal-md + modal-dialog-scrollable, never modal-dialog-centered.
    Native type=date for #txtMprNewDate (pickadate stays on MDB pages).
    Visible labels, gems-form-grid, H3 MzValidate error slots.
    Footer: outline Close first, primary Submit last.
-->
<div class="modal fade" id="modal_ppm_reschedule" tabindex="-1" aria-labelledby="mprTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="mprTitle"><i class="far fa-calendar-check me-2"></i>Reschedule PPM Date</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMpr" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMprPpmTaskNo" id="lblMprPpmTaskNo">PPM Task No</label>
              <input type="text" id="txtMprPpmTaskNo" class="form-control" disabled>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtMprPpmTaskStartDate" id="lblMprPpmTaskStartDate">Scheduled Date</label>
              <input type="text" id="txtMprPpmTaskStartDate" class="form-control" disabled>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtMprPpmTaskScheduleDate" id="lblMprPpmTaskScheduleDate">Final Date</label>
              <input type="text" id="txtMprPpmTaskScheduleDate" class="form-control" disabled>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="optMprFrequency" id="lblMprFrequency">Frequency <span class="required" aria-hidden="true">*</span></label>
              <select id="optMprFrequency" class="form-select" data-stop-refresh="true" aria-required="true" aria-describedby="optMprFrequencyErr"></select>
              <div class="gems-field-error" id="optMprFrequencyErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMprNewDate" id="lblMprNewDate">New Scheduled Date <span class="required" aria-hidden="true">*</span></label>
              <input type="date" id="txtMprNewDate" class="form-control" aria-required="true" aria-describedby="txtMprNewDateErr">
              <div class="gems-field-error" id="txtMprNewDateErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><i class="fas fa-undo-alt me-1"></i> Close</button>
        <button type="button" id="btnMprSubmit" class="btn btn-primary" disabled><i class="far fa-paper-plane me-1"></i> Submit</button>
      </div>
    </div>
  </div>
</div>
