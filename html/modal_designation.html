<!--
  Modal: modal_designation — Tabler/GEMS modal + form contract (P4A-1).

  Loaded by pages/designation.html ONLY. Copies the P2 modal_license contract:
    gems-modal-sm (480px) + modal-dialog-scrollable, never modal-dialog-centered.
    Flat white header, btn-close flex-centred with the title.
    Visible labels, gems-form-grid, H3 MzValidate error slots.
    Footer: outline Close first, primary Save last. No btn-info.

  JS contract preserved (js/pages/modal_designation.js, js/pages/main_designation.js):
    #modal_designation  #formMdg  #txtMdgDesc  #lblMdgDesc  #txtMdgDescErr
    #chkMdgStatus  #chkMdgStatusErr  #btnMdgSubmit  #lblMdgTitle
-->
<div class="modal fade" id="modal_designation" tabindex="-1" aria-labelledby="lblMdgTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-sm modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMdgTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMdg" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMdgDesc" id="lblMdgDesc">Designation <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMdgDesc" class="form-control" aria-required="true" aria-describedby="txtMdgDescErr">
              <div class="gems-field-error" id="txtMdgDescErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <span class="form-label">Status</span>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkMdgStatus" name="chkMdgStatus" value="1" aria-describedby="chkMdgStatusErr">
                <label class="form-check-label" for="chkMdgStatus">Active</label>
              </div>
              <div class="gems-field-error" id="chkMdgStatusErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" id="btnMdgSubmit" class="btn btn-primary" disabled>
          <i class="far fa-save me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
