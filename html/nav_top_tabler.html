<!--
  Inner markup for the Tabler top bar.

  The HOST element on the page must itself be
  <header class="navbar navbar-expand-md"> inside .page-wrapper (see
  html/nav_left_tabler.html). Do not place this header as a sibling of the
  aside under .page — Tabler 1.5 will hide the sidebar.

  No hamburger here: the sidebar host carries Tabler’s navbar-toggler, which
  becomes the fold control below 992px. Native data-bs-toggle only — do not add
  data-toggle or data-boundary (P0 N6). .gems-notification-nav on the bell's <li>
  is load-bearing: below 576px gems-theme.css drops it to position:static so the
  notification menu spans the header instead of hanging off the left of the
  screen. Keep #pBasePageTitle, #navNotification,
  #navNotificationTotal, #btnChangePassword. modal_profile.js is shipped here
  because unmigrated pages rely on nav_top.html to load it; Tabler pages will
  too. IDs exist once — do not duplicate this block for a mobile copy.
-->
<script src="js/pages/modal_profile.js"></script>
<div class="container-xl">
    <div class="d-flex align-items-center flex-grow-1 min-w-0">
        <div id="pBasePageTitle" class="navbar-text px-0 text-truncate"></div>
    </div>
    <ul class="navbar-nav flex-row ms-auto">
        <li class="nav-item dropdown gems-notification-nav">
            <a class="nav-link" href="#" id="navbarDropdownMenuLink" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false" aria-label="Notifications">
                <i class="fa fa-bell"></i>
                <span class="d-none d-lg-inline ms-1">Notifications</span>
                <span class="badge bg-red badge-notification" id="navNotificationTotal">0</span>
            </a>
            <div class="dropdown-menu dropdown-menu-end gems-notification-menu" aria-labelledby="navbarDropdownMenuLink" id="navNotification">
                <div class="dropdown-item text-secondary small py-3">No notifications</div>
            </div>
        </li>
        <li class="nav-item dropdown">
            <a class="nav-link d-flex align-items-center lh-1" href="#" id="userDropdown" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false" aria-label="Profile">
                <span class="avatar avatar-sm" aria-hidden="true"><i class="fa fa-user"></i></span>
                <span class="d-none d-md-inline ms-2">Profile</span>
            </a>
            <div class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                <a class="dropdown-item" href="#" onclick="mzProfile();">Update Profile</a>
                <a class="dropdown-item" href="signature.html"><i class="fas fa-signature me-2"></i>My Signature</a>
                <a class="dropdown-item" href="#" id="btnChangePassword">Change Password</a>
            </div>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#" onclick="mzLogout();">
                <i class="fas fa-sign-out-alt"></i>
                <span class="d-none d-md-inline ms-1">Sign Out</span>
            </a>
        </li>
    </ul>
</div>
