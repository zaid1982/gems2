<div class="modal fade gems-modal" id="modal_severity" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered mt-3 pt-3 mb-5" role="document">
        <!--Content-->
        <div class="modal-content gems-modal-card">
            <!--Header-->
            <div class="modal-header gems-modal-header">
                <h4 class="text-white mt-2 ml-2" id="lblMsvTitle"></h4>
                <button type="button" class="close waves-effect waves-light mr-0 text-white pt-4 gems-modal-close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--Body-->
            <div class="modal-body gems-modal-body">
                <form id="formMsv">
                    <div class="md-form md-outline mt-4">
                        <input type="text" id="txtMsvName" class="form-control">
                        <label for="txtMsvName" id="lblMsvName">Severity *</label>
                        <p class="font-small text-danger" id="txtMsvNameErr"></p>
                    </div>
                    <h6 class="font-small">Status:</h6>
                    <div class="form-check pl-0 ml-3">
                        <input type="checkbox" class="form-check-input" id="chkMsvStatus" name="chkMsvStatus" value="1">
                        <label class="form-check-label" for="chkMsvStatus">Active</label>
                    </div>
                </form>
            </div>
            <div class="modal-footer p-2 gems-modal-footer">
                <button class="btn btn-outline-info waves-effect" data-dismiss="modal"><i class="fas fa-undo-alt ml-1"></i> Close</button>
                <button id="btnMsvSubmit" class="btn btn-info waves-effect" disabled><i class="far fa-paper-plane ml-1"></i> Submit</button>
            </div>
        </div>
    </div>
</div>
