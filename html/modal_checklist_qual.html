<!--
  Modal: modal_checklist_qual — Tabler/GEMS modal + form contract (P4C-6).

  Loaded by pages/checklist.html ONLY. Copies the P4 modal contract:
    gems-modal-md (640px) + modal-dialog-scrollable, never modal-dialog-centered.
    Flat white header, btn-close flex-centred with the title.
    Visible labels, gems-form-grid, H3 MzValidate error slots.
    Footer: outline Close first, primary Submit last. No btn-info.

  JS contract preserved (js/pages/modal_checklist_qual.js):
    #modal_checklist_qual  #formMql
    #txtMqlChecklistQualNumb  #lblMqlChecklistQualNumb  #txtMqlChecklistQualNumbErr
    #txaMqlChecklistQualDesc  #lblMqlChecklistQualDesc  #txaMqlChecklistQualDescErr
    #optMqlFrequencyId  #lblMqlFrequencyId  #optMqlFrequencyIdErr
    #chkMqlChecklistQualStatus
    #btnMqlSubmit  #lblMqlTitle
-->
<div class="modal fade" id="modal_checklist_qual" tabindex="-1" aria-labelledby="lblMqlTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMqlTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMql" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMqlChecklistQualNumb" id="lblMqlChecklistQualNumb">Numbering <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMqlChecklistQualNumb" class="form-control" aria-required="true" aria-describedby="txtMqlChecklistQualNumbErr">
              <div class="gems-field-error" id="txtMqlChecklistQualNumbErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txaMqlChecklistQualDesc" id="lblMqlChecklistQualDesc">Description <span class="required" aria-hidden="true">*</span></label>
              <textarea id="txaMqlChecklistQualDesc" class="form-control" rows="3" aria-required="true" aria-describedby="txaMqlChecklistQualDescErr"></textarea>
              <div class="gems-field-error" id="txaMqlChecklistQualDescErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="optMqlFrequencyId" id="lblMqlFrequencyId">Frequency <span class="required" aria-hidden="true">*</span></label>
              <select id="optMqlFrequencyId" class="form-select" aria-required="true" aria-describedby="optMqlFrequencyIdErr"></select>
              <div class="gems-field-error" id="optMqlFrequencyIdErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <span class="form-label">Status</span>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkMqlChecklistQualStatus" name="chkMqlChecklistQualStatus" value="1">
                <label class="form-check-label" for="chkMqlChecklistQualStatus">Active</label>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><i class="fas fa-undo-alt me-1"></i> Close</button>
        <button type="button" id="btnMqlSubmit" class="btn btn-primary" disabled><i class="far fa-paper-plane me-1"></i> Submit</button>
      </div>
    </div>
  </div>
</div>
