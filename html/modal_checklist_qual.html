<div class="modal fade" id="modal_checklist_qual" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-notify modal-info mt-3 pt-3 mb-5" role="document">
        <!--Content-->
        <div class="modal-content">
            <!--Header-->
            <div class="modal-header d-flex justify-content-center">
                <h4 class="text-white mt-2 ml-2" id="lblMqlTitle"></h4>
                <button type="button" class="close waves-effect waves-light mr-0 text-white pt-4" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--Body-->
            <div class="modal-body">
                <form id="formMql">
                    <div class="md-form md-outline">
                        <input type="text" id="txtMqlChecklistQualNumb" class="form-control">
                        <label for="txtMqlChecklistQualNumb" id="lblMqlChecklistQualNumb">Numbering *</label>
                        <p class="font-small text-danger" id="txtMqlChecklistQualNumbErr"></p>
                    </div>
                    <div class="md-form md-outline">
                        <textarea id="txaMqlChecklistQualDesc" class="md-textarea form-control" rows="3"></textarea>
                        <label for="txaMqlChecklistQualDesc" id="lblMqlChecklistQualDesc" class="text-muted">Description *</label>
                        <p class="font-small text-danger" id="txaMqlChecklistQualDescErr"></p>
                    </div>
                    <div class="row">
                        <div class="col-md-12 select-outline">
                            <select id="optMqlFrequencyId" class="mdb-select md-form md-outline colorful-select mt-0"></select>
                            <label for="optMqlFrequencyId" id="lblMqlFrequencyId">Frequency *</label>
                            <p class="font-small text-danger" id="optMqlFrequencyIdErr"></p>
                        </div>
                    </div>
                    <h6 class="font-small">Status:</h6>
                    <div class="form-check pl-0 ml-3">
                        <input type="checkbox" class="form-check-input" id="chkMqlChecklistQualStatus" name="chkMqlChecklistQualStatus" value="1">
                        <label class="form-check-label" for="chkMqlChecklistQualStatus">Active</label>
                    </div>
                </form>
            </div>
            <div class="modal-footer p-2">
                <button class="btn btn-outline-info waves-effect" data-dismiss="modal"><i class="fas fa-undo-alt ml-1"></i> Close</button>
                <button id="btnMqlSubmit" class="btn btn-info waves-effect" disabled><i class="far fa-paper-plane ml-1"></i> Submit</button>
            </div>
        </div>
    </div>
</div>
