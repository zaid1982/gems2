<!--
  Modal: modal_kpa_eval_mpv — Tabler/GEMS modal + form contract (P3B KPA).
  Loaded by pages/kpa_evaluation.html. JS IDs preserved from the MDB original.
-->
<div class="modal fade" id="modal_kpa_eval_mpv" tabindex="-1" aria-labelledby="h4KmvTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="h4KmvTitle">Monthly Payment Value</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formKmv" autocomplete="off" novalidate>
          <input type="hidden" id="hidKmvEvalId">
          <p id="pKmvPeriod" class="text-secondary"></p>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtKmvMpv">Monthly Payment Value (RM)</label>
              <input type="number" step="0.001" min="0" id="txtKmvMpv" class="form-control">
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtKmvMaxApd">Maximum APD (%)</label>
              <input type="number" step="0.01" min="0" max="100" id="txtKmvMaxApd" class="form-control">
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtKmvRemarks">Remarks</label>
              <input type="text" id="txtKmvRemarks" class="form-control">
            </div>
          </div>
          <div class="gems-note">
            <i class="fas fa-triangle-exclamation"></i>
            <div>Saving recalculates the APD value of every indicator in this month.</div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" class="btn btn-primary" id="btnKmvSave">
          <i class="far fa-save me-2"></i>Save &amp; Recalculate
        </button>
      </div>
    </div>
  </div>
</div>
