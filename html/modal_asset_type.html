<!--
  Modal: modal_asset_type — Tabler/GEMS modal + form contract (P4B-2).

  Loaded by pages/asset_type.html ONLY. Copies the P4 modal contract:
    gems-modal-md (640px) + modal-dialog-scrollable, never modal-dialog-centered.
    Flat white header, btn-close flex-centred with the title.
    Visible labels, gems-form-grid, H3 MzValidate error slots.
    Footer: outline Close first, primary Save last. No btn-info.

  Asset Type extras vs simple masters: required Group + Category cascade
  (GemsUI.fillSelect), description textarea (maxLength 255), and status
  values 1 / 2 / 5 (archived is display-only; the checkbox still writes 1 or 2).

  Legacy Add / Edit contract (preserve):
    Add filters parent groups to assetGroupStatus === '1'.
    Add Group change rebuilds Category to that group's assetCategoryStatus === '1'
    and clears any stale Category value.
    Edit loads every Group and every Category (including inactive/archived)
    so an existing Type whose parent is no longer active remains displayable,
    then disables both parent selects so the relationship cannot be changed.

  JS contract preserved (js/pages/modal_asset_type.js, js/pages/main_asset_type.js):
    #modal_asset_type  #formMzt
    #optMztAssetGroupId  #lblMztAssetGroupId  #optMztAssetGroupIdErr
    #optMztAssetCategoryId  #lblMztAssetCategoryId  #optMztAssetCategoryIdErr
    #txtMztName  #lblMztName  #txtMztNameErr
    #txaMztDesc  #lblMztDesc  #txaMztDescErr
    #chkMztStatus  #chkMztStatusErr  #btnMztSubmit  #lblMztTitle
-->
<div class="modal fade" id="modal_asset_type" tabindex="-1" aria-labelledby="lblMztTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMztTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMzt" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optMztAssetGroupId" id="lblMztAssetGroupId">Asset Group <span class="required" aria-hidden="true">*</span></label>
              <select id="optMztAssetGroupId" class="form-select" aria-required="true" aria-describedby="optMztAssetGroupIdErr"></select>
              <div class="gems-field-error" id="optMztAssetGroupIdErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optMztAssetCategoryId" id="lblMztAssetCategoryId">Asset Category <span class="required" aria-hidden="true">*</span></label>
              <select id="optMztAssetCategoryId" class="form-select" aria-required="true" aria-describedby="optMztAssetCategoryIdErr">
                <option value="" selected>Choose Asset Category</option>
              </select>
              <div class="gems-field-error" id="optMztAssetCategoryIdErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMztName" id="lblMztName">Asset Type <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMztName" class="form-control" aria-required="true" aria-describedby="txtMztNameErr">
              <div class="gems-field-error" id="txtMztNameErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txaMztDesc" id="lblMztDesc">Description</label>
              <textarea id="txaMztDesc" class="form-control" rows="3" aria-describedby="txaMztDescErr"></textarea>
              <div class="gems-field-error" id="txaMztDescErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <span class="form-label">Status</span>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkMztStatus" name="chkMztStatus" value="1" aria-describedby="chkMztStatusErr">
                <label class="form-check-label" for="chkMztStatus">Active</label>
              </div>
              <div class="gems-field-error" id="chkMztStatusErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" id="btnMztSubmit" class="btn btn-primary" disabled>
          <i class="far fa-save me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
