<!--
  Modal: modal_site_ptw_public — Tabler chrome only (P4C-1).

  Loaded by pages/site.html ONLY. Converts header/footer/buttons.
  Does not migrate ptw_form.html. URL + QR IDs stay:
    #modal_site_ptw_public  #modalSitePtwPublicLabel
    #txtSitePtwPublicLink  #divSitePtwPublicQr  #btnSitePtwPublicCopy
-->
<div class="modal fade" id="modal_site_ptw_public" tabindex="-1" aria-labelledby="modalSitePtwPublicLabel" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalSitePtwPublicLabel">PTW Public Form Link</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="gems-form-grid">
          <div class="gems-field gems-field-12">
            <label class="form-label" for="txtSitePtwPublicLink">PTW Form URL</label>
            <input type="text" id="txtSitePtwPublicLink" class="form-control" disabled value="">
          </div>
          <div class="gems-field gems-field-12">
            <span class="form-label">PTW Form QR Code</span>
            <div class="d-flex justify-content-center">
              <div id="divSitePtwPublicQr"></div>
            </div>
          </div>
          <div class="gems-field gems-field-12">
            <p class="text-secondary mb-0" style="font-size:.75rem">Scan or copy the above link to access the public PTW submission form for this site.</p>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" id="btnSitePtwPublicCopy" class="btn btn-primary">
          <i class="fas fa-copy me-2"></i>Copy Link
        </button>
      </div>
    </div>
  </div>
</div>
