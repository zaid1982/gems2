<!--
  Modal: modal_client — Tabler/GEMS modal + form contract (P4B-3).

  Loaded by pages/client.html ONLY. Copies the P4 modal contract:
    gems-modal-lg (800px) + modal-dialog-scrollable, never modal-dialog-centered.
    Flat white header, btn-close flex-centred with the title.
    Visible labels, gems-form-grid, H3 MzValidate error slots.
    Footer: outline Close first, primary Save last. No btn-info.

  Client extras: required Severity + Failure Code checkbox lists
  (name="chkMclSeverity[]" / name="chkMclFailureCode[]"). Legacy Add and
  Edit both render only severityStatus === '1' / failureCodeStatus === '1'.
  Inactive saved IDs are not represented and are omitted from PUT — that
  is legacy behavior, not an Edit-preservation improvement.

  Status checkbox still writes 1 or 2. Archived (5) is list/filter only.

  JS contract preserved (js/pages/modal_client.js, js/pages/main_client.js):
    #modal_client  #formMcl
    #txtMclName  #lblMclName  #txtMclNameErr
    #txaMclDesc  #lblMclDesc  #txaMclDescErr
    #divMclSeverity  #chkMclSeverityErr
    #divMclFailureCode  #chkMclFailureCodeErr
    #chkMclStatus  #chkMclStatusErr  #btnMclSubmit  #lblMclTitle
-->
<div class="modal fade" id="modal_client" tabindex="-1" aria-labelledby="lblMclTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMclTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMcl" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMclName" id="lblMclName">Client Name <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMclName" class="form-control" aria-required="true" aria-describedby="txtMclNameErr">
              <div class="gems-field-error" id="txtMclNameErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txaMclDesc" id="lblMclDesc">Description</label>
              <textarea id="txaMclDesc" class="form-control" rows="3" aria-describedby="txaMclDescErr"></textarea>
              <div class="gems-field-error" id="txaMclDescErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <span class="form-label" id="lblMclSeverity">Work Order Severity <span class="required" aria-hidden="true">*</span></span>
              <div id="divMclSeverity"></div>
              <div class="gems-field-error" id="chkMclSeverityErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <span class="form-label" id="lblMclFailureCode">Failure Code <span class="required" aria-hidden="true">*</span></span>
              <div id="divMclFailureCode"></div>
              <div class="gems-field-error" id="chkMclFailureCodeErr" role="alert"></div>
              <span class="form-label mt-3">Status</span>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkMclStatus" name="chkMclStatus" value="1" aria-describedby="chkMclStatusErr">
                <label class="form-check-label" for="chkMclStatus">Active</label>
              </div>
              <div class="gems-field-error" id="chkMclStatusErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" id="btnMclSubmit" class="btn btn-primary" disabled>
          <i class="far fa-save me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
