<div class="modal fade gems-modal" id="modal_ppm_group" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered mt-3 pt-3 mb-5" role="document">
        <!--Content-->
        <div class="modal-content gems-modal-card">
            <!--Header-->
            <div class="modal-header gems-modal-header">
                <h4 class="text-white mt-2 ml-2"><i class="fas fa-plus text-white"></i> &nbsp;Add PPM Group</h4>
                <button type="button" class="close waves-effect waves-light mr-0 text-white pt-4 gems-modal-close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--Body-->
            <div class="modal-body gems-modal-body">
                <form id="formMpg">
                    <div class="md-form md-outline mt-4">
                        <input type="text" id="txtMpgClient" class="form-control" disabled>
                        <label for="txtMpgClient" id="lblMpgClient">Client</label>
                    </div>
                    <div class="md-form md-outline mt-0">
                        <input type="text" id="txtMpgSite" class="form-control" disabled>
                        <label for="txtMpgSite" id="lblMpgSite">Site</label>
                    </div>
                    <div class="md-form md-outline mt-0">
                        <input type="text" id="txtMpgRole" class="form-control" disabled>
                        <label for="txtMpgRole" id="lblMpgRole">Role</label>
                    </div>
                    <div class="md-form md-outline mt-0">
                        <input type="text" id="txtMpgName" class="form-control">
                        <label for="txtMpgName" id="lblMpgName">Group Name *</label>
                        <p class="font-small text-danger" id="txtMpgNameErr"></p>
                    </div>
                    <div class="row" id="divMpgReportTo">
                        <div class="col-md-12 select-outline mt-0">
                            <select id="optMpgReportTo" class="mdb-select md-form md-outline colorful-select mt-0" data-stop-refresh="true"></select>
                            <label for="optMpgReportTo" id="lblMpgReportTo">Report To *</label>
                            <p class="font-small text-danger" id="optMpgReportToErr"></p>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer p-2 gems-modal-footer">
                <button class="btn btn-outline-info waves-effect" data-dismiss="modal"><i class="fas fa-undo-alt ml-1"></i> Close</button>
                <button id="btnMpgSubmit" class="btn btn-info waves-effect" disabled><i class="far fa-paper-plane ml-1"></i> Submit</button>
            </div>
        </div>
    </div>
</div>
