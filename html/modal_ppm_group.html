<!--
  Modal: modal_ppm_group — Tabler/GEMS modal + form contract (P5-1).

  Loaded by pages/ppm_group.html ONLY.
    gems-modal-md + modal-dialog-scrollable, never modal-dialog-centered.
    Visible labels, gems-form-grid, H3 MzValidate error slots.
    Footer: outline Close first, primary Submit last.

  JS contract preserved (js/pages/modal_ppm_group.js):
    #modal_ppm_group  #formMpg
    #txtMpgClient  #txtMpgSite  #txtMpgRole
    #txtMpgName  #lblMpgName  #txtMpgNameErr
    #divMpgReportTo  #optMpgReportTo  #lblMpgReportTo  #optMpgReportToErr
    #btnMpgSubmit
-->
<div class="modal fade" id="modal_ppm_group" tabindex="-1" aria-labelledby="lblMpgTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMpgTitle"><i class="fas fa-plus me-2"></i>Add PPM Group</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMpg" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMpgClient" id="lblMpgClient">Client</label>
              <input type="text" id="txtMpgClient" class="form-control" disabled>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMpgSite" id="lblMpgSite">Site</label>
              <input type="text" id="txtMpgSite" class="form-control" disabled>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMpgRole" id="lblMpgRole">Role</label>
              <input type="text" id="txtMpgRole" class="form-control" disabled>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMpgName" id="lblMpgName">Group Name <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMpgName" class="form-control" aria-required="true" aria-describedby="txtMpgNameErr">
              <div class="gems-field-error" id="txtMpgNameErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12" id="divMpgReportTo">
              <label class="form-label" for="optMpgReportTo" id="lblMpgReportTo">Report To <span class="required" aria-hidden="true">*</span></label>
              <select id="optMpgReportTo" class="form-select" aria-describedby="optMpgReportToErr"></select>
              <div class="gems-field-error" id="optMpgReportToErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><i class="fas fa-undo-alt me-1"></i> Close</button>
        <button type="button" id="btnMpgSubmit" class="btn btn-primary" disabled><i class="far fa-paper-plane me-1"></i> Submit</button>
      </div>
    </div>
  </div>
</div>
