<!--
  Modal: modal_waste_pending_edit — Tabler/GEMS modal + form contract (P3A Waste).
  Loaded by pages/waste_pending.html. JS IDs preserved from the MDB original.
-->
<div class="modal fade" id="modal_waste_pending_edit" tabindex="-1" aria-labelledby="lblWpeTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblWpeTitle">Correct pending waste</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="hidWpeId">
        <div class="gems-form-grid">
          <div class="gems-field gems-field-12">
            <label class="form-label" for="lblWpeRef">Waste reference</label>
            <input type="text" id="lblWpeRef" class="form-control" readonly>
          </div>
          <div class="gems-field gems-field-12">
            <label class="form-label" for="optWpeSw">Waste type</label>
            <select id="optWpeSw" class="form-select"></select>
          </div>
          <div class="gems-field gems-field-6">
            <label class="form-label" for="txtWpeQty">Registered weight (kg)</label>
            <input type="number" step="0.001" min="0.001" id="txtWpeQty" class="form-control">
          </div>
          <div class="gems-field gems-field-6">
            <label class="form-label" for="txtWpeDate">Generated date</label>
            <input type="date" id="txtWpeDate" class="form-control">
          </div>
          <div class="gems-field gems-field-12">
            <label class="form-label" for="txtWpeRemarks">Remarks</label>
            <input type="text" id="txtWpeRemarks" class="form-control">
          </div>
          <div class="gems-field gems-field-12">
            <label class="form-label" for="txaWpeReason">Reason for the correction</label>
            <textarea id="txaWpeReason" class="form-control" rows="2" placeholder="Recorded in the amendment history"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" class="btn btn-primary" id="btnWpeSave">
          <i class="far fa-save me-2"></i>Save Changes
        </button>
      </div>
    </div>
  </div>
</div>
