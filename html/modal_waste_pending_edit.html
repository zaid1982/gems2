<div class="modal fade gems-modal" id="modal_waste_pending_edit" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content gems-modal-card">
      <div class="modal-header gems-modal-header">
        <h4 class="text-white mt-2 ml-2">Correct pending waste</h4>
        <button type="button" class="close text-white gems-modal-close" data-dismiss="modal"><span>&times;</span></button>
      </div>
      <div class="modal-body gems-modal-body">
        <input type="hidden" id="hidWpeId">
        <div class="form-group">
          <label class="waste-label" for="lblWpeRef">Waste reference</label>
          <input type="text" id="lblWpeRef" class="form-control" readonly>
        </div>
        <div class="form-group">
          <label class="waste-label" for="optWpeSw">Waste type</label>
          <select id="optWpeSw" class="custom-select gems-plain-select browser-default"></select>
        </div>
        <div class="form-group">
          <label class="waste-label" for="txtWpeQty">Registered weight (kg)</label>
          <input type="number" step="0.001" min="0.001" id="txtWpeQty" class="form-control">
        </div>
        <div class="form-group">
          <label class="waste-label" for="txtWpeDate">Generated date</label>
          <input type="date" id="txtWpeDate" class="form-control">
        </div>
        <div class="form-group">
          <label class="waste-label" for="txtWpeRemarks">Remarks</label>
          <input type="text" id="txtWpeRemarks" class="form-control">
        </div>
        <div class="form-group mb-0">
          <label class="waste-label" for="txaWpeReason">Reason for the correction</label>
          <textarea id="txaWpeReason" class="form-control" rows="2" placeholder="Recorded in the amendment history"></textarea>
        </div>
      </div>
      <div class="modal-footer gems-modal-footer">
        <button class="btn btn-outline-info" data-dismiss="modal">Close</button>
        <button class="btn btn-info" id="btnWpeSave">Save Changes</button>
      </div>
    </div>
  </div>
</div>
