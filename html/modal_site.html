<div class="modal fade" id="modal_site" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-notify modal-info mt-3 pt-3 mb-5" role="document">
        <!--Content-->
        <div class="modal-content">
            <!--Header-->
            <div class="modal-header d-flex justify-content-center">
                <h4 class="text-white mt-2 ml-2" id="lblMstTitle"></h4>
                <button type="button" class="close waves-effect waves-light mr-0 text-white pt-4" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--Body-->
            <div class="modal-body">
                <form id="formMst">
                    <div class="row">
                        <div class="col-md-12 select-outline mt-4">
                            <select id="optMstClientId" class="mdb-select md-form md-outline colorful-select mt-0" data-stop-refresh="true"></select>
                            <label for="optMstClientId" id="lblMstClientId">Client *</label>
                            <p class="font-small text-danger" id="optMstClientIdErr"></p>
                        </div>
                    </div>
                    <div class="md-form md-outline mt-0">
                        <input type="text" id="txtMstName" class="form-control">
                        <label for="txtMstName" id="lblMstName">Site Name *</label>
                        <p class="font-small text-danger" id="txtMstNameErr"></p>
                    </div>
                    <div class="md-form md-outline mt-0">
                        <input type="text" id="txtMstCode" class="form-control">
                        <label for="txtMstCode" id="lblMstCode">Site Code *</label>
                        <p class="font-small text-danger" id="txtMstCodeErr"></p>
                    </div>
                    <div class="md-form md-outline">
                        <textarea id="txaMstDesc" class="md-textarea form-control" rows="3"></textarea>
                        <label for="txaMstDesc" id="lblMstDesc" class="text-muted">Description</label>
                        <p class="font-small text-danger" id="txaMstDescErr"></p>
                    </div>
                    <div class="row mb-3">
                        <div class="col-4 col-lg-3">
                            <h6 class="font-small">Has Work Request:</h6>
                            <div class="form-check pl-0 ml-3 mb-3">
                                <input type="checkbox" class="form-check-input" id="chkMstWorkRequest" name="chkMstWorkRequest" value="1">
                                <label class="form-check-label" for="chkMstWorkRequest">Yes</label>
                            </div>
                        </div>
                        <div class="col-4 col-lg-3">
                            <h6 class="font-small">Status:</h6>
                            <div class="form-check pl-0 ml-3">
                                <input type="checkbox" class="form-check-input" id="chkMstStatus" name="chkMstStatus" value="1">
                                <label class="form-check-label" for="chkMstStatus">Active</label>
                            </div>
                        </div>
                    </div>
                    <div class="row mb-2 isMstWorkRequest">
                        <div class="col-md-12">
                            <div class="card mb-4">
                                <div class="card-body">
                                    <button type="button" class="btn btn-pink btn-sm float-right" id="btnSccLetterAdd" data-toggle="tooltip" data-placement="top" title="Tambah Surat-surat Siasat dan Lain-lain"><i class="fas fa-plus mr-1"></i> Add Problem Type</button>
                                    <h6 class="text-muted font-weight-bold ml-2 mt-2">Problem Type : &nbsp;</h6>
                                    <div class="table-responsive">
                                        <table id="dtMstProblemType" class="table table-hover table-sm mb-0 display responsive">
                                            <thead>
                                            <tr class="th-strong">
                                                <th style="width: 10%">#</th>
                                                <th>Problem Type</th>
                                                <th style="width: 20%">Status</th>
                                                <th>Status</th>
                                            </tr>
                                            </thead>
                                            <tbody></tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row isMstWorkRequest">
                        <div class="col-md-12">
                            <div class="card mb-4">
                                <div class="card-body">
                                    <button type="button" class="btn btn-amber btn-sm float-right" id="btnSccLetterAdd" data-toggle="tooltip" data-placement="top" title="Tambah Surat-surat Siasat dan Lain-lain"><i class="fas fa-plus mr-1"></i> Add Site Location</button>
                                    <h6 class="text-muted font-weight-bold ml-2 mt-2">Site Location : &nbsp;</h6>
                                    <div class="table-responsive">
                                        <table id="dtMstSiteLocation" class="table table-hover mb-0 display responsive">
                                            <thead>
                                            <tr class="th-strong">
                                                <th style="width: 10%">#</th>
                                                <th>Location Name</th>
                                                <th style="width: 20%">Status</th>
                                                <th>Status</th>
                                            </tr>
                                            </thead>
                                            <tbody></tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer p-2">
                <button class="btn btn-outline-info waves-effect" data-dismiss="modal"><i class="fas fa-undo-alt ml-1"></i> Close</button>
                <button id="btnMstSubmit" class="btn btn-info waves-effect" disabled><i class="far fa-paper-plane ml-1"></i> Submit</button>
            </div>
        </div>
    </div>
</div>
