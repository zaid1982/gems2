<!--
  Modal: modal_site — Tabler/GEMS modal + form contract (P4C-1).

  Loaded by pages/site.html ONLY. Copies the P4 modal contract:
    gems-modal-lg (800px) + modal-dialog-scrollable, never modal-dialog-centered.
    Flat white header, btn-close flex-centred with the title.
    Visible labels, gems-form-grid, H3 MzValidate error slots.
    Footer: outline Close first, primary Save last. No btn-info.

  Site extras: required Client parent select (GemsUI.fillSelect), site code
  maxLength 5, WR / public QR checkboxes, and the Edit-only Problem Type
  table when siteIsWr === '1'. The legacy Site Location table stays omitted
  (it was already commented out).

  Legacy Add / Edit contract (preserve):
    Add filters clients to clientStatus === '1'.
    Edit loads every client (including inactive/archived) so an existing
    site whose parent is no longer active remains displayable, then
    disables the select so the parent cannot be changed.
    Status checkbox still writes 1 or 2. Archived (5) is list/filter only.

  JS contract preserved (js/pages/modal_site.js, js/pages/main_site.js):
    #modal_site  #formMst
    #optMstClientId  #lblMstClientId  #optMstClientIdErr
    #txtMstName  #lblMstName  #txtMstNameErr
    #txtMstCode  #lblMstCode  #txtMstCodeErr
    #txaMstDesc  #lblMstDesc  #txaMstDescErr
    #chkMstWorkRequest  #chkMstPublic  #chkMstStatus
    #chkMstWorkRequestErr  #chkMstPublicErr  #chkMstStatusErr
    .isMstWorkRequest  #dtMstProblemType  #btnSccLetterAdd
    #btnMstSubmit  #lblMstTitle
-->
<div class="modal fade" id="modal_site" tabindex="-1" aria-labelledby="lblMstTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMstTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMst" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="optMstClientId" id="lblMstClientId">Client <span class="required" aria-hidden="true">*</span></label>
              <select id="optMstClientId" class="form-select" aria-required="true" aria-describedby="optMstClientIdErr"></select>
              <div class="gems-field-error" id="optMstClientIdErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtMstName" id="lblMstName">Site Name <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMstName" class="form-control" aria-required="true" aria-describedby="txtMstNameErr">
              <div class="gems-field-error" id="txtMstNameErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtMstCode" id="lblMstCode">Site Code <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMstCode" class="form-control" aria-required="true" aria-describedby="txtMstCodeErr">
              <div class="gems-field-error" id="txtMstCodeErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txaMstDesc" id="lblMstDesc">Description</label>
              <textarea id="txaMstDesc" class="form-control" rows="3" aria-describedby="txaMstDescErr"></textarea>
              <div class="gems-field-error" id="txaMstDescErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <span class="form-label">Has Work Request</span>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkMstWorkRequest" name="chkMstWorkRequest" value="1" aria-describedby="chkMstWorkRequestErr">
                <label class="form-check-label" for="chkMstWorkRequest">Yes</label>
              </div>
              <div class="gems-field-error" id="chkMstWorkRequestErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <span class="form-label">Has Public QR Scan</span>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkMstPublic" name="chkMstPublic" value="1" aria-describedby="chkMstPublicErr">
                <label class="form-check-label" for="chkMstPublic">Yes</label>
              </div>
              <div class="gems-field-error" id="chkMstPublicErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <span class="form-label">Status</span>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkMstStatus" name="chkMstStatus" value="1" aria-describedby="chkMstStatusErr">
                <label class="form-check-label" for="chkMstStatus">Active</label>
              </div>
              <div class="gems-field-error" id="chkMstStatusErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12 isMstWorkRequest">
              <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
                <span class="form-label mb-0">Problem Type</span>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="btnSccLetterAdd"
                        data-bs-toggle="tooltip" title="Add Problem Type" aria-label="Add Problem Type">
                  <i class="fas fa-plus me-1"></i>Add Problem Type
                </button>
              </div>
              <table id="dtMstProblemType" class="table table-vcenter table-sm mb-0">
                <thead>
                  <tr>
                    <th style="width:10%">#</th>
                    <th>Problem Type</th>
                    <th style="width:20%">Status</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" id="btnMstSubmit" class="btn btn-primary" disabled>
          <i class="far fa-save me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
