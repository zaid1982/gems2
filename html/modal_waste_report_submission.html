<!--
  Modal: modal_waste_report_submission — Tabler/GEMS modal + form contract (P3A Waste).
  Loaded by pages/waste_report.html. JS IDs preserved from the MDB original.
-->
<div class="modal fade" id="modal_waste_report_submission" tabindex="-1" aria-labelledby="lblWrsTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblWrsTitle">Record JKR Submission</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="hidWrsId">
        <div class="gems-form-grid">
          <div class="gems-field gems-field-6">
            <label class="form-label" for="txtWrsDate">Submission Date <span class="required" aria-hidden="true">*</span></label>
            <input type="date" id="txtWrsDate" class="form-control" aria-required="true">
          </div>
          <div class="gems-field gems-field-6">
            <label class="form-label" for="txtWrsTo">Submitted To <span class="required" aria-hidden="true">*</span></label>
            <input type="text" id="txtWrsTo" class="form-control" aria-required="true">
          </div>
          <div class="gems-field gems-field-6">
            <label class="form-label" for="optWrsChannel">Channel</label>
            <select id="optWrsChannel" class="form-select"></select>
          </div>
          <div class="gems-field gems-field-6">
            <label class="form-label" for="txtWrsRef">Reference</label>
            <input type="text" id="txtWrsRef" class="form-control">
          </div>
          <div class="gems-field gems-field-12">
            <label class="form-label" for="txaWrsNotes">Notes</label>
            <textarea id="txaWrsNotes" class="form-control" rows="2"></textarea>
          </div>
          <div class="gems-field gems-field-12">
            <label class="form-label" for="txfWrsFile">Acknowledgement evidence</label>
            <input type="file" id="txfWrsFile" class="form-control" accept=".pdf,.jpg,.jpeg,.png">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" class="btn btn-primary" id="btnWrsSave">
          <i class="far fa-save me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
