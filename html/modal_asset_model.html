<!--
  Modal: modal_asset_model — Tabler/GEMS modal + form contract (P4B-2).

  Loaded by pages/asset_type.html ONLY. Same P4 modal chrome as Type, but
  fields follow the Model workflow (not a Type clone):
    Type context (Group / Category / Type) is always disabled.
    Brand is required and editable on Add, disabled on Edit.
    Model name maxLength 150, description maxLength 255.
    Status checkbox writes 1 or 2 only. Model UI has no Archived (5) filter.

  Legacy Add / Edit contract (preserve):
    Add populates Brand with assetBrandStatus === '1'.
    Edit loads every Brand (including inactive/archived) so a saved Brand
    that is no longer active remains displayable, then disables Brand.
    Group / Category / Type are derived from the selected Type context
    (refAssetType[assetTypeId].assetCategoryId -> refAssetCategory.assetGroupId).

  JS contract preserved (js/pages/modal_asset_model.js, js/pages/main_asset_type.js):
    #modal_asset_model  #formMzm
    #optMzmAssetGroupId  #lblMzmAssetGroupId  #optMzmAssetGroupIdErr
    #optMzmAssetCategoryId  #lblMzmAssetCategoryId  #optMzmAssetCategoryIdErr
    #optMzmAssetTypeId  #lblMzmAssetTypeId  #optMzmAssetTypeIdErr
    #optMzmAssetBrandId  #lblMzmAssetBrandId  #optMzmAssetBrandIdErr
    #txtMzmName  #lblMzmName  #txtMzmNameErr
    #txaMzmDesc  #lblMzmDesc  #txaMzmDescErr
    #chkMzmStatus  #chkMzmStatusErr  #btnMzmSubmit  #lblMzmTitle
-->
<div class="modal fade" id="modal_asset_model" tabindex="-1" aria-labelledby="lblMzmTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMzmTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMzm" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optMzmAssetGroupId" id="lblMzmAssetGroupId">Asset Group <span class="required" aria-hidden="true">*</span></label>
              <select id="optMzmAssetGroupId" class="form-select" disabled aria-required="true" aria-describedby="optMzmAssetGroupIdErr"></select>
              <div class="gems-field-error" id="optMzmAssetGroupIdErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optMzmAssetCategoryId" id="lblMzmAssetCategoryId">Asset Category <span class="required" aria-hidden="true">*</span></label>
              <select id="optMzmAssetCategoryId" class="form-select" disabled aria-required="true" aria-describedby="optMzmAssetCategoryIdErr"></select>
              <div class="gems-field-error" id="optMzmAssetCategoryIdErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optMzmAssetTypeId" id="lblMzmAssetTypeId">Asset Type <span class="required" aria-hidden="true">*</span></label>
              <select id="optMzmAssetTypeId" class="form-select" disabled aria-required="true" aria-describedby="optMzmAssetTypeIdErr"></select>
              <div class="gems-field-error" id="optMzmAssetTypeIdErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optMzmAssetBrandId" id="lblMzmAssetBrandId">Asset Brand <span class="required" aria-hidden="true">*</span></label>
              <select id="optMzmAssetBrandId" class="form-select" aria-required="true" aria-describedby="optMzmAssetBrandIdErr">
                <option value="" selected>Choose Asset Brand</option>
              </select>
              <div class="gems-field-error" id="optMzmAssetBrandIdErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMzmName" id="lblMzmName">Asset Model <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMzmName" class="form-control" aria-required="true" aria-describedby="txtMzmNameErr">
              <div class="gems-field-error" id="txtMzmNameErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txaMzmDesc" id="lblMzmDesc">Description</label>
              <textarea id="txaMzmDesc" class="form-control" rows="3" aria-describedby="txaMzmDescErr"></textarea>
              <div class="gems-field-error" id="txaMzmDescErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <span class="form-label">Status</span>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkMzmStatus" name="chkMzmStatus" value="1" aria-describedby="chkMzmStatusErr">
                <label class="form-check-label" for="chkMzmStatus">Active</label>
              </div>
              <div class="gems-field-error" id="chkMzmStatusErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" id="btnMzmSubmit" class="btn btn-primary" disabled>
          <i class="far fa-save me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
