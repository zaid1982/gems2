<div class="modal fade" id="modal_asset_model" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-notify modal-info mt-3 pt-3 mb-5" role="document">
        <!--Content-->
        <div class="modal-content">
            <!--Header-->
            <div class="modal-header d-flex justify-content-center">
                <h4 class="text-white mt-2 ml-2" id="lblMzmTitle"></h4>
                <button type="button" class="close waves-effect waves-light mr-0 text-white pt-4" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--Body-->
            <div class="modal-body">
                <form id="formMzm">
                    <div class="row">
                        <div class="col-md-12 select-outline mt-4">
                            <select id="optMzmAssetGroupId" class="mdb-select md-form md-outline colorful-select mt-0" disabled></select>
                            <label for="optMzmAssetGroupId" id="lblMzmAssetGroupId">Asset Group *</label>
                            <p class="font-small text-danger" id="optMzmAssetGroupIdErr"></p>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 select-outline mt-0">
                            <select id="optMzmAssetCategoryId" class="mdb-select md-form md-outline colorful-select mt-0" disabled></select>
                            <label for="optMzmAssetCategoryId" id="lblMzmAssetCategoryId">Asset Category *</label>
                            <p class="font-small text-danger" id="optMzmAssetCategoryIdErr"></p>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 select-outline mt-0">
                            <select id="optMzmAssetTypeId" class="mdb-select md-form md-outline colorful-select mt-0" disabled></select>
                            <label for="optMzmAssetTypeId" id="lblMzmAssetTypeId">Asset Type *</label>
                            <p class="font-small text-danger" id="optMzmAssetTypeIdErr"></p>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 select-outline mt-0">
                            <select id="optMzmAssetBrandId" class="mdb-select md-form md-outline colorful-select mt-0">
                                <option value="" disabled selected>Choose Asset Brand</option>
                            </select>
                            <label for="optMzmAssetBrandId" id="lblMzmAssetBrandId">Asset Brand *</label>
                            <p class="font-small text-danger" id="optMzmAssetBrandIdErr"></p>
                        </div>
                    </div>
                    <div class="md-form md-outline mt-0">
                        <input type="text" id="txtMzmName" class="form-control">
                        <label for="txtMzmName" id="lblMzmName">Asset Model *</label>
                        <p class="font-small text-danger" id="txtMzmNameErr"></p>
                    </div>
                    <div class="md-form md-outline">
                        <textarea id="txaMzmDesc" class="md-textarea form-control" rows="3"></textarea>
                        <label for="txaMzmDesc" id="lblMzmDesc" class="text-muted">Description</label>
                        <p class="font-small text-danger" id="txaMzmDescErr"></p>
                    </div>
                    <h6 class="font-small">Status:</h6>
                    <div class="form-check pl-0 ml-3">
                        <input type="checkbox" class="form-check-input" id="chkMzmStatus" name="chkMzmStatus" value="1">
                        <label class="form-check-label" for="chkMzmStatus">Active</label>
                    </div>
                </form>
            </div>
            <div class="modal-footer flex-center">
                <button class="btn btn-outline-info waves-effect" data-dismiss="modal"><i class="fas fa-undo-alt ml-1"></i> Close</button>
                <button id="btnMzmSubmit" class="btn btn-info waves-effect" disabled><i class="far fa-paper-plane ml-1"></i> Submit</button>
            </div>
        </div>
    </div>
</div>
