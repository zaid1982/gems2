<!--
  Modal: modal_waste_premise — Tabler/GEMS modal + form contract (P3A Waste).
  Loaded by pages/waste_setup.html. JS IDs preserved from the MDB original.
-->
<div class="modal fade" id="modal_waste_premise" tabindex="-1" aria-labelledby="lblWprTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblWprTitle">Premise Settings</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formWpr" autocomplete="off" novalidate>
          <input type="hidden" id="hidWprSiteId">
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <div class="form-label">Premise</div>
              <p id="lblWprName" class="mb-0 fw-bold">-</p>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txaWprAddress">Address</label>
              <textarea id="txaWprAddress" class="form-control" rows="2"></textarea>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtWprContact">Contact Number</label>
              <input type="text" id="txtWprContact" class="form-control">
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtWprCutover">Cut-over Date</label>
              <input type="date" id="txtWprCutover" class="form-control">
            </div>
            <div class="gems-field gems-field-12">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkWprEvP">
                <label class="form-check-label" for="chkWprEvP">Evidence required for Produced</label>
              </div>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkWprEvD">
                <label class="form-check-label" for="chkWprEvD">Evidence required for Disposed</label>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" class="btn btn-primary" id="btnWprSave">
          <i class="far fa-save me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
