<<div class="modal fade" id="modal_leave" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog cascading-modal mt-5 pt-5 mb-5" role="document">
        <!--Content-->
        <div class="modal-content">
            <!--Header-->
            <div class="modal-header info-color white-text">
                <h4 class="mb-0" id="lblMlvTitle">Permohonan Cuti</h4>
                <button type="button" class="close waves-effect waves-light mr-0" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--Body-->
            <div class="modal-body pb-1">
                <form id="formMlv">
                    <div class="md-form">
                        <select id="optMlvLeaveTypeId" class="mdb-select md-form colorful-select dropdown-info">
                            <option value="" selected>Pilih Jenis Cuti *</option>
                        </select>
                        <label for="optMlvLeaveTypeId" id="lblMlvLeaveTypeId"></label>
                        <p class="font-small text-danger" id="optMlvLeaveTypeIdErr"></p>
                    </div>
                    <div class="md-form">
                        <input type="text" id="txtMlvLeaveAmount" class="form-control">
                        <label for="txtMlvLeaveAmount" id="lblMlvLeaveAmount">Jumlah Hari *</label>
                        <p class="font-small text-danger" id="txtMlvLeaveAmountErr"></p>
                    </div>
                    <div class="md-form">
                        <input type="text" id="txtMlvLeaveDateFrom" class="form-control datepicker">
                        <label for="txtMlvLeaveDateFrom" id="lblMlvLeaveDateFrom">Bermula Pada *</label>
                        <p class="font-small text-danger" id="txtMlvLeaveDateFromErr"></p>
                    </div>
                    <div class="md-form">
                        <input type="text" id="txtMlvLeaveDateTo" class="form-control datepicker">
                        <label for="txtMlvLeaveDateTo" id="lblMlvLeaveDateTo">Hingga *</label>
                        <p class="font-small text-danger" id="txtMlvLeaveDateToErr"></p>
                    </div>
                    <div class="md-form">
                        <textarea id="txaMlvLeaveReason" class="md-textarea form-control pt-1" rows="2"></textarea>
                        <label for="txaMlvLeaveReason" id="lblMlvLeaveReason" class="text-muted">Sebab Cuti *</label>
                        <p class="font-small text-danger" id="txaMlvLeaveReasonErr"></p>
                    </div>
                </form>
            </div>
            <div class="modal-footer flex-center">
                <button class="btn btn-outline-info waves-effect" data-dismiss="modal"><i class="fas fa-undo-alt ml-1"></i> Tutup</button>
                <button id="btnMlvSubmit" class="btn btn-info waves-effect"><i class="fas fa-highlighter"></i> Hantar</button>
            </div>
        </div>
    </div>
</div>
