<div class="modal fade" id="modal_ppm_user" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-notify modal-info mt-3 pt-3 mb-5" role="document">
        <!--Content-->
        <div class="modal-content">
            <!--Header-->
            <div class="modal-header d-flex justify-content-center">
                <h4 class="text-white mt-2 ml-2">Add PPM Group User</h4>
                <button type="button" class="close waves-effect waves-light mr-0 text-white pt-4" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--Body-->
            <div class="modal-body">
                <form id="formMpu">
                    <div class="md-form md-outline mt-4">
                        <input type="text" id="txtMpuClient" class="form-control" disabled>
                        <label for="txtMpuClient" id="lblMpuClient">Client</label>
                    </div>
                    <div class="md-form md-outline mt-0">
                        <input type="text" id="txtMpuSite" class="form-control" disabled>
                        <label for="txtMpuSite" id="lblMpuSite">Site</label>
                    </div>
                    <div class="md-form md-outline mt-0">
                        <input type="text" id="txtMpuRole" class="form-control" disabled>
                        <label for="txtMpuRole" id="lblMpuRole">Role</label>
                    </div>
                    <div class="md-form md-outline mt-0">
                        <input type="text" id="txtMpuGroupName" class="form-control" disabled>
                        <label for="txtMpuGroupName" id="lblMpuGroupName">Group Name</label>
                    </div>
                    <div class="row">
                        <div class="col-md-12 select-outline mt-0">
                            <select id="optMpuUserId" class="mdb-select md-form md-outline colorful-select mt-0" data-stop-refresh="true" searchable="Search here.."></select>
                            <label for="optMpuUserId" id="lblMpuUserId">Assigned User *</label>
                            <p class="font-small text-danger" id="optMpuUserIdErr"></p>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer p-2">
                <button class="btn btn-outline-info waves-effect" data-dismiss="modal"><i class="fas fa-undo-alt ml-1"></i> Close</button>
                <button id="btnMpuSubmit" class="btn btn-info waves-effect" disabled><i class="far fa-paper-plane ml-1"></i> Submit</button>
            </div>
        </div>
    </div>
</div>
