<div class="modal fade" id="modal_ppm_user" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
        <div class="modal-content ppm-group-user-modal">
            <div class="modal-header ppm-group-user-modal__header">
                <div class="ppm-group-user-modal__title d-flex align-items-start">
                    <span class="ppm-group-user-modal__icon"><i class="fa-duotone fa-user-plus"></i></span>
                    <div>
                        <h3 class="modal-title mb-1" id="lblMpuTitle">Add PPM Group User</h3>
                        <p class="ppm-group-user-modal__subtitle mb-0">Assign a user to this executor group with full context on the current selection.</p>
                    </div>
                </div>
                <button type="button" class="close ppm-group-user-modal__close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body ppm-group-user-modal__body">
                <form id="formMpu">
                    <div class="ppm-group-user-modal__section">
                        <div class="ppm-group-user-modal__section-header">
                            <h6 class="ppm-group-user-modal__section-title">Context</h6>
                            <p class="ppm-group-user-modal__section-hint mb-0">Reference details for the selected client, site, role, and group.</p>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-3">
                                <div class="md-form md-outline mt-0">
                                    <input type="text" id="txtMpuClient" class="form-control" disabled>
                                    <label for="txtMpuClient" id="lblMpuClient">Client</label>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="md-form md-outline mt-0">
                                    <input type="text" id="txtMpuSite" class="form-control" disabled>
                                    <label for="txtMpuSite" id="lblMpuSite">Site</label>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="md-form md-outline mt-0">
                                    <input type="text" id="txtMpuRole" class="form-control" disabled>
                                    <label for="txtMpuRole" id="lblMpuRole">Role</label>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="md-form md-outline mt-0">
                                    <input type="text" id="txtMpuGroupName" class="form-control" disabled>
                                    <label for="txtMpuGroupName" id="lblMpuGroupName">Group Name</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="ppm-group-user-modal__section">
                        <div class="ppm-group-user-modal__section-header">
                            <h6 class="ppm-group-user-modal__section-title">Assignment</h6>
                            <p class="ppm-group-user-modal__section-hint mb-0">Search and select the user to include in this PPM group.</p>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-12 select-outline mt-0">
                                <select id="optMpuUserId" class="mdb-select md-form md-outline colorful-select mt-0" data-stop-refresh="true" searchable="Search here.."></select>
                                <label for="optMpuUserId" id="lblMpuUserId">Assigned User <span class="text-danger">*</span></label>
                                <p class="font-small text-danger" id="optMpuUserIdErr"></p>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer ppm-group-user-modal__footer">
                <button class="btn btn-outline-secondary" data-dismiss="modal"><i class="fas fa-undo-alt mr-1"></i> Close</button>
                <button id="btnMpuSubmit" class="btn btn-primary" disabled><i class="far fa-paper-plane mr-1"></i> Submit</button>
            </div>
        </div>
    </div>
</div>
