<!--
  Modal: modal_ppm_user — Tabler/GEMS modal + form contract (P5-1).

  Loaded by pages/ppm_group.html ONLY.
    gems-modal-md + modal-dialog-scrollable, never modal-dialog-centered.
    Visible labels, gems-form-grid, H3 MzValidate error slots.
    Footer: outline Close first, primary Submit last.

  JS contract preserved (js/pages/modal_ppm_user.js):
    #modal_ppm_user  #formMpu
    #txtMpuClient  #txtMpuSite  #txtMpuRole  #txtMpuGroupName
    #optMpuUserId  #lblMpuUserId  #optMpuUserIdErr
    #btnMpuSubmit
-->
<div class="modal fade" id="modal_ppm_user" tabindex="-1" aria-labelledby="lblMpuTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMpuTitle">Add PPM Group User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMpu" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMpuClient" id="lblMpuClient">Client</label>
              <input type="text" id="txtMpuClient" class="form-control" disabled>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMpuSite" id="lblMpuSite">Site</label>
              <input type="text" id="txtMpuSite" class="form-control" disabled>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMpuRole" id="lblMpuRole">Role</label>
              <input type="text" id="txtMpuRole" class="form-control" disabled>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMpuGroupName" id="lblMpuGroupName">Group Name</label>
              <input type="text" id="txtMpuGroupName" class="form-control" disabled>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="optMpuUserId" id="lblMpuUserId">Assigned User <span class="required" aria-hidden="true">*</span></label>
              <select id="optMpuUserId" class="form-select" aria-required="true" aria-describedby="optMpuUserIdErr"></select>
              <div class="gems-field-error" id="optMpuUserIdErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><i class="fas fa-undo-alt me-1"></i> Close</button>
        <button type="button" id="btnMpuSubmit" class="btn btn-primary" disabled><i class="far fa-paper-plane me-1"></i> Submit</button>
      </div>
    </div>
  </div>
</div>
