<!--
  Modal: modal_fca_zone — Tabler/GEMS modal + form contract (P5-8 FCA Zone).

  Loaded by pages/fca_zone.html ONLY.
    gems-modal-md + modal-dialog-scrollable, never modal-dialog-centered.
    Visible labels, gems-form-grid, H3 MzValidate error slots.
    Footer: outline Close first, then Delete/Save, primary Submit last.

  JS contract preserved (js/pages/modal_fca_zone.js):
    #modal_fca_zone  #formMfz  #h4MfzTitle
    #optMfzSite  #lblMfzSite  #optMfzSiteErr
    #txtMfzName  #lblMfzName  #txtMfzNameErr
    #radMfzStatus  #radMfzStatus1  #radMfzStatus2  #radMfzStatusErr
    #btnMfzSubmit  #btnMfzSave  #btnMfzDelete
-->
<div class="modal fade" id="modal_fca_zone" tabindex="-1" aria-labelledby="h4MfzTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="h4MfzTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMfz" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12" id="optMfzSite_">
              <label class="form-label" for="optMfzSite" id="lblMfzSite">Site <span class="required" aria-hidden="true">*</span></label>
              <select id="optMfzSite" class="form-select" aria-required="true" aria-describedby="optMfzSiteErr"></select>
              <div class="gems-field-error" id="optMfzSiteErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMfzName" id="lblMfzName">Zone Name <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMfzName" class="form-control" aria-required="true" aria-describedby="txtMfzNameErr">
              <div class="gems-field-error" id="txtMfzNameErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <span class="form-label">Status <span class="required" aria-hidden="true">*</span></span>
              <div class="mt-1">
                <div class="form-check form-check-inline">
                  <input type="radio" class="form-check-input" name="radMfzStatus" id="radMfzStatus1" value="1">
                  <label class="form-check-label" for="radMfzStatus1">Active</label>
                </div>
                <div class="form-check form-check-inline">
                  <input type="radio" class="form-check-input" name="radMfzStatus" id="radMfzStatus2" value="2">
                  <label class="form-check-label" for="radMfzStatus2">Disabled</label>
                </div>
              </div>
              <div class="gems-field-error" id="radMfzStatusErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-undo-alt me-2"></i>Close
        </button>
        <button type="button" id="btnMfzDelete" class="btn btn-outline-danger">
          <i class="fas fa-trash-alt me-2"></i>Delete
        </button>
        <button type="button" id="btnMfzSave" class="btn btn-outline-primary">
          <i class="far fa-save me-2"></i>Save
        </button>
        <button type="button" id="btnMfzSubmit" class="btn btn-primary">
          <i class="far fa-paper-plane me-2"></i>Submit
        </button>
      </div>
    </div>
  </div>
</div>
