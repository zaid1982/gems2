<div class="modal fade gems-modal" id="modal_attendance_participant" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg mt-3 pt-5 mb-5" role="document">
        <!--Content-->
        <div class="modal-content gems-modal-card">
            <!--Header-->
            <div class="modal-header gems-modal-header">
                <h4 class="text-white mt-2 ml-2" id="lblMtpModalTitle"><i class="fas fa-user-edit text-white mr-2"></i> Edit Attendance Participant</h4>
                <button type="button" class="close waves-effect waves-light mr-0 text-white pt-4 gems-modal-close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--Body-->
            <div class="modal-body mb-0 gems-modal-body">
                <form id="formMtp" class="mt-2" autocomplete="off">
                    <div class="card z-depth-2">
                        <div class="card-body blue-grey lighten-5 pt-4 pb-0">
                            <div class="row">
                                <div class="col-md-8">
                                    <div class="md-form mt-0">
                                        <input type="text" id="txtMtpParticipantName" class="form-control" disabled>
                                        <label for="txtMtpParticipantName" id="lblMtpParticipantName" class="active">Employee Name</label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="md-form mt-0">
                                        <input type="text" id="txtMtpSiteName" class="form-control" disabled>
                                        <label for="txtMtpSiteName" id="lblMtpSiteName" class="active">Site Name</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <p class="mb-4 mt-4 font-weight-500">Employee Information :</p>
                    <div class="row">
                        <div class="col-lg-4">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMtpGfId" class="form-control">
                                <label for="txtMtpGfId" id="lblMtpGfId">GF ID</label>
                                <div class="gems-field-error" id="txtMtpGfIdErr" role="alert"></div>
                            </div>
                        </div>
                        <div class="col-lg-8 select-outline mb-2" id="optMtpDesignation_">
                            <select id="optMtpDesignation" class="form-select" data-stop-refresh="true" data-visible-options="-1"></select>
                            <label for="optMtpDesignation" id="lblMtpDesignation">Designation *</label>
                            <div class="gems-field-error" id="optMtpDesignationErr" role="alert"></div>
                        </div>
                        <div class="col-lg-4">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMtpContactNo" class="form-control">
                                <label for="txtMtpContactNo" id="lblMtpContactNo">Contact No. *</label>
                                <div class="gems-field-error" id="txtMtpContactNoErr" role="alert"></div>
                            </div>
                        </div>
                        <div class="col-lg-8">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMtpEmail" class="form-control">
                                <label for="txtMtpEmail" id="lblMtpEmail">Email *</label>
                                <div class="gems-field-error" id="txtMtpEmailErr" role="alert"></div>
                            </div>
                        </div>
                        <div class="col-lg-4">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMtpYearStartService" class="form-control">
                                <label for="txtMtpYearStartService" id="lblMtpYearStartService">Year Start Service</label>
                                <div class="gems-field-error" id="txtMtpYearStartServiceErr" role="alert"></div>
                            </div>
                        </div>
                        <div class="col-lg-8">
                            <div class="md-form md-outline mt-0">
                                <input type="date" id="txtMtpCidbExpiry" class="form-control">
                                <label for="txtMtpCidbExpiry" id="lblMtpCidbExpiry">CIDB Card Expiry</label>
                                <div class="gems-field-error" id="txtMtpCidbExpiryErr" role="alert"></div>
                            </div>
                        </div>
                        <div class="col-lg-12">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMtpCompetency" class="form-control">
                                <label for="txtMtpCompetency" id="lblMtpCompetency">Competency</label>
                                <div class="gems-field-error" id="txtMtpCompetencyErr" role="alert"></div>
                            </div>
                        </div>
                    </div>
                    <hr class="mt-1 grey lighten-1">
                    <p class="mb-4 font-weight-500">Attendance Setting :</p>
                    <div class="row">
                        <div class="col-lg-12 select-outline mb-2" id="optMtpGroup_">
                            <select id="optMtpGroup" class="form-select" data-stop-refresh="true" data-visible-options="-1"></select>
                            <label for="optMtpGroup" id="lblMtpGroup">Attendance Group *</label>
                            <div class="gems-field-error" id="optMtpGroupErr" role="alert"></div>
                        </div>
                        <div class="col-lg-12 select-outline mb-2 divMtpGroupSelected" id="optMtpCategory_">
                            <select id="optMtpCategory" class="form-select" data-stop-refresh="true" data-visible-options="-1"></select>
                            <label for="optMtpCategory" id="lblMtpCategory">Category *</label>
                            <div class="gems-field-error" id="optMtpCategoryErr" role="alert"></div>
                        </div>
                        <div class="col-lg-6 select-outline mb-2 divMtpGroupSelected" id="optMtpShiftMode_">
                            <select id="optMtpShiftMode" class="form-select" data-stop-refresh="true" data-visible-options="-1">
                                <option selected value="" disabled>Please Select</option>
                                <option value="Normal">Normal</option>
                                <option value="2 Shifts">2 Shifts</option>
                                <option value="3 Shifts">3 Shifts</option>
                            </select>
                            <label for="optMtpShiftMode" id="lblMtpShiftMode">Shift Mode *</label>
                            <div class="gems-field-error" id="optMtpShiftModeErr" role="alert"></div>
                        </div>
                        <div class="col-lg-6 select-outline mb-2 divMtpGroupSelected" id="optMtpShift_">
                            <select id="optMtpShift" class="form-select" data-stop-refresh="true" data-visible-options="-1"></select>
                            <label for="optMtpShift" id="lblMtpShift">Initial Shift *</label>
                            <div class="gems-field-error" id="optMtpShiftErr" role="alert"></div>
                        </div>
                        <div class="col-lg-6 divMtpGroupSelected">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMtpReqWeekHours" class="form-control">
                                <label for="txtMtpReqWeekHours" id="lblMtpReqWeekHours">Required Weekly Hours *</label>
                                <div class="gems-field-error" id="txtMtpReqWeekHoursErr" role="alert"></div>
                            </div>
                        </div>
                        <div class="col-lg-6 select-outline mb-0 divMtpGroupSelected" id="optMtpHoliday_">
                            <select id="optMtpHoliday" class="form-select" data-stop-refresh="true" data-visible-options="-1">
                                <option selected value="" disabled>Please Select</option>
                                <option value="Saturday & Sunday">Saturday & Sunday</option>
                                <option value="Sunday">Sunday</option>
                            </select>
                            <label for="optMtpHoliday" id="lblMtpHoliday">Weekly Holiday *</label>
                            <div class="gems-field-error" id="optMtpHolidayErr" role="alert"></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-6 divMtpGroupSelected">
                            <p class="mb-0 font-radio">Status :</p>
                            <div class="md-form mt-0 mb-3 ml-1">
                                <div class="form-check form-check-inline">
                                    <input type="radio" class="form-check-input" name="radMtpStatus" id="radMtpStatus1" value="1">
                                    <label class="form-check-label" for="radMtpStatus1">Active</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input type="radio" class="form-check-input" name="radMtpStatus" id="radMtpStatus2" value="2">
                                    <label class="form-check-label" for="radMtpStatus2">Disabled</label>
                                </div>
                            </div>
                            <div class="gems-field-error" id="radMtpStatusErr" role="alert"></div>
                        </div>
                        <div class="col-lg-6 divMtpGroupSelected">
                            <p class="mb-0 font-radio">Generate Schedule starting from :</p>
                            <div class="md-form mt-0 mb-3 ml-1">
                                <div class="form-check form-check-inline">
                                    <input type="radio" class="form-check-input" name="radMtpGenerateType" id="radMtpGenerateType1" value="1">
                                    <label class="form-check-label" for="radMtpGenerateType1">Today</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input type="radio" class="form-check-input" name="radMtpGenerateType" id="radMtpGenerateType2" value="2">
                                    <label class="form-check-label" for="radMtpGenerateType2">1st day of current month</label>
                                </div>
                            </div>
                            <div class="gems-field-error" id="radMtpGenerateTypeErr" role="alert"></div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer p-2 gems-modal-footer">
                <button class="btn btn-outline-info waves-effect btnMtpClose" data-bs-dismiss="modal"><i class="fas fa-undo-alt ml-1"></i> Close</button>
                <button id="btnMtpSubmit" class="btn btn-info waves-effect"><i class="far fa-paper-plane ml-1"></i> Submit</button>
                <button id="btnMtpSave" class="btn btn-info waves-effect"><i class="far fa-save ml-1"></i> Save</button>
            </div>
        </div>
    </div>
</div>
