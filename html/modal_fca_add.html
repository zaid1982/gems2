<div class="modal fade gems-modal" id="modal_fca_add" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg mt-3 pt-3 mb-5" role="document">
        <!--Content-->
        <div class="modal-content gems-modal-card">
            <!--Header-->
            <div class="modal-header pb-2 gems-modal-header">
                <h4 class="text-white mt-2 ml-2"><i class="fas fa-eye text-white"></i> &nbsp;<span id="spanMfaTitle">Create New FCA Audit</span></h4>
                <button type="button" class="close waves-effect waves-light mr-0 text-white pt-4 gems-modal-close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--Body-->
            <div class="modal-body pb-2 gems-modal-body">
                <form id="formMfa">
                    <div class="card z-depth-1 mb-4_5" id="divMfaValidationInfo">
                        <div class="card-body blue-grey lighten-5 pt-4 pb-0">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="md-form mt-0">
                                        <input type="text" id="txtMfaConditionScale" class="form-control" disabled>
                                        <label for="txtMfaConditionScale" id="lblMfaConditionScale" class="active">Condition Scale</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="md-form mt-0">
                                        <input type="text" id="txtMfaEvaluationType" class="form-control" disabled>
                                        <label for="txtMfaEvaluationType" id="lblMfaEvaluationType" class="active">Evaluation Scale</label>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <div class="md-form mt-0">
                                        <textarea id="txaMfaValidation" class="md-textarea form-control" rows="1"></textarea>
                                        <label for="txaMfaValidation" id="lblMfaValidation" class="text-muted">Validation Remark</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-6 select-outline mb-2" id="optMfaSite_">
                            <select id="optMfaSite" class="mdb-select md-form md-outline colorful-select dropdown-danger my-0" searchable="Filter Site"></select>
                            <label for="optMfaSite" id="lblMfaSite">Site *</label>
                            <p class="font-small text-danger" id="optMfaSiteErr"></p>
                        </div>
                        <div class="col-md-6 select-outline mb-2" id="optMfaZone_">
                            <select id="optMfaZone" class="mdb-select md-form md-outline colorful-select dropdown-danger my-0"></select>
                            <label for="optMfaZone" id="lblMfaZone">Zone</label>
                            <p class="font-small text-danger" id="optMfaZoneErr"></p>
                        </div>
                        <div class="col-md-12">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMfaArea" class="form-control">
                                <label for="txtMfaArea" id="lblMfaArea">Area *</label>
                                <p class="font-small text-danger" id="txtMfaAreaErr"></p>
                            </div>
                        </div>
                        <div class="col-md-6 select-outline mb-2" id="optMfaAssetGroup_">
                            <select id="optMfaAssetGroup" class="mdb-select md-form md-outline colorful-select dropdown-danger my-0"></select>
                            <label for="optMfaAssetGroup" id="lblMfaAssetGroup">Asset Group *</label>
                            <p class="font-small text-danger" id="optMfaAssetGroupErr"></p>
                        </div>
                        <div class="col-md-6">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMfaEvaluated" class="form-control">
                                <label for="txtMfaEvaluated" id="lblMfaEvaluated">Evaluated Asset</label>
                                <p class="font-small text-danger" id="txtMfaEvaluatedErr"></p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMfaDefectItem" class="form-control">
                                <label for="txtMfaDefectItem" id="lblMfaDefectItem">Defect Item *</label>
                                <p class="font-small text-danger" id="txtMfaDefectItemErr"></p>
                            </div>
                        </div>
                        <div class="col-md-6 select-outline mb-2" id="optMfaDefectCategory_">
                            <select id="optMfaDefectCategory" class="mdb-select md-form md-outline colorful-select dropdown-danger my-0"></select>
                            <label for="optMfaDefectCategory" id="lblMfaDefectCategory">Defect Category</label>
                            <p class="font-small text-danger" id="optMfaDefectCategoryErr"></p>
                        </div>
                        <div class="col-md-12">
                            <div class="md-form md-outline mt-0">
                                <textarea id="txaMfaObservation" class="md-textarea form-control" rows="4"></textarea>
                                <label for="txaMfaObservation" id="lblMfaObservation" class="text-muted">Observation *</label>
                                <p class="font-small text-danger" id="txaMfaObservationErr"></p>
                            </div>
                        </div>
                    </div>
                    <h6 class="mb-3">Audit Images * :</h6>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="file-field">
                                <div class="z-depth-1-half mb-2">
                                    <img src="img/background/upload_placeholder.png" id="imgMfaImage1" class="img-fluid" alt="example placeholder">
                                </div>
                                <div class="d-flex justify-content-center">
                                    <div class="btn btn-blue-grey btn-sm btn-rounded float-left">
                                        <span>Choose image file<i class="fas fa-upload ml-3" aria-hidden="true"></i></span>
                                        <input type="file" id="txfMfaImage1">
                                        <input type="hidden" id="txfMfaImage1Blob">
                                    </div>
                                </div>
                                <p class="font-small text-danger text-center" id="txfMfaImage1Err"></p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="file-field">
                                <div class="z-depth-1-half mb-2">
                                    <img src="img/background/upload_placeholder.png" id="imgMfaImage2" class="img-fluid" alt="example placeholder">
                                </div>
                                <div class="d-flex justify-content-center">
                                    <div class="btn btn-blue-grey btn-sm btn-rounded float-left">
                                        <span>Choose image file<i class="fas fa-upload ml-3" aria-hidden="true"></i></span>
                                        <input type="file" id="txfMfaImage2">
                                        <input type="hidden" id="txfMfaImage2Blob">
                                    </div>
                                </div>
                                <p class="font-small text-danger text-center" id="txfMfaImage2Err"></p>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer p-2 gems-modal-footer">
                <button class="btn btn-outline-info waves-effect" data-dismiss="modal"><i class="fas fa-undo-alt mr-1"></i> Close</button>
                <button id="btnMfaSubmit" class="btn btn-info waves-effect"><i class="far fa-paper-plane mr-1"></i> Submit</button>
            </div>
        </div>
    </div>
</div>
