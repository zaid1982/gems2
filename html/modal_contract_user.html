<!--
  Modal: modal_contract_user — Tabler/GEMS modal + form contract (P4C-4).

  Loaded by pages/contract.html ONLY. Child of the hidden technician
  assignment panel in section_contract. Do not expose that panel.

  gems-modal-md + modal-dialog-scrollable, never centered.
  Location codes are site-scoped. Technician select stays role 5.
  POST contract_user.php only (no edit).

  JS contract preserved (js/pages/modal_contract_user.js):
    #modal_contract_user  #formMcu
    #txtMcuClientName  #txtMcuSiteName  #txtMcuContractName
    #optMcuLocationCodeId  #lblMcuLocationCodeId  #optMcuLocationCodeIdErr
    #optMcuUserId  #lblMcuUserId  #optMcuUserIdErr
    #optMcuAssetGroupId  #lblMcuAssetGroupId  #optMcuAssetGroupIdErr
    #btnMcuSubmit  #lblMcuTitle
-->
<div class="modal fade" id="modal_contract_user" tabindex="-1" aria-labelledby="lblMcuTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMcuTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMcu" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMcuClientName" id="lblMcuClientName">Client Name</label>
              <input type="text" id="txtMcuClientName" class="form-control" disabled aria-describedby="txtMcuClientNameErr">
              <div class="gems-field-error" id="txtMcuClientNameErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMcuSiteName" id="lblMcuSiteName">Site Name</label>
              <input type="text" id="txtMcuSiteName" class="form-control" disabled aria-describedby="txtMcuSiteNameErr">
              <div class="gems-field-error" id="txtMcuSiteNameErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMcuContractName" id="lblMcuContractName">Contract Name</label>
              <input type="text" id="txtMcuContractName" class="form-control" disabled aria-describedby="txtMcuContractNameErr">
              <div class="gems-field-error" id="txtMcuContractNameErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="optMcuLocationCodeId" id="lblMcuLocationCodeId">Location Code <span class="required" aria-hidden="true">*</span></label>
              <select id="optMcuLocationCodeId" class="form-select" aria-required="true" aria-describedby="optMcuLocationCodeIdErr"></select>
              <div class="gems-field-error" id="optMcuLocationCodeIdErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="optMcuUserId" id="lblMcuUserId">Technician Assigned <span class="required" aria-hidden="true">*</span></label>
              <select id="optMcuUserId" class="form-select" aria-required="true" aria-describedby="optMcuUserIdErr"></select>
              <div class="gems-field-error" id="optMcuUserIdErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="optMcuAssetGroupId" id="lblMcuAssetGroupId">Asset Group <span class="required" aria-hidden="true">*</span></label>
              <select id="optMcuAssetGroupId" class="form-select" aria-required="true" aria-describedby="optMcuAssetGroupIdErr"></select>
              <div class="gems-field-error" id="optMcuAssetGroupIdErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" id="btnMcuSubmit" class="btn btn-primary" disabled>
          <i class="far fa-paper-plane me-2"></i>Submit
        </button>
      </div>
    </div>
  </div>
</div>
