<!--
  Modal: modal_ppm_set_select_asset — Tabler/GEMS modal + form contract (P5-4 Commit 3).

  SHARED by pages/ppm_set_management.html and pages/ppm_set_form.html. Convert in place; do not fork.
  modal-xl + gems-modal-lg, modal-dialog-scrollable, never modal-dialog-centered.
  Wide table: Close (outline), Add Selected (primary), Add All (warning).
-->
<div class="modal fade" id="modal_ppm_set_select_asset" tabindex="-1" aria-labelledby="h4MpssaTitle" aria-hidden="true">
  <div class="modal-dialog modal-xl gems-modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="h4MpssaTitle"><i class="fas fa-cubes me-2"></i>Select Assets for PPM Set</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="lblMpssaPpmSetId">
        <input type="hidden" id="lblMpssaContractId">
        <input type="hidden" id="lblMpssaAssetTypeId">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title mb-0"><i class="fas fa-list me-2"></i>Available Assets</h3>
            <div class="gems-card-toolbar" style="min-width:16rem">
              <label class="form-label visually-hidden" for="txtMpssaSearch">Keyword Search</label>
              <input type="text" id="txtMpssaSearch" class="form-control" placeholder="Search assets...">
            </div>
          </div>
          <div class="table-responsive">
            <table id="dtMpssa" class="table table-vcenter card-table table-hover mb-0">
              <thead>
                <tr>
                  <th style="width:2.5rem"><input type="checkbox" class="form-check-input" id="chkMpssaSelectAll" aria-label="Select all assets"></th>
                  <th style="width:4%">#</th>
                  <th>Asset No</th>
                  <th>Asset Name</th>
                  <th>Location</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><i class="fas fa-undo-alt me-1"></i> Close</button>
        <button type="button" class="btn btn-primary" id="btnMpssaAddSelected">Add Selected</button>
        <button type="button" class="btn btn-warning" id="btnMpssaAddAllAssetSelected">Add All</button>
      </div>
    </div>
  </div>
</div>
