<!--
  modal_part_add — Tabler in-place (P5-27). inventory.html only.
  Cascade IDs and POST part {storeId,itemId} stay.
-->
<div class="modal fade" id="modal_part_add" tabindex="-1" aria-labelledby="lblMpaTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMpaTitle"><i class="fas fa-plus me-1"></i> Add Inventory Item</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMpa" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMpaSite" id="lblMpaSite">Site</label>
              <input type="text" id="txtMpaSite" class="form-control" disabled>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMpaStore" id="lblMpaStore">Store</label>
              <input type="text" id="txtMpaStore" class="form-control" disabled>
            </div>
            <div class="gems-field gems-field-12" id="optMpaAssetGroup_">
              <label class="form-label" for="optMpaAssetGroup" id="lblMpaAssetGroup">Asset Group <span class="required" aria-hidden="true">*</span></label>
              <select id="optMpaAssetGroup" class="form-select" data-stop-refresh="true" aria-describedby="optMpaAssetGroupErr"></select>
              <div class="gems-field-error" id="optMpaAssetGroupErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12" id="optMpaItemType_">
              <label class="form-label" for="optMpaItemType" id="lblMpaItemType">Item Type <span class="required" aria-hidden="true">*</span></label>
              <select id="optMpaItemType" class="form-select" data-stop-refresh="true" aria-describedby="optMpaItemTypeErr"></select>
              <div class="gems-field-error" id="optMpaItemTypeErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12" id="optMpaItem_">
              <label class="form-label" for="optMpaItem" id="lblMpaItem">Item Description <span class="required" aria-hidden="true">*</span></label>
              <select id="optMpaItem" class="form-select" data-stop-refresh="true" aria-describedby="optMpaItemErr"></select>
              <div class="gems-field-error" id="optMpaItemErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem"><span class="required" aria-hidden="true">*</span> Required</span>
        <button type="button" class="btn btn-outline-secondary btnMpaClose" data-bs-dismiss="modal" data-dismiss="modal">
          <i class="fas fa-undo-alt me-1"></i>Close
        </button>
        <button type="button" id="btnMpaSubmit" class="btn btn-primary">
          <i class="far fa-paper-plane me-1"></i>Submit
        </button>
      </div>
    </div>
  </div>
</div>
