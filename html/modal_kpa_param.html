<!--
  Modal: modal_kpa_param — Tabler/GEMS modal + form contract (P3B KPA).
  Loaded by pages/kpa_structure.html. Contains a parameter table, so lg (800px).
  JS IDs preserved from the MDB original.
-->
<div class="modal fade" id="modal_kpa_param" tabindex="-1" aria-labelledby="h4KprTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="h4KprTitle">PI Parameters</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="hidKprPiId">
        <input type="hidden" id="hidKprParamId">
        <p class="text-secondary mb-3" id="pKprHelp">Parameters are the values the PI Entry user captures each month. The keys are referenced by the formula.</p>
        <div class="table-responsive mb-3">
          <table id="tblKprList" class="table table-vcenter table-hover mb-0">
            <thead>
              <tr>
                <th>Key</th>
                <th>Label</th>
                <th>Type</th>
                <th>Source</th>
                <th>Required</th>
                <th>Order</th>
                <th class="noVis"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <form id="formKpr" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtKprKey">Key <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtKprKey" class="form-control" placeholder="p1" maxlength="10" aria-required="true">
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optKprType">Type</label>
              <select id="optKprType" class="form-select">
                <option value="NUMBER">Number</option>
                <option value="INT">Whole number</option>
                <option value="PERCENT">Percentage</option>
              </select>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtKprLabel">Label <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtKprLabel" class="form-control" placeholder="Work Orders Generated" aria-required="true">
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optKprSource">Source</label>
              <select id="optKprSource" class="form-select">
                <option value="MANUAL">Manual entry</option>
                <option value="GEMS">Automated from GEMS+</option>
              </select>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtKprHook">GEMS+ hook (reserved)</label>
              <input type="text" id="txtKprHook" class="form-control" placeholder="WO_GENERATED">
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtKprOrder">Order</label>
              <input type="number" min="1" id="txtKprOrder" class="form-control" value="1">
            </div>
            <div class="gems-field gems-field-6">
              <div class="form-label">Required</div>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkKprRequired" checked>
                <label class="form-check-label" for="chkKprRequired">Must be filled before submit</label>
              </div>
            </div>
            <div class="gems-field gems-field-12 gems-field-actions">
              <button type="button" class="btn btn-primary" id="btnKprSave">Add / Update</button>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Done
        </button>
      </div>
    </div>
  </div>
</div>
