<!--
  Modal: modal_fca_validate — Tabler (P5-8 FCA Task/All). JS IDs preserved.
-->
<div class="modal fade" id="modal_fca_validate" tabindex="-1" aria-labelledby="lblMfvTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMfvTitle"><i class="fas fa-check me-2"></i>Validate FCA Audit</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMfv" autocomplete="off" novalidate>
          <div class="card mb-3">
            <div class="card-body">
              <div class="gems-form-grid">
                <div class="gems-field gems-field-6">
                  <label class="form-label" for="txtMfvConditionScale" id="lblMfvConditionScale">Condition Scale</label>
                  <input type="text" id="txtMfvConditionScale" class="form-control" disabled>
                </div>
                <div class="gems-field gems-field-6">
                  <label class="form-label" for="txtMfvEvaluationType" id="lblMfvEvaluationType">Evaluation Scale</label>
                  <input type="text" id="txtMfvEvaluationType" class="form-control" disabled>
                </div>
              </div>
            </div>
          </div>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <span class="form-label">Action <span class="required" aria-hidden="true">*</span></span>
              <div class="mt-1">
                <div class="form-check">
                  <input type="radio" class="form-check-input" name="radMfvResult" id="radMfvResult1" value="1" aria-describedby="radMfvResultErr">
                  <label class="form-check-label" for="radMfvResult1">Validate Audit and Close</label>
                </div>
                <div class="form-check">
                  <input type="radio" class="form-check-input" name="radMfvResult" id="radMfvResult2" value="2">
                  <label class="form-check-label" for="radMfvResult2">Return to Auditor for Correction</label>
                </div>
              </div>
              <div class="gems-field-error" id="radMfvResultErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12" id="divMfvRemark">
              <label class="form-label" for="txaMfvValidation" id="lblMfvValidation">Validation Remark <span id="spanMfvAsteriskValidation">*</span></label>
              <textarea id="txaMfvValidation" class="form-control" rows="4" aria-describedby="txaMfvValidationErr"></textarea>
              <div class="gems-field-error" id="txaMfvValidationErr" role="alert"></div>
            </div>
          </div>
          <h4 class="mt-3 divMfvImage">Rectification Images <span id="spanMfvAsteriskImage">*</span></h4>
          <div class="row divMfvImage">
            <div class="col-md-6 mb-3">
              <img src="img/background/upload_placeholder.png" id="imgMfvImage1" class="img-fluid mb-2" alt="">
              <input type="file" id="txfMfvImage1" class="form-control" accept="image/*">
              <input type="hidden" id="txfMfvImage1Blob">
              <div class="gems-field-error" id="txfMfvImage1Err" role="alert"></div>
            </div>
            <div class="col-md-6 mb-3">
              <img src="img/background/upload_placeholder.png" id="imgMfvImage2" class="img-fluid mb-2" alt="">
              <input type="file" id="txfMfvImage2" class="form-control" accept="image/*">
              <input type="hidden" id="txfMfvImage2Blob">
              <div class="gems-field-error" id="txfMfvImage2Err" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><i class="fas fa-undo-alt me-2"></i>Close</button>
        <button type="button" id="btnMfvSubmit" class="btn btn-primary"><i class="far fa-paper-plane me-2"></i>Submit</button>
      </div>
    </div>
  </div>
</div>
