<div class="modal fade gems-modal" id="modal_fca_validate" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg mt-3 pt-3 mb-5" role="document">
        <!--Content-->
        <div class="modal-content gems-modal-card">
            <!--Header-->
            <div class="modal-header pb-2 gems-modal-header">
                <h4 class="text-white mt-2 ml-2"><i class="fas fa-check text-white"></i> &nbsp;Validate FCA Audit</h4>
                <button type="button" class="close waves-effect waves-light mr-0 text-white pt-4 gems-modal-close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--Body-->
            <div class="modal-body pb-2 gems-modal-body">
                <form id="formMfv" class="mt-3">
                    <div class="card z-depth-1">
                        <div class="card-body blue-grey lighten-5 pt-4 pb-0">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="md-form mt-0">
                                        <input type="text" id="txtMfvConditionScale" class="form-control" disabled>
                                        <label for="txtMfvConditionScale" id="lblMfvConditionScale" class="active">Condition Scale</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="md-form mt-0">
                                        <input type="text" id="txtMfvEvaluationType" class="form-control" disabled>
                                        <label for="txtMfvEvaluationType" id="lblMfvEvaluationType" class="active">Evaluation Scale</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-4_5">
                        <div class="col-12 mb-3">
                            <p class="mb-0 font-small">Action * :</p>
                            <div class="md-form mt-0 mb-3 ml-3">
                                <div class="form-check form-check-inline">
                                    <input type="radio" class="form-check-input" name="radMfvResult" id="radMfvResult1" value="1">
                                    <label class="form-check-label" for="radMfvResult1">Validate Audit and Close</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input type="radio" class="form-check-input" name="radMfvResult" id="radMfvResult2" value="2">
                                    <label class="form-check-label" for="radMfvResult2">Return to Auditor for Correction</label>
                                </div>
                            </div>
                            <p class="font-small text-danger mt-0" id="radMfvResultErr"></p>
                        </div>
                        <div class="col-md-12" id="divMfvRemark">
                            <div class="md-form md-outline mt-0">
                                <textarea id="txaMfvValidation" class="md-textarea form-control" rows="4"></textarea>
                                <label for="txaMfvValidation" id="lblMfvValidation" class="text-muted">Validation Remark <span id="spanMfvAsteriskValidation">*</span></label>
                                <p class="font-small text-danger" id="txaMfvValidationErr"></p>
                            </div>
                        </div>
                    </div>
                    <h6 class="mb-3 divMfvImage">Rectification Images <span id="spanMfvAsteriskImage">*</span> :</h6>
                    <div class="row divMfvImage">
                        <div class="col-md-6">
                            <div class="file-field">
                                <div class="z-depth-1-half mb-2">
                                    <img src="img/background/upload_placeholder.png" id="imgMfvImage1" class="img-fluid" alt="example placeholder">
                                </div>
                                <div class="d-flex justify-content-center">
                                    <div class="btn btn-blue-grey btn-sm btn-rounded float-left">
                                        <span>Choose image file<i class="fas fa-upload ml-3" aria-hidden="true"></i></span>
                                        <input type="file" id="txfMfvImage1">
                                        <input type="hidden" id="txfMfvImage1Blob">
                                    </div>
                                </div>
                                <p class="font-small text-danger text-center" id="txfMfvImage1Err"></p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="file-field">
                                <div class="z-depth-1-half mb-2">
                                    <img src="img/background/upload_placeholder.png" id="imgMfvImage2" class="img-fluid" alt="example placeholder">
                                </div>
                                <div class="d-flex justify-content-center">
                                    <div class="btn btn-blue-grey btn-sm btn-rounded float-left">
                                        <span>Choose image file<i class="fas fa-upload ml-3" aria-hidden="true"></i></span>
                                        <input type="file" id="txfMfvImage2">
                                        <input type="hidden" id="txfMfvImage2Blob">
                                    </div>
                                </div>
                                <p class="font-small text-danger text-center" id="txfMfvImage2Err"></p>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer p-2 gems-modal-footer">
                <button class="btn btn-outline-info waves-effect" data-dismiss="modal"><i class="fas fa-undo-alt mr-1"></i> Close</button>
                <button id="btnMfvSubmit" class="btn btn-info waves-effect"><i class="far fa-paper-plane mr-1"></i> Submit</button>
            </div>
        </div>
    </div>
</div>
