<section class="section mb-5 sectionContract">
    <div class="row mb-0 pb-0">
        <div class="col-md-12">
            <button type="button" class="btn morpheus-den-gradient btn-rounded float-right text-white" id="btnSctBack">
                <i class="fas fa-arrow-left"></i> Back to Main Page
            </button>
        </div>
    </div>
    <div class="row">
        <div class="col-md-7">
            <div class="card card-cascade cascading-admin-card user-card mt-4">
                <div class="admin-up d-flex justify-content-start">
                    <i class="fas fa-file-contract rgba-cyan-strong py-4 z-depth-4"></i>
                    <div class="data">
                        <h3 class="font-weight-bold dark-grey-text ml-3">Contract Information</h3>
                    </div>
                </div>
                <div class="card-body card-body-cascade px-4">
                    <form id="formSct">
                        <h5 class="mt-3 font-weight-500">Main Information :</h5>
                        <div class="row px-3">
                            <div class="col-md-8">
                                <div class="md-form md-outline mt-3">
                                    <input type="text" id="txtSctChecklistName" class="form-control">
                                    <label for="txtSctChecklistName" id="lblSctChecklistName">Checklist Name *</label>
                                    <p class="font-small text-danger" id="txtSctChecklistNameErr"></p>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="md-form md-outline mt-3">
                                    <input type="text" id="txtSctChecklistVersion" class="form-control">
                                    <label for="txtSctChecklistVersion" id="lblSctChecklistVersion">Checklist Version *</label>
                                    <p class="font-small text-danger" id="txtSctChecklistVersionErr"></p>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-5">
            <div class="card profile-card mt-4">
                <div class="card-header teal lighten-4">
                    <h5 class="font-weight-bold text-center mt-2">Location Code</h5>
                </div>
                <div class="card-body mt-3 pb-0">
                    <dl class="row">
                        <dt class="col-sm-4">Contract Name</dt>
                        <dd class="col-sm-8" id="lblSszContactName"></dd>
                        <dt class="col-sm-4">Client</dt>
                        <dd class="col-sm-8" id="lblSszClientName"></dd>
                        <dt class="col-sm-4">Site</dt>
                        <dd class="col-sm-8" id="lblSszSiteName"></dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>
</section>
