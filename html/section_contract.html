<section class="section mb-5 sectionContract">
    <div class="row mb-0 pb-0">
        <div class="col-md-12">
            <button type="button" class="btn morpheus-den-gradient btn-rounded float-right text-white" id="btnSctBack">
                <i class="fas fa-arrow-left"></i> Back to Main Page
            </button>
        </div>
    </div>
    <div class="row">
        <div class="col-md-5">
            <div class="card card-cascade cascading-admin-card user-card mt-4">
                <div class="admin-up d-flex justify-content-start">
                    <i class="fas fa-file-contract rgba-cyan-strong py-4 z-depth-3"></i>
                    <div class="data">
                        <h3 class="font-weight-bold dark-grey-text ml-3">Contract Information</h3>
                    </div>
                </div>
                <div class="card-body card-body-cascade px-3 pb-0">
                    <form id="formSct">
                        <div class="row">
                            <div class="col-md-12">
                                <div class="md-form md-outline mt-4">
                                    <input type="text" id="txtSctClientName" class="form-control" disabled>
                                    <label for="txtSctClientName" id="lblSctClientName">Client Name</label>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="md-form md-outline mt-0">
                                    <input type="text" id="txtSctSiteName" class="form-control" disabled>
                                    <label for="txtSctSiteName" id="lblSctSiteName">Site Name</label>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="md-form md-outline mt-0">
                                    <input type="text" id="txtSctContractName" class="form-control" disabled>
                                    <label for="txtSctContractName" id="lblSctContractName">Contract Name</label>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="md-form md-outline mt-0">
                                    <textarea id="txaSctContractDesc" class="md-textarea form-control" rows="3" disabled></textarea>
                                    <label for="txaSctContractDesc" id="lblSctContractDesc" class="text-muted">Description</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="md-form md-outline mt-0">
                                    <input type="text" id="txtSctContractDateStart" class="form-control" disabled>
                                    <label for="txtSctContractDateStart" id="lblSctContractDateStart">Contract Date Start</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="md-form md-outline mt-0">
                                    <input type="text" id="txtSctContractDateEnd" class="form-control" disabled>
                                    <label for="txtSctContractDateEnd" id="lblSctContractDateEnd">Contract Date End</label>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="md-form md-outline mt-0">
                                    <input type="text" id="txtSctContractStatus" class="form-control" disabled>
                                    <label for="txtSctContractStatus" id="lblSctContractStatus" class="text-muted">Status</label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card card-cascade narrower mb-5 mt-5">
                <div class="view view-cascade gradient-card-header cyan darken-1 narrower py-1 mx-3 mb-3 d-flex justify-content-between align-items-center z-depth-3">
                    <div>
                        <button type="button" id="btnSctLocationCodeAdd" class="btn btn-outline-white btn-rounded btn-sm px-2 material-tooltip-main" data-toggle="tooltip" data-placement="top" title="Add Contract"><i class="fas fa-plus mt-0"></i></button>
                        <a tabindex="0" role="button" class="btn btn-outline-white btn-rounded btn-sm px-2"
                           data-toggle="popover" data-trigger="focus" title="Location Code List"
                           data-content="All location code available in this contract."><i class="fas fa-info mt-0 mx-1"></i></a>
                        <button type="button" id="btnDtSctLocationCodeRefresh" class="btn btn-outline-white btn-rounded btn-sm px-2" data-toggle="tooltip" data-placement="top" title="Refresh data"><i class="fas fa-sync mt-0"></i></button>
                    </div>
                    <a href="javascript:void(0);" class="text-white mx-3">Location Code</a>
                    <div>
                        <div id="btnDtSctLocationCodeExport"></div>
                    </div>
                </div>
                <div class="px-4">
                    <form class="form-inline md-form form-sm mt-2 mb-0 pb-0 float-right">
                        <div class="">
                            <i class="fas fa-search mt-2" aria-hidden="true"></i>
                            <input type="text" id="txtSctLocationCodeSearch" class="form-control form-control-sm" style="width: 250px; max-width:250px">
                            <label for="txtSctLocationCodeSearch" class="ml-4">Search</label>
                        </div>
                    </form>
                </div>
                <div class="table-responsive pb-4">
                    <table id="dtSctLocationCode" class="table table-hover table-sm mb-0 mt-2 display responsive" cellspacing="0" width="100%">
                        <thead>
                        <tr class="th-strong">
                            <th style="width: 5%">#</th>
                            <th>Location Code</th>
                            <th style="width: 20%">Status</th>
                            <th style="width: 64px; min-width: 64px"></th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
            <div class="card card-cascade narrower">
                <div class="view view-cascade gradient-card-header cyan darken-1 narrower py-1 mx-3 mb-3 d-flex justify-content-between align-items-center z-depth-3">
                    <div>
                        <button type="button" id="btnSctLocationUserAdd" class="btn btn-outline-white btn-rounded btn-sm px-2 material-tooltip-main" data-toggle="tooltip" data-placement="top" title="Add Contract"><i class="fas fa-plus mt-0"></i></button>
                        <a tabindex="0" role="button" class="btn btn-outline-white btn-rounded btn-sm px-2"
                           data-toggle="popover" data-trigger="focus" title="Technician Assigned List"
                           data-content="All technician assigned in this location with the asset group."><i class="fas fa-info mt-0 mx-1"></i></a>
                        <button type="button" id="btnDtSctLocationUserRefresh" class="btn btn-outline-white btn-rounded btn-sm px-2" data-toggle="tooltip" data-placement="top" title="Refresh data"><i class="fas fa-sync mt-0"></i></button>
                    </div>
                    <a href="javascript:void(0);" class="text-white mx-3">Technician Assigned</a>
                    <div>
                        <div id="btnDtSctLocationUserExport"></div>
                    </div>
                </div>
                <div class="table-responsive">
                    <table id="dtSctLocationUser" class="table table-hover table-sm mb-0 mt-2 display responsive" cellspacing="0" width="100%">
                        <thead>
                        <tr class="th-strong">
                            <th style="width: 5%">#</th>
                            <th style="width: 20%">Location Code</th>
                            <th>Technician Name</th>
                            <th style="width: 20%">Asset Group</th>
                            <th style="width: 24px; min-width: 24px"></th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
