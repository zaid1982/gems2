<!--
  Modal: modal_ppm_asset_select — Tabler/GEMS modal + form contract (P5-4).

  Loaded by pages/ppm_asset.html ONLY.
  gems-modal-lg + modal-dialog-scrollable, never modal-dialog-centered.
  Native multiple select (MDB searchable type-ahead is not on Tabler).
-->
<div class="modal fade" id="modal_ppm_asset_select" tabindex="-1" aria-labelledby="h4MpasTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="h4MpasTitle"><i class="fas fa-plus me-2"></i>Add PPM Asset</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMpas" autocomplete="off" novalidate>
          <div class="card mb-3">
            <div class="card-body py-2">
              <div class="gems-form-grid">
                <div class="gems-field gems-field-6">
                  <label class="form-label">PPM Group Name</label>
                  <p class="mb-0" id="pMpasName"></p>
                </div>
                <div class="gems-field gems-field-6">
                  <label class="form-label">Document No.</label>
                  <p class="mb-0" id="pMpasDocNo"></p>
                </div>
              </div>
            </div>
          </div>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12" id="optMpasAsset_">
              <label class="form-label" for="optMpasAsset" id="lblMpasAsset">Asset for PPM Asset Group <span class="required" aria-hidden="true">*</span></label>
              <select id="optMpasAsset" class="form-select" data-stop-refresh="true" multiple size="10" aria-required="true" aria-describedby="optMpasAssetErr"></select>
              <div class="gems-field-error" id="optMpasAssetErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><i class="fas fa-undo-alt me-1"></i> Close</button>
        <button type="button" id="btnMpasSubmit" class="btn btn-primary"><i class="far fa-paper-plane me-1"></i> Submit</button>
      </div>
    </div>
  </div>
</div>
