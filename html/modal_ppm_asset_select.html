<div class="modal fade" id="modal_ppm_asset_select" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-xl" role="document">
        <div class="modal-content ppm-asset-select-modal">
            <div class="modal-header ppm-asset-select-modal__header">
                <div class="ppm-asset-select-modal__title d-flex align-items-start">
                    <span class="ppm-asset-select-modal__icon"><i class="fa-duotone fa-plus"></i></span>
                    <div>
                        <h3 class="modal-title mb-1" id="h4MpasTitle">Add PPM Asset</h3>
                        <p class="ppm-asset-select-modal__subtitle mb-0">Choose the assets you’d like to attach to this preventive maintenance configuration.</p>
                    </div>
                </div>
                <button type="button" class="close ppm-asset-select-modal__close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body ppm-asset-select-modal__body">
                <form id="formMpas">
                    <div class="row">
                        <div class="col-md-12">
                            <div class="card theme-surface ppm-asset-select-modal__summary-card">
                                <div class="ppm-asset-select-modal__summary-card-body">
                                    <div class="row">
                                        <div class="md-form col-sm-7 mt-1 mb-0">
                                            <label class="active ppm-asset-select-modal__summary-label">PPM Group Name</label>
                                            <p class="mt-1 pt-2 mb-0" id="pMpasName"></p>
                                            <hr class="ppm-asset-select-modal__divider">
                                        </div>
                                        <div class="md-form col-sm-5 mt-1 mb-0">
                                            <label class="active ppm-asset-select-modal__summary-label">Document No.</label>
                                            <p class="mt-1 pt-2 mb-0" id="pMpasDocNo"></p>
                                            <hr class="ppm-asset-select-modal__divider">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 select-outline ppm-asset-select-modal__select" id="optMpasAsset_">
                            <select id="optMpasAsset" class="mdb-select md-form md-outline colorful-select dropdown-primary" data-stop-refresh="true" searchable="Search here.." multiple></select>
                            <label for="optMpasAsset" id="lblMpasAsset">Asset for PPM Asset Group <span class="text-danger">*</span></label>
                            <p class="font-small text-danger mt-0" id="optMpasAssetErr"></p>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer ppm-asset-select-modal__footer">
                <button class="btn btn-outline-secondary" data-dismiss="modal"><i class="fas fa-undo-alt mr-1"></i> Close</button>
                <button id="btnMpasSubmit" class="btn btn-primary"><i class="far fa-paper-plane mr-1"></i> Submit</button>
            </div>
        </div>
    </div>
</div>
