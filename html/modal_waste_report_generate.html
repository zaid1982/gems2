<!--
  Modal: modal_waste_report_generate — Tabler/GEMS modal + form contract (P3A Waste).
  Loaded by pages/waste_report.html. JS IDs preserved from the MDB original.
-->
<div class="modal fade" id="modal_waste_report_generate" tabindex="-1" aria-labelledby="lblWrgTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblWrgTitle">Generate JKR Report</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="gems-form-grid">
          <div class="gems-field gems-field-12">
            <label class="form-label" for="optWrgSite">Premise <span class="required" aria-hidden="true">*</span></label>
            <select id="optWrgSite" class="form-select" aria-required="true"></select>
          </div>
          <div class="gems-field gems-field-6">
            <label class="form-label" for="txtWrgFrom">Period from <span class="required" aria-hidden="true">*</span></label>
            <input type="date" id="txtWrgFrom" class="form-control" aria-required="true">
          </div>
          <div class="gems-field gems-field-6">
            <label class="form-label" for="txtWrgTo">Period to / As-at <span class="required" aria-hidden="true">*</span></label>
            <input type="date" id="txtWrgTo" class="form-control" aria-required="true">
          </div>
          <div class="gems-field gems-field-12">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="chkWrgDetail" checked>
              <label class="form-check-label" for="chkWrgDetail">Include transaction appendix</label>
            </div>
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="chkWrgZero">
              <label class="form-check-label" for="chkWrgZero">Include zero-activity profile codes</label>
            </div>
          </div>
          <div class="gems-field gems-field-12">
            <label class="form-label" for="txaWrgRemarks">Remarks</label>
            <textarea id="txaWrgRemarks" class="form-control" rows="2"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" class="btn btn-outline-secondary" id="btnWrgPreview">
          <i class="fas fa-eye me-2"></i>Preview
        </button>
        <button type="button" class="btn btn-primary" id="btnWrgGenerate">
          <i class="fas fa-plus me-2"></i>Generate version
        </button>
      </div>
    </div>
  </div>
</div>
