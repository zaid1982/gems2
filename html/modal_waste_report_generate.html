<div class="modal fade gems-modal" id="modal_waste_report_generate" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content gems-modal-card">
      <div class="modal-header gems-modal-header">
        <h4 class="text-white mt-2 ml-2">Generate JKR Report</h4>
        <button type="button" class="close text-white gems-modal-close" data-dismiss="modal"><span>&times;</span></button>
      </div>
      <div class="modal-body gems-modal-body">
        <div class="form-group"><label>Premise *</label><select id="optWrgSite" class="custom-select gems-plain-select browser-default"></select></div>
        <div class="form-group"><label>Period from *</label><input type="date" id="txtWrgFrom" class="form-control"></div>
        <div class="form-group"><label>Period to / As-at *</label><input type="date" id="txtWrgTo" class="form-control"></div>
        <div class="form-check"><input type="checkbox" class="form-check-input" id="chkWrgDetail" checked><label class="form-check-label" for="chkWrgDetail">Include transaction appendix</label></div>
        <div class="form-check mb-2"><input type="checkbox" class="form-check-input" id="chkWrgZero"><label class="form-check-label" for="chkWrgZero">Include zero-activity profile codes</label></div>
        <div class="form-group"><label>Remarks</label><textarea id="txaWrgRemarks" class="form-control" rows="2"></textarea></div>
      </div>
      <div class="modal-footer gems-modal-footer">
        <button class="btn btn-outline-info" data-dismiss="modal">Close</button>
        <button class="btn btn-outline-primary" id="btnWrgPreview">Preview</button>
        <button class="btn btn-info" id="btnWrgGenerate">Generate version</button>
      </div>
    </div>
  </div>
</div>
