<!--
  Modal: modal_checklist_duplicate — Tabler/GEMS modal + form contract (P4C-6).

  Loaded by pages/checklist.html ONLY. Copies the P4 modal contract:
    gems-modal-md + modal-dialog-scrollable, never modal-dialog-centered.
    Visible labels, gems-form-grid, H3 MzValidate error slots.
    Footer: outline Close first, primary Submit last.

  JS contract preserved (js/pages/modal_checklist_duplicate.js):
    #modal_checklist_duplicate  #formMcx  #lblMcxModalTitle
    #pMcxDocumentNo  #pMcxChecklistName  #pMcxAssetType
    #txtMcxDocumentNo  #lblMcxDocumentNo  #txtMcxDocumentNoErr
    #txtMcxChecklistName  #lblMcxChecklistName  #txtMcxChecklistNameErr
    #btnMcxSubmit  .btnMcxClose
-->
<div class="modal fade" id="modal_checklist_duplicate" tabindex="-1" aria-labelledby="lblMcxModalTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMcxModalTitle"><i class="far fa-copy me-2"></i>Duplicate PPM Checklist</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMcx" autocomplete="off" novalidate>
          <h4 class="mb-2">Duplicate From</h4>
          <div class="mb-3">
            <div class="text-secondary" style="font-size:.75rem">Document No</div>
            <p class="mb-2" id="pMcxDocumentNo"></p>
            <div class="text-secondary" style="font-size:.75rem">Checklist Name</div>
            <p class="mb-2" id="pMcxChecklistName"></p>
            <div class="text-secondary" style="font-size:.75rem">Asset Type</div>
            <p class="mb-0" id="pMcxAssetType"></p>
          </div>
          <h4 class="mb-2">Duplicate To</h4>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMcxDocumentNo" id="lblMcxDocumentNo">Document No <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMcxDocumentNo" class="form-control" aria-required="true" aria-describedby="txtMcxDocumentNoErr">
              <div class="gems-field-error" id="txtMcxDocumentNoErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMcxChecklistName" id="lblMcxChecklistName">Checklist Name <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMcxChecklistName" class="form-control" aria-required="true" aria-describedby="txtMcxChecklistNameErr">
              <div class="gems-field-error" id="txtMcxChecklistNameErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary btnMcxClose" data-bs-dismiss="modal" data-bs-toggle="tooltip" title="Close">
          <i class="fas fa-undo-alt me-1"></i> Close
        </button>
        <button type="button" id="btnMcxSubmit" class="btn btn-primary" data-bs-toggle="tooltip" title="Submit">
          <i class="far fa-paper-plane me-1"></i> Submit
        </button>
      </div>
    </div>
  </div>
</div>
