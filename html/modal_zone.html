<div class="modal fade gems-modal" id="modal_zone" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered mt-5 pt-3 mb-5" role="document">
        <!--Content-->
        <div class="modal-content gems-modal-card">
            <!--Header-->
            <div class="modal-header pb-2 gems-modal-header">
                <h4 class="text-white mt-2 ml-2" id="h4MznTitle"></h4>
                <button type="button" class="close waves-effect waves-light mr-0 text-white pt-4 gems-modal-close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--Body-->
            <div class="modal-body pb-2 gems-modal-body">
                <form id="formMzn" class="mt-3">
                    <div class="row">
                        <div class="col-12 select-outline mb-2" id="optMznSite_">
                            <select id="optMznSite" class="mdb-select md-form md-outline colorful-select dropdown-danger my-0"></select>
                            <label for="optMznSite" id="lblMznSite">Site *</label>
                            <p class="font-small text-danger" id="optMznSiteErr"></p>
                        </div>
                        <div class="col-12">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMznType" class="form-control">
                                <label for="txtMznType" id="lblMznType">Zone Type *</label>
                                <p class="font-small text-danger" id="txtMznTypeErr"></p>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMznCode" class="form-control">
                                <label for="txtMznCode" id="lblMznCode">Zone Code *</label>
                                <p class="font-small text-danger" id="txtMznCodeErr"></p>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMznName" class="form-control">
                                <label for="txtMznName" id="lblMznName">Zone Name *</label>
                                <p class="font-small text-danger" id="txtMznNameErr"></p>
                            </div>
                        </div>
                        <div class="col-12 divMznQr">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMznLink" class="form-control font-small" disabled="disabled">
                                <label for="txtMznName" id="lblMznLink">Public Complaint Link</label>
                            </div>
                        </div>
                        <div class="col-12 mb-3 divMznQr">
                            <p class="mb-0">Public Complaint QR Code :</p>
                            <div class="flex-center flex-column">
                                <div id="divMznQrCodeImg" style="margin:5px;"></div>
                            </div>
                        </div>
                        <div class="col-12 mb-3">
                            <p class="mb-0">Status :</p>
                            <div class="md-form mt-0 mb-3 ml-3">
                                <div class="form-check form-check-inline">
                                    <input type="radio" class="form-check-input" name="radMznStatus" id="radMznStatus1" value="1">
                                    <label class="form-check-label" for="radMznStatus1">Active</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input type="radio" class="form-check-input" name="radMznStatus" id="radMznStatus2" value="2">
                                    <label class="form-check-label" for="radMznStatus2">Disabled</label>
                                </div>
                            </div>
                            <p class="font-small text-danger mt-0" id="radMznStatusErr"></p>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer p-2 gems-modal-footer">
                <button class="btn btn-outline-info waves-effect" data-dismiss="modal"><i class="fas fa-undo-alt mr-1"></i> Close</button>
                <button id="btnMznDelete" class="btn btn-outline-danger waves-effect"><i class="fas fa-trash-alt text-danger mr-1"></i> Delete</button>
                <button id="btnMznSave" class="btn btn-info waves-effect"><i class="far fa-save mr-1"></i> Save</button>
                <button id="btnMznSubmit" class="btn btn-info waves-effect"><i class="far fa-paper-plane mr-1"></i> Submit</button>
            </div>
        </div>
    </div>
</div>
