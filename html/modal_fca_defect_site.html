<!--
  Modal: modal_fca_defect_site — Tabler/GEMS modal + form contract (P5-8 FCA Defect).

  Loaded by pages/fca_defect.html ONLY.
    gems-modal-md + modal-dialog-scrollable, never modal-dialog-centered.

  JS contract preserved (js/pages/modal_fca_defect_site.js):
    #modal_fca_defect_site  #formMfy
    #optMfySite  #lblMfySite  #optMfySiteErr
    #optMfyDefectCategory  #lblMfyDefectCategory  #optMfyDefectCategoryErr
    #btnMfySubmit
-->
<div class="modal fade" id="modal_fca_defect_site" tabindex="-1" aria-labelledby="h4MfyTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="h4MfyTitle"><i class="fas fa-plus me-2"></i>Add Site Defect Category</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMfy" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12" id="optMfySite_">
              <label class="form-label" for="optMfySite" id="lblMfySite">Site <span class="required" aria-hidden="true">*</span></label>
              <select id="optMfySite" class="form-select" aria-required="true" aria-describedby="optMfySiteErr"></select>
              <div class="gems-field-error" id="optMfySiteErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12" id="optMfyDefectCategory_">
              <label class="form-label" for="optMfyDefectCategory" id="lblMfyDefectCategory">Defect Category <span class="required" aria-hidden="true">*</span></label>
              <select id="optMfyDefectCategory" class="form-select" aria-required="true" aria-describedby="optMfyDefectCategoryErr"></select>
              <div class="gems-field-error" id="optMfyDefectCategoryErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-undo-alt me-2"></i>Close
        </button>
        <button type="button" id="btnMfySubmit" class="btn btn-primary">
          <i class="far fa-paper-plane me-2"></i>Submit
        </button>
      </div>
    </div>
  </div>
</div>
