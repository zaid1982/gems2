<!--
  section_fca_info — Tabler-migrated (P5-8 FCA Task/All).
  Shared by fca_task + fca_all only. Converted in place (no _tabler fork).
  All JS hook IDs and show/hide classes are preserved.
  Image galleries are plain thumbnails (new tab); mdb-lightbox stays on remaining MDB pages.
-->
<section class="sectionFcaInfo mb-5">
  <div class="page-header">
    <div class="row align-items-center g-2">
      <div class="col-12 col-sm">
        <h1 class="page-title">FCA Audit No. <span id="lblSfcAuditNo"></span></h1>
        <div class="page-subtitle">Status — <span id="lblSfcStatus"></span></div>
      </div>
      <div class="col-12 col-sm-auto">
        <button type="button" class="btn btn-outline-secondary" id="btnSfcBack" data-bs-toggle="tooltip" title="Back to Main Page">
          <i class="fas fa-arrow-left me-2"></i>Back to Main Page
        </button>
        <button type="button" class="btn btn-outline-primary" id="btnSfcCorrection" data-bs-toggle="tooltip" title="Perform FCA Correction">
          <i class="fas fa-edit me-2"></i>Correction
        </button>
        <button type="button" class="btn btn-outline-primary" id="btnSfcValidate" data-bs-toggle="tooltip" title="Perform FCA Validation">
          <i class="fas fa-check me-2"></i>Validation
        </button>
        <button type="button" class="btn btn-primary" id="btnSfcRecommend" data-bs-toggle="tooltip" title="Perform FCA Recommendation">
          <i class="fas fa-marker me-2"></i>Recommendation
        </button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-5">
      <div class="card mb-3">
        <div class="card-header"><h3 class="card-title mb-0">Observation</h3></div>
        <div class="card-body"><p class="mb-0" id="pSfcObservation"></p></div>
      </div>
      <div class="card mb-3">
        <div class="card-header"><h3 class="card-title mb-0">Recommendation</h3></div>
        <div class="card-body"><p class="mb-0" id="pSfcRecommendation"></p></div>
      </div>
      <div class="card mb-3">
        <div class="card-header"><h3 class="card-title mb-0">Validation</h3></div>
        <div class="card-body"><p class="mb-0" id="pSfcValidation"></p></div>
      </div>
      <div class="card mb-3">
        <div class="card-header"><h3 class="card-title mb-0">Work Progress</h3></div>
        <div class="card-body" id="divSfcProgress"></div>
      </div>
      <div class="d-grid gap-2 mb-3">
        <button type="button" class="btn btn-outline-primary" id="btnSfcEditAudit" data-bs-toggle="tooltip" title="Edit FCA Observation"><i class="far fa-edit me-2"></i>Edit FCA Observation</button>
        <button type="button" class="btn btn-outline-primary" id="btnSfcEditRecommend" data-bs-toggle="tooltip" title="Edit FCA Recommendation"><i class="far fa-edit me-2"></i>Edit FCA Recommendation</button>
        <button type="button" class="btn btn-outline-primary" id="btnSfcEditValidate" data-bs-toggle="tooltip" title="Edit FCA Validation"><i class="far fa-edit me-2"></i>Edit FCA Validation</button>
        <button type="button" class="btn btn-outline-warning" id="btnSfcExcludeReport" data-bs-toggle="tooltip" title="Exclude from Report"><i class="fas fa-file-export me-2"></i>Exclude from Report</button>
        <button type="button" class="btn btn-outline-success" id="btnSfcIncludeReport" data-bs-toggle="tooltip" title="Include in Report"><i class="fas fa-file-import me-2"></i>Include in Report</button>
        <button type="button" class="btn btn-outline-danger" id="btnSfcRemove" data-bs-toggle="tooltip" title="Delete FCA"><i class="far fa-trash-alt me-2"></i>Delete FCA</button>
      </div>
    </div>
    <div class="col-lg-7">
      <div class="card mb-3">
        <div class="card-header"><h3 class="card-title mb-0">FCA Profile</h3></div>
        <div class="card-body">
          <div class="datagrid">
            <div class="datagrid-item"><div class="datagrid-title">Site</div><div class="datagrid-content" id="pSfcSite"></div></div>
            <div class="datagrid-item"><div class="datagrid-title">Zone</div><div class="datagrid-content" id="pSfcZone"></div></div>
            <div class="datagrid-item"><div class="datagrid-title">Area</div><div class="datagrid-content" id="pSfcArea"></div></div>
            <div class="datagrid-item"><div class="datagrid-title">Asset Group</div><div class="datagrid-content" id="pSfcAssetGroup"></div></div>
            <div class="datagrid-item"><div class="datagrid-title">Asset No.</div><div class="datagrid-content" id="pSfcAssetNo"></div></div>
            <div class="datagrid-item"><div class="datagrid-title">Evaluated Asset</div><div class="datagrid-content" id="pSfcEvaluatedAsset"></div></div>
            <div class="datagrid-item"><div class="datagrid-title">Defect Item</div><div class="datagrid-content" id="pSfcDefectItem"></div></div>
            <div class="datagrid-item"><div class="datagrid-title">Defect Category</div><div class="datagrid-content" id="pSfcDefectCategory"></div></div>
            <div class="datagrid-item"><div class="datagrid-title">Condition Scale</div><div class="datagrid-content" id="pSfcConditionScale"></div></div>
            <div class="datagrid-item"><div class="datagrid-title">Evaluation Scale</div><div class="datagrid-content" id="pSfcEvaluationType"></div></div>
            <div class="datagrid-item"><div class="datagrid-title">Auditor</div><div class="datagrid-content" id="pSfcAuditor"></div></div>
            <div class="datagrid-item"><div class="datagrid-title">Validator</div><div class="datagrid-content" id="pSfcValidator"></div></div>
            <div class="datagrid-item"><div class="datagrid-title">Audit Date</div><div class="datagrid-content" id="pSfcAuditDate"></div></div>
            <div class="datagrid-item"><div class="datagrid-title">Validate Date</div><div class="datagrid-content" id="pSfcValidateDate"></div></div>
          </div>
        </div>
      </div>
      <div class="card mb-3">
        <div class="card-header"><h3 class="card-title mb-0">Audit Images</h3></div>
        <div class="card-body">
          <div class="row" id="divSfcImageAudit"></div>
        </div>
      </div>
      <div class="card mb-3">
        <div class="card-header"><h3 class="card-title mb-0">Rectification Images</h3></div>
        <div class="card-body">
          <div class="row" id="divSfcImageRectify"></div>
        </div>
      </div>
    </div>
  </div>
</section>
