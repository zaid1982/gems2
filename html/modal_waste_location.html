<div class="modal fade gems-modal" id="modal_waste_location" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content gems-modal-card">
      <div class="modal-header gems-modal-header">
        <h4 class="text-white mt-2 ml-2">Location</h4>
        <button type="button" class="close text-white gems-modal-close" data-dismiss="modal"><span>&times;</span></button>
      </div>
      <div class="modal-body gems-modal-body">
        <form id="formWlc">
          <input type="hidden" id="hidWlcId">
          <div class="form-group"><label>Premise</label><select id="optWlcSite" class="custom-select gems-plain-select browser-default"></select></div>
          <div class="form-group"><label>Location Name *</label><input type="text" id="txtWlcName" class="form-control"></div>
          <div class="form-group"><label>Type</label>
            <select id="optWlcType" class="custom-select gems-plain-select browser-default"><option value="STORAGE">Storage</option><option value="DESTINATION">Destination</option></select>
          </div>
          <div class="form-group"><label>Status</label>
            <select id="optWlcStatus" class="custom-select gems-plain-select browser-default"><option value="1">Active</option><option value="2">Inactive</option></select>
          </div>
        </form>
      </div>
      <div class="modal-footer gems-modal-footer">
        <button class="btn btn-outline-info" data-dismiss="modal">Close</button>
        <button class="btn btn-info" id="btnWlcSave">Save</button>
      </div>
    </div>
  </div>
</div>
