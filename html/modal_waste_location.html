<!--
  Modal: modal_waste_location — Tabler/GEMS modal + form contract (P3A Waste).
  Loaded by pages/waste_setup.html. JS IDs preserved from the MDB original.
-->
<div class="modal fade" id="modal_waste_location" tabindex="-1" aria-labelledby="lblWlcTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblWlcTitle">Location</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formWlc" autocomplete="off" novalidate>
          <input type="hidden" id="hidWlcId">
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="optWlcSite">Premise</label>
              <select id="optWlcSite" class="form-select"></select>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtWlcName">Location Name <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtWlcName" class="form-control" aria-required="true">
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optWlcType">Type</label>
              <select id="optWlcType" class="form-select">
                <option value="STORAGE">Storage</option>
                <option value="DESTINATION">Destination</option>
              </select>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optWlcStatus">Status</label>
              <select id="optWlcStatus" class="form-select">
                <option value="1">Active</option>
                <option value="2">Inactive</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" class="btn btn-primary" id="btnWlcSave">
          <i class="far fa-save me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
