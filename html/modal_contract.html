<div class="modal fade" id="modal_contract" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-notify modal-info mt-3 pt-3 mb-5" role="document">
        <!--Content-->
        <div class="modal-content">
            <!--Header-->
            <div class="modal-header d-flex justify-content-center">
                <h4 class="text-white mt-2 ml-2" id="lblMcrTitle"></h4>
                <button type="button" class="close waves-effect waves-light mr-0 text-white pt-4" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--Body-->
            <div class="modal-body">
                <form id="formMcr">
                    <div class="row">
                        <div class="col-md-12 select-outline mt-2">
                            <select id="optMcrClientId" class="mdb-select md-form md-outline colorful-select mt-0" data-stop-refresh="true"></select>
                            <label for="optMcrClientId" id="lblMcrClientId">Client <span class="text-danger">*</span></label>
                            <p class="font-small text-danger" id="optMcrClientIdErr"></p>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 select-outline mt-0">
                            <select id="optMcrSiteId" class="mdb-select md-form md-outline colorful-select mt-0" data-stop-refresh="true">
                                <option value="" disabled selected>Choose Site</option>
                            </select>
                            <label for="optMcrSiteId" id="lblMcrSiteId">Site <span class="text-danger">*</span></label>
                            <p class="font-small text-danger" id="optMcrSiteIdErr"></p>
                        </div>
                    </div>
                    <div class="md-form md-outline mt-0">
                        <input type="text" id="txtMcrName" class="form-control">
                        <label for="txtMcrName" id="lblMcrName">Contract Name <span class="text-danger">*</span></label>
                        <p class="font-small text-danger" id="txtMcrNameErr"></p>
                    </div>
                    <div class="md-form md-outline mb-0">
                        <textarea id="txaMcrDesc" class="md-textarea form-control" rows="3"></textarea>
                        <label for="txaMcrDesc" id="lblMcrDesc" class="text-muted">Description</label>
                        <p class="font-small text-danger" id="txaMcrDescErr"></p>
                    </div>
                    <h6 class="font-small">Contract Modification Type : <span class="text-danger">*</span></h6>
                    <div class="form-check pl-0 ml-3">
                        <input type="radio" class="form-check-input" name="radMcrContractType" id="radMcrContractType1" value="1">
                        <label class="form-check-label" for="radMcrContractType1">Normal Update</label>
                    </div>
                    <div class="form-check pl-0 ml-3">
                        <input type="radio" class="form-check-input" name="radMcrContractType" id="radMcrContractType2" value="2">
                        <label class="form-check-label" for="radMcrContractType2">Contract Extension with PPM Reschedule</label>
                    </div>
                    <p class="font-small text-danger" id="radMcrContractTypeErr"></p>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="md-form md-outline my-0">
                                <input type="text" id="txtMcrContractDateStart" class="form-control datepicker" readonly>
                                <label for="txtMcrContractDateStart" id="lblMcrContractDateStart">Date Start *</label>
                                <p class="font-small text-danger" id="txtMcrContractDateStartErr"></p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="md-form md-outline my-0">
                                <input type="text" id="txtMcrContractDateEnd" class="form-control datepicker" readonly>
                                <label for="txtMcrContractDateEnd" id="lblMcrContractDateEnd">Date End *</label>
                                <p class="font-small text-danger" id="txtMcrContractDateEndErr"></p>
                            </div>
                        </div>
                    </div>
                    <h6 class="font-small">Status : </h6>
                    <div class="form-check pl-0 ml-3">
                        <input type="checkbox" class="form-check-input" id="chkMcrStatus" name="chkMcrStatus" value="1">
                        <label class="form-check-label" for="chkMcrStatus">Active</label>
                    </div>
                </form>
            </div>
            <div class="modal-footer flex-center p-1">
                <button class="btn btn-outline-info waves-effect" data-dismiss="modal"><i class="fas fa-undo-alt ml-1"></i> Close</button>
                <button id="btnMcrSubmit" class="btn btn-info waves-effect" disabled><i class="far fa-paper-plane ml-1"></i> Submit</button>
            </div>
        </div>
    </div>
</div>
