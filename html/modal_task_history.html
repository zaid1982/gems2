<div class="modal fade" id="modal_task_history" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-notify modal-info mt-3 pt-3 mb-5" role="document">
        <!--Content-->
        <div class="modal-content">
            <!--Header-->
            <div class="modal-header d-flex justify-content-center">
                <h4 class="text-white mt-2 ml-2" id="lblMthTitle"></h4>
                <button type="button" class="close waves-effect waves-light mr-0 text-white pt-4" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--Body-->
            <div class="modal-body pb-1">
                <form id="formMth">
                    <h6 class="font-small">Task Information :</h6>
                    <div class="row pl-2 mt-3">
                        <div class="col-md-6">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMthContractName" class="form-control" disabled>
                                <label for="txtMthContractName" id="lblMthContractName">Contract Name</label>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMthContractDateStart" class="form-control" disabled>
                                <label for="txtMthContractDateStart" id="lblMthContractDateStart">Contract Start</label>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMthContractDateEnd" class="form-control" disabled>
                                <label for="txtMthContractDateEnd" id="lblMthContractDateEnd">Contract End</label>
                            </div>
                        </div>
                    </div>
                    <div class="row pl-2">
                        <div class="col-md-4">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMthAssetNo" class="form-control" disabled>
                                <label for="txtMthAssetNo" id="lblMthAssetNo">Asset No</label>
                            </div>
                        </div>
                        <div class="col-md-8">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMthAssetName" class="form-control" disabled>
                                <label for="txtMthAssetName" id="lblMthAssetName">Asset Name</label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer p-2">
                <button class="btn btn-outline-info waves-effect" data-dismiss="modal"><i class="fas fa-undo-alt ml-1"></i> Close</button>
                <button id="btnMthSubmit" class="btn btn-info waves-effect" disabled><i class="far fa-paper-plane ml-1"></i> Submit</button>
            </div>
        </div>
    </div>
</div>
