<!--
  Modal: modal_checklist_quan — Tabler/GEMS modal + form contract (P4C-6).

  Loaded by pages/checklist.html ONLY. Copies the P4 modal contract:
    gems-modal-md + modal-dialog-scrollable, never modal-dialog-centered.
    Visible labels, gems-form-grid, H3 MzValidate error slots.
    Footer: outline Close first, primary Submit last.

  The unused Limit / Tolerance checkbox (#chkMqnChecklistQuanStatuss2)
  and #xxx2 placeholder stay for ID compatibility. Commented-out title
  and extra-field blocks from the MDB original are not ported.

  JS contract preserved (js/pages/modal_checklist_quan.js):
    #modal_checklist_quan  #formMqn
    #txtMqnChecklistQuanNumb  #txaMqnChecklistQuanDesc
    #txtMqnChecklistQuanUnit  #txtMqnChecklistQuanSetValues
    #optMqnFrequencyId  #chkMqnChecklistQuanStatus
    #btnMqnSubmit  #lblMqnTitle
-->
<div class="modal fade" id="modal_checklist_quan" tabindex="-1" aria-labelledby="lblMqnTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMqnTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMqn" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMqnChecklistQuanNumb" id="lblMqnChecklistQuanNumb">Numbering <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMqnChecklistQuanNumb" class="form-control" aria-required="true" aria-describedby="txtMqnChecklistQuanNumbErr">
              <div class="gems-field-error" id="txtMqnChecklistQuanNumbErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txaMqnChecklistQuanDesc" id="lblMqnChecklistQuanDesc">Description <span class="required" aria-hidden="true">*</span></label>
              <textarea id="txaMqnChecklistQuanDesc" class="form-control" rows="3" aria-required="true" aria-describedby="txaMqnChecklistQuanDescErr"></textarea>
              <div class="gems-field-error" id="txaMqnChecklistQuanDescErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtMqnChecklistQuanUnit" id="lblMqnChecklistQuanUnit">Unit</label>
              <input type="text" id="txtMqnChecklistQuanUnit" class="form-control" aria-describedby="txtMqnChecklistQuanUnitErr">
              <div class="gems-field-error" id="txtMqnChecklistQuanUnitErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtMqnChecklistQuanSetValues" id="lblMqnChecklistQuanSetValues">Set Values</label>
              <input type="text" id="txtMqnChecklistQuanSetValues" class="form-control" aria-describedby="txtMqnChecklistQuanSetValuesErr">
              <div class="gems-field-error" id="txtMqnChecklistQuanSetValuesErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="optMqnFrequencyId" id="lblMqnFrequencyId">Frequency <span class="required" aria-hidden="true">*</span></label>
              <select id="optMqnFrequencyId" class="form-select" aria-required="true" aria-describedby="optMqnFrequencyIdErr"></select>
              <div class="gems-field-error" id="optMqnFrequencyIdErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkMqnChecklistQuanStatuss2" name="chkMqnChecklistQuanStatuss" value="1">
                <label class="form-check-label" for="chkMqnChecklistQuanStatuss2">Limit / Tolerance</label>
              </div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label visually-hidden" for="xxx2">Default Value</label>
              <input type="text" id="xxx2" class="form-control" placeholder="Default Value">
            </div>
            <div class="gems-field gems-field-12">
              <span class="form-label">Status</span>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkMqnChecklistQuanStatus" name="chkMqnChecklistQuanStatus" value="1">
                <label class="form-check-label" for="chkMqnChecklistQuanStatus">Active</label>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><i class="fas fa-undo-alt me-1"></i> Close</button>
        <button type="button" id="btnMqnSubmit" class="btn btn-primary" disabled><i class="far fa-paper-plane me-1"></i> Submit</button>
      </div>
    </div>
  </div>
</div>
