<div class="modal fade" id="modal_attendance_group" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">

            </div>
            <!--Body-->
            <div class="modal-body mb-0">

									</div>

							</div>
						</div>
					</div>

						</div>
						<div class="col-md-6 select-outline mt-2 mb-2" id="optMtgPermission_">

								<option value="2">High</option>
							</select>

								<option value="2">High</option>

							<div class="md-form md-outline mt-0">

								<p class="font-small text-danger" id="txtMtgVersionErr"></p>
							</div>
						</div>
						<div class="col-md-6">
