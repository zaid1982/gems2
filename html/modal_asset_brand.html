<!--
  Modal: modal_asset_brand — Tabler/GEMS modal + form contract (P4A-4).

  Loaded by pages/asset_brand.html ONLY. Copies the P4A-1 Designation / P4A-2
  Severity / P4A-3 Failure Code / P2 License contract:
    gems-modal-md (640px) + modal-dialog-scrollable, never modal-dialog-centered.
    Flat white header, btn-close flex-centred with the title.
    Visible labels, gems-form-grid, H3 MzValidate error slots.
    Footer: outline Close first, primary Save last. No btn-info.

  Asset Brand extras vs other P4 simple masters: description textarea
  (maxLength 255) and status values 1 / 2 / 5 (archived is display-only;
  the checkbox still writes 1 or 2).

  JS contract preserved (js/pages/modal_asset_brand.js, js/pages/main_asset_brand.js):
    #modal_asset_brand  #formMzb  #txtMzbName  #lblMzbName  #txtMzbNameErr
    #txaMzbDesc  #lblMzbDesc  #txaMzbDescErr
    #chkMzbStatus  #chkMzbStatusErr  #btnMzbSubmit  #lblMzbTitle
-->
<div class="modal fade" id="modal_asset_brand" tabindex="-1" aria-labelledby="lblMzbTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMzbTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMzb" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMzbName" id="lblMzbName">Asset Brand <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMzbName" class="form-control" aria-required="true" aria-describedby="txtMzbNameErr">
              <div class="gems-field-error" id="txtMzbNameErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txaMzbDesc" id="lblMzbDesc">Description</label>
              <textarea id="txaMzbDesc" class="form-control" rows="3" aria-describedby="txaMzbDescErr"></textarea>
              <div class="gems-field-error" id="txaMzbDescErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <span class="form-label">Status</span>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkMzbStatus" name="chkMzbStatus" value="1" aria-describedby="chkMzbStatusErr">
                <label class="form-check-label" for="chkMzbStatus">Active</label>
              </div>
              <div class="gems-field-error" id="chkMzbStatusErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" id="btnMzbSubmit" class="btn btn-primary" disabled>
          <i class="far fa-save me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
