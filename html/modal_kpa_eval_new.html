<!--
  Modal: modal_kpa_eval_new — Tabler/GEMS modal + form contract (P3B KPA).
  Loaded by pages/kpa_evaluation.html. JS IDs preserved from the MDB original.
-->
<div class="modal fade" id="modal_kpa_eval_new" tabindex="-1" aria-labelledby="h4KenTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="h4KenTitle">Create Monthly Evaluation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formKen" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optKenYear">Evaluation year <span class="required" aria-hidden="true">*</span></label>
              <select id="optKenYear" class="form-select" aria-required="true"></select>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optKenMonth">Evaluation month <span class="required" aria-hidden="true">*</span></label>
              <select id="optKenMonth" class="form-select" aria-required="true"></select>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtKenMpv">Monthly Payment Value (RM) <span class="required" aria-hidden="true">*</span></label>
              <input type="number" step="0.001" min="0" id="txtKenMpv" class="form-control" aria-required="true">
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtKenMaxApd">Maximum APD (%)</label>
              <input type="text" id="txtKenMaxApd" class="form-control" readonly>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtKenApdMax">APD Maximum (RM)</label>
              <input type="text" id="txtKenApdMax" class="form-control" readonly>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtKenRemarks">Remarks</label>
              <input type="text" id="txtKenRemarks" class="form-control">
            </div>
          </div>
          <div class="gems-note">
            <i class="fas fa-info-circle"></i>
            <div>
              <div><strong id="lblKenPiCount">0</strong> active indicators will be copied from the KPI template into this month.</div>
              <div>The MPV defaults to the previous month. Changing it later recalculates every APD figure.</div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" class="btn btn-primary" id="btnKenCreate">
          <i class="fas fa-plus me-2"></i>Create Month
        </button>
      </div>
    </div>
  </div>
</div>
