<div class="modal fade gems-modal" id="modal_attendance_shift" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered mt-3 pt-5 mb-5" role="document">
        <!--Content-->
        <div class="modal-content gems-modal-card">
            <!--Header-->
            <div class="modal-header gems-modal-header">
                <h4 class="text-white mt-2 ml-2" id="lblMtsModalTitle"><i class="far fa-edit text-white"></i> &nbsp;Set Shift Time</h4>
                <button type="button" class="close waves-effect waves-light mr-0 text-white pt-4 gems-modal-close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--Body-->
            <div class="modal-body mb-0 gems-modal-body">
                <form id="formMts" class="mt-2" autocomplete="off">
                    <div class="row">
                        <div class="col-md-12 select-outline mt-0" id="optMtsGroup_">
                            <select id="optMtsGroup" class="mdb-select md-form md-outline colorful-select my-0" data-stop-refresh="true">
                                <option value="1" selected>PPM</option>
                                <option value="2">Operation</option>
                            </select>
                            <label for="optMtsGroup" id="lblMtsGroup">Group *</label>
                        </div>
                        <div class="col-md-12 select-outline mt-4" id="optMtsCategory_">
                            <select id="optMtsCategory" class="mdb-select md-form md-outline colorful-select my-0" data-stop-refresh="true">
                                <option value="1" selected>Mechanical</option>
                                <option value="2">Electrical</option>
                                <option value="3">Civil</option>
                            </select>
                            <label for="optMtsCategory" id="lblMtsCategory">Category *</label>
                        </div>
                        <div class="col-md-12">
                            <div class="md-form md-outline mt-4">
                                <input type="text" id="txtMtsHourStart" class="form-control">
                                <label for="txtMtsHourStart" id="lblMtsHourStart">Hour Start *</label>
                                <p class="font-small text-danger" id="txtMtsHourStartErr"></p>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtMtsHourEnd" class="form-control">
                                <label for="txtMtsHourEnd" id="lblMtsHourEnd">Hour End *</label>
                                <p class="font-small text-danger" id="txtMtsHourEndErr"></p>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer p-2 gems-modal-footer">
                <button class="btn btn-outline-info waves-effect btnMtsClose" data-dismiss="modal" data-toggle="tooltip" title="Close"><i class="fas fa-undo-alt ml-1"></i> Close</button>
                <button id="btnMtsSubmit" class="btn btn-info waves-effect" data-toggle="tooltip" title="Submit Item Type"><i class="far fa-paper-plane ml-1"></i> Submit</button>
                <button id="btnMtsSave" class="btn btn-info waves-effect" data-toggle="tooltip" title="Save Item Type"><i class="far fa-save ml-1"></i> Save</button>
            </div>
        </div>
    </div>
</div>
