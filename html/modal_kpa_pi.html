<!--
  Modal: modal_kpa_pi — Tabler/GEMS modal + form contract (P3B KPA).
  Loaded by pages/kpa_structure.html. JS IDs preserved from the MDB original.
-->
<div class="modal fade" id="modal_kpa_pi" tabindex="-1" aria-labelledby="h4KpiTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="h4KpiTitle">Performance Indicator</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formKpi" autocomplete="off" novalidate>
          <input type="hidden" id="hidKpiId">
          <div class="gems-form-grid">
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optKpiGroup">KPI group <span class="required" aria-hidden="true">*</span></label>
              <select id="optKpiGroup" class="form-select" aria-required="true"></select>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtKpiNo">PI No. <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtKpiNo" class="form-control" maxlength="10" placeholder="1C" aria-required="true">
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtKpiName">Performance Indicator <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtKpiName" class="form-control" placeholder="Response Time meets target" aria-required="true">
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtKpiTarget">Target <span class="required" aria-hidden="true">*</span></label>
              <input type="number" step="0.0001" id="txtKpiTarget" class="form-control" aria-required="true">
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optKpiUnit">Target unit</label>
              <select id="optKpiUnit" class="form-select">
                <option value="%">Percentage (%)</option>
                <option value="BEI">Building Energy Index</option>
              </select>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtKpiDemerit">Demerit point</label>
              <input type="number" min="0" id="txtKpiDemerit" class="form-control" value="1">
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtKpiWeight">Weightage (%)</label>
              <input type="number" step="0.01" min="0" max="100" id="txtKpiWeight" class="form-control">
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optKpiPassRule">Pass rule</label>
              <select id="optKpiPassRule" class="form-select">
                <option value="GTE_TARGET">Actual must be at or above target</option>
                <option value="LTE_TARGET">Actual must be at or below target</option>
                <option value="EQ_TARGET">Actual must equal target</option>
              </select>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optKpiCalc">Calculation</label>
              <select id="optKpiCalc" class="form-select">
                <option value="EXPRESSION">Formula expression</option>
                <option value="BACKLOG_AVG">Backlog bucket average</option>
                <option value="BEI">Building Energy Index</option>
                <option value="AVG_PARAMS">Average of parameters</option>
                <option value="DIRECT">Direct value</option>
              </select>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optKpiSource">Data source</label>
              <select id="optKpiSource" class="form-select">
                <option value="MANUAL">Manual entry</option>
                <option value="GEMS">Automated from GEMS+</option>
              </select>
            </div>
            <div class="gems-field gems-field-12" id="divKpiFormula">
              <label class="form-label" for="txtKpiFormula">Formula</label>
              <input type="text" id="txtKpiFormula" class="form-control" placeholder="(p2/p1)*100">
              <div class="form-hint">Use the parameter keys p1, p2, p3 with + - * / ( ) and min() / max(). Example: <code>100-((p1/p2)*100)</code></div>
            </div>
            <div class="gems-field gems-field-12" id="divKpiTest">
              <div class="d-flex align-items-center flex-wrap gap-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="btnKpiTest">Test formula</button>
                <span id="lblKpiTestResult" class="text-secondary"></span>
              </div>
              <div id="divKpiTestInputs" class="gems-form-grid mt-2"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtKpiOrder">Display order</label>
              <input type="number" min="1" id="txtKpiOrder" class="form-control" value="1">
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optKpiStatus">Status</label>
              <select id="optKpiStatus" class="form-select">
                <option value="1">Active</option>
                <option value="2">Inactive</option>
              </select>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtKpiEffective">Effective from</label>
              <input type="date" id="txtKpiEffective" class="form-control">
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txaKpiDesc">Description</label>
              <textarea id="txaKpiDesc" class="form-control" rows="2"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" class="btn btn-primary" id="btnKpiSave">
          <i class="far fa-save me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
