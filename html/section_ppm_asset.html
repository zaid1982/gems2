<!--
  Section: section_ppm_asset — Tabler (P5-4 Commit 2).

  Loaded by pages/ppm_asset.html ONLY. Not the asset-details split.
  Field IDs, table IDs, and button IDs are copied verbatim.
-->
<section class="section mb-4 sectionPpmAsset" style="display:none">
  <div class="page-header">
    <div class="row align-items-center g-2">
      <div class="col-12 col-sm">
        <h1 class="page-title"><i class="fas fa-users me-2 text-primary"></i><span id="lblSpgWoMainName">PPM Asset Group Name</span></h1>
        <div class="page-subtitle"><span id="lblSpgName"></span></div>
      </div>
      <div class="col-12 col-sm-auto">
        <button type="button" class="btn btn-outline-secondary" id="btnSpgBack" data-bs-toggle="tooltip" title="Back to Main Page" aria-label="Back to main page">
          <i class="fas fa-arrow-left me-2"></i>Back to Main Page
        </button>
      </div>
    </div>
  </div>

  <div class="row row-cards">
    <div class="col-xl-4">
      <div class="card mb-3">
        <div class="card-body py-2">
          <div class="text-secondary" style="font-size:.75rem">PPM Status</div>
          <h4 class="mb-0" id="pSpgStatus"></h4>
        </div>
      </div>
      <div class="card mb-3">
        <div class="card-body py-2">
          <div class="text-secondary" style="font-size:.75rem">Total Assets</div>
          <h4 class="mb-0" id="pSpgTotalAsset">0</h4>
        </div>
      </div>
      <div class="card mb-3">
        <div class="card-body py-2">
          <div class="text-secondary" style="font-size:.75rem">Total PPM Tasks</div>
          <h4 class="mb-0" id="pSpgTotalTask">0</h4>
        </div>
      </div>
    </div>
    <div class="col-xl-8">
      <div class="card mb-3">
        <div class="card-header">
          <div>
            <h3 class="card-title mb-0">PPM Asset Group Details</h3>
          </div>
          <div class="gems-card-toolbar">
            <button type="button" class="btn btn-outline-danger btn-sm" id="btnSpgRemove" data-bs-toggle="tooltip" title="Edit Info" aria-label="Delete PPM Group">
              <i class="far fa-trash-alt me-1"></i>Delete PPM Group
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="btnSpgEdit" data-bs-toggle="tooltip" title="Edit Info" aria-label="Edit Info">
              <i class="far fa-edit me-1"></i>Edit Info
            </button>
          </div>
        </div>
        <div class="card-body">
          <div class="gems-form-grid">
            <div class="gems-field gems-field-6" id="divSpgWo">
              <label class="form-label">PPM Asset Group Name</label>
              <p class="mb-0" id="pSpgName">-</p>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label">Site</label>
              <p class="mb-0" id="pSpgSite">-</p>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label">Contract</label>
              <p class="mb-0" id="pSpgContract">-</p>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label">Asset Group</label>
              <p class="mb-0" id="pSpgAssetGroup">-</p>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label">Asset Category</label>
              <p class="mb-0" id="pSpgAssetCategory">-</p>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label">Asset Type</label>
              <p class="mb-0" id="pSpgAssetType">-</p>
            </div>
            <div class="gems-field gems-field-4">
              <label class="form-label">Document No.</label>
              <p class="mb-0" id="pSpgTaskNo">-</p>
            </div>
            <div class="gems-field gems-field-4">
              <label class="form-label">Issue No.</label>
              <p class="mb-0" id="pSpgIssueNo">-</p>
            </div>
            <div class="gems-field gems-field-4">
              <label class="form-label">Frequency</label>
              <p class="mb-0" id="pSpgFrequency">-</p>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label">Started Date</label>
              <p class="mb-0" id="pSpgDateStart">-</p>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label">Created Date/Time</label>
              <p class="mb-0" id="pSpgTimeCreated">-</p>
            </div>
            <div class="gems-field gems-field-12" id="divSpgWr">
              <label class="form-label">Description</label>
              <p class="mb-0" id="pSpgRemark">-</p>
            </div>
          </div>
        </div>
      </div>

      <div class="card mb-3 divSpgAssigned">
        <div class="card-header">
          <div>
            <h3 class="card-title mb-0">List of Assets</h3>
          </div>
          <div class="gems-card-toolbar">
            <button type="button" class="btn btn-outline-secondary btn-sm" id="btnSpgAssetRefresh" aria-label="Refresh assets" data-bs-toggle="tooltip" title="Refresh">
              <i class="fas fa-sync me-1"></i>Refresh
            </button>
            <button type="button" class="btn btn-primary btn-sm" id="btnSpgAssetAdd" aria-label="Add Asset" title="Add Asset">
              <i class="fas fa-plus me-1"></i>Add Asset
            </button>
            <div id="btnDtSpgAssetExport"></div>
          </div>
        </div>
        <div class="table-responsive">
          <table id="dtSpgAsset" class="table table-vcenter card-table table-hover mb-0">
            <thead>
              <tr>
                <th style="width:4%">#</th>
                <th>Asset No.</th>
                <th>Asset Name</th>
                <th>Serial No.</th>
                <th>Location Code</th>
                <th>Asset Description</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="card-footer">
          <button type="button" class="btn btn-primary" id="btnSpgSubmit" data-bs-toggle="tooltip" title="Submit" aria-label="Submit for PPM Task Scheduling">
            <i class="far fa-calendar-check me-1"></i>Submit for PPM Task Scheduling
          </button>
        </div>
      </div>

      <div class="card mb-3 divSpgAssigned">
        <div class="card-header">
          <div>
            <h3 class="card-title mb-0">List of PPM Tasks</h3>
          </div>
          <div class="gems-card-toolbar">
            <button type="button" class="btn btn-outline-secondary btn-sm" id="btnSpgTaskRefresh" aria-label="Refresh tasks" data-bs-toggle="tooltip" title="Refresh">
              <i class="fas fa-sync me-1"></i>Refresh
            </button>
            <div id="btnDtSpgTaskExport"></div>
          </div>
        </div>
        <div class="table-responsive">
          <table id="dtSpgTask" class="table table-vcenter card-table table-hover mb-0">
            <thead>
              <tr>
                <th style="width:4%">#</th>
                <th>PPM Task No.</th>
                <th>Schedule Date</th>
                <th>Executor</th>
                <th>Time Execute</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</section>
