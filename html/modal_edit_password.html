<!--
  Modal: modal_edit_password — Tabler/GEMS modal + form contract (P4C-3).

  Loaded by pages/user_management.html ONLY. Admin password-reset child
  modal (not ModalChangePassword). IDs, validation, and
  PUT profile.php?userId= {action:'edit_password', newPassword} stay.

  gems-modal-sm + modal-dialog-scrollable, never centered.
  Footer: outline Close, primary Submit.
-->
<div class="modal fade" id="modal_edit_password" tabindex="-1" aria-labelledby="h4MpzTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-sm modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="h4MpzTitle"><i class="fas fa-unlock-alt me-2"></i>Edit Password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMpz" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMpzUserName" id="lblMpzUserName">User Name</label>
              <input type="text" id="txtMpzUserName" class="form-control" disabled aria-describedby="txtMpzUserNameErr">
              <div class="gems-field-error" id="txtMpzUserNameErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMpzNewPassword" id="lblMpzNewPassword">New Password <span class="required" aria-hidden="true">*</span></label>
              <input type="password" id="txtMpzNewPassword" class="form-control" autocomplete="new-password" aria-required="true" aria-describedby="txtMpzNewPasswordErr">
              <div class="gems-field-error" id="txtMpzNewPasswordErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMpzConfirmPassword" id="lblMpzConfirmPassword">Confirm New Password <span class="required" aria-hidden="true">*</span></label>
              <input type="password" id="txtMpzConfirmPassword" class="form-control" autocomplete="new-password" aria-required="true" aria-describedby="txtMpzConfirmPasswordErr">
              <div class="gems-field-error" id="txtMpzConfirmPasswordErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" id="btnMpzSubmit" class="btn btn-primary" disabled>
          <i class="far fa-paper-plane me-2"></i>Submit
        </button>
      </div>
    </div>
  </div>
</div>
