<div class="modal fade" id="modal_edit_password" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-notify modal-warning mt-3 pt-5 mb-5" role="document">
        <!--Content-->
        <div class="modal-content">
            <!--Header-->
            <div class="modal-header d-flex justify-content-center">
                <h4 class="text-white mt-2 ml-2"><i class="fas fa-unlock-alt text-white"></i> Edit Password</h4>
                <button type="button" class="close waves-effect waves-light mr-0 text-white pt-4" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--Body-->
            <div class="modal-body mb-0">
                <form id="formMpz">
                    <div class="md-form">
                        <input type="text" id="txtMpzUserName" class="form-control" disabled="">
                        <label for="txtMpzUserName" id="lblMpzUserName">User Name</label>
                        <p class="font-small text-danger" id="txtMpzUserNameErr"></p>
                    </div>
                    <div class="md-form">
                        <input type="password" id="txtMpzNewPassword" class="form-control">
                        <label for="txtMpzNewPassword" id="lblMpzNewPassword">New Password *</label>
                        <p class="font-small text-danger" id="txtMpzNewPasswordErr"></p>
                    </div>
                    <div class="md-form">
                        <input type="password" id="txtMpzConfirmPassword" class="form-control">
                        <label for="txtMpzConfirmPassword" id="lblMpzConfirmPassword">Confirm New Password *</label>
                        <p class="font-small text-danger" id="txtMpzConfirmPasswordErr"></p>
                    </div>
                </form>
            </div>
            <div class="modal-footer p-2">
                <button class="btn btn-outline-warning waves-effect" data-dismiss="modal"><i class="fas fa-undo-alt ml-1"></i> Close</button>
                <button id="btnMpzSubmit" class="btn btn-warning waves-effect" disabled><i class="far fa-paper-plane ml-1"></i> Submit</button>
            </div>
        </div>
    </div>
</div>
