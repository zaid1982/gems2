<div class="modal fade gems-modal" id="modal_waste_ref_value" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content gems-modal-card">
      <div class="modal-header gems-modal-header">
        <h4 class="text-white mt-2 ml-2">Reference Value</h4>
        <button type="button" class="close text-white gems-modal-close" data-dismiss="modal"><span>&times;</span></button>
      </div>
      <div class="modal-body gems-modal-body">
        <form id="formWrv">
          <input type="hidden" id="hidWrvId">
          <div class="form-group"><label>Type *</label>
            <select id="optWrvType" class="custom-select gems-plain-select browser-default">
              <option value="PACKAGING_TYPE">Packaging Type</option>
              <option value="HANDLING_METHOD">Handling Method</option>
              <option value="DOCUMENT_TYPE">Document Type</option>
              <option value="TRANSPORTER">Transporter</option>
              <option value="RECEIVER">Receiving Facility</option>
              <option value="SUBMISSION_CHANNEL">Submission Channel</option>
            </select>
          </div>
          <div class="form-group"><label>Name *</label><input type="text" id="txtWrvName" class="form-control"></div>
          <div class="form-group"><label>Premise (optional, blank = global)</label><select id="optWrvSite" class="custom-select gems-plain-select browser-default"></select></div>
          <div class="form-group"><label>Status</label>
            <select id="optWrvStatus" class="custom-select gems-plain-select browser-default"><option value="1">Active</option><option value="2">Inactive</option></select>
          </div>
        </form>
      </div>
      <div class="modal-footer gems-modal-footer">
        <button class="btn btn-outline-info" data-dismiss="modal">Close</button>
        <button class="btn btn-info" id="btnWrvSave">Save</button>
      </div>
    </div>
  </div>
</div>
