<!--
  Modal: modal_waste_ref_value — Tabler/GEMS modal + form contract (P3A Waste).
  Loaded by pages/waste_setup.html. JS IDs preserved from the MDB original.
-->
<div class="modal fade" id="modal_waste_ref_value" tabindex="-1" aria-labelledby="lblWrvTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblWrvTitle">Reference Value</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formWrv" autocomplete="off" novalidate>
          <input type="hidden" id="hidWrvId">
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="optWrvType">Type <span class="required" aria-hidden="true">*</span></label>
              <select id="optWrvType" class="form-select" aria-required="true">
                <option value="PACKAGING_TYPE">Packaging Type</option>
                <option value="HANDLING_METHOD">Handling Method</option>
                <option value="DOCUMENT_TYPE">Document Type</option>
                <option value="TRANSPORTER">Transporter</option>
                <option value="RECEIVER">Receiving Facility</option>
                <option value="SUBMISSION_CHANNEL">Submission Channel</option>
              </select>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtWrvName">Name <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtWrvName" class="form-control" aria-required="true">
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optWrvSite">Premise (optional, blank = global)</label>
              <select id="optWrvSite" class="form-select"></select>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optWrvStatus">Status</label>
              <select id="optWrvStatus" class="form-select">
                <option value="1">Active</option>
                <option value="2">Inactive</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" class="btn btn-primary" id="btnWrvSave">
          <i class="far fa-save me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
