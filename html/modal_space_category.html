<!--
  Modal: modal_space_category — Tabler/GEMS modal + form contract (P5-6).

  Loaded by pages/space_category.html ONLY.
    gems-modal-sm + modal-dialog-scrollable, never modal-dialog-centered.
    Visible labels, gems-form-grid, H3 MzValidate error slots.
    Footer: outline Close first, primary Submit last.

  JS contract preserved (js/pages/modal_space_category.js):
    #modal_space_category  #formMsc
    #txtMscName  #lblMscName  #txtMscNameErr
    #txaMscDesc  #lblMscDesc  #txaMscDescErr
    #chkMscStatus  #chkMscStatusErr
    #btnMscSubmit  #lblMscTitle
-->
<div class="modal fade" id="modal_space_category" tabindex="-1" aria-labelledby="lblMscTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-sm modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMscTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMsc" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMscName" id="lblMscName">Category Name <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMscName" class="form-control" aria-required="true" aria-describedby="txtMscNameErr">
              <div class="gems-field-error" id="txtMscNameErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txaMscDesc" id="lblMscDesc">Description</label>
              <textarea id="txaMscDesc" class="form-control" rows="3" aria-describedby="txaMscDescErr"></textarea>
              <div class="gems-field-error" id="txaMscDescErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <span class="form-label">Status</span>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkMscStatus" name="chkMscStatus" value="1" aria-describedby="chkMscStatusErr">
                <label class="form-check-label" for="chkMscStatus">Active</label>
              </div>
              <div class="gems-field-error" id="chkMscStatusErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" id="btnMscSubmit" class="btn btn-primary" disabled>
          <i class="far fa-paper-plane me-2"></i>Submit
        </button>
      </div>
    </div>
  </div>
</div>
