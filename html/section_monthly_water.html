<section class="section mb-5 sectionMonthlyWater">
    <div class="row mb-4 pb-0">
        <div class="col-md-12">
            <button type="button" class="btn peach-gradient btn-rounded float-right text-white z-depth-3"
                    id="btnSmwBack">
                <i class="fas fa-arrow-left"></i> Back to Main Page
            </button>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4">
            <div class="card z-depth-3 mb-3">
                <div class="">
                    <div class="float-left info-color" style="width: 24px; height: 45px">&nbsp;</div>
                    <h4 class="font-weight-bold pt-2 pl-4_5"><span id="lblSmwMonthName"></span> Water Report</h4>
                </div>
            </div>
            <div class="card z-depth-4 mb-3">
                <div class="p-3 info-color text-white">
                    <h4>Total Monthly Charges</h4>
                    <h1 class="mt-3">RM <span id="lblSmwTotalMonthlyCharges"></span> &nbsp;&nbsp;<span id="lblSmwChangePerc" class="h3"></span></h1>
                    <p class="mt-2 mb-0 font-small">Final calculation for <span id="lblSmwSiteName" class="font-weight-bold"></span> monthly water charges</p>
                </div>
            </div>
            <div class="card z-depth-4 mb-4">
                <div class="p-3 info-color text-white">
                    <h5>Total Consumption</h5>
                    <h2 class="mt-2 mb-0"><span id="lblSmwTotalMonthlyConsumption"></span> m<sup>3</sup></h2>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card z-depth-3 mb-3">
                <div class="">
                    <div class="float-left info-color" style="width: 24px; height: 45px">&nbsp;</div>
                    <h4 class="font-weight-bold pt-2 pl-4_5">Daily Reading Chart</h4>
                </div>
            </div>
            <div class="card z-depth-4 mb-4">
                <div class="" id="chartSmwKwh" style="margin: 0;"></div>
            </div>
            <div class="card z-depth-3 mb-3">
                <div class="">
                    <div class="float-left info-color" style="width: 24px; height: 45px">&nbsp;</div>
                    <h4 class="font-weight-bold pt-2 pl-4_5">Daily Reading Record</h4>
                </div>
            </div>
            <div class="card z-depth-4 mb-3">
                <div class="p-3">
                    <div class="table-responsive">
                        <table id="dtSmwData" class="table table-hover table-sm mb-0 display responsive" style="width: 100%">
                            <thead>
                            <tr class="th-strong">
                                <th>Date</th>
                                <th>Maximum<br>Demand (kW)</th>
                                <th>Opening<br>Reading (kWh)</th>
                                <th>Closing<br>Reading (kWh)</th>
                                <th>Daily<br>Usage (kWh)</th>
                                <th>Recorded By</th>
                                <th>Recorded Time</th>
                                <th>Trend</th>
                                <th>Trend</th>
                            </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

</section>
