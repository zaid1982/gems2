<!--
  Modal: modal_drawing — Tabler (P5-15). Drawing Records only.

  gems-modal-lg + modal-dialog-scrollable, never centered.
  Visible labels, gems-form-grid, H3 error slots. IDs/payloads unchanged.

  Files stay txfMdwFile / txfMdwPdfFile + hidden blobs + readonly name fields.
  Date is native type=date (mzConvertDate / mzApplyDateValue already dual-stack).
  Group values remain 1–4. Permission 1 Low / 2 High.
-->
<div class="modal fade" id="modal_drawing" tabindex="-1" aria-labelledby="lblMdwModalTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMdwModalTitle"><i class="fas fa-upload me-1"></i> Upload Drawing File</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" data-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMdw" autocomplete="off" novalidate>
          <div class="alert alert-warning" role="alert">
            <strong>Attention.</strong> Drawing must be Autocad <code>.dwg</code> and must not exceed 30MB. A PDF is required if the drawing should be viewed in the web as embedded.
          </div>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMdwTitle" id="lblMdwTitle">Document Title <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMdwTitle" class="form-control" aria-required="true" aria-describedby="txtMdwTitleErr">
              <div class="gems-field-error" id="txtMdwTitleErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtMdwIdNo" id="lblMdwIdNo">Document ID No. <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMdwIdNo" class="form-control" aria-required="true" aria-describedby="txtMdwIdNoErr">
              <div class="gems-field-error" id="txtMdwIdNoErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtMdwVersion" id="lblMdwVersion">Document Version <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMdwVersion" class="form-control" aria-required="true" aria-describedby="txtMdwVersionErr">
              <div class="gems-field-error" id="txtMdwVersionErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtMdwPublishedBy" id="lblMdwPublishedBy">Published By <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMdwPublishedBy" class="form-control" aria-required="true" aria-describedby="txtMdwPublishedByErr">
              <div class="gems-field-error" id="txtMdwPublishedByErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtMdwPublishedDate" id="lblMdwPublishedDate">Published Date <span class="required" aria-hidden="true">*</span></label>
              <input type="date" id="txtMdwPublishedDate" class="form-control" aria-required="true" aria-describedby="txtMdwPublishedDateErr">
              <div class="gems-field-error" id="txtMdwPublishedDateErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtMdwBlock" id="lblMdwBlock">Building Block</label>
              <input type="text" id="txtMdwBlock" class="form-control" aria-describedby="txtMdwBlockErr">
              <div class="gems-field-error" id="txtMdwBlockErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtMdwLevel" id="lblMdwLevel">Building Level</label>
              <input type="text" id="txtMdwLevel" class="form-control" aria-describedby="txtMdwLevelErr">
              <div class="gems-field-error" id="txtMdwLevelErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6" id="optMdwGroup_1">
              <label class="form-label" for="optMdwGroup" id="lblMdwGroup">Group <span class="required" aria-hidden="true">*</span></label>
              <select id="optMdwGroup" class="form-select" data-stop-refresh="true" aria-required="true" aria-describedby="optMdwGroupErr">
                <option selected value="" disabled>Please Select *</option>
                <option value="1">Civil</option>
                <option value="2">Electrical</option>
                <option value="3">Mechanical</option>
                <option value="4">Other</option>
              </select>
              <div class="gems-field-error" id="optMdwGroupErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6" id="optMdwPermission_">
              <label class="form-label" for="optMdwPermission" id="lblMdwPermission">Permission Level <span class="required" aria-hidden="true">*</span></label>
              <select id="optMdwPermission" class="form-select" data-stop-refresh="true" aria-required="true" aria-describedby="optMdwPermissionErr">
                <option selected value="" disabled>Please Select</option>
                <option value="1">Low</option>
                <option value="2">High</option>
              </select>
              <div class="gems-field-error" id="optMdwPermissionErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txfMdwFile" id="lblMdwFile">Drawing DWG File</label>
              <input type="file" id="txfMdwFile" class="form-control" accept=".dwg">
              <input type="hidden" id="txfMdwFileBlob">
              <input type="text" id="txtMdwFile" class="form-control mt-2" readonly aria-label="Selected DWG filename">
              <div class="form-hint">Autocad .dwg, maximum 30MB.</div>
              <div class="gems-field-error" id="txfMdwFileErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txfMdwPdfFile" id="lblMdwPdfFile">Drawing PDF File</label>
              <input type="file" id="txfMdwPdfFile" class="form-control" accept="application/pdf,.pdf">
              <input type="hidden" id="txfMdwPdfFileBlob">
              <input type="text" id="txtMdwPdfFile" class="form-control mt-2" readonly aria-label="Selected PDF filename">
              <div class="form-hint">Required to view the drawing as an embedded PDF.</div>
              <div class="gems-field-error" id="txfMdwPdfFileErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txaMdwRemark" id="lblMdwRemark">Remarks</label>
              <textarea id="txaMdwRemark" class="form-control" rows="3" aria-describedby="txaMdwRemarkErr"></textarea>
              <div class="gems-field-error" id="txaMdwRemarkErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary btnMdwClose" data-bs-dismiss="modal" data-dismiss="modal"><i class="fas fa-undo-alt me-1"></i>Close</button>
        <button type="button" id="btnMdwSubmit" class="btn btn-primary"><i class="far fa-paper-plane me-1"></i>Submit</button>
        <button type="button" id="btnMdwSave" class="btn btn-primary"><i class="far fa-save me-1"></i>Save</button>
      </div>
    </div>
  </div>
</div>
