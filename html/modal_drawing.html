<div class="modal fade" id="modal_drawing" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-notify modal-info modal-lg mt-3 pt-5 mb-5" role="document">
        <!--Content-->
        <div class="modal-content">
            <!--Header-->
            <div class="modal-header d-flex justify-content-center">
                <h4 class="text-white mt-2 ml-2" id="lblMdwModalTitle"><i class="fas fa-upload text-white"></i> Upload Drawing File</h4>
                <button type="button" class="close waves-effect waves-light mr-0 text-white pt-4" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--Body-->
            <div class="modal-body mb-0">
                <form id="formMdw" class="mt-2" autocomplete="off">
					<div class="row">
						<div class="col-md-12">
							<div class="card ripe-malinka-gradient py-1 z-depth-3 mb-5">
								<div class="card-body text-white text-center p-3">
									<h5 class="mb-1 font-weight-bold">
										<i class="fas fa-exclamation-triangle mr-2 text-white"></i> Attention
									</h5>
									<hr class="white my-2">
									<p class="mb-0">
										<strong>Please make sure the drawing in .dwg Autocad format. The file size should not exceed 10Mb. PDF Drawing File is required if this drawing to be viewed in the web as embedded.</strong>
									</p>
								</div>
							</div>
						</div>
						<div class="col-md-12">
							<div class="md-form md-outline mt-0">
								<input type="text" id="txtMdwTitle" class="form-control">
								<label for="txtMdwTitle" id="lblMdwTitle">Document Title *</label>
								<p class="font-small text-danger" id="txtMdwTitleErr"></p>
							</div>
						</div>
						<div class="col-md-7">
							<div class="md-form md-outline mt-0">
								<input type="text" id="txtMdwIdNo" class="form-control">
								<label for="txtMdwIdNo" id="lblMdwIdNo">Document ID No. *</label>
								<p class="font-small text-danger" id="txtMdwIdNoErr"></p>
							</div>
						</div>
						<div class="col-md-5">
							<div class="md-form md-outline mt-0">
								<input type="text" id="txtMdwVersion" class="form-control">
								<label for="txtMdwVersion" id="lblMdwVersion">Document Version *</label>
								<p class="font-small text-danger" id="txtMdwVersionErr"></p>
							</div>
						</div>
						<div class="col-md-7">
							<div class="md-form md-outline mt-0">
								<input type="text" id="txtMdwPublishedBy" class="form-control">
								<label for="txtMdwPublishedBy" id="lblMdwPublishedBy">Published By *</label>
								<p class="font-small text-danger" id="txtMdwPublishedByErr"></p>
							</div>
						</div>
						<div class="col-md-5">
							<div class="md-form md-outline mt-0">
								<input type="text" id="txtMdwPublishedDate" class="form-control datepicker">
								<label for="txtMdwPublishedDate" id="lblMdwPublishedDate">Published Date *</label>
								<p class="font-small text-danger" id="txtMdwPublishedDateErr"></p>
							</div>
						</div>
						<div class="col-md-7">
							<div class="md-form md-outline mt-0">
								<input type="text" id="txtMdwBlock" class="form-control">
								<label for="txtMdwBlock" id="lblMdwBlock">Building Block</label>
								<p class="font-small text-danger" id="txtMdwBlockErr"></p>
							</div>
						</div>
						<div class="col-md-5">
							<div class="md-form md-outline mt-0">
								<input type="text" id="txtMdwLevel" class="form-control">
								<label for="txtMdwLevel" id="lblMdwLevel">Building Level</label>
								<p class="font-small text-danger" id="txtMdwLevelErr"></p>
							</div>
						</div>
						<div class="col-md-7 select-outline mt-2 mb-2" id="optMdwGroup_1">
							<select id="optMdwGroup" class="mdb-select md-form md-outline colorful-select dropdown-danger my-0" data-stop-refresh="true" data-visible-options="-1">
								<option selected value="" disabled>Please Select *</option>
								<option value="1">Civil</option>
								<option value="2">Mechanical</option>
								<option value="3">Electrical</option>
								<option value="4">Other</option>
							</select>
							<label for="optMdwGroup" id="lblMdwGroup">Group</label>
							<p class="font-small text-danger" id="optMdwGroupErr"></p>
						</div>
						<div class="col-md-5 select-outline mt-2 mb-2" id="optMdwPermission_">
							<select id="optMdwPermission" class="mdb-select md-form md-outline colorful-select dropdown-danger my-0" data-stop-refresh="true" data-visible-options="-1">
								<option selected value="" disabled>Please Select</option>
								<option value="1">Low</option>
								<option value="2">High</option>
							</select>
							<label for="optMdwPermission" id="lblMdwPermission">Permission Level *</label>
							<p class="font-small text-danger" id="optMdwPermissionErr"></p>
						</div>
						<div class="col-md-12">
							<div class="md-form md-outline mt-0">
								<div class="file-field">
									<div class="btn btn-danger btn-sm float-right mr-0 mt-0">
										<span><i class="fas fa-file-upload mr-2" aria-hidden="true"></i>Choose DWG file</span>
										<input type="file" id="txfMdwFile">
										<input type="hidden" id="txfMdwFileBlob">
									</div>
									<div class="file-path-wrapper pl-0 pr-1">
										<input class="file-path form-control" type="text" id="txtMdwFile" readonly>
										<label for="txtMdwFile" id="lblMdwFile">Drawing DWG File *</label>
									</div>
									<p class="font-small text-danger" id="txfMdwFileErr"></p>
								</div>
							</div>
						</div>
						<div class="col-md-12">
							<div class="md-form md-outline mt-0">
								<div class="file-field">
									<div class="btn btn-danger btn-sm float-right mr-0 mt-0">
										<span><i class="fas fa-file-pdf mr-2" aria-hidden="true"></i>Choose PDF file</span>
										<input type="file" id="txfMdwPdfFile">
										<input type="hidden" id="txfMdwPdfFileBlob">
									</div>
									<div class="file-path-wrapper pl-0 pr-1">
										<input class="file-path form-control" type="text" id="txtMdwPdfFile" readonly>
										<label for="txtMdwPdfFile" id="lblMdwPdfFile">Drawing PDF File</label>
									</div>
									<p class="font-small text-danger" id="txfMdwPdfFileErr"></p>
								</div>
							</div>
						</div>
						<div class="col-md-12">
							<div class="md-form md-outline mt-0">
								<textarea id="txaMdwRemark" class="md-textarea form-control" rows="3"></textarea>
								<label for="txaMdwRemark" id="lblMdwRemark" class="text-muted">Remarks</label>
								<p class="font-small text-danger" id="txaMdwRemarkErr"></p>
							</div>							
						</div>
                    </div>
                </form>
            </div>
            <div class="modal-footer p-2">
                <button class="btn btn-outline-info waves-effect btnMdwClose" data-dismiss="modal"><i class="fas fa-undo-alt ml-1"></i> Close</button>
                <button id="btnMdwSubmit" class="btn btn-info waves-effect"><i class="far fa-paper-plane ml-1"></i> Submit</button>
                <button id="btnMdwSave" class="btn btn-info waves-effect"><i class="far fa-save ml-1"></i> Save</button>
            </div>
        </div>
    </div>
</div>
