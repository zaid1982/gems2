<!--
  section_item — Tabler in-place (P5-23). item_management.html only.
  Field IDs, prefix hooks, picture table, and action buttons stay.
-->
<section class="section mb-4 sectionItem" style="display:none">
  <div class="page-header">
    <div class="row align-items-center g-2">
      <div class="col-12 col-sm">
        <div class="text-secondary" style="font-size:.75rem">Item Management</div>
        <h1 class="page-title">Item Description</h1>
      </div>
      <div class="col-12 col-sm-auto">
        <button type="button" class="btn btn-outline-secondary" id="btnSiyBack" data-toggle="tooltip" data-bs-toggle="tooltip" title="Back to Main Page">
          <i class="fas fa-arrow-left me-1"></i>Back
        </button>
        <button type="button" class="btn btn-outline-success" id="btnSiyEnable" data-toggle="tooltip" data-bs-toggle="tooltip" title="Enable Item Description">
          <i class="fas fa-check me-1"></i>Enable
        </button>
        <button type="button" class="btn btn-outline-warning" id="btnSiyDisable" data-toggle="tooltip" data-bs-toggle="tooltip" title="Disable Item Description">
          <i class="fas fa-ban me-1"></i>Disable
        </button>
        <button type="button" class="btn btn-outline-danger" id="btnSiyDelete" data-toggle="tooltip" data-bs-toggle="tooltip" title="Delete Item Description">
          <i class="fas fa-trash-alt me-1"></i>Delete
        </button>
        <button type="button" class="btn btn-primary" id="btnSiySave" data-toggle="tooltip" data-bs-toggle="tooltip" title="Save Item Description">
          <i class="fas fa-save me-1"></i>Save
        </button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-7 mb-3">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title mb-0">Item Description</h3>
        </div>
        <div class="card-body">
          <form id="formSiy" autocomplete="off" novalidate>
            <div class="gems-form-grid">
              <div class="gems-field gems-field-12">
                <span id="optSiyAssetGroupPre" class="d-none"></span>
                <label class="form-label" for="optSiyAssetGroup" id="lblSiyAssetGroup">Asset Group <span class="required" aria-hidden="true">*</span></label>
                <select id="optSiyAssetGroup" class="form-select" data-stop-refresh="true" aria-describedby="optSiyAssetGroupErr"></select>
                <div class="gems-field-error" id="optSiyAssetGroupErr" role="alert"></div>
              </div>
              <div class="gems-field gems-field-12">
                <span id="optSiyItemTypePre" class="d-none"></span>
                <label class="form-label" for="optSiyItemType" id="lblSiyItemType">Item Type <span class="required" aria-hidden="true">*</span></label>
                <select id="optSiyItemType" class="form-select" data-stop-refresh="true" aria-describedby="optSiyItemTypeErr"></select>
                <div class="gems-field-error" id="optSiyItemTypeErr" role="alert"></div>
              </div>
              <div class="gems-field gems-field-12">
                <span id="txtSiyDescriptionPre" class="d-none"></span>
                <label class="form-label" for="txtSiyDescription" id="lblSiyDescription">Item Description <span class="required" aria-hidden="true">*</span></label>
                <input type="text" id="txtSiyDescription" class="form-control" aria-describedby="txtSiyDescriptionErr">
                <div class="gems-field-error" id="txtSiyDescriptionErr" role="alert"></div>
              </div>
              <div class="gems-field gems-field-6">
                <span id="txtSiyThresholdPre" class="d-none"></span>
                <label class="form-label" for="txtSiyThreshold" id="lblSiyThreshold">Default Threshold <span class="required" aria-hidden="true">*</span></label>
                <input type="text" id="txtSiyThreshold" class="form-control" aria-describedby="txtSiyThresholdErr">
                <div class="gems-field-error" id="txtSiyThresholdErr" role="alert"></div>
              </div>
              <div class="gems-field gems-field-6">
                <span id="txtSiyMinOrderPre" class="d-none"></span>
                <label class="form-label" for="txtSiyMinOrder" id="lblSiyMinOrder">Minimum Order <span class="required" aria-hidden="true">*</span></label>
                <input type="text" id="txtSiyMinOrder" class="form-control" aria-describedby="txtSiyMinOrderErr">
                <div class="gems-field-error" id="txtSiyMinOrderErr" role="alert"></div>
              </div>
              <div class="gems-field gems-field-6">
                <span id="txtSiyMaxOrderPre" class="d-none"></span>
                <label class="form-label" for="txtSiyMaxOrder" id="lblSiyMaxOrder">Maximum Order <span class="required" aria-hidden="true">*</span></label>
                <input type="text" id="txtSiyMaxOrder" class="form-control" aria-describedby="txtSiyMaxOrderErr">
                <div class="gems-field-error" id="txtSiyMaxOrderErr" role="alert"></div>
              </div>
              <div class="gems-field gems-field-6">
                <span id="txtSiyTurnPre" class="d-none"></span>
                <label class="form-label" for="txtSiyTurn" id="lblSiyTurn">Option Turn <span class="required" aria-hidden="true">*</span></label>
                <input type="text" id="txtSiyTurn" class="form-control" aria-describedby="txtSiyTurnErr">
                <div class="gems-field-error" id="txtSiyTurnErr" role="alert"></div>
              </div>
              <div class="gems-field gems-field-12">
                <span id="txaSiyRemarkPre" class="d-none"></span>
                <label class="form-label" for="txaSiyRemark" id="lblSiyRemark">Remark</label>
                <textarea id="txaSiyRemark" class="form-control" rows="2" aria-describedby="txaSiyRemarkErr"></textarea>
                <div class="gems-field-error" id="txaSiyRemarkErr" role="alert"></div>
              </div>
              <div class="gems-field gems-field-12">
                <label class="form-label" for="txtSiyStatus" id="lblSiyStatus">Status</label>
                <input type="text" id="txtSiyStatus" class="form-control" readonly>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="col-lg-5 mb-3">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title mb-0">Item Images</h3>
          <div class="gems-card-toolbar">
            <a href="javascript:void(0);" id="btnSiyUpload" data-toggle="tooltip" data-bs-toggle="tooltip" title="Upload Item Images" aria-label="Upload item images">
              <i class="fas fa-upload"></i>
            </a>
          </div>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table id="dtSiyPicture" class="table table-hover table-sm mb-0 display responsive mobile-stack">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Title</th>
                  <th>Picture</th>
                  <th>&nbsp;</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
