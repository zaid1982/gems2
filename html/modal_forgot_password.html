<!-- Modal: modalForgotPassword -->
<div class="modal fade gems-modal" id="modalForgotPassword" tabindex="-1" role="dialog" aria-labelledby="lblMfpTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content gems-modal-card">
            <div class="gems-modal-header">
                <div class="gems-modal-title">
                    <span class="gems-modal-icon"><i class="fas fa-unlock-alt"></i></span>
                    <div class="gems-modal-heading" id="lblMfpTitle">Forgot Password</div>
                </div>
                <button type="button" class="gems-modal-close" data-dismiss="modal" aria-label="Close">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div class="gems-modal-body">
                <form id="formMfpForgotPassword">
                    <div class="gems-modal-section">
                        <div class="gems-section-grid">
                            <div class="gems-field">
                                <label class="gems-field-label" for="txtMfpEmail">Email <span class="text-danger">*</span></label>
                                <input type="email" id="txtMfpEmail" name="txtMfpEmail" class="form-control gems-field-input" autocomplete="email">
                                <p class="gems-field-error" id="txtMfpEmailErr"></p>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="gems-modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-dismiss="modal"><i class="fas fa-times mr-2"></i>Cancel</button>
                <button type="button" id="btnMfpSend" class="btn btn-primary" disabled><i class="far fa-paper-plane mr-2"></i>Submit</button>
            </div>
        </div>
    </div>
</div>
