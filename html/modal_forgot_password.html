<!--
  Modal: modalForgotPassword — Tabler/GEMS modal contract (P2).

  Loaded by pages/login.html ONLY, so it converts with that page.

  It does NOT carry .gems-modal: that class is the scope key for the temporary
  legacy bridge in gems-theme.css section 12, and contract markup must never be
  reached by it.

  JS contract preserved exactly (js/pages/modal_forgot_password.js):
    #modalForgotPassword  #formMfpForgotPassword  #txtMfpEmail
    #txtMfpEmailErr (MzValidate writes here)      #btnMfpSend (starts disabled)
-->
<div class="modal fade" id="modalForgotPassword" tabindex="-1" aria-labelledby="lblMfpTitle" aria-hidden="true">
    <div class="modal-dialog gems-modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="lblMfpTitle">Forgot password</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formMfpForgotPassword" autocomplete="off" novalidate>
                    <div class="gems-form-grid">
                        <div class="gems-field gems-field-12">
                            <label class="form-label" for="txtMfpEmail">Email <span class="required" aria-hidden="true">*</span></label>
                            <input type="email" id="txtMfpEmail" name="txtMfpEmail" class="form-control"
                                   autocomplete="email" aria-required="true" aria-describedby="txtMfpEmailErr">
                            <div class="gems-field-error" id="txtMfpEmailErr" role="alert"></div>
                            <div class="gems-field-help">We will email a reset link to this address.</div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="btnMfpSend" class="btn btn-primary" disabled>
                    <i class="far fa-paper-plane me-2"></i>Submit
                </button>
            </div>
        </div>
    </div>
</div>
