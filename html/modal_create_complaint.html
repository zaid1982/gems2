<!--
  Modal: modal_create_complaint — Tabler/GEMS modal + form contract (P5-2).

  Loaded by pages/helpdesk.html ONLY.
    gems-modal-lg + modal-dialog-scrollable, never modal-dialog-centered.
    Visible labels, gems-form-grid, H3 MzValidate error slots.
    Footer: outline Close first, primary Submit last.

  JS contract preserved (js/pages/modal_create_complaint.js):
    #modal_create_complaint  #formMcc
    #txtMccClient  #txtMccRole  #txtMccSiteName
    #optMccCreatedBy  #txtMccLocation  #txaMccComplaint
    #optMccType  #optMccSeverity
    #imgMccImage1/2/3  #txfMccImage1/2/3  #txfMccImage1/2/3Blob
    #lblMccFile1/2/3  #divMccImgDesc1/2/3  #txaMccImgDesc1/2/3
    #optMccPpmGroupId  #divMccExecutor  #optMccAssignedTo
    #divMccAssist  #optMccAssist
    #txtMccUserName  #txtMccUserContactNo  #txtMccUserEmail
    #dtMccCurrentTask  #btnMccSubmit
    .divMccView  .divMccHideInitial  .divMccExecutorDetails
-->
<div class="modal fade" id="modal_create_complaint" tabindex="-1" aria-labelledby="mccTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="mccTitle"><i class="fas fa-headset me-2"></i>Create New Complaint</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMcc" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-6 divMccView">
              <label class="form-label" for="txtMccClient" id="lblMccClient">Request No</label>
              <input type="text" id="txtMccClient" class="form-control" disabled>
            </div>
            <div class="gems-field gems-field-6 divMccView">
              <label class="form-label" for="txtMccRole" id="lblMccRole">Work Order No</label>
              <input type="text" id="txtMccRole" class="form-control" disabled>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMccSiteName" id="lblMccSiteName">Site</label>
              <input type="text" id="txtMccSiteName" class="form-control" disabled>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="optMccCreatedBy" id="lblMccCreatedBy">Complainer <span class="required" aria-hidden="true">*</span></label>
              <select id="optMccCreatedBy" class="form-select" aria-required="true" aria-describedby="optMccCreatedByErr"></select>
              <div class="gems-field-error" id="optMccCreatedByErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMccLocation" id="lblMccLocation">Location <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMccLocation" class="form-control" aria-required="true" aria-describedby="txtMccLocationErr">
              <div class="gems-field-error" id="txtMccLocationErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txaMccComplaint" id="lblMccComplaint">Complaint Details <span class="required" aria-hidden="true">*</span></label>
              <textarea id="txaMccComplaint" class="form-control" rows="3" aria-required="true" aria-describedby="txaMccComplaintErr"></textarea>
              <div class="gems-field-error" id="txaMccComplaintErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optMccType" id="lblMccType">Category <span class="required" aria-hidden="true">*</span></label>
              <select id="optMccType" class="form-select" aria-required="true" aria-describedby="optMccTypeErr">
                <option value="">Select Category</option>
                <option value="1">Client Complaint</option>
                <option value="3">Request</option>
                <option value="4">Breakdown</option>
                <option value="5">Defect</option>
                <option value="6">Public Complaint</option>
              </select>
              <div class="gems-field-error" id="optMccTypeErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optMccSeverity" id="lblMccSeverity">Severity <span class="required" aria-hidden="true">*</span></label>
              <select id="optMccSeverity" class="form-select" aria-required="true" aria-describedby="optMccSeverityErr"></select>
              <div class="gems-field-error" id="optMccSeverityErr" role="alert"></div>
            </div>
          </div>

          <h3 class="mt-3 mb-2" style="font-size:1rem">Complaint Images</h3>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-4">
              <img src="img/background/upload_placeholder.png" id="imgMccImage1" class="img-fluid rounded mb-2" alt="Complaint reference image 1">
              <label class="form-label" for="txfMccImage1">Image 1 <span class="required" aria-hidden="true">*</span></label>
              <input type="file" id="txfMccImage1" class="form-control" accept="image/*" aria-describedby="txfMccImage1Err">
              <input type="hidden" id="txfMccImage1Blob">
              <div class="text-secondary" style="font-size:.75rem" id="lblMccFile1">No file chosen</div>
              <div class="gems-field-error" id="txfMccImage1Err" role="alert"></div>
              <div id="divMccImgDesc1">
                <label class="form-label" for="txaMccImgDesc1" id="lblMccImgDesc1">Image Description <span class="required" aria-hidden="true">*</span></label>
                <textarea id="txaMccImgDesc1" class="form-control" rows="3" aria-describedby="txaMccImgDesc1Err"></textarea>
                <div class="gems-field-error" id="txaMccImgDesc1Err" role="alert"></div>
              </div>
            </div>
            <div class="gems-field gems-field-4">
              <img src="img/background/upload_placeholder.png" id="imgMccImage2" class="img-fluid rounded mb-2" alt="Complaint reference image 2">
              <label class="form-label" for="txfMccImage2">Image 2</label>
              <input type="file" id="txfMccImage2" class="form-control" accept="image/*" aria-describedby="txfMccImage2Err">
              <input type="hidden" id="txfMccImage2Blob">
              <div class="text-secondary" style="font-size:.75rem" id="lblMccFile2">No file chosen</div>
              <div class="gems-field-error" id="txfMccImage2Err" role="alert"></div>
              <div id="divMccImgDesc2">
                <label class="form-label" for="txaMccImgDesc2" id="lblMccImgDesc2">Image Description</label>
                <textarea id="txaMccImgDesc2" class="form-control" rows="3" aria-describedby="txaMccImgDesc2Err"></textarea>
                <div class="gems-field-error" id="txaMccImgDesc2Err" role="alert"></div>
              </div>
            </div>
            <div class="gems-field gems-field-4">
              <img src="img/background/upload_placeholder.png" id="imgMccImage3" class="img-fluid rounded mb-2" alt="Complaint reference image 3">
              <label class="form-label" for="txfMccImage3">Image 3</label>
              <input type="file" id="txfMccImage3" class="form-control" accept="image/*" aria-describedby="txfMccImage3Err">
              <input type="hidden" id="txfMccImage3Blob">
              <div class="text-secondary" style="font-size:.75rem" id="lblMccFile3">No file chosen</div>
              <div class="gems-field-error" id="txfMccImage3Err" role="alert"></div>
              <div id="divMccImgDesc3">
                <label class="form-label" for="txaMccImgDesc3" id="lblMccImgDesc3">Image Description</label>
                <textarea id="txaMccImgDesc3" class="form-control" rows="3" aria-describedby="txaMccImgDesc3Err"></textarea>
                <div class="gems-field-error" id="txaMccImgDesc3Err" role="alert"></div>
              </div>
            </div>
          </div>

          <h3 class="mt-3 mb-2" style="font-size:1rem">Assign Executor</h3>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="optMccPpmGroupId" id="lblMccPpmGroupId">Executor Group <span class="required" aria-hidden="true">*</span></label>
              <select id="optMccPpmGroupId" class="form-select" aria-required="true" aria-describedby="optMccPpmGroupIdErr"></select>
              <div class="gems-field-error" id="optMccPpmGroupIdErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12 divMccHideInitial" id="divMccExecutor">
              <label class="form-label" for="optMccAssignedTo" id="lblMccAssignedTo">Executor <span class="required" aria-hidden="true">*</span></label>
              <select id="optMccAssignedTo" class="form-select" data-stop-refresh="true" aria-describedby="optMccAssignedToErr"></select>
              <div class="gems-field-error" id="optMccAssignedToErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12 divMccHideInitial" id="divMccAssist">
              <label class="form-label" for="optMccAssist" id="lblMccAssist">Technician Assistant</label>
              <select id="optMccAssist" class="form-select" multiple data-stop-refresh="true" aria-describedby="optMccAssistErr"></select>
              <div class="gems-field-error" id="optMccAssistErr" role="alert"></div>
            </div>
          </div>

          <div class="divMccHideInitial divMccExecutorDetails">
            <h3 class="mt-3 mb-2" style="font-size:1rem">Executor Details</h3>
            <div class="gems-form-grid">
              <div class="gems-field gems-field-12">
                <label class="form-label" for="txtMccUserName" id="lblMccUserName">Name</label>
                <input type="text" id="txtMccUserName" class="form-control" disabled>
              </div>
              <div class="gems-field gems-field-6">
                <label class="form-label" for="txtMccUserContactNo" id="lblMccUserContactNo">Phone No.</label>
                <input type="text" id="txtMccUserContactNo" class="form-control" disabled>
              </div>
              <div class="gems-field gems-field-6">
                <label class="form-label" for="txtMccUserEmail" id="lblMccUserEmail">Email</label>
                <input type="text" id="txtMccUserEmail" class="form-control" disabled>
              </div>
            </div>
            <table id="dtMccCurrentTask" class="table table-vcenter card-table table-sm mb-0">
              <thead>
                <tr>
                  <th style="width:4%">#</th>
                  <th>Current Task in Hands</th>
                  <th>Date Received</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><i class="fas fa-undo-alt me-1"></i> Close</button>
        <button type="button" id="btnMccSubmit" class="btn btn-primary"><i class="far fa-paper-plane me-1"></i> Submit</button>
      </div>
    </div>
  </div>
</div>
