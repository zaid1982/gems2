<div class="modal fade" id="modal_ppm_set" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable" role="document">
        <div class="modal-content ppm-set-modal">
            <div class="modal-header ppm-set-modal__header">
                <div class="ppm-set-modal__title d-flex align-items-start">
                    <span class="ppm-set-modal__icon"><i class="fas fa-layer-group"></i></span>
                    <div>
                        <h4 class="modal-title mb-1" id="h4MpsTitle">Add PPM Set</h4>
                        <p class="ppm-set-modal__subtitle mb-0">Define the core attributes for this set before assigning assets.</p>
                    </div>
                </div>
                <button type="button" class="close ppm-set-modal__close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body ppm-set-modal__body">
                <form id="formMps" name="formMps">
                    <div class="md-form mb-4">
                        <i class="far fa-users prefix"></i>
                        <input type="text" id="txtMpsName" class="form-control validate" maxlength="200" autocomplete="off" required>
                        <label data-error="Incorrect" data-success="Correct" for="txtMpsName">PPM Set Name</label>
                    </div>
                    <div class="md-form mb-4">
                        <i class="fas fa-file-alt prefix"></i>
                        <textarea id="txaMpsDesc" class="md-textarea form-control" rows="3" maxlength="1000"></textarea>
                        <label data-error="Incorrect" data-success="Correct" for="txaMpsDesc">Description</label>
                    </div>
                    <div class="select-outline mb-4 ppm-set-modal__select">
                        <i class="fas fa-layer-group select-prefix"></i>
                        <select class="mdb-select md-form colorful-select dropdown-primary" searchable="Search here.." id="optMpsAssetGroup" required>
                            <option value="" disabled selected>Select Asset Group</option>
                        </select>
                        <label class="">Asset Group</label>
                    </div>
                    <div class="select-outline mb-4 ppm-set-modal__select">
                        <i class="fas fa-list-alt select-prefix"></i>
                        <select class="mdb-select md-form colorful-select dropdown-primary" searchable="Search here.." id="optMpsAssetCategory" required>
                            <option value="" disabled selected>Select Asset Category</option>
                        </select>
                        <label class="">Asset Category</label>
                    </div>
                    <div class="select-outline mb-4 ppm-set-modal__select">
                        <i class="fas fa-cogs select-prefix"></i>
                        <select class="mdb-select md-form colorful-select dropdown-primary" searchable="Search here.." id="optMpsAssetType" required>
                            <option value="" disabled selected>Select Asset Type</option>
                        </select>
                        <label class="">Asset Type</label>
                    </div>
                    <div class="select-outline mb-4 ppm-set-modal__select">
                        <i class="fas fa-users-medical select-prefix"></i>
                        <select class="mdb-select md-form colorful-select dropdown-primary" searchable="Search here.." id="optMpsPpmGroupId" required>
                            <option value="" disabled selected>Select PPM Executor Group</option>
                        </select>
                        <label class="">PPM Executor Group</label>
                    </div>
                    <input type="hidden" id="lblMpsId">
                </form>
            </div>
            <div class="modal-footer ppm-set-modal__footer">
                <button class="btn btn-outline-secondary" data-dismiss="modal">Close</button>
                <button class="btn btn-primary" id="btnMpsSubmit">Save</button>
            </div>
        </div>
    </div>
</div>
