<!--
  Modal: modal_license — Tabler/GEMS modal + form contract (P2 reference).

  Loaded by pages/license.html ONLY, so it converts with that page. Later waves
  copy THIS file for create/edit dialogs.

  It does NOT carry .gems-modal: that class is the scope key for the temporary
  legacy bridge in gems-theme.css section 12, and contract markup must never be
  reached by it.

  Contract points:
    gems-modal-md (640px) + modal-dialog-scrollable, never modal-dialog-centered:
      on a 768px-tall laptop the header and footer stay put and only the body
      scrolls. No mt-3 pt-3 mb-5, no 960px width, no calc(100dvh - 235px).
    Flat white header, btn-close flex-centred with the title by .modal-header.
    Visible labels above every control (form-label), no .md-form / floating labels.
    6 + 6 pairs for the dates, 12 for title / warning date / file.
    Footer: outline Cancel first, primary action last. No btn-info / btn-outline-info.

  JS contract preserved exactly (js/pages/modal_license.js, js/pages/main_license.js):
    #modal_license  #formMlc  #txtMlcTitle  #txtMlcStartDate  #txtMlcEndDate
    #txtMlcWarningDate  #txfMlcFile  #txfMlcFileBlob/Width/Height
    #lnkMlcCurrentFile  #btnMlcDelete  #btnMlcSave  #btnMlcSubmit
    #lblMlcTitle (title text is written by JS)  every #<fieldId>Err element
    #lblMlcTitle2 / #lblMlcStartDate / #lblMlcEndDate / #lblMlcWarningDate ids stay
      on the labels: modal_license.js still toggles .active on them (a no-op here,
      since these are static labels, but the selectors must keep resolving).
    Dates are native <input type="date">; modal_license.js already branches on
    whether pickadate exists and takes its native path when it does not.
-->
<div class="modal fade" id="modal_license" tabindex="-1" aria-labelledby="lblMlcTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMlcTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMlc" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMlcTitle" id="lblMlcTitle2">License Title <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMlcTitle" class="form-control" aria-required="true" aria-describedby="txtMlcTitleErr">
              <div class="gems-field-error" id="txtMlcTitleErr" role="alert"></div>
            </div>

            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtMlcStartDate" id="lblMlcStartDate">Start Date <span class="required" aria-hidden="true">*</span></label>
              <input type="date" id="txtMlcStartDate" class="form-control" aria-required="true" aria-describedby="txtMlcStartDateErr">
              <div class="gems-field-error" id="txtMlcStartDateErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtMlcEndDate" id="lblMlcEndDate">End Date <span class="required" aria-hidden="true">*</span></label>
              <input type="date" id="txtMlcEndDate" class="form-control" aria-required="true" aria-describedby="txtMlcEndDateErr">
              <div class="gems-field-error" id="txtMlcEndDateErr" role="alert"></div>
            </div>

            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMlcWarningDate" id="lblMlcWarningDate">Warning start date</label>
              <input type="date" id="txtMlcWarningDate" class="form-control" aria-describedby="txtMlcWarningDateHelp txtMlcWarningDateErr">
              <div class="gems-field-help" id="txtMlcWarningDateHelp">
                From this date onward the license shows as &ldquo;Expiring&rdquo;. Leave blank to use the
                default (30 days before the end date). Enabled once both dates above are set.
              </div>
              <div class="gems-field-error" id="txtMlcWarningDateErr" role="alert"></div>
            </div>

            <div class="gems-field gems-field-12">
              <label class="form-label" for="txfMlcFile">License File (PDF / image)</label>
              <input type="file" id="txfMlcFile" class="form-control" accept="application/pdf,image/*" aria-describedby="txfMlcFileCurrent txfMlcFileErr">
              <input type="hidden" id="txfMlcFileBlob">
              <input type="hidden" id="txfMlcFileWidth">
              <input type="hidden" id="txfMlcFileHeight">
              <div class="gems-field-help" id="txfMlcFileCurrent">
                Current: <a href="#" id="lnkMlcCurrentFile" target="_blank" rel="noopener">N/A</a>
              </div>
              <div class="gems-field-error" id="txfMlcFileErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" id="btnMlcDelete" class="btn btn-outline-danger">
          <i class="fas fa-trash-alt me-2"></i>Delete
        </button>
        <button type="button" id="btnMlcSave" class="btn btn-primary">
          <i class="far fa-save me-2"></i>Save
        </button>
        <button type="button" id="btnMlcSubmit" class="btn btn-primary">
          <i class="far fa-paper-plane me-2"></i>Submit
        </button>
      </div>
    </div>
  </div>
</div>
