<!--
  Modal: modal_fca_report — Tabler/GEMS modal + form contract (P5-8 FCA Report).

  Loaded by pages/fca_report.html ONLY.
    gems-modal-md + modal-dialog-scrollable, never modal-dialog-centered.
    Visible labels, gems-form-grid, H3 MzValidate error slots.
    Native date inputs; mzDateFromTo / mzConvertDate already accept YYYY-MM-DD.
    Footer: outline Close first, primary Submit last.

  JS contract preserved (js/pages/modal_fca_report.js):
    #modal_fca_report  #formMfr
    #optMfrSite  #lblMfrSite  #optMfrSiteErr
    #txtMfrName  #lblMfrName  #txtMfrNameErr
    #txtMfrDateFrom  #lblMfrDateFrom  #txtMfrDateFromErr
    #txtMfrDateTo  #lblMfrDateTo  #txtMfrDateToErr
    #optMfrAssetGroup  #lblMfrAssetGroup  #optMfrAssetGroupErr
    #optMfrSort  #lblMfrSort  #optMfrSortErr
    #radMfrExclude  #radMfrExclude1  #radMfrExclude2  #radMfrExcludeErr
    #btnMfrSubmit
-->
<div class="modal fade" id="modal_fca_report" tabindex="-1" aria-labelledby="lblMfrTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMfrTitle"><i class="fas fa-file-pdf me-2"></i>Generate New FCA Report</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMfr" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12" id="optMfrSite_">
              <label class="form-label" for="optMfrSite" id="lblMfrSite">Site <span class="required" aria-hidden="true">*</span></label>
              <select id="optMfrSite" class="form-select" aria-required="true" aria-describedby="optMfrSiteErr"></select>
              <div class="gems-field-error" id="optMfrSiteErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMfrName" id="lblMfrName">Report Name <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMfrName" class="form-control" aria-required="true" aria-describedby="txtMfrNameErr">
              <div class="gems-field-error" id="txtMfrNameErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtMfrDateFrom" id="lblMfrDateFrom">Date From <span class="required" aria-hidden="true">*</span></label>
              <input type="date" id="txtMfrDateFrom" class="form-control" aria-required="true" aria-describedby="txtMfrDateFromErr">
              <div class="gems-field-error" id="txtMfrDateFromErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtMfrDateTo" id="lblMfrDateTo">Date To <span class="required" aria-hidden="true">*</span></label>
              <input type="date" id="txtMfrDateTo" class="form-control" aria-required="true" aria-describedby="txtMfrDateToErr">
              <div class="gems-field-error" id="txtMfrDateToErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12" id="optMfrAssetGroup_">
              <label class="form-label" for="optMfrAssetGroup" id="lblMfrAssetGroup">Asset Group</label>
              <select id="optMfrAssetGroup" class="form-select" aria-describedby="optMfrAssetGroupErr"></select>
              <div class="gems-field-error" id="optMfrAssetGroupErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12" id="optMfrSort_">
              <label class="form-label" for="optMfrSort" id="lblMfrSort">Sort by <span class="required" aria-hidden="true">*</span></label>
              <select id="optMfrSort" class="form-select" aria-required="true" aria-describedby="optMfrSortErr">
                <option value="" disabled selected>Select Sort By *</option>
                <option value="fcaTaskTimeCreated">Audit Date</option>
                <option value="assetGroupName">Asset Group</option>
                <option value="fcaZoneName">Zone</option>
                <option value="fcaTaskConditionScale desc">Condition Scale</option>
              </select>
              <div class="gems-field-error" id="optMfrSortErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <span class="form-label">Keep Out FCA Exclude List</span>
              <div class="mt-1">
                <div class="form-check form-check-inline">
                  <input type="radio" class="form-check-input" name="radMfrExclude" id="radMfrExclude1" value="1" aria-describedby="radMfrExcludeErr">
                  <label class="form-check-label" for="radMfrExclude1">Yes</label>
                </div>
                <div class="form-check form-check-inline">
                  <input type="radio" class="form-check-input" name="radMfrExclude" id="radMfrExclude2" value="0" aria-describedby="radMfrExcludeErr">
                  <label class="form-check-label" for="radMfrExclude2">No</label>
                </div>
              </div>
              <div class="gems-field-error" id="radMfrExcludeErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-undo-alt me-2"></i>Close
        </button>
        <button type="button" id="btnMfrSubmit" class="btn btn-primary">
          <i class="far fa-paper-plane me-2"></i>Submit
        </button>
      </div>
    </div>
  </div>
</div>
