<!--
  Modal: modal_kpa_group — Tabler/GEMS modal + form contract (P3B KPA).
  Loaded by pages/kpa_structure.html. JS IDs preserved from the MDB original.
-->
<div class="modal fade" id="modal_kpa_group" tabindex="-1" aria-labelledby="h4KgpTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="h4KgpTitle">KPI Group</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formKgp" autocomplete="off" novalidate>
          <input type="hidden" id="hidKgpId">
          <div class="gems-form-grid">
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtKgpNo">Group number <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtKgpNo" class="form-control" maxlength="5" placeholder="1" aria-required="true">
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtKgpOrder">Display order</label>
              <input type="number" min="1" id="txtKgpOrder" class="form-control" value="1">
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtKgpName">Group name <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtKgpName" class="form-control" placeholder="FMM Service Delivery related to Core Business" aria-required="true">
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optKgpStatus">Status</label>
              <select id="optKgpStatus" class="form-select">
                <option value="1">Active</option>
                <option value="2">Inactive</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" class="btn btn-primary" id="btnKgpSave">
          <i class="far fa-save me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
