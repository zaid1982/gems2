<div class="modal fade gems-modal" id="modal_kpa_group" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content gems-modal-card">
      <div class="modal-header gems-modal-header">
        <h4 class="text-white mt-2 ml-2" id="h4KgpTitle">KPI Group</h4>
        <button type="button" class="close text-white gems-modal-close" data-dismiss="modal"><span>&times;</span></button>
      </div>
      <div class="modal-body gems-modal-body">
        <input type="hidden" id="hidKgpId">
        <div class="form-group">
          <label class="waste-label" for="txtKgpNo">Group number <span class="waste-req">*</span></label>
          <input type="text" id="txtKgpNo" class="form-control" maxlength="5" placeholder="1">
        </div>
        <div class="form-group">
          <label class="waste-label" for="txtKgpName">Group name <span class="waste-req">*</span></label>
          <input type="text" id="txtKgpName" class="form-control" placeholder="FMM Service Delivery related to Core Business">
        </div>
        <div class="form-group">
          <label class="waste-label" for="txtKgpOrder">Display order</label>
          <input type="number" min="1" id="txtKgpOrder" class="form-control" value="1">
        </div>
        <div class="form-group mb-0">
          <label class="waste-label" for="optKgpStatus">Status</label>
          <select id="optKgpStatus" class="custom-select gems-plain-select browser-default">
            <option value="1">Active</option>
            <option value="2">Inactive</option>
          </select>
        </div>
      </div>
      <div class="modal-footer gems-modal-footer">
        <button class="btn btn-outline-info" data-dismiss="modal">Close</button>
        <button class="btn btn-info" id="btnKgpSave">Save</button>
      </div>
    </div>
  </div>
</div>
