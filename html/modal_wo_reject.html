<!--
  Modal: modal_wo_reject — Tabler/GEMS modal + form contract (P5-3).

  Loaded by pages/wo_assign.html ONLY.
    gems-modal-md + modal-dialog-scrollable, never modal-dialog-centered.
    Visible labels, gems-form-grid, H3 MzValidate error slots.
    Footer: outline Close first, primary Submit last.

  JS contract preserved (js/pages/modal_wo_reject.js):
    #modal_wo_reject  #formMwj  #txaMwjRemark  #txaMwjRemarkErr  #btnMwjSubmit
-->
<div class="modal fade" id="modal_wo_reject" tabindex="-1" aria-labelledby="mwjTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="mwjTitle"><i class="fas fa-ban me-2"></i>Out of Scope</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMwj" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txaMwjRemark" id="lblMwjRemark">Remark / Notes to Complainer <span class="required" aria-hidden="true">*</span></label>
              <textarea id="txaMwjRemark" class="form-control" rows="4" aria-required="true" aria-describedby="txaMwjRemarkErr"></textarea>
              <div class="gems-field-error" id="txaMwjRemarkErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><i class="fas fa-undo-alt me-1"></i> Close</button>
        <button type="button" id="btnMwjSubmit" class="btn btn-danger"><i class="far fa-paper-plane me-1"></i> Submit</button>
      </div>
    </div>
  </div>
</div>
