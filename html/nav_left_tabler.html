<!--
  Inner markup for the Tabler vertical sidebar.

  The HOST element on the page must itself be the Tabler aside, because Tabler
  offsets content with sibling combinators
  (.navbar-vertical.navbar-expand-lg ~ .page-wrapper / ~ .navbar). Loading this
  fragment into a wrapper <div> would leave a fixed sidebar overlapping content.

  Page skeleton (also recorded on html/head_tabler.html):

    <html data-bs-theme="light" data-bs-navbar-position="vertical">
    <div class="page">
      <aside class="includeHtml navbar navbar-vertical navbar-expand-lg" id="h-nav_left_tabler"></aside>
      <div class="page-wrapper">
        <header class="includeHtml navbar navbar-expand-md" id="h-nav_top_tabler"></header>
        …
      </div>
    </div>

  The top bar is inside .page-wrapper, not a sibling of the aside. Tabler 1.5
  hides .navbar-vertical when .page has a non-vertical navbar-expand-* child
  unless data-bs-navbar-position="vertical" is set — and even then it hides a
  non-vertical expand navbar that is a *direct child* of .page.

  navbar-expand-lg (992px), not -xxl: at 1366 and 1280 the 16rem sidebar stays
  visible so the form pane keeps ~1000–1110px. Below 992px Tabler’s own
  toggler + #sidebar-menu collapse is the fold. Do not add navbar-dark,
  navbar-folded, or MDB classes. #ulNavLeft is filled by mzBuildNavMenu().
-->
<div class="container-fluid">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu" aria-controls="sidebar-menu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <h1 class="navbar-brand navbar-brand-autodark">
        <a href="home.html">
            <img src="img/icon/logo.png" alt="GEMS 2.0 logo" class="navbar-brand-image" height="32">
        </a>
    </h1>
    <div class="collapse navbar-collapse" id="sidebar-menu">
        <ul class="navbar-nav pt-lg-3" id="ulNavLeft"></ul>
        <div class="navbar-footer">
            <small class="text-secondary">© 2019 Copyright: GEMS v2.0</small>
        </div>
    </div>
</div>
