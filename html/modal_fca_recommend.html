<!--
  Modal: modal_fca_recommend — Tabler (P5-8 FCA Task/All).
  IDs stay on the historical Mfr* prefix (page-local; not the report modal).
-->
<div class="modal fade" id="modal_fca_recommend" tabindex="-1" aria-labelledby="lblMfrRecommendTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMfrRecommendTitle"><i class="fas fa-marker me-2"></i>Recommend FCA Audit</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMfr" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMfrAssetNo" id="lblMfrAssetNo">Asset No. (if any)</label>
              <input type="text" id="txtMfrAssetNo" class="form-control" aria-describedby="txtMfrAssetNoErr">
              <div class="gems-field-error" id="txtMfrAssetNoErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <span class="form-label">Condition Scale <i>(Skala Pemeriksaan Kondisi)</i></span>
              <div class="mt-1">
                <div class="form-check"><input type="radio" class="form-check-input" name="radMfrCondition" id="radMfrCondition1" value="1" aria-describedby="radMfrConditionErr"><label class="form-check-label" for="radMfrCondition1">Very Good</label></div>
                <div class="form-check"><input type="radio" class="form-check-input" name="radMfrCondition" id="radMfrCondition2" value="2"><label class="form-check-label" for="radMfrCondition2">Good</label></div>
                <div class="form-check"><input type="radio" class="form-check-input" name="radMfrCondition" id="radMfrCondition3" value="3"><label class="form-check-label" for="radMfrCondition3">Average</label></div>
                <div class="form-check"><input type="radio" class="form-check-input" name="radMfrCondition" id="radMfrCondition4" value="4"><label class="form-check-label" for="radMfrCondition4">Critical</label></div>
                <div class="form-check"><input type="radio" class="form-check-input" name="radMfrCondition" id="radMfrCondition5" value="5"><label class="form-check-label" for="radMfrCondition5">Very Critical</label></div>
              </div>
              <div class="gems-field-error" id="radMfrConditionErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <span class="form-label">Evaluation Scale <i>(Skala Penilaian Keutamaan)</i></span>
              <div class="mt-1">
                <div class="form-check"><input type="radio" class="form-check-input" name="radMfrEvaluationType" id="radMfrEvaluationType1" value="1" aria-describedby="radMfrEvaluationTypeErr"><label class="form-check-label" for="radMfrEvaluationType1">Normal</label></div>
                <div class="form-check"><input type="radio" class="form-check-input" name="radMfrEvaluationType" id="radMfrEvaluationType2" value="2"><label class="form-check-label" for="radMfrEvaluationType2">Routine</label></div>
                <div class="form-check"><input type="radio" class="form-check-input" name="radMfrEvaluationType" id="radMfrEvaluationType3" value="3"><label class="form-check-label" for="radMfrEvaluationType3">Repair</label></div>
                <div class="form-check"><input type="radio" class="form-check-input" name="radMfrEvaluationType" id="radMfrEvaluationType4" value="4"><label class="form-check-label" for="radMfrEvaluationType4">Recovery</label></div>
                <div class="form-check"><input type="radio" class="form-check-input" name="radMfrEvaluationType" id="radMfrEvaluationType5" value="5"><label class="form-check-label" for="radMfrEvaluationType5">Replacement</label></div>
              </div>
              <div class="gems-field-error" id="radMfrEvaluationTypeErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txaMfrRecommendation" id="lblMfrRecommendation">Recommendation <span class="required" aria-hidden="true">*</span></label>
              <textarea id="txaMfrRecommendation" class="form-control" rows="5" aria-required="true" aria-describedby="txaMfrRecommendationErr"></textarea>
              <div class="gems-field-error" id="txaMfrRecommendationErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><i class="fas fa-undo-alt me-2"></i>Close</button>
        <button type="button" id="btnMfrSubmit" class="btn btn-primary"><i class="far fa-paper-plane me-2"></i>Submit</button>
      </div>
    </div>
  </div>
</div>
