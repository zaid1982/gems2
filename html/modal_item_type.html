<!--
  modal_item_type — Tabler in-place (P5-22). item_type_management.html only.

  IDs, MzValidate slots, POST/PUT payloads, and Add/Save button split stay.
-->
<div class="modal fade" id="modal_item_type" tabindex="-1" aria-labelledby="lblMitModalTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMitModalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMit" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12" id="optMitAssetGroup_">
              <label class="form-label" for="optMitAssetGroup" id="lblMitAssetGroup">Asset Group <span class="required" aria-hidden="true">*</span></label>
              <select id="optMitAssetGroup" class="form-select" data-stop-refresh="true" aria-required="true" aria-describedby="optMitAssetGroupErr"></select>
              <div class="gems-field-error" id="optMitAssetGroupErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txaMitDesc" id="lblMitDesc">Item Type <span class="required" aria-hidden="true">*</span></label>
              <textarea id="txaMitDesc" class="form-control" rows="2" aria-required="true" aria-describedby="txaMitDescErr"></textarea>
              <div class="gems-field-error" id="txaMitDescErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMitTurn" id="lblMitTurn">Option Turn <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMitTurn" class="form-control" aria-required="true" aria-describedby="txtMitTurnErr">
              <div class="gems-field-error" id="txtMitTurnErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <span class="form-label">Status</span>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkMitStatus" name="chkMitStatus" value="1">
                <label class="form-check-label" for="chkMitStatus">Active</label>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem"><span class="required" aria-hidden="true">*</span> Required</span>
        <button type="button" class="btn btn-outline-secondary btnMitClose" data-bs-dismiss="modal" data-dismiss="modal">
          <i class="fas fa-undo-alt me-1"></i>Close
        </button>
        <button type="button" id="btnMitSubmit" class="btn btn-primary">
          <i class="far fa-paper-plane me-1"></i>Submit
        </button>
        <button type="button" id="btnMitSave" class="btn btn-primary">
          <i class="far fa-save me-1"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
