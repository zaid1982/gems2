<div class="modal fade gems-modal" id="modal_waste_profile" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content gems-modal-card">
      <div class="modal-header gems-modal-header">
        <h4 class="text-white mt-2 ml-2" id="h4WpfTitle">Waste Profile</h4>
        <button type="button" class="close text-white gems-modal-close" data-dismiss="modal"><span>&times;</span></button>
      </div>
      <div class="modal-body gems-modal-body">
        <form id="formWpf">
          <input type="hidden" id="hidWpfId">
          <div class="form-group"><label>Premise</label><select id="optWpfSite" class="custom-select gems-plain-select browser-default"></select></div>
          <div class="form-group"><label>SW Code *</label><select id="optWpfSw" class="custom-select gems-plain-select browser-default"></select></div>
          <div class="form-group"><label>Official Description</label><p id="lblWpfDesc" class="mb-0">-</p></div>
          <div class="form-group"><label>Site Alias</label><input type="text" id="txtWpfAlias" class="form-control"></div>
          <div class="form-group"><label>Status</label>
            <select id="optWpfStatus" class="custom-select gems-plain-select browser-default"><option value="1">Active</option><option value="2">Inactive</option></select>
          </div>
        </form>
      </div>
      <div class="modal-footer gems-modal-footer">
        <button class="btn btn-outline-info" data-dismiss="modal">Close</button>
        <button class="btn btn-info" id="btnWpfSave">Save</button>
      </div>
    </div>
  </div>
</div>
