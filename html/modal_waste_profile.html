<!--
  Modal: modal_waste_profile — Tabler/GEMS modal + form contract (P3A Waste).
  Loaded by pages/waste_setup.html. JS IDs preserved from the MDB original.
-->
<div class="modal fade" id="modal_waste_profile" tabindex="-1" aria-labelledby="h4WpfTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="h4WpfTitle">Waste Profile</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formWpf" autocomplete="off" novalidate>
          <input type="hidden" id="hidWpfId">
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="optWpfSite">Premise</label>
              <select id="optWpfSite" class="form-select"></select>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="optWpfSw">SW Code <span class="required" aria-hidden="true">*</span></label>
              <select id="optWpfSw" class="form-select" aria-required="true"></select>
            </div>
            <div class="gems-field gems-field-12">
              <div class="form-label">Official Description</div>
              <p id="lblWpfDesc" class="mb-0">-</p>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtWpfAlias">Site Alias</label>
              <input type="text" id="txtWpfAlias" class="form-control">
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optWpfStatus">Status</label>
              <select id="optWpfStatus" class="form-select">
                <option value="1">Active</option>
                <option value="2">Inactive</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" class="btn btn-primary" id="btnWpfSave">
          <i class="far fa-save me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
