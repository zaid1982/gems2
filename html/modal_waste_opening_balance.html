<!--
  Modal: modal_waste_opening_balance — Tabler/GEMS modal + form contract (P3A Waste).
  Loaded by pages/waste_opening_balance.html. JS IDs preserved from the MDB original.
-->
<div class="modal fade" id="modal_waste_opening_balance" tabindex="-1" aria-labelledby="lblWobTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblWobTitle">Opening Balance</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formWob" autocomplete="off" novalidate>
          <input type="hidden" id="hidWobId">
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="optWobFormSite">Premise <span class="required" aria-hidden="true">*</span></label>
              <select id="optWobFormSite" class="form-select" aria-required="true"></select>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="optWobSw">SW Code <span class="required" aria-hidden="true">*</span></label>
              <select id="optWobSw" class="form-select" aria-required="true"></select>
              <div class="gems-field-help" id="lblWobDesc">-</div>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtWobAsAt">As-at Date <span class="required" aria-hidden="true">*</span></label>
              <input type="date" id="txtWobAsAt" class="form-control" aria-required="true">
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="txtWobQty">Quantity <span class="required" aria-hidden="true">*</span></label>
              <input type="number" step="0.001" min="0" id="txtWobQty" class="form-control" aria-required="true">
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optWobUnit">Unit <span class="required" aria-hidden="true">*</span></label>
              <select id="optWobUnit" class="form-select" aria-required="true">
                <option value="KG">kg</option>
                <option value="MT">MT</option>
              </select>
            </div>
            <div class="gems-field gems-field-6">
              <label class="form-label" for="optWobLoc">Storage Location</label>
              <select id="optWobLoc" class="form-select"></select>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txaWobRemarks">Remarks</label>
              <textarea id="txaWobRemarks" class="form-control" rows="2"></textarea>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txfWobFile">Supporting Document (optional)</label>
              <input type="file" id="txfWobFile" class="form-control" accept=".pdf,.jpg,.jpeg,.png">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" class="btn btn-primary" id="btnWobSave">
          <i class="far fa-save me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
