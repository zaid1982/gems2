<div class="modal fade gems-modal" id="modal_waste_opening_balance" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content gems-modal-card">
      <div class="modal-header gems-modal-header">
        <h4 class="text-white mt-2 ml-2">Opening Balance</h4>
        <button type="button" class="close text-white gems-modal-close" data-dismiss="modal"><span>&times;</span></button>
      </div>
      <div class="modal-body gems-modal-body">
        <form id="formWob">
          <input type="hidden" id="hidWobId">
          <div class="form-group"><label>Premise *</label><select id="optWobFormSite" class="custom-select gems-plain-select browser-default"></select></div>
          <div class="form-group"><label>SW Code *</label><select id="optWobSw" class="custom-select gems-plain-select browser-default"></select></div>
          <div class="form-group"><label>Official Description</label><p id="lblWobDesc">-</p></div>
          <div class="form-row">
            <div class="form-group col-md-4"><label>As-at Date *</label><input type="date" id="txtWobAsAt" class="form-control"></div>
            <div class="form-group col-md-4"><label>Quantity *</label><input type="number" step="0.001" min="0" id="txtWobQty" class="form-control"></div>
            <div class="form-group col-md-4"><label>Unit *</label><select id="optWobUnit" class="custom-select gems-plain-select browser-default"><option value="KG">kg</option><option value="MT">MT</option></select></div>
          </div>
          <div class="form-group"><label>Storage Location</label><select id="optWobLoc" class="custom-select gems-plain-select browser-default"></select></div>
          <div class="form-group"><label>Remarks</label><textarea id="txaWobRemarks" class="form-control" rows="2"></textarea></div>
          <div class="form-group"><label>Supporting Document (optional)</label><input type="file" id="txfWobFile" class="form-control" accept=".pdf,.jpg,.jpeg,.png"></div>
        </form>
      </div>
      <div class="modal-footer gems-modal-footer">
        <button class="btn btn-outline-info" data-dismiss="modal">Close</button>
        <button class="btn btn-info" id="btnWobSave">Save</button>
      </div>
    </div>
  </div>
</div>
