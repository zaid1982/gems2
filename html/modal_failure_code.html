<div class="modal fade" id="modal_failure_code" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-notify modal-info mt-3 pt-3 mb-5" role="document">
        <!--Content-->
        <div class="modal-content">
            <!--Header-->
            <div class="modal-header d-flex justify-content-center">
                <h4 class="text-white mt-2 ml-2" id="lblMfcTitle"></h4>
                <button type="button" class="close waves-effect waves-light mr-0 text-white pt-4" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--Body-->
            <div class="modal-body">
                <form id="formMfc">
                    <div class="md-form md-outline mt-4">
                        <input type="text" id="txtMfcName" class="form-control">
                        <label for="txtMfcName" id="lblMfcName">Failure Code *</label>
                        <p class="font-small text-danger" id="txtMfcNameErr"></p>
                    </div>
                    <h6 class="font-small">Status:</h6>
                    <div class="form-check pl-0 ml-3">
                        <input type="checkbox" class="form-check-input" id="chkMfcStatus" name="chkMfcStatus" value="1">
                        <label class="form-check-label" for="chkMfcStatus">Active</label>
                    </div>
                </form>
            </div>
            <div class="modal-footer p-2">
                <button class="btn btn-outline-info waves-effect" data-dismiss="modal"><i class="fas fa-undo-alt ml-1"></i> Close</button>
                <button id="btnMfcSubmit" class="btn btn-info waves-effect" disabled><i class="far fa-paper-plane ml-1"></i> Submit</button>
            </div>
        </div>
    </div>
</div>
