<!--
  Modal: modal_failure_code — Tabler/GEMS modal + form contract (P4A-3).

  Loaded by pages/failure_code.html ONLY. Copies the P4A-1 Designation / P4A-2
  Severity / P2 License contract:
    gems-modal-sm (480px) + modal-dialog-scrollable, never modal-dialog-centered.
    Flat white header, btn-close flex-centred with the title.
    Visible labels, gems-form-grid, H3 MzValidate error slots.
    Footer: outline Close first, primary Save last. No btn-info.

  JS contract preserved (js/pages/modal_failure_code.js, js/pages/main_failure_code.js):
    #modal_failure_code  #formMfc  #txtMfcName  #lblMfcName  #txtMfcNameErr
    #chkMfcStatus  #chkMfcStatusErr  #btnMfcSubmit  #lblMfcTitle
-->
<div class="modal fade" id="modal_failure_code" tabindex="-1" aria-labelledby="lblMfcTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-sm modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMfcTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMfc" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMfcName" id="lblMfcName">Failure Code <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMfcName" class="form-control" aria-required="true" aria-describedby="txtMfcNameErr">
              <div class="gems-field-error" id="txtMfcNameErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <span class="form-label">Status</span>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkMfcStatus" name="chkMfcStatus" value="1" aria-describedby="chkMfcStatusErr">
                <label class="form-check-label" for="chkMfcStatus">Active</label>
              </div>
              <div class="gems-field-error" id="chkMfcStatusErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" id="btnMfcSubmit" class="btn btn-primary" disabled>
          <i class="far fa-save me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
