<!--
  Modal: modal_fca_defect — Tabler/GEMS modal + form contract (P5-8 FCA Defect).

  Loaded by pages/fca_defect.html ONLY.
    gems-modal-md + modal-dialog-scrollable, never modal-dialog-centered.

  JS contract preserved (js/pages/modal_fca_defect.js):
    #modal_fca_defect  #formMfd  #h4MfdTitle
    #txtMfdName  #lblMfdName  #txtMfdNameErr
    #radMfdStatus  #radMfdStatus1  #radMfdStatus2  #radMfdStatusErr
    #btnMfdSubmit  #btnMfdSave  #btnMfdDelete
-->
<div class="modal fade" id="modal_fca_defect" tabindex="-1" aria-labelledby="h4MfdTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="h4MfdTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMfd" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMfdName" id="lblMfdName">Defect Category Name <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMfdName" class="form-control" aria-required="true" aria-describedby="txtMfdNameErr">
              <div class="gems-field-error" id="txtMfdNameErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <span class="form-label">Status <span class="required" aria-hidden="true">*</span></span>
              <div class="mt-1">
                <div class="form-check form-check-inline">
                  <input type="radio" class="form-check-input" name="radMfdStatus" id="radMfdStatus1" value="1">
                  <label class="form-check-label" for="radMfdStatus1">Active</label>
                </div>
                <div class="form-check form-check-inline">
                  <input type="radio" class="form-check-input" name="radMfdStatus" id="radMfdStatus2" value="2">
                  <label class="form-check-label" for="radMfdStatus2">Disabled</label>
                </div>
              </div>
              <div class="gems-field-error" id="radMfdStatusErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-undo-alt me-2"></i>Close
        </button>
        <button type="button" id="btnMfdDelete" class="btn btn-outline-danger">
          <i class="fas fa-trash-alt me-2"></i>Delete
        </button>
        <button type="button" id="btnMfdSave" class="btn btn-outline-primary">
          <i class="far fa-save me-2"></i>Save
        </button>
        <button type="button" id="btnMfdSubmit" class="btn btn-primary">
          <i class="far fa-paper-plane me-2"></i>Submit
        </button>
      </div>
    </div>
  </div>
</div>
