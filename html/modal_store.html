<!--
  modal_store — Tabler in-place (P5-24). store_management.html only.
  Client/site cascade IDs and POST/PUT payloads stay.
-->
<div class="modal fade" id="modal_store" tabindex="-1" aria-labelledby="lblMsrModalTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMsrModalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMsr" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12" id="optMsrClient_">
              <label class="form-label" for="optMsrClient" id="lblMsrClient">Client <span class="required" aria-hidden="true">*</span></label>
              <select id="optMsrClient" class="form-select" data-stop-refresh="true" data-visible-options="-1" aria-describedby="optMsrClientErr"></select>
              <div class="gems-field-error" id="optMsrClientErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12" id="optMsrSite_">
              <label class="form-label" for="optMsrSite" id="lblMsrSite">Site <span class="required" aria-hidden="true">*</span></label>
              <select id="optMsrSite" class="form-select" data-stop-refresh="true" data-visible-options="30" aria-describedby="optMsrSiteErr"></select>
              <div class="gems-field-error" id="optMsrSiteErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMsrName" id="lblMsrName">Store Name <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMsrName" class="form-control" aria-describedby="txtMsrNameErr">
              <div class="gems-field-error" id="txtMsrNameErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txaMsrDesc" id="lblMsrDesc">Store Description</label>
              <textarea id="txaMsrDesc" class="form-control" rows="4" aria-describedby="txaMsrDescErr"></textarea>
              <div class="gems-field-error" id="txaMsrDescErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <span class="form-label">Status</span>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="chkMsrStatus" name="chkMsrStatus" value="1">
                <label class="form-check-label" for="chkMsrStatus">Active</label>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem"><span class="required" aria-hidden="true">*</span> Required</span>
        <button type="button" class="btn btn-outline-secondary btnMsrClose" data-bs-dismiss="modal" data-dismiss="modal">
          <i class="fas fa-undo-alt me-1"></i>Close
        </button>
        <button type="button" id="btnMsrSubmit" class="btn btn-primary">
          <i class="far fa-paper-plane me-1"></i>Submit
        </button>
        <button type="button" id="btnMsrSave" class="btn btn-primary">
          <i class="far fa-save me-1"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
