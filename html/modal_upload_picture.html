<!--
  modal_upload_picture — Tabler in-place (P5-23). item_management.html only.
  File IDs, blob/width/height hidden fields, and POST payload stay.
-->
<div class="modal fade" id="modal_upload_picture" tabindex="-1" aria-labelledby="lblMupModalTitle" aria-hidden="true">
  <div class="modal-dialog gems-modal-md modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lblMupModalTitle"><i class="fas fa-camera me-1"></i>Upload Image</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMup" autocomplete="off" novalidate>
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtMupTitle" id="lblMupTitle">Image Title <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtMupTitle" class="form-control" aria-describedby="txtMupTitleErr">
              <div class="gems-field-error" id="txtMupTitleErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txfMupFile" id="lblMupFile">Image File (JPEG, JPG, PNG)</label>
              <input type="file" id="txfMupFile" class="form-control" accept="image/jpeg,image/jpg,image/png,.jpeg,.jpg,.png">
              <input type="hidden" id="txfMupFileBlob">
              <input type="hidden" id="txfMupFileWidth">
              <input type="hidden" id="txfMupFileHeight">
              <input class="form-control mt-2" type="text" id="txtMupFile" readonly>
              <div class="gems-field-error" id="txfMupFileErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem"><span class="required" aria-hidden="true">*</span> Required</span>
        <button type="button" class="btn btn-outline-secondary btnMupClose" data-bs-dismiss="modal" data-dismiss="modal">
          <i class="fas fa-undo-alt me-1"></i>Close
        </button>
        <button type="button" id="btnMupSubmit" class="btn btn-primary">
          <i class="far fa-paper-plane me-1"></i>Submit
        </button>
      </div>
    </div>
  </div>
</div>
