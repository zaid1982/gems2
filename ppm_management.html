<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>GEMS 2.0</title>

    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Material Design Bootstrap -->
    <link rel="stylesheet" href="css/mdb.min.css">
    <!-- DataTables.net -->
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/dataTables.bootstrap4.min.css"/>
    <!-- Your custom styles (optional) -->
    <link href="css/style.css" rel="stylesheet">
    <!-- Your custom styles (optional) -->

    </style>

    <script type="text/javascript" src="js/jquery-3.4.0.min.js"></script>

<body class="fixed-sn light-blue-skin">
<!--Main Navigation-->
<header>
    <!-- Sidebar navigation -->
    <div class="includeHtml" id="h-nav_left"></div>
    <!-- Navbar -->
    <div class="includeHtml" id="h-nav_top"></div>
</header>
<!--Main layout-->
<main>
    <div class="container-fluid">
        <!--Section: Main panel-->
        <section class="mb-5 mt-lg-5 sectionPmgMain">
            <div class="card card-cascade narrower">
                <!--Section: Search Function & Chart-->
                <section>
                    <div class="row">
                        <!--Search Function-->
                        <div class="col-xl-5 col-lg-12 mr-0">
                            <div class="view view-cascade gradient-card-header rgba-cyan-strong z-depth-4">
                                <h2 class="h2-responsive mb-0">PPM Management</h2>
                            </div>
                            <div class="card-body card-body-cascade">
                                <div class="px-3 pt-3">
                                    <h6>PPM Status by Asset:</h6>
                                    <div class="mt-1 pb-2">
                                        <ul class="striped list-unstyled pl-2">
                                            <li><a href="javascript:void(0);" id="linkPmgAll"></a></li>
                                            <li><a href="javascript:void(0);" id="linkPmg1"></a></li>
                                            <li><a href="javascript:void(0);" id="linkPmg2"></a></li>
                                            <li><a href="javascript:void(0);" id="linkPmg5"></a></li>
                                        </ul>
                                    </div>
                                    <h6 class="pb-3">Search:</h6>
                                    <div class="row">
                                        <div class="col-md-12 select-outline">
                                            <select id="optPmgContractId" class="mdb-select md-form md-outline colorful-select mt-0"></select>
                                            <label for="optPmgContractId">Contract *</label>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-12 select-outline">
                                            <select id="optPmgGroupId" class="mdb-select md-form md-outline colorful-select mt-0">
                                                <option value="" disabled>All Asset Group</option>
                                            </select>
                                            <label for="optPmgGroupId">Asset Group</label>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-12 select-outline">
                                            <select id="optPmgCategoryId" class="mdb-select md-form md-outline colorful-select mt-0" data-stop-refresh="true">
                                                <option value="" disabled>All Asset Category</option>
                                            </select>
                                            <label for="optPmgCategoryId">Asset Category</label>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-12 select-outline">
                                            <select id="optPmgTypeId" class="mdb-select md-form md-outline colorful-select mt-0" data-stop-refresh="true">
                                                <option value="" disabled>All Asset Type</option>
                                            </select>
                                            <label for="optPmgTypeId">Asset Type</label>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-12 select-outline">
                                            <select id="optPmgBrandId" class="mdb-select md-form md-outline colorful-select mt-0" data-stop-refresh="true">
                                                <option value="" disabled>All Asset Brand</option>
                                            </select>
                                            <label for="optPmgBrandId">Brand</label>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-12 select-outline">
                                            <select id="optPmgModelId" class="mdb-select md-form md-outline colorful-select mt-0" data-stop-refresh="true">
                                                <option value="" disabled>All Asset Model</option>
                                            </select>
                                            <label for="optPmgModelId">Model</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!--Chart-->
                        <div class="col-xl-7 col-lg-12">
                            <div class="view view-cascade z-depth-4 mb-3">
                                <div id="chartPmgAssetByStatus" style="height: 616px; margin: 0"></div>
                            </div>
                            <div class="card-body">
                                <div class="px-3 pt-3">
                                    <div class="row">
                                        <div class="col-md-7 select-outline">
                                            <select id="optPmgColumns" class="mdb-select md-form md-outline colorful-select mt-0" multiple>
                                                <option value="" disabled>Choose Column Visibility</option>
                                                <option value="1">Asset Name</option>
                                                <option value="2" selected>Asset No</option>
                                                <option value="3" selected>PPM Task No</option>
                                                <option value="4">Asset Serial No</option>
                                                <option value="5" selected>Asset Group</option>
                                                <option value="6" selected>Asset Category</option>
                                                <option value="7" selected>Asset Type</option>
                                                <option value="8">Brand</option>
                                                <option value="9">Model</option>
                                                <option value="10">Capacity</option>
                                                <option value="11">Location Code</option>
                                                <option value="12" selected>Status</option>
                                            </select>
                                            <label for="optPmgColumns">Columns Visibility</label>
                                        </div>
                                        <div class="col-md-5">
                                            <div class="md-form md-outline mt-0">
                                                <input type="text" id="txtPmgAssetSearch" class="form-control">
                                                <label for="txtPmgAssetSearch" class="active">Keyword Search</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <!--Section: Table-->
                <section>
                    <div class="card card-cascade narrower z-depth-0">
                        <div class="view view-cascade gradient-card-header aqua-gradient narrower py-2 mx-4 mb-3 d-flex justify-content-between align-items-center z-depth-3">
                            <div>
                                <button type="button" id="btnPmgAssetSet" class="btn btn-outline-white btn-rounded btn-sm px-2 material-tooltip-main" data-toggle="tooltip" data-placement="top" title="Set Group PPM"><i class="fas fa-calendar-alt mt-0"></i></button>
                                <a tabindex="0" role="button" class="btn btn-outline-white btn-rounded btn-sm px-2"
                                   data-toggle="popover" data-trigger="focus" title="Asset List"
                                   data-content="Asset List for assigned and unassigned checklist."><i class="fas fa-info mt-0 mx-1"></i></a>
                                <button type="button" id="btnDtPmgAssetRefresh" class="btn btn-outline-white btn-rounded btn-sm px-2" data-toggle="tooltip" data-placement="top" title="Refresh data"><i class="fas fa-sync mt-0"></i></button>
                            </div>
                            <a href="javascript:void(0);" class="text-white mx-3">Asset List</a>
                            <div>
                                <div id="btnDtPmgAssetExport"></div>
                            </div>
                        </div>
                        <div class="px-4 pb-4">
                            <div class="table-responsive">
                                <table id="dtPmgAsset" class="table table-hover table-sm mb-0 display responsive" cellspacing="0" width="100%">
                                    <thead>
                                    <tr class="th-strong">
                                        <th scope="row" style="max-width: 30px">#</th>
                                        <th style="min-width: 100px">Asset Name</th>
                                        <th style="min-width: 130px">Asset No</th>
                                        <th style="min-width: 130px">PPM Task No</th>
                                        <th style="min-width: 130px">Asset Serial No</th>
                                        <th style="min-width: 80px">Asset Group</th>
                                        <th style="min-width: 80px">Asset Category</th>
                                        <th style="min-width: 80px">Asset Type</th>
                                        <th style="min-width: 80px">Brand</th>
                                        <th style="min-width: 80px">Model</th>
                                        <th style="min-width: 80px">Capacity</th>
                                        <th style="min-width: 100px">Location Code</th>
                                        <th style="max-width: 70px">Status</th>
                                        <th style="width: 64px; min-width: 64px"></th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
                <section id="divPmgScheduled">
                    <div class="card card-cascade narrower z-depth-0 pt-4">
                        <div class="view view-cascade gradient-card-header aqua-gradient narrower py-2 mx-4 mb-3 d-flex justify-content-between align-items-center z-depth-3">
                            <div>
                                <a tabindex="0" role="button" class="btn btn-outline-white btn-rounded btn-sm px-2"
                                   data-toggle="popover" data-trigger="focus" title="Scheduled PPM List"
                                   data-content="Scheduled PPM List for selected asset."><i class="fas fa-info mt-0 mx-1"></i></a>
                                <button type="button" id="btnDtPmgScheduledRefresh" class="btn btn-outline-white btn-rounded btn-sm px-2" data-toggle="tooltip" data-placement="top" title="Refresh data"><i class="fas fa-sync mt-0"></i></button>
                            </div>
                            <a href="javascript:void(0);" class="text-white mx-3">Scheduled PPM List - <span id="lblPmgScheduledTitle" class="font-italic"></span></a>
                            <div>
                                <div id="btnDtPmgScheduledExport"></div>
                            </div>
                        </div>
                        <div class="px-4 pb-4">
                            <div class="table-responsive">
                                <table id="dtPmgScheduled" class="table table-hover table-sm mb-0 display responsive" cellspacing="0" width="100%">
                                    <thead>
                                    <tr class="th-strong">
                                        <th scope="row" style="max-width: 30px">#</th>
                                        <th>Work Order No</th>
                                        <th>Scheduled Date
                                        <th>Frequency</th>
                                        <th>Technician Assigned</th>
                                        <th style="max-width: 70px">Status</th>
                                        <th style="width: 64px; min-width: 64px"></th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </section>
        <div class="includeHtml" id="h-section_asset_details"></div>
    </div>
    <div class="includeHtml" id="h-modal_change_password"></div>
    <div class="includeHtml" id="h-modal_confirm_delete"></div>
    <div class="includeHtml" id="h-modal_ppm"></div>

</main>

<!-- SCRIPTS -->

<script type="text/javascript" src="js/vendor/highcharts/highcharts.js"></script>

<!--Custom scripts-->
<script type="text/javascript">
    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let changePasswordClass_;
    let ppmManagementClass_;
    let sectionAssetDetails_;
    let modalConfirmDelete_;
    let modalPpmClass_;

    document.addEventListener('DOMContentLoaded', function () {

        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                ppmManagementClass_ = new MainPpmManagement();
                sectionAssetDetails_ = new SectionAssetDetails();
                modalConfirmDelete_ = new ModalConfirmDelete();
                modalPpmClass_ = new ModalPpm();

                const refStatus_ = mzGetLocalArray('gems_status', versionLocal_, 'statusId');
                const refAssetGroup_ = mzGetLocalArray('gems_assetGroup', versionLocal_, 'assetGroupId', [], 'asset_group');
                const refAssetCategory_ = mzGetLocalArray('gems_assetCategory', versionLocal_, 'assetCategoryId', [], 'asset_category');
                const refAssetType_ = mzGetLocalArray('gems_assetType', versionLocal_, 'assetTypeId', [], 'asset_type');
                const refAssetBrand_ = mzGetLocalArray('gems_assetBrand', versionLocal_, 'assetBrandId', [], 'asset_brand');
                const refAssetModel_ = mzGetLocalArray('gems_assetModel', versionLocal_, 'assetModelId', [], 'asset_model');
                const refUser_ = mzGetLocalArray('gems_user', versionLocal_, 'userId');
                const refContract_ = mzGetLocalArray('gems_contract', versionLocal_, 'contractId', [], 'contract');
                const refSite_ = mzGetLocalArray('gems_site', versionLocal_, 'siteId', [], 'site');
                const refClient_ = mzGetLocalArray('gems_client', versionLocal_, 'clientId', [], 'client');
                const refLocationCode_ = mzGetLocalArray('gems_locationCode', versionLocal_, 'locationCodeId', [], 'location_code');

                modalPpmClass_.setClassFrom(ppmManagementClass_);
                modalPpmClass_.setRefContract(refContract_);
                modalPpmClass_.setRefAssetGroup(refAssetGroup_);
                modalPpmClass_.setRefAssetCategory(refAssetCategory_);
                modalPpmClass_.setRefAssetType(refAssetType_);
                modalPpmClass_.setRefAssetBrand(refAssetBrand_);
                modalPpmClass_.setRefAssetModel(refAssetModel_);
                modalPpmClass_.init();

                sectionAssetDetails_.setClassFrom(ppmManagementClass_);
                sectionAssetDetails_.setRefStatus(refStatus_);
                sectionAssetDetails_.setRefAssetGroup(refAssetGroup_);
                sectionAssetDetails_.setRefAssetCategory(refAssetCategory_);
                sectionAssetDetails_.setRefAssetType(refAssetType_);
                sectionAssetDetails_.setRefAssetBrand(refAssetBrand_);
                sectionAssetDetails_.setRefAssetModel(refAssetModel_);
                sectionAssetDetails_.setRefUser(refUser_);
                sectionAssetDetails_.setRefContract(refContract_);
                sectionAssetDetails_.setRefSite(refSite_);
                sectionAssetDetails_.setRefClient(refClient_);
                sectionAssetDetails_.setRefLocationCode(refLocationCode_);
                sectionAssetDetails_.setVersionLocal(versionLocal_);
                sectionAssetDetails_.init();

                ppmManagementClass_.setVersionLocal(versionLocal_);
                ppmManagementClass_.setRefStatus(refStatus_);
                ppmManagementClass_.setRefContract(refContract_);
                ppmManagementClass_.setRefAssetGroup(refAssetGroup_);
                ppmManagementClass_.setRefAssetCategory(refAssetCategory_);
                ppmManagementClass_.setRefAssetType(refAssetType_);
                ppmManagementClass_.setRefAssetBrand(refAssetBrand_);
                ppmManagementClass_.setRefAssetModel(refAssetModel_);
                ppmManagementClass_.setRefLocationCode(refLocationCode_);
                ppmManagementClass_.setRefUser(refUser_);
                ppmManagementClass_.setModalPpmClass(modalPpmClass_);
                ppmManagementClass_.setSectionAssetClass(sectionAssetDetails_);
                ppmManagementClass_.setModalConfirmDeleteClass(modalConfirmDelete_);
                ppmManagementClass_.init();
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }

            HideLoader();
        }, 300);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/section_asset_details.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_confirm_delete.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_ppm.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_ppm_management.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>
