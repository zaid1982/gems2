<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>GEMS 2.0</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Material Design Bootstrap -->
    <link rel="stylesheet" href="css/mdb.min.css">
    <!-- DataTables.net -->
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/dataTables.bootstrap4.min.css"/>
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/button.dataTables.min.css"/>
    <!-- Your custom styles (optional) -->
    <link href="css/style.css" rel="stylesheet">
    <!-- Your custom styles (optional) -->
    <style>

    </style>
    <!-- JQuery -->
    <script type="text/javascript" src="js/jquery-3.4.0.min.js"></script>

<body class="fixed-sn light-blue-skin">
<!--Main Navigation-->
<header>
    <!-- Sidebar navigation -->
    <div class="includeHtml" id="h-nav_left"></div>
    <!-- Navbar -->
    <div class="includeHtml" id="h-nav_top"></div>
</header>
<!--Main layout-->
<main>
    <div class="container-fluid">
        <nav class="navbar navbar-dark blue-grey darken-3 z-depth-4 rounded mt-2 pb-1 sectionFctMain">
            <h5 class="navbar-text white-text font-weight-bold ml-4 mt-1">
                Facility Condition Appraisal (FCA) Task
            </h5>
        </nav>
        <nav class="navbar navbar-expand navbar-dark primary-color lighten-2 z-depth-4 mt-4 sectionFctMain">
            <div class="collapse navbar-collapse" id="basicExampleNav">
                <ul class="navbar-nav mr-auto">
                    <button class="btn btn-blue-grey text-white my-0 py-2 px-4" id="btnFctAudit" type="button">
                        <i class="fas fa-eye mr-2"></i> Observe
                    </button>
                    <button class="btn btn-blue-grey text-white my-0 py-2 px-4" id="btnFctRecommend" type="button">
                        <i class="fas fa-marker mr-2"></i> Recommend
                    </button>
                    <button class="btn btn-blue-grey text-white my-0 py-2 px-4" id="btnFctValidate" type="button">
                        <i class="fas fa-check mr-2"></i> Validate
                    </button>
                </ul>
            </div>
        </nav>
        <section class="my-3 sectionFctMain sectionFctObserve">
            <div class="row">
                <div class="col-md-12">
                    <div class="card z-depth-3 mb-4_5">
                        <div class="card-header white p-0" id="divFctObserveHeader">
                            <div class="float-left primary-color" style="width: 24px; height: 45px">&nbsp;</div>
                            <h4 class="font-weight-bold pt-2 pl-4_5">Observation List</h4>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table id="dtFctObserve" class="table table-hover table-sm mb-0 display responsive">
                                    <thead>
                                    <tr class="th-strong">
                                        <th>#</th>
                                        <th>Audit No.</th>
                                        <th>Site</th>
                                        <th>Asset Group</th>
                                        <th>Asset No.</th>
                                        <th>Evaluated Asset</th> <!--5-->
                                        <th>Defect Item</th>
                                        <th>Defect Category</th>
                                        <th>Block</th>
                                        <th>Level</th>
                                        <th>Area</th> <!--10-->
                                        <th>Auditor</th>
                                        <th>Validator</th>
                                        <th>Submitted Time</th>
                                        <th>Status</th>
                                    </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <div class="includeHtml" id="h-modal_change_password"></div>
    <div class="includeHtml" id="h-modal_fca_add"></div>
</main>

<!-- SCRIPTS -->
<script type="text/javascript">
    $('.includeHtml').each(function () {
        const divId = $(this).attr('id');
        $('#' + divId).load('html/' + divId.substr(2) + '.html?' + new Date().valueOf());
    });
</script>

<!-- Bootstrap tooltips -->
<script type="text/javascript" src="js/popper.min.js"></script>
<!-- Bootstrap core JavaScript -->
<script type="text/javascript" src="js/bootstrap.js"></script>
<!-- MDB core JavaScript -->
<script type="text/javascript" src="js/mdb.min.js"></script>
<!-- Crypto JS -->
<script type="text/javascript" src="js/addons/crypto.js"></script>
<!-- DataTables.net -->
<script type="text/javascript" src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.bootstrap4.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.html5.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.print.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.colvis.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/jszip.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/pdfmake.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/vfs_fonts.js"></script>

<!--Custom scripts-->
<script type="text/javascript">
    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let changePasswordClass_;
    let modalFcaAddClass_;
    let fcaTaskClass_;

    document.addEventListener('DOMContentLoaded', function () {
        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                modalFcaAddClass_ = new ModalFcaAdd();
                fcaTaskClass_ = new MainFcaTask();

                const refStatus_ = mzGetLocalArrayV2('gems_status', versionLocal_, 'status/ref');
                const refUser_ = mzGetLocalArrayV2('gems_user', versionLocal_, 'user/ref');
                const refSite_ = mzGetLocalArrayV2('gems_site', versionLocal_, 'site_v2/ref');
                const refAssetGroup_ = mzGetLocalArrayV2('gems_assetGroup', versionLocal_, 'asset_group_v2/ref');
                const refDefectCategory_ = mzGetLocalArrayV2('gems_defectCategory', versionLocal_, 'fca_defect_category/ref');

                modalFcaAddClass_.setRefSite(refSite_);
                modalFcaAddClass_.setRefAssetGroup(refAssetGroup_);
                modalFcaAddClass_.setRefDefectCategory(refDefectCategory_);
                modalFcaAddClass_.setClassFrom(fcaTaskClass_);
                modalFcaAddClass_.init();

                fcaTaskClass_.setRefStatus(refStatus_);
                fcaTaskClass_.setRefUser(refUser_);
                fcaTaskClass_.setRefSite(refSite_);
                fcaTaskClass_.setRefAssetGroup(refAssetGroup_);
                fcaTaskClass_.setRefDefectCategory(refDefectCategory_);
                fcaTaskClass_.setModalFcaAddClass(modalFcaAddClass_);
                fcaTaskClass_.init();
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }

            HideLoader();
        }, 200);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_fca_add.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_fca_task.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
</script>
</body>
</html>
