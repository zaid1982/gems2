<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>GEMS 2.0</title>
    <link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
    <link rel="stylesheet" href="css/fontawesome-pro-6.5.1-web/css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/mdb.min.css">
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/dataTables.bootstrap4.min.css"/>
    <link href="css/style.css" rel="stylesheet">
  <link href="css/gems2-ui.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4f46e5; --primary-dark: #3730a3; --info-color:#3b82f6; --success-color:#10b981;
            --border-radius-lg: 16px; --card-shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
  .space-location-header { margin: 24px 0 16px; }
  .space-location-header .header-text h2{ font-size:1.75rem; font-weight:700; margin-bottom:8px; }
  .space-location-header .header-text p{ font-size:1rem; opacity:.9; margin-bottom:0; }
        .main-content-card { background:#fff; border-radius:.5rem; box-shadow: 0 2px 10px rgba(0,0,0,.08); overflow: visible; }
        .main-content-card .card-header { background: #f8fafc; color:#000; border-top-left-radius:.5rem; border-top-right-radius:.5rem; padding:.75rem 1rem; display:flex; align-items:center; justify-content:space-between; }
        .main-content-card .card-body { padding: 1rem 1.25rem; }
        .header-title { font-weight:600; font-size:1.1rem; letter-spacing:.2px; }
        .icon-btn{ border:1px solid #e5e7eb; background:#fff; color:#374151; padding:6px 8px; border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
        .icon-btn:hover{ background:#f3f4f6; }
        .th-strong th { font-weight: 700; color:#374151; border-bottom:2px solid #e5e7eb; }
        /* Segmented buttons */
        .segmented-group{ display:inline-flex; border:1px solid #e5e7eb; border-radius:10px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.06); }
        .segmented-btn{ background:#fff; color:#374151; padding:8px 12px; border:none; border-right:1px solid #e5e7eb; font-weight:600; letter-spacing:.2px; }
        .segmented-btn:last-child{ border-right:none; }
        .segmented-btn:hover{ background:#f8fafc; }
        /* Badges */
        .badge-modern { padding: 6px 10px; border-radius: 16px; font-size: .75rem; font-weight: 600; display:inline-block; }
        .badge-success-dark { background: rgba(16, 185, 129, 1); color: #fff; }
        .badge-warning { background: rgba(245, 158, 11, 0.9); color: #fff; }
        .badge-danger-dark { background: rgb(184, 51, 51); color: #fff; }
    </style>
    <script type="text/javascript" src="js/jquery-3.7.0.min.js"></script>
    <script type="text/javascript" src="js/jquery-migrate-3.4.0.min.js"></script>
</head>
<body class="fixed-sn light-blue-skin">
<header>
    <div class="includeHtml" id="h-nav_left"></div>
    <div class="includeHtml" id="h-nav_top"></div>
</header>
<main>
    <div class="container-fluid">
        <div class="gems-page-header space-location-header">
            <div class="header-text">
                            <h2 class="mb-0"><i class="fas fa-map-marker-alt mr-3"></i>Space Location</h2>
                            <p class="mb-0">Manage space locations used by Space module</p>
                        </div>
            <div class="header-actions align-items-center">
                            <button type="button" id="btnLocAdd" class="icon-btn" data-toggle="tooltip" title="Add Location"><i class="fas fa-plus"></i></button>
                            <a tabindex="0" role="button" class="icon-btn ml-2" data-toggle="popover" data-trigger="focus" title="Space Location" data-content="Add, edit, activate/deactivate locations."><i class="fas fa-info"></i></a>
                            <button type="button" id="btnDtLocRefresh" class="icon-btn ml-2" data-toggle="tooltip" title="Refresh"><i class="fas fa-sync"></i></button>
                        </div>
                </div>
        <section class="mb-5 mt-lg-5 sectionSpaceLocation">
            <div class="main-content-card mb-4">
                <div class="card-header">
                    <div class="header-title">Filters</div>
                    <div class="d-flex align-items-center header-actions">
                        <div id="dtLocButtons" class="d-none"></div>
                        <div class="segmented-group ml-2" id="locExportToggle" role="group" aria-label="Export">
                          <button class="segmented-btn" data-export="csv" aria-label="Export CSV">CSV</button>
                          <button class="segmented-btn" data-export="excel" aria-label="Export Excel">EXCEL</button>
                          <button class="segmented-btn" data-export="print" aria-label="Export Print">PRINT</button>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="row">
                        
                        <div class="col-md-6">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtLocSearch" class="form-control">
                                <label for="txtLocSearch" class="active">Search</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="main-content-card">
                <div class="card-header">
                    <div class="header-title">Locations</div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="dtLoc" class="table table-hover table-sm mb-0 display responsive" cellspacing="0" width="100%">
                            <thead>
                                <tr class="th-strong">
                                    <th style="max-width:30px">#</th>
                                    <th style="min-width:180px">Location Name</th>
                                    <th style="min-width:220px">Description</th>
                                    <th style="max-width:80px">Status</th>
                                    <th style="min-width:80px"></th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <div class="includeHtml" id="h-modal_change_password"></div>
        <div class="includeHtml" id="h-modal_confirm_delete"></div>
    </div>
</main>

<!-- Modal: Add/Edit Location -->
<div class="modal fade" id="modalLocForm" tabindex="-1" role="dialog" aria-labelledby="modalLocFormLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalLocFormLabel">Add Location</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
      </div>
      <div class="modal-body">
        <form id="frmLoc">
          <input type="hidden" id="hidLocId" value="">
          <div class="md-form md-outline mt-0">
            <input type="text" id="txtLocName" class="form-control" required>
            <label for="txtLocName" class="active">Location Name *</label>
          </div>
          <div class="md-form md-outline mt-0">
            <input type="text" id="txtLocDesc" class="form-control">
            <label for="txtLocDesc" class="active">Description</label>
          </div>
          <div class="select-outline">
            <select id="optLocStatusForm" class="mdb-select md-form md-outline colorful-select mt-0">
                <option value="1" selected>Active</option>
                <option value="0">Inactive</option>
            </select>
            <label for="optLocStatusForm">Status *</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="btnLocSave">Save</button>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript" src="js/popper.min.js"></script>
<script type="text/javascript" src="js/bootstrap.min.js"></script>
<script type="text/javascript" src="js/mdb.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.bootstrap4.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.html5.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.print.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/jszip.min.js"></script>
<script type="text/javascript" src="js/addons/crypto.js"></script>
<script type="text/javascript" src="js/addons/moment.min.js"></script>
<script type="text/javascript" src="js/modules/toastr.js"></script>
<script type="text/javascript" src="js/common.js"></script>
<script type="text/javascript" src="js/pages/main_space_location.js"></script>
</body>
</html>
