    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-dark: #3730a3;
            --secondary-color: #64748b;
            --success-color: #10b981;
            --success-dark: #047857;
            --success-light: #6ee7b7;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --danger-dark: #991b1b;
            --danger-light: #fecaca;
            --info-color: #3b82f6;
            --light-bg: #f8fafc;
            --card-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --card-shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --border-radius: 12px;
            --border-radius-lg: 16px;
        }
        .title-box { border: lightgray 1px solid; border-radius: 5px; font-size: 13px; }
        .title-box-title { position: relative; top: -0.7em; margin-left: 1em; display: inline; background-color: white; }
        .title-box-content { padding-top: 0.3rem; padding-left: 1rem; padding-right: 1rem; }
    /* Modern card styling */
    .main-content-card { background:#fff; border-radius:.5rem; box-shadow: 0 2px 10px rgba(0,0,0,.08); overflow: visible; }
    .main-content-card .card-header { background: #f8fafc; color:#000; border-top-left-radius:.5rem; border-top-right-radius:.5rem; padding:.75rem 1rem; display:flex; align-items:center; justify-content:space-between; }
        .main-content-card .card-body { padding: 1rem 1.25rem; }
        .header-actions .btn { margin-left:.25rem; }
        .header-title { font-weight:600; font-size:1.1rem; letter-spacing:.2px; }
        /* Ensure ancestor containers do not hide overflowed dropdowns */
        .main-content-card .dropdown, .dataTables_wrapper .dropdown { position: relative; }
        /* Wider dropdown for action items */
        .action-split .dropdown-menu { min-width: 240px; z-index: 3000; }
        /* Compact status select to avoid truncation */
        .status-filter { min-width: 140px; }
        /* Helpers */
        .d-none { display: none !important; }
        .page-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 32px;
            border-radius: var(--border-radius-lg);
            margin-bottom: 32px;
            box-shadow: var(--card-shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .page-header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translate(50%, -50%);
        }

        .page-header h2 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .page-header p {
            font-size: 1.125rem;
            opacity: 0.9;
            margin-bottom: 0;
            position: relative;
            z-index: 1;
        }

        /* Badge Styling */
        .badge-modern {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
        }

        .badge-success-dark {
            background: rgba(16, 185, 129, 1);
            color: var(--success-dark);
        }

        .badge-success-light {
            background: rgba(16, 185, 129, 0.3);
            color: var(--success-light);
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning-color);
        }

        .badge-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
        }

        .badge-danger-dark {
            background: rgb(184, 51, 51);
            color: var(--danger-dark);
        }
            .icon-btn{ border:1px solid #e5e7eb; background:#fff; color:#374151; padding:6px 8px; border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
            .view-toggle .icon-btn { border-top-right-radius:0; border-bottom-right-radius:0; }
            .view-toggle .icon-btn + .icon-btn { margin-left:0; border-left:0; }
            .view-toggle .icon-btn:last-child { border-top-right-radius:8px; border-bottom-right-radius:8px; }
            .icon-btn.is-active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); box-shadow: 0 4px 6px rgba(79,70,229,0.25); }
            .icon-btn.is-active:hover { background: var(--primary-dark); color:#fff; }
            .space-card-grid { display: flex; flex-wrap: wrap; margin-left: -0.75rem; margin-right: -0.75rem; }
            .space-card-grid__col { padding: 0.75rem; width: 100%; }
            @media (min-width: 576px) { .space-card-grid__col { width: 50%; } }
            @media (min-width: 1200px) { .space-card-grid__col { width: 33.333%; } }
            .space-card { background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); overflow: hidden; display: flex; flex-direction: column; height: 100%; transition: transform .25s ease, box-shadow .25s ease; border: 1px solid rgba(148, 163, 184, 0.25); }
            .space-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12); }
            .space-card__media { position: relative; aspect-ratio: 16/9; background: #f1f5f9; overflow: hidden; }
            .space-card__media img { width: 100%; height: 100%; object-fit: cover; display: block; }
            .space-card__badge { position: absolute; top: 12px; left: 12px; background: rgba(15, 23, 42, 0.85); color: #fff; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 6px 10px; border-radius: 999px; font-weight: 600; }
            .space-card__badge--available { background: rgba(16, 185, 129, 0.9); }
            .space-card__badge--reserved { background: rgba(245, 158, 11, 0.9); }
            .space-card__badge--disabled { background: rgba(248, 113, 113, 0.95); }
            .space-card__body { padding: 18px 20px; flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; }
            .space-card__title { font-size: 1.05rem; font-weight: 700; color: #0f172a; display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
            .space-card__subtitle { color: #475569; font-size: 0.9rem; display:flex; align-items:center; gap:0.35rem; }
            .space-card__meta { display: flex; align-items: center; color: #64748b; font-size: 0.82rem; gap: 0.4rem; }
            .space-card__meta i { color: #94a3b8; }
            .space-card__stats { margin-top: auto; color: #475569; font-size: 0.8rem; display:flex; gap:0.5rem; }
            .space-card__stats i { color: #6366f1; }
            .space-card__actions { padding: 16px 20px 20px; display: flex; flex-wrap: wrap; gap: 10px; }
            .space-card__actions .btn { flex: 1 1 auto; }
            .space-card__actions .btn-secondary { background:#e2e8f0; color:#0f172a; border:none; }
            #spcCardEmpty { border:1px dashed #cbd5f5; border-radius:12px; padding:2.5rem; text-align:center; color:#475569; margin-top:1rem; }
        .badge-danger-light {
            background: rgba(239, 68, 68, 0.3);
            color: var(--danger-light);
        }

        .badge-info {
            background: rgba(59, 130, 246, 0.1);
            color: var(--info-color);
        }

        .badge-dark {
            background: rgba(31, 41, 55, 0.1);
            color: #1f2937;
        }

        /* Dark green for Closed status */
        .badge-closed {
            background: rgba(6, 95, 70, 0.15); /* #065f46 with transparency */
            color: #065f46;
        }
        /* Segmented buttons + icon buttons */
        .segmented-group{ display:inline-flex; border:1px solid #e5e7eb; border-radius:10px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.06); }
        .segmented-btn{ background:#fff; color:#374151; padding:8px 12px; border:none; border-right:1px solid #e5e7eb; font-weight:600; letter-spacing:.2px; }
        .segmented-btn:last-child{ border-right:none; }
        .segmented-btn:hover{ background:#f8fafc; }
        .icon-btn{ border:1px solid #e5e7eb; background:#fff; color:#374151; padding:6px 8px; border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
        .icon-btn:hover{ background:#f3f4f6; }
    </style>

<main>
    <div class="container-fluid">

        <div class="page-header d-flex align-items-center justify-content-between">
            <div>
                <h2 class="mb-0"><i class="fas fa-door-open mr-3"></i>Space Management</h2>
                <p class="mb-0">Review and manage spaces within the organization</p>
            </div>
            <div class="d-flex align-items-center">
                <button type="button" id="btnSpcAdd" class="icon-btn" data-toggle="tooltip" title="Add Space"><i class="fas fa-plus"></i></button>
                <a tabindex="0" role="button" class="icon-btn ml-2" data-toggle="popover" data-trigger="focus" title="Space List" data-content="Space directory with booking."><i class="fas fa-info"></i></a>
                <button type="button" id="btnDtSpcRefresh" class="icon-btn ml-2" data-toggle="tooltip" title="Refresh"><i class="fas fa-sync"></i></button>
            </div>
        </div>

        <section class="mb-5 mt-lg-5 sectionSpaceMain">
            <!-- Filters Card (modern concept) -->
            <!-- <div class="main-content-card mb-4">
                <div class="card-header">
                    <div class="header-title">Filters</div>
                    
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4 select-outline">

            <!-- List Card (modern concept) -->
            <div class="main-content-card">
                <div class="card-header">
                    <div class="header-title">Spaces</div>
                    <div class="d-flex align-items-center header-actions">
                        <div class="d-flex align-items-center view-toggle">
                            <button type="button" id="btnSpcViewList" class="icon-btn is-active" title="List view"><i class="fas fa-list"></i></button>
                            <button type="button" id="btnSpcViewCard" class="icon-btn" title="Card view"><i class="fas fa-th-large"></i></button>
                        </div>
                        <div id="dtSpcButtons" class="d-none"></div>
                        <div class="segmented-group ml-2" id="spcExportToggle" role="group" aria-label="Export">
                            <button class="segmented-btn" data-export="csv" aria-label="Export CSV">CSV</button>
                            <button class="segmented-btn" data-export="excel" aria-label="Export Excel">EXCEL</button>
                            <button class="segmented-btn" data-export="print" aria-label="Export Print">PRINT</button>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div id="spcTableWrapper" class="table-responsive">
                        <table id="dtSpc" class="table table-hover table-sm mb-0 display responsive" cellspacing="0" width="100%">
                            <thead>
                                <tr class="th-strong">
                                    <th style="max-width:30px">#</th>
                                    <th style="min-width:120px">Space Name</th>
                                    <th style="min-width:100px">Location</th>
                                    <th style="min-width:120px">Category</th>
                                    <th style="min-width:120px">Type</th>
                                    <th style="min-width:60px">Area</th>
                                    <th style="min-width:60px">Capacity</th>
                                    <th style="max-width:55px">Status</th>
                                    <th style="min-width:42px"></th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div id="spcCardWrapper" class="d-none">
                        <div class="space-card-grid" id="spcCardGrid"></div>
                        <div id="spcCardEmpty" class="d-none">
                            <h5 class="font-weight-bold mb-2">No spaces match the current filters</h5>
                            <p class="mb-0">Try selecting a different status or adjust your filters to explore more spaces.</p>
                        </div>
                    </div>
                </div>

        </section>
    <div class="includeHtml" id="h-modal_change_password"></div>
    <div class="includeHtml" id="h-modal_confirm_delete"></div>

</main>
<!-- Create Space Modal -->
<div class="modal fade" id="modalSpcForm" tabindex="-1" role="dialog" aria-labelledby="modalSpcFormLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalSpcFormLabel">Create Space</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="frmSpc">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtSpcName" class="form-control" required>
                                <label for="txtSpcName" class="active">Space Name *</label>
                            </div>
                        </div>
                        <div class="col-md-6 select-outline">
                            <select id="optSpcStatusForm" class="mdb-select md-form md-outline colorful-select mt-0">
                                <option value="AVAILABLE" selected>Available</option>
                                <option value="DISABLED">Disabled</option>
                            </select>
                            <label for="optSpcStatusForm">Status *</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 select-outline">
                            <select id="optSpcLocation" class="mdb-select md-form md-outline colorful-select mt-0"></select>
                            <label for="optSpcLocation">Location</label>
                        </div>
                        <div class="col-md-4 select-outline">
                            <select id="optSpcCategory" class="mdb-select md-form md-outline colorful-select mt-0"></select>
                            <label for="optSpcCategory">Category</label>
                        </div>
                        <div class="col-md-4 select-outline">
                            <select id="optSpcType" class="mdb-select md-form md-outline colorful-select mt-0"></select>
                            <label for="optSpcType">Type</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="md-form md-outline mt-0">
                                <input type="number" id="txtSpcArea" class="form-control" min="0" step="0.01">
                                <label for="txtSpcArea" class="active">Area (m²)</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="md-form md-outline mt-0">
                                <input type="number" id="txtSpcCapacity" class="form-control" min="0" step="1">
                                <label for="txtSpcCapacity" class="active">Capacity</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtSpcDesc" class="form-control">
                                <label for="txtSpcDesc" class="active">Description</label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="btnSpcSave">Save</button>
            </div>
        </div>
    </div>
</div>
