    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-dark: #3730a3;
            --secondary-color: #64748b;
            --success-color: #10b981;
            --success-dark: #047857;
            --success-light: #6ee7b7;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --danger-dark: #991b1b;
            --danger-light: #fecaca;
            --info-color: #3b82f6;
            --light-bg: #f8fafc;
            --card-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --card-shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --border-radius: 12px;
            --border-radius-lg: 16px;
        }
        .title-box { border: lightgray 1px solid; border-radius: 5px; font-size: 13px; }
        .title-box-title { position: relative; top: -0.7em; margin-left: 1em; display: inline; background-color: white; }
        .title-box-content { padding-top: 0.3rem; padding-left: 1rem; padding-right: 1rem; }
        /* PTW Supervisor-inspired card styling */
        .main-content-card { background:#fff; border-radius:.5rem; box-shadow: 0 2px 10px rgba(0,0,0,.08); overflow: visible; }
        .main-content-card .card-header { background: linear-gradient(60deg,#26c6da,#00acc1); color:#fff; border-top-left-radius:.5rem; border-top-right-radius:.5rem; padding:.75rem 1rem; display:flex; align-items:center; justify-content:space-between; }
        .main-content-card .card-body { padding: 1rem 1.25rem; }
        .header-actions .btn { margin-left:.25rem; }
        .header-title { font-weight:600; font-size:1.1rem; letter-spacing:.2px; }
        /* Ensure ancestor containers do not hide overflowed dropdowns */
        .main-content-card .dropdown, .dataTables_wrapper .dropdown { position: relative; }
        /* Wider dropdown for action items */
        .action-split .dropdown-menu { min-width: 240px; z-index: 3000; }
        /* Compact status select to avoid truncation */
        .status-filter { min-width: 140px; }
        /* Helpers */
        .d-none { display: none !important; }
        .page-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 32px;
            border-radius: var(--border-radius-lg);
            margin-bottom: 32px;
            box-shadow: var(--card-shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .page-header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translate(50%, -50%);
        }

        .page-header h2 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .page-header p {
            font-size: 1.125rem;
            opacity: 0.9;
            margin-bottom: 0;
            position: relative;
            z-index: 1;
        }

        /* Badge Styling */
        .badge-modern {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
        }

        .badge-success-dark {
            background: rgba(16, 185, 129, 1);
            color: var(--success-dark);
        }

        .badge-success-light {
            background: rgba(16, 185, 129, 0.3);
            color: var(--success-light);
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning-color);
        }

        .badge-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
        }

        .badge-danger-dark {
            background: rgb(184, 51, 51);
            color: var(--danger-dark);
        }

        .badge-danger-light {
            background: rgba(239, 68, 68, 0.3);
            color: var(--danger-light);
        }

        .badge-info {
            background: rgba(59, 130, 246, 0.1);
            color: var(--info-color);
        }

        .badge-dark {
            background: rgba(31, 41, 55, 0.1);
            color: #1f2937;
        }

        /* Dark green for Closed status */
        .badge-closed {
            background: rgba(6, 95, 70, 0.15); /* #065f46 with transparency */
            color: #065f46;
        }
    </style>

            <!-- List Card (PTW style) -->
            <div class="main-content-card">

                    <div class="d-flex align-items-center header-actions">

<!-- Create Space Modal -->
<div class="modal fade" id="modalSpcForm" tabindex="-1" role="dialog" aria-labelledby="modalSpcFormLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalSpcFormLabel">Create Space</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="frmSpc">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtSpcName" class="form-control" required>
                                <label for="txtSpcName" class="active">Space Name *</label>
                            </div>
                        </div>
                        <div class="col-md-6 select-outline">
                            <select id="optSpcStatusForm" class="mdb-select md-form md-outline colorful-select mt-0">
                                <option value="AVAILABLE" selected>Available</option>
                                <option value="DISABLED">Disabled</option>
                            </select>
                            <label for="optSpcStatusForm">Status *</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 select-outline">
                            <select id="optSpcLocation" class="mdb-select md-form md-outline colorful-select mt-0"></select>
                            <label for="optSpcLocation">Location</label>
                        </div>
                        <div class="col-md-4 select-outline">
                            <select id="optSpcCategory" class="mdb-select md-form md-outline colorful-select mt-0"></select>
                            <label for="optSpcCategory">Category</label>
                        </div>
                        <div class="col-md-4 select-outline">
                            <select id="optSpcType" class="mdb-select md-form md-outline colorful-select mt-0"></select>
                            <label for="optSpcType">Type</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="md-form md-outline mt-0">
                                <input type="number" id="txtSpcArea" class="form-control" min="0" step="0.01">
                                <label for="txtSpcArea" class="active">Area (m²)</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="md-form md-outline mt-0">
                                <input type="number" id="txtSpcCapacity" class="form-control" min="0" step="1">
                                <label for="txtSpcCapacity" class="active">Capacity</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="md-form md-outline mt-0">
                                <input type="text" id="txtSpcDesc" class="form-control">
                                <label for="txtSpcDesc" class="active">Description</label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="btnSpcSave">Save</button>
            </div>
        </div>
    </div>
