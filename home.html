<!--Custom scripts-->
<script type="text/javascript">
    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal;
    let changePasswordClass;
    let homeClass_;

    document.addEventListener('DOMContentLoaded', function () {

        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass = new ModalChangePassword();
                homeClass_ = new MainHome();

                const refClient_ = mzGetLocalArray('gems_client', versionLocal_, 'clientId', [], 'client');
                const refSite_ = mzGetLocalArray('gems_site', versionLocal_, 'siteId', [], 'site');
                const refContract_ = mzGetLocalArray('gems_contract', versionLocal_, 'contractId', [], 'contract');

                homeClass_.setRefClient(refClient_);
                homeClass_.setRefSite(refSite_);
                homeClass_.setRefContract(refContract_);
                homeClass_.init();
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }

            HideLoader();
        }, 300);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_home.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>
