<body class="fixed-sn light-blue-skin">
<!--Main Navigation-->
<header>
    <!-- Sidebar navigation -->
    <div class="includeHtml" id="h-nav_left"></div>
    <!-- Navbar -->
    <div class="includeHtml" id="h-nav_top"></div>
</header>
<!--Main layout-->
<main>
    <div class="container-fluid">
        <!--Section: Notification panel-->
        <section class="mt-2 mb-4 sectionHmeMain">
            <!--Navbar-->
            <nav class="navbar navbar-expand-lg navbar-dark mdb-color lighten-3">
                <div class="collapse navbar-collapse" id="basicExampleNav">
                    <ul class="navbar-nav mr-auto">
                        <li class="nav-item dropdown mr-2 active">
                            <a class="nav-link dropdown-toggle" id="navHmeClient" data-toggle="dropdown"
                               aria-haspopup="true" aria-expanded="false">Client</a>
                            <div class="dropdown-menu dropdown-primary" aria-labelledby="navHmeClient" id="divHmeClient">
                            </div>
                        </li>
                        <li class="nav-item dropdown active">
                            <a class="nav-link dropdown-toggle" id="navHmeMonth" data-toggle="dropdown"
                               aria-haspopup="true" aria-expanded="false">Month</a>
                            <div class="dropdown-menu dropdown-primary" aria-labelledby="navHmeMonth" id="divHmeMonth">
                            </div>
                        </li>
                    </ul>
                </div>
                <a class="navbar-brand" href="#" id="lblHmeSelected"></a>
            </nav>
            <!--/.Navbar-->
            <div class="row mt-4_5">
                <!-- Intro Card: Jumlah Seminar -->
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card card-cascade cascading-admin-card">
                        <div class="admin-up">
                            <i class="fa fas fa-qrcode primary-color"></i>
                            <div class="data">
                                <p>TOTAL ASSETS</p>
                                <h4 class="font-weight-bold dark-grey-text" id="lblHmeTotalAsset">0</h4>
                            </div>
                        </div>
                        <div class="card-body card-body-cascade">
                            <p class="card-text">Total active asset<br/><strong>Current</strong></p>
                        </div>
                    </div>
                </div>
                <!-- Intro Card: Jumlah Syarikat -->
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card card-cascade cascading-admin-card">
                        <div class="admin-up">
                            <i class="fa far fa-tasks warning-color"></i>
                            <div class="data">
                                <p>TOTAL PPM</p>
                                <h4 class="font-weight-bold dark-grey-text" id="lblHmeTotalPpm"></h4>
                            </div>
                        </div>
                        <div class="card-body card-body-cascade">
                            <p class="card-text" id="lblHmeTotalPpmTitle"></p>
                        </div>
                    </div>
                </div>
                <!-- Intro Card: Jumlah Peserta -->
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card card-cascade cascading-admin-card">
                        <div class="admin-up">
                            <i class="fa fas fa-exclamation-triangle red accent-2"></i>
                            <div class="data">
                                <p>TOTAL LATE PPM</p>
                                <h4 class="font-weight-bold dark-grey-text" id="lblHmeTotalPpmLate"></h4>
                            </div>
                        </div>
                        <div class="card-body card-body-cascade">
                            <p class="card-text" id="lblHmeTotalPpmLateTitle"></p>
                        </div>
                    </div>
                </div>
                <!-- Intro Card: Attendance -->
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card card-cascade cascading-admin-card">
                        <div class="admin-up">
                            <i class="fa fas fa-check success-color-dark"></i>
                            <div class="data">
                                <p>PERC. PPM DONE</p>
                                <h4 class="font-weight-bold dark-grey-text"  id="lblHmePercPpmDone"></h4>
                            </div>
                        </div>
                        <div class="card-body card-body-cascade">
                            <div class="progress mb-3">
                                <div class="progress-bar bg-primary" id="divBarHmePercAttendance" role="progressbar" style="width: 0%" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                            <p class="card-text" id="lblHmePercPpmDoneTitle"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div class="includeHtml" id="h-modal_change_password"></div>
</main>

<!--Custom scripts-->
<script type="text/javascript">
    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal;
    let changePasswordClass;
    let homeClass_;

    document.addEventListener('DOMContentLoaded', function () {

        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass = new ModalChangePassword();
                homeClass_ = new MainHome();

                const refClient_ = mzGetLocalArray('gems_client', versionLocal_, 'clientId', [], 'client');
                const refSite_ = mzGetLocalArray('gems_site', versionLocal_, 'siteId', [], 'site');
                const refContract_ = mzGetLocalArray('gems_contract', versionLocal_, 'contractId', [], 'contract');

                homeClass_.setRefClient(refClient_);
                homeClass_.setRefSite(refSite_);
                homeClass_.setRefContract(refContract_);
                homeClass_.init();
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }

            HideLoader();
        }, 300);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_home.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>
