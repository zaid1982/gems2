<!--Custom scripts-->
<script type="text/javascript">
    $(function () {
        $("#mdb-lightbox-ui").load("mdb-addons/mdb-lightbox-ui.html");
    });

    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let changePasswordClass_;
    let modalConfirmDelete_;
    let modalPpmAssetClass_;
    let sectionPpmAssetClass_;
    let mainClass_;

    document.addEventListener('DOMContentLoaded', function () {
        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                modalConfirmDelete_ = new ModalConfirmDelete();
                modalPpmAssetClass_ = new ModalPpmAsset();
                sectionPpmAssetClass_ = new SectionPpmAsset();
                mainClass_ = new MainPpmAsset();

                const refStatus_ = mzGetLocalArrayV2('gems_status2', versionLocal_, 'status/ref');
                const refUser_ = mzGetLocalArrayV2('gems_user2', versionLocal_, 'user/ref');
                const refSite_ = mzGetLocalArray('gems_site', versionLocal_, 'siteId', [], 'site');
                const refContract_ = mzGetLocalArray('gems_contract', versionLocal_, 'contractId', [], 'contract');
                const refAssetGroup_ = mzGetLocalArray('gems_assetGroup', versionLocal_, 'assetGroupId', [], 'asset_group');
                const refAssetCategory_ = mzGetLocalArray('gems_assetCategory', versionLocal_, 'assetCategoryId', [], 'asset_category');
                const refAssetType_ = mzGetLocalArray('gems_assetType', versionLocal_, 'assetTypeId', [], 'asset_type');
                const refPpmGroup_ = mzGetLocalArray('gems_ppmGroup', versionLocal_, 'ppmGroupId', [], 'ppm_group');

                modalPpmAssetClass_.setRefAssetGroup(refAssetGroup_);
                modalPpmAssetClass_.setRefAssetCategory(refAssetCategory_);
                modalPpmAssetClass_.setRefAssetType(refAssetType_);
                modalPpmAssetClass_.setRefPpmGroup(refPpmGroup_);
                modalPpmAssetClass_.init();
                sectionPpmAssetClass_.setRefStatus(refStatus_);
                sectionPpmAssetClass_.setRefAssetGroup(refAssetGroup_);
                sectionPpmAssetClass_.setRefAssetCategory(refAssetCategory_);
                sectionPpmAssetClass_.setRefAssetType(refAssetType_);
                sectionPpmAssetClass_.setRefPpmGroup(refPpmGroup_);
                sectionPpmAssetClass_.setClassFrom(mainClass_);
                sectionPpmAssetClass_.init();
                mainClass_.setRefStatus(refStatus_);
                mainClass_.setRefUser(refUser_);
                mainClass_.setRefSite(refSite_);
                mainClass_.setRefContract(refContract_);
                mainClass_.setRefAssetGroup(refAssetGroup_);
                mainClass_.setRefAssetCategory(refAssetCategory_);
                mainClass_.setRefAssetType(refAssetType_);
                mainClass_.setRefPpmGroup(refPpmGroup_);
                mainClass_.setModalPpmAssetClass(modalPpmAssetClass_);
                mainClass_.setSectionPpmAssetClass(sectionPpmAssetClass_);
                mainClass_.init();
            } catch (e) { toastr['error'](e.message, _ALERT_TITLE_ERROR); }
            HideLoader();
        }, 200);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_confirm_delete.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_ppm_asset.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/section_ppm_asset.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_ppm_asset.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
</script>
