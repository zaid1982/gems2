<!DOCTYPE html>
<!--
  pages/energy_monthly.html — Tabler-migrated (P3C Energy).

  Twelve-month summary plus stacked Highcharts. Asset stack is a verbatim
  copy of html/head_tabler.html and html/scripts_tabler.html.

  NEVER load next to Tabler: css/bootstrap.min.css, css/mdb.min.css,
  css/style.css, css/gems2-ui.css, js/popper.min.js, js/bootstrap*.js,
  js/mdb*.js, js/jquery-migrate-3.4.0.min.js, dataTables.bootstrap4.*,
  js/vendor/tabler/tabler-theme.min.js.
-->
<html lang="en" data-bs-theme="light" data-bs-navbar-position="vertical">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GEMS 2.0 - Monthly Electricity Summary</title>
  <link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
  <link rel="stylesheet" href="css/fontawesome-pro-6.5.1-web/css/all.min.css">
  <link rel="stylesheet" href="css/vendor/tabler/tabler.min.css">
  <link rel="stylesheet" href="js/vendor/datatables/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="js/vendor/datatables/css/buttons.bootstrap5.min.css">
  <link rel="stylesheet" href="css/gems-theme.css?p3h1">
</head>
<body class="gems-tabler">
<div class="page">
  <aside class="includeHtml navbar navbar-vertical navbar-expand-lg" id="h-nav_left_tabler"></aside>
  <div class="page-wrapper">
    <header class="includeHtml navbar navbar-expand-md" id="h-nav_top_tabler"></header>
    <div class="page-body">
      <div class="container-xl">

        <div class="page-header">
          <div class="row align-items-center g-2">
            <div class="col-12 col-sm">
              <h1 class="page-title"><i class="fas fa-chart-column me-2 text-primary"></i>Monthly Electricity Summary</h1>
              <div class="page-subtitle">Twelve months of consumption per incoming meter, derived from the daily cumulative readings.</div>
            </div>
            <div class="col-12 col-sm-auto">
              <button type="button" class="btn btn-outline-secondary" id="btnEmoRefresh"
                      data-bs-toggle="tooltip" title="Refresh data" aria-label="Refresh data">
                <i class="fas fa-sync-alt me-2"></i>Refresh
              </button>
              <button type="button" class="btn btn-outline-secondary" id="btnEmoExport"
                      data-bs-toggle="tooltip" title="Export CSV" aria-label="Export CSV">
                <i class="fas fa-file-excel me-2"></i>Export
              </button>
            </div>
          </div>
        </div>

        <div class="card gems-filter-card mb-3">
          <div class="card-body">
            <div class="gems-form-grid">
              <div class="gems-field gems-field-6">
                <label class="form-label" for="optEmoSite">Site</label>
                <select id="optEmoSite" class="form-select"></select>
              </div>
              <div class="gems-field gems-field-6">
                <label class="form-label" for="optEmoYear">Year</label>
                <select id="optEmoYear" class="form-select"></select>
              </div>
            </div>
            <div class="d-flex flex-wrap align-items-center gap-2 mt-2 text-secondary" style="font-size:.75rem">
              <div id="lblEmoSummary">Loading…</div>
            </div>
          </div>
        </div>

        <div class="card mb-3">
          <div class="card-header">
            <div>
              <h3 class="card-title mb-0">Consumption by month</h3>
              <div class="text-secondary" style="font-size:.75rem">Stacked by incoming meter with the monthly total.</div>
            </div>
          </div>
          <div class="card-body">
            <div id="chartEmo" class="gems-chart-lg"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="card-title mb-0">Monthly totals</h3>
              <div class="text-secondary" style="font-size:.75rem">Total per meter, combined total and the average daily consumption.</div>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-vcenter card-table table-hover mb-0 enr-table" id="tblEmo">
              <thead id="theadEmo"></thead>
              <tbody id="tbodyEmo"></tbody>
              <tfoot id="tfootEmo"></tfoot>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<div class="includeHtml" id="h-modal_change_password"></div>

<script src="js/jquery-3.7.0.min.js"></script>
<script src="js/vendor/tabler/tabler.min.js"></script>
<script src="js/gems-bs5-jquery.js"></script>
<script src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script src="js/vendor/datatables/js/dataTables.bootstrap5.min.js"></script>
<script src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script src="js/vendor/datatables/js/buttons.bootstrap5.min.js"></script>
<script src="js/modules/toastr.js"></script>
<script src="js/addons/crypto.js"></script>
<script src="js/addons/moment.min.js"></script>
<script src="js/vendor/highcharts/highcharts.js"></script>
<script src="js/vendor/highcharts/modules/exporting.js"></script>
<script>
  $('.includeHtml').each(function () {
    const divId = $(this).attr('id');
    $('#' + divId).load('html/' + divId.substr(2) + '.html?' + new Date().valueOf());
  });
</script>
<script>
  document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/gems-tabler-ui.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/energy_common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/main_energy_monthly.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.addEventListener('DOMContentLoaded', function () {
    ShowLoader();
    setTimeout(function () {
      try { initiatePages(); new ModalChangePassword(); new MainEnergyMonthly().init(); }
      catch (e) { toastr['error'](e.message, _ALERT_TITLE_ERROR); }
      HideLoader();
    }, 300);
  });
</script>
</body>
</html>
