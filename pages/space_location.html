<!DOCTYPE html>
<!--
  pages/space_location.html — Tabler-migrated (P5-6 Space Location).

  Page-local master. Add/edit modal is inline (#modalLocForm).
  Bridges: modal_change_password, modal_confirm_delete (included, unused by JS).

  NEVER load next to Tabler: css/bootstrap.min.css, css/mdb.min.css,
  css/style.css, css/gems2-ui.css, js/popper.min.js, js/bootstrap*.js,
  js/mdb*.js, js/jquery-migrate-3.4.0.min.js, dataTables.bootstrap4.*,
  js/vendor/tabler/tabler-theme.min.js.
-->
<html lang="en" data-bs-theme="light" data-bs-navbar-position="vertical">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GEMS 2.0 - Space Location</title>
  <link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
  <link rel="stylesheet" href="css/fontawesome-pro-6.5.1-web/css/all.min.css">
  <link rel="stylesheet" href="css/vendor/tabler/tabler.min.css">
  <link rel="stylesheet" href="js/vendor/datatables/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="js/vendor/datatables/css/buttons.bootstrap5.min.css">
  <link rel="stylesheet" href="css/gems-theme.css">
</head>
<body class="gems-tabler">
<div class="page">
  <aside class="includeHtml navbar navbar-vertical navbar-expand-lg" id="h-nav_left_tabler"></aside>
  <div class="page-wrapper">
    <header class="includeHtml navbar navbar-expand-md" id="h-nav_top_tabler"></header>
    <div class="page-body">
      <div class="container-xl">

        <div class="page-header">
          <div class="row align-items-center g-2">
            <div class="col-12 col-sm">
              <h1 class="page-title"><i class="fas fa-map-marker-alt me-2 text-primary"></i>Space Location</h1>
              <div class="page-subtitle">Manage space locations used by Space module</div>
            </div>
            <div class="col-12 col-sm-auto">
              <button type="button" class="btn btn-outline-secondary" id="btnDtLocRefresh"
                      data-bs-toggle="tooltip" title="Refresh data" aria-label="Refresh data">
                <i class="fas fa-sync-alt me-2"></i>Refresh
              </button>
              <button type="button" class="btn btn-primary" id="btnLocAdd"
                      data-bs-toggle="tooltip" title="Add Location" aria-label="Add Location">
                <i class="fas fa-plus me-2"></i>New Location
              </button>
            </div>
          </div>
        </div>

        <div class="card gems-filter-card mb-3">
          <div class="card-body">
            <div class="gems-form-grid">
              <div class="gems-field gems-field-6">
                <label class="form-label" for="txtLocSearch">Search</label>
                <input type="search" id="txtLocSearch" class="form-control" placeholder="Search locations" autocomplete="off">
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="card-title mb-0"><i class="fas fa-map-marker-alt me-2 text-primary"></i>Locations</h3>
              <div class="text-secondary" style="font-size:.75rem">All locations</div>
            </div>
            <div class="gems-card-toolbar">
              <button type="button" class="btn btn-outline-secondary btn-sm" id="btnLocRefreshTable"
                      data-bs-toggle="tooltip" title="Refresh data" aria-label="Refresh data">
                <i class="fas fa-sync-alt"></i>
              </button>
              <div id="dtLocButtons" class="d-inline-flex align-items-center"></div>
            </div>
          </div>
          <table id="dtLoc" class="table table-vcenter card-table table-hover mb-0">
            <thead>
              <tr>
                <th style="width:6%">#</th>
                <th>Location Name</th>
                <th>Description</th>
                <th style="width:15%">Status</th>
                <th style="width:120px" class="noVis text-center">Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

      </div>
    </div>
  </div>
</div>

<div class="includeHtml" id="h-modal_change_password"></div>
<div class="includeHtml" id="h-modal_confirm_delete"></div>

<div class="modal fade" id="modalLocForm" tabindex="-1" aria-labelledby="modalLocFormLabel" aria-hidden="true">
  <div class="modal-dialog gems-modal-sm modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalLocFormLabel">Add Location</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="frmLoc" autocomplete="off" novalidate>
          <input type="hidden" id="hidLocId" value="">
          <div class="gems-form-grid">
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtLocName">Location Name <span class="required" aria-hidden="true">*</span></label>
              <input type="text" id="txtLocName" class="form-control" aria-required="true" aria-describedby="txtLocNameErr">
              <div class="gems-field-error" id="txtLocNameErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="txtLocDesc">Description</label>
              <input type="text" id="txtLocDesc" class="form-control" aria-describedby="txtLocDescErr">
              <div class="gems-field-error" id="txtLocDescErr" role="alert"></div>
            </div>
            <div class="gems-field gems-field-12">
              <label class="form-label" for="optLocStatusForm">Status <span class="required" aria-hidden="true">*</span></label>
              <select id="optLocStatusForm" class="form-select" aria-required="true" aria-describedby="optLocStatusFormErr">
                <option value="1" selected>Active</option>
                <option value="0">Inactive</option>
              </select>
              <div class="gems-field-error" id="optLocStatusFormErr" role="alert"></div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <span class="text-secondary me-auto" style="font-size:.75rem">
          <span class="required" aria-hidden="true">*</span> Required
        </span>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Close
        </button>
        <button type="button" class="btn btn-primary" id="btnLocSave">
          <i class="far fa-save me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>

<script src="js/jquery-3.7.0.min.js"></script>
<script src="js/vendor/tabler/tabler.min.js"></script>
<script src="js/gems-bs5-jquery.js"></script>
<script src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script src="js/vendor/datatables/js/dataTables.bootstrap5.min.js"></script>
<script src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script src="js/vendor/datatables/js/buttons.bootstrap5.min.js"></script>
<script src="js/vendor/datatables/js/buttons.html5.min.js"></script>
<script src="js/vendor/datatables/js/buttons.print.min.js"></script>
<script src="js/vendor/datatables/js/jszip.min.js"></script>
<script src="js/modules/toastr.js"></script>
<script src="js/addons/crypto.js"></script>
<script src="js/addons/moment.min.js"></script>
<script>
  $('.includeHtml').each(function () {
    const divId = $(this).attr('id');
    $('#' + divId).load('html/' + divId.substr(2) + '.html?' + new Date().valueOf());
  });
</script>
<script>
  document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/gems-tabler-ui.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/main_space_location.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
</script>
</body>
</html>
