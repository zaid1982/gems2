<!DOCTYPE html>
<!--
  pages/ppm_set_form.html — Tabler-migrated (P5-4 Commit 3 PPM Set Form).

  Converted together with ppm_set_management + modal_ppm_set + modal_ppm_set_select_asset.
  This page does NOT load modal_ppm_set.js. modal_ppm_set_select_asset is SHARED — do not fork.
  Do not touch section_asset_details / _tabler.

  Bridges: modal_change_password, modal_confirm_delete, modal_pdf stay dual-stack.

  NEVER load next to Tabler: css/bootstrap.min.css, css/mdb.min.css,
  css/style.css, css/gems2-ui.css, js/popper.min.js, js/bootstrap*.js,
  js/mdb*.js, js/jquery-migrate-3.4.0.min.js, dataTables.bootstrap4.*,
  js/vendor/tabler/tabler-theme.min.js, steppers, lightbox.
-->
<html lang="en" data-bs-theme="light" data-bs-navbar-position="vertical">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GEMS 2.0 - PPM Set Details</title>
  <link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
  <link rel="stylesheet" href="css/fontawesome-pro-6.5.1-web/css/all.min.css">
  <link rel="stylesheet" href="css/vendor/tabler/tabler.min.css">
  <link rel="stylesheet" href="js/vendor/datatables/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="js/vendor/datatables/css/buttons.bootstrap5.min.css">
  <link rel="stylesheet" href="css/gems-theme.css">
</head>
<body class="gems-tabler">
<div class="page">
  <aside class="includeHtml navbar navbar-vertical navbar-expand-lg" id="h-nav_left_tabler"></aside>
  <div class="page-wrapper">
    <header class="includeHtml navbar navbar-expand-md" id="h-nav_top_tabler"></header>
    <div class="page-body">
      <div class="container-xl">

        <section class="sectionPsmMain">
          <div class="page-header">
            <div class="row align-items-center g-2">
              <div class="col-12 col-sm">
                <h1 class="page-title" id="h5PpmSetFormTitle"><i class="fas fa-layer-group me-2 text-primary"></i>PPM Set Details</h1>
                <div class="page-subtitle">Create or edit a preventive maintenance set and the assets it covers.</div>
              </div>
              <div class="col-12 col-sm-auto">
                <a class="btn btn-outline-secondary" href="ppm_set_management.html" title="Back to PPM Set List" aria-label="Back to PPM Set List">
                  <i class="fas fa-arrow-left me-2"></i>Back
                </a>
              </div>
            </div>
          </div>

          <div class="card mb-3">
            <div class="card-header">
              <h3 class="card-title mb-0"><i class="fas fa-file-alt me-2"></i>PPM Set Information</h3>
            </div>
            <div class="card-body">
              <form id="formMps" name="formMps" autocomplete="off" novalidate>
                <input type="hidden" id="lblMpsId" value="">
                <div class="gems-form-grid">
                  <div class="gems-field gems-field-6">
                    <label class="form-label" for="txtMpsName" id="lblMpsName">PPM Set Name <span class="required" aria-hidden="true">*</span></label>
                    <input type="text" id="txtMpsName" class="form-control" maxlength="200" autocomplete="off" aria-required="true" aria-describedby="txtMpsNameErr">
                    <div class="gems-field-error" id="txtMpsNameErr" role="alert"></div>
                  </div>
                  <div class="gems-field gems-field-6">
                    <label class="form-label" for="txaMpsDesc" id="lblMpsDesc">Description</label>
                    <textarea id="txaMpsDesc" class="form-control" rows="2" maxlength="1000" aria-describedby="txaMpsDescErr"></textarea>
                    <div class="gems-field-error" id="txaMpsDescErr" role="alert"></div>
                  </div>
                  <div class="gems-field gems-field-4" id="optMpsAssetGroup_">
                    <label class="form-label" for="optMpsAssetGroup" id="lblMpsAssetGroup">Asset Group <span class="required" aria-hidden="true">*</span></label>
                    <select id="optMpsAssetGroup" class="form-select" data-stop-refresh="true" aria-required="true" aria-describedby="optMpsAssetGroupErr"></select>
                    <div class="gems-field-error" id="optMpsAssetGroupErr" role="alert"></div>
                  </div>
                  <div class="gems-field gems-field-4" id="optMpsAssetCategory_">
                    <label class="form-label" for="optMpsAssetCategory" id="lblMpsAssetCategory">Asset Category <span class="required" aria-hidden="true">*</span></label>
                    <select id="optMpsAssetCategory" class="form-select" data-stop-refresh="true" aria-required="true" aria-describedby="optMpsAssetCategoryErr"></select>
                    <div class="gems-field-error" id="optMpsAssetCategoryErr" role="alert"></div>
                  </div>
                  <div class="gems-field gems-field-4" id="optMpsAssetType_">
                    <label class="form-label" for="optMpsAssetType" id="lblMpsAssetType">Asset Type <span class="required" aria-hidden="true">*</span></label>
                    <select id="optMpsAssetType" class="form-select" data-stop-refresh="true" aria-required="true" aria-describedby="optMpsAssetTypeErr"></select>
                    <div class="gems-field-error" id="optMpsAssetTypeErr" role="alert"></div>
                  </div>
                  <div class="gems-field gems-field-4" id="optMpsPpmGroupId_">
                    <label class="form-label" for="optMpsPpmGroupId" id="lblMpsPpmGroupId">PPM Executor Group <span class="required" aria-hidden="true">*</span></label>
                    <select id="optMpsPpmGroupId" class="form-select" data-stop-refresh="true" aria-required="true" aria-describedby="optMpsPpmGroupIdErr"></select>
                    <div class="gems-field-error" id="optMpsPpmGroupIdErr" role="alert"></div>
                  </div>
                </div>
              </form>
              <div class="mt-3">
                <button type="button" class="btn btn-primary" id="btnMpsSubmit"><i class="fas fa-save me-2"></i>Save PPM Set</button>
              </div>
            </div>
          </div>
        </section>

        <section id="sectionAssetsInSet" class="sectionPsmMain mb-3" style="display: none;">
          <div class="card">
            <div class="card-header">
              <div>
                <h3 class="card-title mb-0"><i class="fas fa-cube me-2"></i>Assets in this PPM Set</h3>
              </div>
              <div class="gems-card-toolbar">
                <button type="button" class="btn btn-primary btn-sm" id="btnAddAssetsToSet"><i class="fas fa-plus me-1"></i> Add Assets</button>
              </div>
            </div>
            <div class="table-responsive">
              <table id="dtPpsa" class="table table-vcenter card-table table-hover mb-0">
                <thead>
                  <tr>
                    <th style="width:4%">#</th>
                    <th>Asset No</th>
                    <th>Asset Name</th>
                    <th>Location</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </section>

      </div>
    </div>
  </div>
</div>

<div class="includeHtml" id="h-modal_change_password"></div>
<div class="includeHtml" id="h-modal_confirm_delete"></div>
<div class="includeHtml" id="h-modal_pdf"></div>
<div class="includeHtml" id="h-modal_ppm_set_select_asset"></div>

<script src="js/jquery-3.7.0.min.js"></script>
<script src="js/vendor/tabler/tabler.min.js"></script>
<script src="js/gems-bs5-jquery.js"></script>
<script src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script src="js/vendor/datatables/js/dataTables.bootstrap5.min.js"></script>
<script src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script src="js/vendor/datatables/js/buttons.bootstrap5.min.js"></script>
<script src="js/modules/toastr.js"></script>
<script src="js/addons/crypto.js"></script>
<script src="js/vendor/datatables/js/buttons.html5.min.js"></script>
<script src="js/vendor/datatables/js/buttons.print.min.js"></script>
<script src="js/vendor/datatables/js/buttons.colvis.min.js"></script>
<script src="js/vendor/datatables/js/jszip.min.js"></script>
<script src="js/vendor/datatables/js/pdfmake.min.js"></script>
<script src="js/vendor/datatables/js/vfs_fonts.js"></script>
<script src="js/addons/moment.min.js"></script>
<script>
  $('.includeHtml').each(function () {
    const divId = $(this).attr('id');
    $('#' + divId).load('html/' + divId.substr(2) + '.html?' + new Date().valueOf());
  });
</script>
<script>
  document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/gems-tabler-ui.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/modal_confirm_delete.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/modal_ppm_set_select_asset.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/main_ppm_set_form.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

  let versionLocal_;
  let changePasswordClass_;
  let modalConfirmDeleteClass_;
  let modalPpmSetSelectAssetClass_;
  let mainPpmSetFormClass_;

  function mzFilterSparseArray(arr) {
    if (!Array.isArray(arr)) {
      return [];
    }
    return arr.filter(item => typeof item !== 'undefined' && item !== null);
  }

  document.addEventListener('DOMContentLoaded', function () {
    ShowLoader();
    setTimeout(function () {
      try {
        initiatePages();
        versionLocal_ = mzGetDataVersion();
        changePasswordClass_ = new ModalChangePassword();
        modalConfirmDeleteClass_ = new ModalConfirmDelete();

        modalPpmSetSelectAssetClass_ = new ModalPpmSetSelectAsset();
        mainPpmSetFormClass_ = new MainPpmSetForm();

        const refStatus_ = mzGetLocalArrayV2('gems_status2', versionLocal_, 'status/ref');
        const refUser_ = mzGetLocalArrayV2('gems_user2', versionLocal_, 'user/ref');
        const refAssetGroup_ = mzFilterSparseArray(mzGetLocalArray('gems_assetGroup', versionLocal_, 'assetGroupId', [], 'asset_group'));
        const refAssetCategory_ = mzFilterSparseArray(mzGetLocalArray('gems_assetCategory', versionLocal_, 'assetCategoryId', [], 'asset_category'));
        const refAssetType_ = mzFilterSparseArray(mzGetLocalArray('gems_assetType', versionLocal_, 'assetTypeId', [], 'asset_type'));
        const refPpmGroup_ = mzFilterSparseArray(mzGetLocalArray('gems_ppmGroup', versionLocal_, 'ppmGroupId', [], 'ppm_group'));

        modalPpmSetSelectAssetClass_.setRefStatus(refStatus_);
        modalPpmSetSelectAssetClass_.init();

        mainPpmSetFormClass_.setRefAssetGroup(refAssetGroup_);
        mainPpmSetFormClass_.setRefAssetCategory(refAssetCategory_);
        mainPpmSetFormClass_.setRefAssetType(refAssetType_);
        mainPpmSetFormClass_.setRefPpmGroup(refPpmGroup_);
        mainPpmSetFormClass_.setModalPpmSetSelectAssetClass(modalPpmSetSelectAssetClass_);
        mainPpmSetFormClass_.setModalConfirmDeleteClass(modalConfirmDeleteClass_);
        mainPpmSetFormClass_.init();
      } catch (e) {
        toastr['error'](e.message, _ALERT_TITLE_ERROR);
      }
      HideLoader();
    }, 200);
  });
</script>
</body>
</html>
