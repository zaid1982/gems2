<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>GEMS 2.0</title>
	<!-- Browser icon -->
	<link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Material Design Bootstrap -->
    <link rel="stylesheet" href="css/mdb.min.css">
    <!-- DataTables.net -->
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/dataTables.bootstrap4.min.css"/>
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/button.dataTables.min.css"/>
    <!-- Your custom styles (optional) -->
    <link href="css/style.css" rel="stylesheet">
    <link href="css/gems2-ui.css" rel="stylesheet">
    <!-- Your custom styles (optional) -->
    <style>
        /* Modern table enhancements for Drawing Records */
        #dtDwrData tbody td:first-child { 
            font-weight: 600; 
            color: var(--gems-muted); 
        }
        /* #dtDwrData tbody td:nth-child(2) { 
            font-weight: 600; 
            color: var(--gems-primary); 
        }
        #dtDwrData tbody td:nth-child(3) { 
            font-weight: 600; 
        } */
        
        /* Action column with download icon */
        #dtDwrData tbody td:last-child a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            margin-right: 4px;
            color: var(--gems-primary);
            transition: all 0.15s ease;
        }
        #dtDwrData tbody td:last-child a:hover {
            color: var(--gems-primary);
            transform: scale(1.1);
        }
    </style>
	<!-- JQuery -->
    <script type="text/javascript" src="js/jquery-3.7.0.min.js"></script>
	<!--JQuery Migrate-->
	<script type="text/javascript" src="js/jquery-migrate-3.4.0.min.js"></script>
</head>

<body class="fixed-sn light-blue-skin">
<!--Main Navigation-->
<header>
    <!-- Sidebar navigation -->
    <div class="includeHtml" id="h-nav_left"></div>
    <!-- Navbar -->
    <div class="includeHtml" id="h-nav_top"></div>
</header>
<!--Main layout-->
<main>
    <div class="container-fluid">
        <!--Section: Main panel-->
        <section class="mb-5 mt-lg-2 sectionDwrMain">
            <section class="gems-page-header client-header d-flex justify-content-between align-items-center mb-5">
                <div class="header-text">
                    <h2><i class="fas fa-drafting-compass mr-2"></i> Drawing Management</h2>
                    <p>Oversee drawing profiles, versioning, and associated metadata.</p>
                </div>
                <div class="header-actions">
                    <button type="button" id="btnDtDwrDataRefresh" class="btn btn-light btn-icon" aria-label="Refresh data" data-toggle="tooltip" data-placement="top" title="Refresh data"><i class="fas fa-sync-alt"></i></button>
                    <button type="button" id="btnDwrDataAdd" class="btn btn-primary btn-icon" aria-label="Add drawing" data-toggle="tooltip" data-placement="top" title="Add Drawing"><i class="fas fa-plus"></i></button>
                </div>
            </section>
            
            <div class="modern-table-card">
                <div class="table-header">
                    <div>
                        <a tabindex="0" role="button" class="btn btn-outline-white btn-rounded btn-sm px-2"
                           data-toggle="popover" data-trigger="focus" title="Drawing Records List"
                           data-content="All records of available drawing."><i class="fas fa-info mt-0 mx-1"></i></a>
                    </div>
                    <h3 class="table-title">Drawing Records</h3>
                    <div>
                        <!-- Export buttons will be added here by DataTable -->
                    </div>
                </div>
                <div class="table-body">
                    <div class="table-responsive">
                        <table id="dtDwrData" class="table display responsive">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Drawing ID No.</th>
                                <th>Drawing Title</th>
                                <th>Drawing Version</th>
                                <th>Published By</th>
                                <th>Published Date</th>
                                <th>Permission Level</th>
                                <th>Block</th>
                                <th>Level</th>
                                <th>Group</th>
                                <th>Remarks</th>
                                <th>Uploaded By</th>
                                <th>Uploaded Time</th>
                                <th style="width: 34px; min-width: 34px">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
							</tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div class="includeHtml" id="h-modal_change_password"></div>
    <div class="includeHtml" id="h-modal_confirm_delete"></div>
    <div class="includeHtml" id="h-modal_drawing"></div>
    <div class="includeHtml" id="h-modal_pdf"></div>

</main>

<!-- SCRIPTS -->
<script type="text/javascript">
    $('.includeHtml').each(function () {
        const divId = $(this).attr('id');
        $('#'+divId).load('html/'+divId.substr(2)+'.html?' + new Date().valueOf());
    });
</script>

<!-- Bootstrap tooltips -->
<script type="text/javascript" src="js/popper.min.js"></script>
<!-- Bootstrap core JavaScript -->
<script type="text/javascript" src="js/bootstrap.js"></script>
<!-- MDB core JavaScript -->
<script type="text/javascript" src="js/mdb.min.js"></script>
<!-- Crypto JS -->
<script type="text/javascript" src="js/addons/crypto.js"></script>
<!-- DataTables.net -->
<script type="text/javascript" src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.bootstrap4.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.html5.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.print.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.colvis.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/jszip.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/pdfmake.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/vfs_fonts.js"></script>
<!-- Moment JavaScript -->
<script type="text/javascript" src="js/addons/moment.min.js"></script>

<!--Custom scripts-->
<script type="text/javascript">
    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let changePasswordClass_;
    let modalConfirmDelete_;
	let modalDrawingClass_;
	let drawingRecordsClass_;

    document.addEventListener('DOMContentLoaded', function () {

        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                modalConfirmDelete_ = new ModalConfirmDelete();
				modalDrawingClass_ = new ModalDrawing();
                drawingRecordsClass_ = new MainDrawingRecords();

                const refAssetGroup_ = mzGetLocalArray('gems_assetGroup', versionLocal_, 'assetGroupId', [], 'asset_group');
                
				modalDrawingClass_.setClassFrom(drawingRecordsClass_);
				modalDrawingClass_.init();

                drawingRecordsClass_.setRefAssetGroup(refAssetGroup_);
				drawingRecordsClass_.setModalDrawingClass(modalDrawingClass_);
                drawingRecordsClass_.init();				
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }

            HideLoader();
        }, 200);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_confirm_delete.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_drawing.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_drawing_records.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>

</body>
</html>
