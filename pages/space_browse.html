<!DOCTYPE html>
<!--
  pages/space_browse.html — Tabler-migrated (P5-6 Space Explorer).

  Orphan page (no nav entry). Card grid + client filters only. No DataTables.
  Outbound: space_preview.html?id= and space_calendar.html?id=.
  Do not invent a menu item. Do not migrate include/modal_space_form.html.

  NEVER load next to Tabler: css/bootstrap.min.css, css/mdb.min.css,
  css/style.css, css/gems2-ui.css, js/popper.min.js, js/bootstrap*.js,
  js/mdb*.js, js/jquery-migrate-3.4.0.min.js, dataTables.bootstrap4.*,
  js/vendor/tabler/tabler-theme.min.js.
-->
<html lang="en" data-bs-theme="light" data-bs-navbar-position="vertical">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GEMS 2.0 - Space Explorer</title>
  <link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
  <link rel="stylesheet" href="css/fontawesome-pro-6.5.1-web/css/all.min.css">
  <link rel="stylesheet" href="css/vendor/tabler/tabler.min.css">
  <link rel="stylesheet" href="css/gems-theme.css">
  <style>
    .filter-select:disabled {
      background-color: var(--gems-bg-page);
      color: #94a3b8;
      cursor: not-allowed;
    }
    .results-summary { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:0.75rem; margin-top:0.75rem; color:var(--gems-text); }
    .space-grid { margin-top:1.25rem; }
    .space-card { border-radius: 16px; overflow:hidden; background:#fff; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); transition: transform .25s ease, box-shadow .25s ease; position:relative; height:100%; display:flex; flex-direction:column; border:1px solid rgba(148,163,184,0.25); }
    .space-card:hover { transform: translateY(-4px); box-shadow:0 16px 40px rgba(15, 23, 42, 0.12); }
    .space-card__media { position:relative; overflow:hidden; padding-top:66%; background:#e2e8f0; }
    .space-card__media img { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; transition: transform .35s ease; }
    .space-card:hover .space-card__media img { transform: scale(1.04); }
    .space-card__badge { position:absolute; top:16px; left:16px; padding:6px 12px; border-radius:999px; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#fff; background:rgba(15,23,42,0.65); }
    .space-card__badge--available { background: rgba(16,185,129,0.85); }
    .space-card__badge--reserved { background: rgba(59,130,246,0.9); }
    .space-card__badge--disabled { background: rgba(148,163,184,0.9); }
    .space-card__body { padding:20px 22px 16px 22px; flex:1; display:flex; flex-direction:column; }
    .space-card__title { font-size:1.15rem; font-weight:700; color:var(--gems-text); margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .space-card__subtitle { color:var(--gems-muted); font-size:.9rem; margin-bottom:12px; }
    .space-card__meta { display:flex; align-items:center; gap:8px; color:#1e293b; font-weight:500; font-size:.92rem; margin-bottom:8px; }
    .space-card__meta i { color:var(--gems-primary); }
    .space-card__stats { display:flex; gap:12px; flex-wrap:wrap; font-size:.82rem; color:#475569; margin-top:auto; }
    .space-card__actions { padding:18px 22px 22px 22px; display:flex; flex-wrap:wrap; gap:10px; }
    #spaceGridEmpty { border-radius:12px; background:#fff; padding:60px 30px; border:1px dashed #cbd5f5; text-align:center; color:#475569; font-size:1rem; }
    #spaceGridEmpty i { font-size:2.2rem; color:var(--gems-secondary); margin-bottom:12px; display:block; }
    @media (max-width: 767.98px){ .space-card__badge { top:12px; left:12px; } }
  </style>
</head>
<body class="gems-tabler">
<div class="page">
  <aside class="includeHtml navbar navbar-vertical navbar-expand-lg" id="h-nav_left_tabler"></aside>
  <div class="page-wrapper">
    <header class="includeHtml navbar navbar-expand-md" id="h-nav_top_tabler"></header>
    <div class="page-body">
      <div class="container-xl">

        <div class="page-header">
          <div class="row align-items-center g-2">
            <div class="col-12 col-sm">
              <h1 class="page-title"><i class="fas fa-globe-asia me-2 text-primary"></i>Space Explorer</h1>
              <div class="page-subtitle">Discover available rooms and spaces, compare at a glance, and jump straight into booking.</div>
            </div>
          </div>
        </div>

        <div class="card gems-filter-card mb-3">
          <div class="card-body">
            <div class="gems-form-grid">
              <div class="gems-field gems-field-4">
                <label class="form-label" for="txtSpaceSearch">Search</label>
                <input id="txtSpaceSearch" type="search" class="form-control" placeholder="Search by name, location, or site" autocomplete="off">
              </div>
              <div class="gems-field gems-field-3">
                <label class="form-label" for="optSpaceSite">Site</label>
                <select id="optSpaceSite" class="form-select filter-select">
                  <option value="all" selected>All sites</option>
                </select>
              </div>
              <div class="gems-field gems-field-3">
                <label class="form-label" for="optSpaceCapacity">Minimum capacity</label>
                <select id="optSpaceCapacity" class="form-select filter-select">
                  <option value="0" selected>Any size</option>
                  <option value="10">10+ seats</option>
                  <option value="20">20+ seats</option>
                  <option value="40">40+ seats</option>
                  <option value="80">80+ seats</option>
                </select>
              </div>
              <div class="gems-field gems-field-2 d-flex align-items-end">
                <div class="form-check form-switch mb-2">
                  <input type="checkbox" class="form-check-input" id="chkSpaceAvailable" checked>
                  <label class="form-check-label" for="chkSpaceAvailable">Show only bookable statuses</label>
                </div>
              </div>
            </div>
            <div class="results-summary">
              <div id="lblSpaceCount">Loading spaces…</div>
              <button type="button" id="btnSpaceReset" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-undo me-1"></i>Reset filters
              </button>
            </div>
          </div>
        </div>

        <div class="space-grid">
          <div class="row" id="spaceGrid"></div>
          <div id="spaceGridEmpty" class="d-none">
            <i class="far fa-images"></i>
            <div class="fw-bold mb-1">No spaces match your filters right now</div>
            <p class="mb-0">Try adjusting your search or capacity requirements to discover more spaces.</p>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<div class="includeHtml" id="h-modal_change_password"></div>

<script src="js/jquery-3.7.0.min.js"></script>
<script src="js/vendor/tabler/tabler.min.js"></script>
<script src="js/gems-bs5-jquery.js"></script>
<script src="js/modules/toastr.js"></script>
<script src="js/addons/crypto.js"></script>
<script src="js/addons/moment.min.js"></script>
<script>
  $('.includeHtml').each(function () {
    const divId = $(this).attr('id');
    $('#' + divId).load('html/' + divId.substr(2) + '.html?' + new Date().valueOf());
  });
</script>
<script>
  document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/gems-tabler-ui.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/main_space_browse.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
</script>
</body>
</html>
