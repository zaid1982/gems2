<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>GEMS 2.0</title>
  <link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
  <link rel="stylesheet" href="css/fontawesome-pro-6.5.1-web/css/all.min.css">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/mdb.min.css">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/gems2-ui.css" rel="stylesheet">
  <script type="text/javascript" src="js/jquery-3.7.0.min.js"></script>
  <script type="text/javascript" src="js/jquery-migrate-3.4.0.min.js"></script>
  <style>
    :root {
      --primary-color: var(--gems-primary);
      --primary-dark: var(--gems-primary-dark);
      --card-shadow-lg: 0 10px 30px -12px rgba(15, 23, 42, 0.25);
      --card-shadow: 0 20px 45px -20px rgba(30, 64, 175, 0.45);
      --border-radius-xl: 22px;
      --muted: var(--gems-muted);
    }
    body { background: var(--gems-bg-page); }
    .space-browse-header { margin: 32px 0 28px 0; padding: 40px 32px; }
    .space-browse-header .header-text h2 { font-size: 2.4rem; font-weight: 700; margin-bottom: 10px; }
    .space-browse-header .header-text p { font-size: 1.05rem; opacity: 0.95; margin: 0; }

    .filter-card { background:#fff; border-radius:24px; padding:24px 26px; box-shadow:0 20px 45px -26px rgba(15,23,42,0.35); }
    .filter-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:18px; }
    .filter-label { font-size: .78rem; text-transform: uppercase; font-weight:600; letter-spacing:.08em; color:var(--muted); margin-bottom:6px; }
    .filter-card .form-control,
    .filter-card .custom-select {
      border-radius:14px;
      border:1px solid #e2e8f0;
      padding:10px 14px;
      box-shadow:none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .filter-card .form-control:focus,
    .filter-card .custom-select:focus {
      border-color: rgba(79,70,229,0.75);
      box-shadow:0 0 0 0.15rem rgba(79,70,229,0.1);
    }
    .filter-card .filter-select:disabled {
      background-color:var(--gems-bg-page);
      color:#94a3b8;
      cursor:not-allowed;
    }
    /* .filter-card .select-wrapper { margin-bottom: 0; }
    .filter-card .select-wrapper input.select-dropdown {
      border-radius:14px;
      border:1px solid #e2e8f0;
      padding:10px 14px;
      height:auto;
      font-size:14px;
      line-height:1.3;
      box-shadow:none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .filter-card .select-wrapper input.select-dropdown[disabled] {
      background-color:var(--gems-bg-page);
      color:#94a3b8;
      cursor:not-allowed;
    }
    .filter-card .select-wrapper input.select-dropdown:focus {
      border-color: rgba(79,70,229,0.75);
      box-shadow:0 0 0 0.15rem rgba(79,70,229,0.1);
    }
    .filter-card .select-wrapper span.caret { color:#4a5568; } */
    .custom-control-label { font-weight: 500; color:var(--gems-text); }
    .results-summary { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-top:22px; color:var(--gems-text); }

    .space-grid { margin-top:36px; }
    .space-card { border-radius: var(--border-radius-xl); overflow:hidden; background:#fff; box-shadow: var(--card-shadow); transition: transform .25s ease, box-shadow .25s ease; position:relative; height:100%; display:flex; flex-direction:column; }
    .space-card:hover { transform: translateY(-6px); box-shadow:0 25px 55px -28px rgba(15, 23, 42, 0.65); }
    .space-card__media { position:relative; overflow:hidden; padding-top:66%; background:#e2e8f0; }
    .space-card__media img { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; transition: transform .35s ease; }
    .space-card:hover .space-card__media img { transform: scale(1.04); }
    .space-card__badge { position:absolute; top:16px; left:16px; padding:6px 12px; border-radius:999px; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#fff; background:rgba(15,23,42,0.65); backdrop-filter:blur(6px); }
    .space-card__badge--available { background: rgba(16,185,129,0.85); }
    .space-card__badge--reserved { background: rgba(59,130,246,0.9); }
    .space-card__badge--disabled { background: rgba(148,163,184,0.9); }
    .space-card__favorite { position:absolute; top:16px; right:16px; width:38px; height:38px; border-radius:999px; background:rgba(255,255,255,0.85); display:flex; align-items:center; justify-content:center; color:#ef4444; font-size:1rem; box-shadow:0 10px 20px -12px rgba(15,23,42,0.45); }
    .space-card__body { padding:20px 22px 16px 22px; flex:1; display:flex; flex-direction:column; }
    .space-card__title { font-size:1.15rem; font-weight:700; color:var(--gems-text); margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .space-card__subtitle { color:var(--muted); font-size:.9rem; margin-bottom:12px; }
    .space-card__meta { display:flex; align-items:center; gap:8px; color:#1e293b; font-weight:500; font-size:.92rem; margin-bottom:8px; }
    .space-card__meta i { color:var(--gems-primary); }
    .space-card__stats { display:flex; gap:12px; flex-wrap:wrap; font-size:.82rem; color:#475569; margin-top:auto; }
    .space-card__actions { padding:18px 22px 22px 22px; display:flex; flex-wrap:wrap; gap:10px; }
    .btn-outline-primary { border-radius:12px; font-weight:600; }
    .btn-primary { border-radius:12px; font-weight:600; }

    #spaceGridEmpty { border-radius:20px; background:#fff; padding:60px 30px; box-shadow:0 20px 35px -28px rgba(15,23,42,0.4); text-align:center; color:#475569; font-size:1rem; }
    #spaceGridEmpty i { font-size:2.2rem; color:var(--gems-secondary); margin-bottom:12px; }

  @media (max-width: 991.98px){ .space-browse-header { padding:32px 24px; } }
    @media (max-width: 767.98px){ .space-card__badge { top:12px; left:12px; } }
  </style>
</head>
<body class="fixed-sn light-blue-skin">
<header>
  <div class="includeHtml" id="h-nav_left"></div>
  <div class="includeHtml" id="h-nav_top"></div>
</header>
<main>
  <div class="container-fluid">
    <section class="mb-4 mt-lg-4">
      <div class="gems-page-header space-browse-header">
        <div class="header-text">
          <h2><i class="fas fa-globe-asia mr-3"></i>Space Explorer</h2>
          <p>Discover available rooms and spaces, compare at a glance, and jump straight into booking.</p>
        </div>
      </div>

      <div class="filter-card">
        <div class="filter-grid">
          <div>
            <div class="filter-label">Search</div>
            <input id="txtSpaceSearch" type="text" class="form-control" placeholder="Search by name, location, or site">
          </div>
          <div>
            <div class="filter-label">Site</div>
            <select id="optSpaceSite" class="custom-select filter-select" data-mdb-skip="true">
              <option value="all" selected>All sites</option>
            </select>
          </div>
          <div>
            <div class="filter-label">Minimum capacity</div>
            <select id="optSpaceCapacity" class="custom-select filter-select" data-mdb-skip="true">
              <option value="0" selected>Any size</option>
              <option value="10">10+ seats</option>
              <option value="20">20+ seats</option>
              <option value="40">40+ seats</option>
              <option value="80">80+ seats</option>
            </select>
          </div>
          <div class="align-self-end">
            <div class="custom-control custom-switch">
              <input type="checkbox" class="custom-control-input" id="chkSpaceAvailable" checked>
              <label class="custom-control-label" for="chkSpaceAvailable">Show only bookable statuses</label>
            </div>
          </div>
        </div>
        <div class="results-summary">
          <div id="lblSpaceCount">Loading spaces…</div>
          <button type="button" id="btnSpaceReset" class="btn btn-light btn-sm px-3"><i class="fas fa-undo mr-1"></i>Reset filters</button>
        </div>
      </div>

      <div class="space-grid">
        <div class="row" id="spaceGrid">
          <!-- cards injected here -->
        </div>
        <div id="spaceGridEmpty" class="d-none">
          <i class="far fa-images"></i>
          <div class="font-weight-bold mb-1">No spaces match your filters right now</div>
          <p class="mb-0">Try adjusting your search or capacity requirements to discover more spaces.</p>
        </div>
      </div>
    </section>
    <div class="includeHtml" id="h-modal_change_password"></div>
  </div>
</main>

<script type="text/javascript" src="js/popper.min.js"></script>
<script type="text/javascript" src="js/bootstrap.min.js"></script>
<script type="text/javascript" src="js/mdb.min.js"></script>
<script type="text/javascript" src="js/modules/toastr.js"></script>
<script type="text/javascript" src="js/addons/crypto.js"></script>
<script type="text/javascript" src="js/addons/moment.min.js"></script>
<script type="text/javascript" src="js/common.js"></script>
<script type="text/javascript" src="js/pages/main_space_browse.js"></script>
</body>
</html>
