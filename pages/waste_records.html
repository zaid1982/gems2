<!DOCTYPE html>
<!--
  pages/waste_records.html — Tabler-migrated (P3A Waste).

  Asset stack is a verbatim copy of html/head_tabler.html and
  html/scripts_tabler.html. Page extras: moment, DataTables Buttons exports.

  NEVER load next to Tabler: css/bootstrap.min.css, css/mdb.min.css,
  css/style.css, css/gems2-ui.css, js/popper.min.js, js/bootstrap*.js,
  js/mdb*.js, js/jquery-migrate-3.4.0.min.js, dataTables.bootstrap4.*,
  js/vendor/tabler/tabler-theme.min.js.
-->
<html lang="en" data-bs-theme="light" data-bs-navbar-position="vertical">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GEMS 2.0 - Waste Records</title>
  <link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
  <link rel="stylesheet" href="css/fontawesome-pro-6.5.1-web/css/all.min.css">
  <link rel="stylesheet" href="css/vendor/tabler/tabler.min.css">
  <link rel="stylesheet" href="js/vendor/datatables/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="js/vendor/datatables/css/buttons.bootstrap5.min.css">
  <link rel="stylesheet" href="css/gems-theme.css">
</head>
<body class="gems-tabler">
<div class="page">
  <aside class="includeHtml navbar navbar-vertical navbar-expand-lg" id="h-nav_left_tabler"></aside>
  <div class="page-wrapper">
    <header class="includeHtml navbar navbar-expand-md" id="h-nav_top_tabler"></header>
    <div class="page-body">
      <div class="container-xl">

        <div class="page-header">
          <div class="row align-items-center g-2">
            <div class="col-12 col-sm">
              <h1 class="page-title"><i class="fas fa-clipboard-list me-2 text-primary"></i>Waste Record</h1>
              <div class="page-subtitle">Search, view and add scheduled waste records.</div>
            </div>
            <div class="col-12 col-sm-auto">
              <button type="button" class="btn btn-outline-secondary" id="btnWtrRefresh"
                      data-bs-toggle="tooltip" title="Refresh data" aria-label="Refresh data">
                <i class="fas fa-sync-alt me-2"></i>Refresh
              </button>
              <a class="btn btn-primary" href="p_waste_record_form" title="Add waste record" aria-label="Add waste record">
                <i class="fas fa-plus me-2"></i>Add Record
              </a>
            </div>
          </div>
        </div>

        <div class="row row-cards mb-3">
          <div class="col-6 col-lg-3">
            <div class="card"><div class="card-body py-2">
              <div class="text-secondary" style="font-size:.75rem">Final</div>
              <div class="h2 mb-0" id="mFinal">-</div>
              <div class="text-secondary" style="font-size:.75rem">Official register</div>
            </div></div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="card"><div class="card-body py-2">
              <div class="text-secondary" style="font-size:.75rem">Draft</div>
              <div class="h2 mb-0 text-warning" id="mDraft">-</div>
              <div class="text-secondary" style="font-size:.75rem">Not in totals</div>
            </div></div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="card"><div class="card-body py-2">
              <div class="text-secondary" style="font-size:.75rem">Produced</div>
              <div class="h2 mb-0 text-success" id="mProd">-</div>
              <div class="text-secondary" style="font-size:.75rem">Final only</div>
            </div></div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="card"><div class="card-body py-2">
              <div class="text-secondary" style="font-size:.75rem">Disposed</div>
              <div class="h2 mb-0 text-danger" id="mDisp">-</div>
              <div class="text-secondary" style="font-size:.75rem">Final only</div>
            </div></div>
          </div>
        </div>

        <div class="card gems-filter-card mb-3">
          <div class="card-body">
            <div class="gems-form-grid">
              <div class="gems-field gems-field-6">
                <label class="form-label" for="txtWtrSearch">Search</label>
                <input type="text" id="txtWtrSearch" class="form-control" placeholder="Reference or external ref">
              </div>
              <div class="gems-field gems-field-6">
                <label class="form-label" for="optWtrSite">Premise</label>
                <select id="optWtrSite" class="form-select"><option value="">All authorised</option></select>
              </div>
              <div class="gems-field gems-field-6">
                <label class="form-label" for="optWtrType">Type</label>
                <select id="optWtrType" class="form-select">
                  <option value="">All</option>
                  <option value="P">Produced</option>
                  <option value="D">Disposed</option>
                </select>
              </div>
              <div class="gems-field gems-field-6">
                <label class="form-label" for="optWtrStatus">Status</label>
                <select id="optWtrStatus" class="form-select">
                  <option value="">All</option>
                  <option value="DRAFT">Draft</option>
                  <option value="FINAL">Final</option>
                  <option value="CANCELLED">Cancelled</option>
                </select>
              </div>
              <div class="gems-field gems-field-12 gems-field-actions">
                <button class="btn btn-ghost-secondary btn-sm ms-auto" type="button"
                        data-bs-toggle="collapse" data-bs-target="#wtrMoreFilters"
                        aria-expanded="false" aria-controls="wtrMoreFilters">
                  <i class="fas fa-sliders-h me-1"></i>More filters
                </button>
              </div>
            </div>
            <div class="collapse" id="wtrMoreFilters">
              <div class="gems-form-grid mt-2 pt-2" style="border-top:1px solid var(--gems-border)">
                <div class="gems-field gems-field-6">
                  <label class="form-label" for="optWtrSw">SW Code</label>
                  <select id="optWtrSw" class="form-select"><option value="">All</option></select>
                </div>
                <div class="gems-field-pair">
                  <div class="gems-field">
                    <label class="form-label" for="txtWtrFrom">From</label>
                    <input type="date" id="txtWtrFrom" class="form-control">
                  </div>
                  <div class="gems-field">
                    <label class="form-label" for="txtWtrTo">To</label>
                    <input type="date" id="txtWtrTo" class="form-control">
                  </div>
                </div>
              </div>
            </div>
            <div class="d-flex flex-wrap align-items-center gap-2 mt-2 text-secondary" style="font-size:.75rem">
              <div id="lblWtrCount">Loading…</div>
              <div id="lblWtrUpdated" class="ms-auto text-nowrap"><i class="far fa-clock me-1"></i>Last refreshed: <strong>-</strong></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title mb-0"><i class="fas fa-layer-group me-2 text-primary"></i>Waste records</h3>
            <div class="gems-card-toolbar" id="btnDtWtrExport"></div>
          </div>
          <table id="dtWtr" class="table table-vcenter card-table table-hover mb-0">
            <thead>
              <tr>
                <th>#</th>
                <th>Reference</th>
                <th>Event Date</th>
                <th>Premise</th>
                <th>Type</th>
                <th>SW Code</th>
                <th>Quantity</th>
                <th>Balance Effect</th>
                <th>Evidence</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

      </div>
    </div>
  </div>
</div>

<div class="includeHtml" id="h-modal_change_password"></div>

<script src="js/jquery-3.7.0.min.js"></script>
<script src="js/vendor/tabler/tabler.min.js"></script>
<script src="js/gems-bs5-jquery.js"></script>
<script src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script src="js/vendor/datatables/js/dataTables.bootstrap5.min.js"></script>
<script src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script src="js/vendor/datatables/js/buttons.bootstrap5.min.js"></script>
<script src="js/modules/toastr.js"></script>
<script src="js/addons/crypto.js"></script>
<script src="js/vendor/datatables/js/buttons.html5.min.js"></script>
<script src="js/vendor/datatables/js/buttons.print.min.js"></script>
<script src="js/vendor/datatables/js/buttons.colvis.min.js"></script>
<script src="js/vendor/datatables/js/jszip.min.js"></script>
<script src="js/vendor/datatables/js/pdfmake.min.js"></script>
<script src="js/vendor/datatables/js/vfs_fonts.js"></script>
<script src="js/addons/moment.min.js"></script>
<script>
  $('.includeHtml').each(function () {
    const divId = $(this).attr('id');
    $('#' + divId).load('html/' + divId.substr(2) + '.html?' + new Date().valueOf());
  });
</script>
<script>
  document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/gems-tabler-ui.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/waste_common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/main_waste_records.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  let changePasswordClass_;
  document.addEventListener('DOMContentLoaded', function () {
    ShowLoader();
    setTimeout(function () {
      try { initiatePages(); changePasswordClass_ = new ModalChangePassword(); new MainWasteRecords().init(); }
      catch (e) { toastr['error'](e.message, _ALERT_TITLE_ERROR); }
      HideLoader();
    }, 250);
  });
</script>
</body>
</html>
