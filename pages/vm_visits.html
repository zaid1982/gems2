<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>GEMS 2.0 - Visitor Submissions</title>
  <link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/mdb.min.css">
  <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/dataTables.bootstrap4.min.css"/>
  <link href="css/style.css" rel="stylesheet">
  <link href="css/gems2-ui.css" rel="stylesheet">
  <style>
    :root { --vm-bg:var(--gems-bg-page); --vm-muted:var(--gems-muted); --vm-border:var(--gems-border); --vm-text:var(--gems-text); }
    body { background:var(--vm-bg); color:var(--vm-text); }
    .page { max-width: 1140px; margin: 0 auto; padding: 2rem 0; }
    .card, .btn, .form-control, .badge, .modal-content, .input-group-text { border-radius: 0 !important; }
    .subtitle { color: var(--vm-muted); }
    .table td { vertical-align: middle; }
    .text-ellipsis { max-width: 380px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
  <!--[if lt IE 9]>
  <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
  <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
  <![endif]-->
  <!-- Pace loader to avoid FOUC (optional) -->
</head>
<body class="fixed-sn light-blue-skin">

<header class="global-header">
  <div class="company-logo">
    <img src="img/icon/gfm-logo-transparent.png" alt="GFM Logo">
  </div>
  <div class="container-fluid"><div class="row mt-3"></div></div>
  <div id="mdb-lightbox-ui"></div>
 </header>

<main style="padding-top: 3rem;">
  <div class="container-fluid page">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h3 class="mb-1"><i class="fas fa-users me-2"></i>Visitor Submissions</h3>
        <div class="subtitle">Recent submissions for this site</div>
      </div>
      <div class="d-flex align-items-center">
        <a id="newBtn" class="btn btn-primary"><i class="fas fa-plus me-1"></i>New Registration</a>
      </div>
    </div>

    <div id="siteNotice" class="alert alert-info d-none" role="alert">
      Please provide a site id in the URL, e.g. vm_visits.html?site=19
    </div>

    <div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table id="visitsTable" class="table table-striped table-bordered" style="width:100%">
            <thead>
              <tr>
                <th>Ref ID</th>
                <th>Arrived At</th>
                <th>Name</th>
                <th>Contact</th>
                <th>IC/ID</th>
                <th>Company</th>
                <th>Email</th>
                <th>Party</th>
                <th>Host</th>
                <th>Status</th>
                <th>Purpose</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<script type="text/javascript" src="js/jquery-3.7.0.min.js"></script>
<script type="text/javascript" src="js/jquery-migrate-3.4.0.min.js"></script>
<script type="text/javascript" src="js/popper.min.js"></script>
<script type="text/javascript" src="js/bootstrap.js"></script>
<script type="text/javascript" src="js/mdb.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.bootstrap4.min.js"></script>
<script type="text/javascript">
  (function(){
    const params = new URLSearchParams(window.location.search);
    const siteId = params.get('site');
    const $notice = $('#siteNotice');
    const $table = $('#visitsTable');
    const $newBtn = $('#newBtn');
    if(!siteId){ $notice.removeClass('d-none'); $newBtn.addClass('disabled'); return; }
    $newBtn.attr('href', 'vm_visit.html?site=' + encodeURIComponent(siteId));

    function render(rows){
      const tbody = $table.find('tbody').empty();
      rows.forEach(r=>{
        const purpose = $('<span>')
          .addClass('text-ellipsis')
          .attr('title', r.purpose || '')
          .text(r.purpose || '');
        const tr = $('<tr/>')
          .append($('<td/>').text(r.visit_id))
          .append($('<td/>').text(r.arrived_at || ''))
          .append($('<td/>').text(r.name || ''))
          .append($('<td/>').text(r.contact_no || ''))
          .append($('<td/>').text(r.ic_no || ''))
          .append($('<td/>').text(r.company || ''))
          .append($('<td/>').text(r.email || ''))
          .append($('<td/>').text(r.party_size || ''))
          .append($('<td/>').text(r.host_name || ''))
          .append($('<td/>').text(r.status || ''))
          .append($('<td/>').append(purpose));
        tbody.append(tr);
      });
      // init or re-init DataTable
      if ( $.fn.dataTable.isDataTable('#visitsTable') ) {
        $table.DataTable().destroy();
      }
      $table.DataTable({
        order: [[1,'desc']],
        pageLength: 25,
        autoWidth: false,
        columnDefs: [
          { targets: [10], orderable: false }
        ]
      });
    }

    fetch('api/vm.php?site_id=' + encodeURIComponent(siteId) + '&limit=200')
      .then(r=>r.json())
      .then(resp=>{
        if(!resp || resp.success !== true || !Array.isArray(resp.result)){
          throw new Error(resp && resp.error ? resp.error : 'Failed to load data');
        }
        render(resp.result);
      })
      .catch(err=>{
        console.error(err);
        alert('Unable to load visitor submissions: ' + err.message);
      });
  })();
 </script>
 </body>
 </html>
