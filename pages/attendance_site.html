<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <style>
        :root {
            --attendance-primary: var(--gems-primary);
            --attendance-accent: var(--gems-secondary);
            --attendance-bg: var(--gems-bg-page);
            --attendance-text: var(--gems-text);
            --attendance-muted: var(--gems-muted);
            --attendance-card-radius: var(--gems-radius-lg);
            --attendance-shadow: var(--gems-shadow-lg);
            --attendance-card-shadow: var(--gems-card-shadow);
        }

        body { background: var(--attendance-bg); }
        main { padding: 1.5rem 0 3rem; }
        .fc .fc-toolbar-title { font-size: 20px; }
        #map { height: 100%; }

        .attendance-site-section { margin-top: 1.5rem; }

        .attendance-page-header {
            padding: 36px 32px;
            border-radius: 28px;
            margin-bottom: 28px;
        }

        .attendance-page-header .header-text { max-width: 720px; }
        .attendance-page-header .header-text h2 { font-size: 2.15rem; font-weight: 700; margin-bottom: 0.6rem; }
        .attendance-page-header .header-text p { margin: 0; font-size: 1.02rem; opacity: 0.96; }

        .attendance-header-actions { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 12px; }
        .attendance-header-actions .btn {
            border-radius: 999px;
            padding: 0.55rem 1.5rem;
            font-weight: 600;
            min-width: 150px;
            box-shadow: none;
        }

        #divSacBack, #divSacActivate, #divSacDeactivate { display: inline-flex; }

        .attendance-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .attendance-metrics .metric-card {
            background: #fff;
            border-radius: var(--attendance-card-radius);
            padding: 22px 24px;
            box-shadow: var(--attendance-card-shadow);
            position: relative;
            overflow: hidden;
        }

        .attendance-metrics .metric-card::after {
            content: '';
            position: absolute;
            bottom: -40px;
            right: -40px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(var(--gems-primary-rgb), 0.08);
        }

        .metric-label { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--attendance-muted); margin-bottom: 6px; }
        .metric-value { font-size: 2.05rem; font-weight: 700; color: var(--attendance-text); }
        .metric-subtext { font-size: 0.86rem; color: var(--attendance-muted); margin-top: 4px; }

        .attendance-filter-card {
            background: #fff;
            border-radius: 26px;
            padding: 24px 28px;
            box-shadow: 0 25px 50px -32px rgba(15, 23, 42, 0.35);
            margin-bottom: 28px;
        }

        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
        .filter-label { font-size: .78rem; text-transform: uppercase; font-weight: 600; letter-spacing: .08em; color: var(--attendance-muted); margin-bottom: 6px; }

        .filter-pill-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .filter-pill-group a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.4rem 0.95rem;
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            color: var(--attendance-text);
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            transition: all .2s ease;
            background: rgba(248, 250, 252, 0.65);
        }

            .filter-pill-group a:hover, .filter-pill-group a.active {
            background: rgba(var(--gems-primary-rgb), 0.12);
            border-color: rgba(var(--gems-primary-rgb), 0.45);
            color: var(--attendance-primary);
        }

            .filter-pill-group a.text-white {
                background: var(--attendance-primary);
                border-color: rgba(var(--gems-primary-rgb), 0.6);
                color: #fff !important;
            }

        .results-summary {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
            color: var(--attendance-text);
            justify-content: space-between;
        }

        .summary-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--attendance-muted);
            background: rgba(148, 163, 184, 0.12);
            border-radius: 999px;
            padding: 6px 14px;
        }

        .summary-pill i { color: var(--attendance-accent); }

        .attendance-charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }

        .chart-card {
            background: #fff;
            border-radius: 24px;
            box-shadow: var(--attendance-card-shadow);
            padding: 18px 20px;
            min-height: 320px;
        }

        .chart-card h5 {
            font-weight: 700;
            color: var(--attendance-text);
            margin-bottom: 14px;
        }

        .attendance-data-card {
            background: #fff;
            border-radius: 26px;
            box-shadow: 0 28px 60px -40px rgba(15, 23, 42, 0.42);
            padding: 20px 24px;
            margin-bottom: 28px;
        }

        .attendance-data-card h6 { font-weight: 700; color: var(--attendance-text); margin-bottom: 18px; }

        .attendance-data-card .table-responsive { border-radius: 18px; overflow: hidden; }
        .attendance-data-card table { width: 100% !important; }
        .attendance-data-card thead th {
            background: #eef2ff;
            color: var(--gems-primary-dark);
            font-weight: 700;
            border: none;
            padding: 0.85rem 0.75rem;
            text-transform: uppercase;
            font-size: 0.74rem;
            letter-spacing: .06em;
        }

        .attendance-data-card tbody td {
            border-bottom: 1px solid var(--gems-bg-page);
            padding: 0.85rem 0.75rem;
            vertical-align: middle;
            font-size: 0.93rem;
            color: var(--attendance-text);
        }

        .attendance-data-card tbody tr:last-child td { border-bottom: none; }

        .table-grid-width {
            width: 32px;
            min-width: 32px;
        }

        .table-grid-cut-text {
            padding-left: 3px !important;
            text-overflow: ellipsis;
            overflow: hidden;
            width: 135px;
            white-space: nowrap;
        }

        .table-grid-small-text th {
            font-size: 12px;
            text-align: center;
            background-color: #eef2ff;
        }

        .table-grid-small-text td {
            font-size: 12px;
            text-align: center;
        }

        .table-grid-small-text > tbody > tr > td {
            padding-left: 1px !important;
            padding-right: 1px !important;
        }

        .table-grid-small-text > thead > tr > th {
            padding-top: 3px !important;
            padding-left: 1px !important;
            padding-right: 1px !important;
        }

        .attendance-planner-actions { margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 12px; }

        .attendance-planner-actions .btn { border-radius: 999px; font-weight: 600; }

        .dataTables_wrapper .dataTables_filter { display: none !important; }
        .dataTables_wrapper .dataTables_info { padding-top: 1rem; color: var(--attendance-muted); font-size: 0.85rem; }
        .dataTables_wrapper .dataTables_paginate { padding-top: 0.75rem; }
        .dataTables_wrapper .dataTables_paginate .paginate_button {
            border-radius: 12px !important;
            border: none !important;
            margin: 0 3px !important;
            padding: 0.35rem 0.75rem !important;
            background: #e2e8f0 !important;
            color: #1e293b !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button.current,
        .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
            background: var(--attendance-primary) !important;
            color: #fff !important;
        }

        @media (max-width: 991.98px) {
            .attendance-page-header { padding: 28px 24px; }
            .attendance-page-header .header-text h2 { font-size: 1.85rem; }
        }

        @media (max-width: 767.98px) {
            main { padding-top: 1rem; }
            .attendance-page-header { padding: 24px 20px; }
            .attendance-header-actions { width: 100%; }
            .attendance-header-actions .btn { width: 100%; min-width: 0; }
            .attendance-data-card { padding: 18px 18px; }
            .attendance-data-card thead { display: none; }
            .attendance-data-card table { display: block; }
            .attendance-data-card tbody { display: block; width: 100%; }
            .attendance-data-card tbody tr {
                display: block;
                margin-bottom: 14px;
                border: 1px solid #e2e8f0;
                border-radius: 18px;
                box-shadow: 0 12px 28px -22px rgba(15, 23, 42, 0.35);
                overflow: hidden;
            }
            .attendance-data-card tbody td {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0.75rem 0.95rem;
                border-bottom: 1px solid var(--gems-bg-page);
            }
            .attendance-data-card tbody tr td:last-child { border-bottom: none; }
            .attendance-data-card tbody td::before {
                content: attr(data-label);
                font-weight: 600;
                color: var(--attendance-muted);
                margin-right: 12px;
                text-align: left;
            }
        }
    </style>
</head>

<!--Custom scripts-->
<script type="text/javascript">
    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let changePasswordClass_;
    let confirmSubmitClass_;
    let modalAttendanceGroupClass_;
    let modalAttendanceParticipantClass_;
    let modalAttendanceDailyClass_;
    let sectionAttendanceSiteClass_;
    let sectionAttendanceGroupClass_;
    let googleMapsDrawingPolygonClass_;
    let googleMapsDrawingPolygonClass2_;

    document.addEventListener('DOMContentLoaded', function () {

        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                confirmSubmitClass_ = new ModalConfirmSubmit();
                modalAttendanceGroupClass_ = new ModalAttendanceGroup();
                modalAttendanceParticipantClass_ = new ModalAttendanceParticipant();
                modalAttendanceDailyClass_ = new ModalAttendanceDaily();
                sectionAttendanceSiteClass_ = new SectionAttendanceSite();
                sectionAttendanceGroupClass_ = new SectionAttendanceGroup();
                googleMapsDrawingPolygonClass_ = new GoogleMapsDrawingPolygon();
                googleMapsDrawingPolygonClass2_ = new GoogleMapsDrawingPolygon();

                const refStatus_ = mzGetLocalArrayV2('gems_status2', versionLocal_, 'status/ref');
                const refUser_ = mzGetLocalArrayV2('gems_user2', versionLocal_, 'user/ref');
                const refDesignation_ = mzGetLocalArrayV2('gems_designation2', versionLocal_, 'designation/ref');
                const refAssetGroup_ = mzGetLocalArrayV2('gems_assetGroup2', versionLocal_, 'asset_group/ref');
                const refAttGroup_ = mzGetLocalArrayV2('gems_attGroup', versionLocal_, 'att_group/ref');
                const refAttType_ = mzGetLocalArrayV2('gems_attType', versionLocal_, 'att_type/ref');
                const refSite_ = mzGetLocalArrayV2('gems_site2', versionLocal_, 'site/ref');

                modalAttendanceGroupClass_.setRefUser(refUser_);
                modalAttendanceGroupClass_.setRefAssetGroup(refAssetGroup_);
                modalAttendanceGroupClass_.setGoogleMapsDrawingPolygon(googleMapsDrawingPolygonClass_);
                modalAttendanceGroupClass_.setClassFrom(sectionAttendanceSiteClass_);
                modalAttendanceGroupClass_.init();

                modalAttendanceParticipantClass_.setRefDesignation(refDesignation_);
                modalAttendanceParticipantClass_.setRefAttGroup(refAttGroup_);
                modalAttendanceParticipantClass_.setRefAttType(refAttType_);
                modalAttendanceParticipantClass_.setRefAssetGroup(refAssetGroup_);
                modalAttendanceParticipantClass_.setClassFrom(sectionAttendanceSiteClass_)
                modalAttendanceParticipantClass_.init();

                modalAttendanceDailyClass_.setRefStatus(refStatus_);
                modalAttendanceDailyClass_.setRefUser(refUser_);
                modalAttendanceDailyClass_.setRefDesignation(refDesignation_);
                modalAttendanceDailyClass_.setRefAssetGroup(refAssetGroup_);
                modalAttendanceDailyClass_.setRefAttGroup(refAttGroup_);
                modalAttendanceDailyClass_.setRefAttType(refAttType_);
                modalAttendanceDailyClass_.setGoogleMapsDrawingPolygon(googleMapsDrawingPolygonClass_);
                //modalAttendanceDailyClass_.setClassFrom(sectionAttendancePlannerClass_);
                modalAttendanceDailyClass_.init();

                sectionAttendanceGroupClass_.setRefStatus(refStatus_);
                sectionAttendanceGroupClass_.setRefUser(refUser_);
                sectionAttendanceGroupClass_.setRefAssetGroup(refAssetGroup_);
                sectionAttendanceGroupClass_.setRefAttType(refAttType_);
                sectionAttendanceGroupClass_.setRefAttGroup(refAttGroup_);
                sectionAttendanceGroupClass_.setRefSite(refSite_);
                sectionAttendanceGroupClass_.setModalAttendanceDailyClass(modalAttendanceDailyClass_);
                sectionAttendanceGroupClass_.setGoogleMapsDrawingPolygon(googleMapsDrawingPolygonClass2_);
                sectionAttendanceGroupClass_.setClassFrom(sectionAttendanceSiteClass_);
                sectionAttendanceGroupClass_.init();

                sectionAttendanceSiteClass_.setRefStatus(refStatus_);
                sectionAttendanceSiteClass_.setRefUser(refUser_);
                sectionAttendanceSiteClass_.setRefAssetGroup(refAssetGroup_);
                sectionAttendanceSiteClass_.setRefAttType(refAttType_);
                sectionAttendanceSiteClass_.setModalConfirmSubmitClass(confirmSubmitClass_);
                sectionAttendanceSiteClass_.setModalAttendanceGroupClass(modalAttendanceGroupClass_);
                sectionAttendanceSiteClass_.setModalAttendanceParticipantClass(modalAttendanceParticipantClass_);
                sectionAttendanceSiteClass_.setSectionAttendanceGroupClass(sectionAttendanceGroupClass_);
                sectionAttendanceSiteClass_.setModalAttendanceDailyClass(modalAttendanceDailyClass_);
                //sectionAttendanceSiteClass_.setClassFrom(attendanceClass_);
                sectionAttendanceSiteClass_.init();

                if (mzIsRoleExist('19,2')) {
                    const siteId = mzGetUserInfoByParam('siteId');
                    sectionAttendanceSiteClass_.load(parseInt(siteId));
                } else {
                    throw new Error('You do not have a Site Admin role therefore not eligible to preview this page');
                }
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }
            HideLoader();
        }, 200);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_confirm_submit.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_attendance_group.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_attendance_participant.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_attendance_daily.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/section_attendance_group.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/section_attendance_site.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>
