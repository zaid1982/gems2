<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>GEMS 2.0</title>
    <link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
    <link rel="stylesheet" href="css/fontawesome-pro-6.5.1-web/css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/mdb.min.css">
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/dataTables.bootstrap4.min.css"/>
    <link href="css/style.css" rel="stylesheet">
  <link href="css/gems2-ui.css" rel="stylesheet">

    <script type="text/javascript" src="js/jquery-3.7.0.min.js"></script>
    <script type="text/javascript" src="js/jquery-migrate-3.4.0.min.js"></script>
    <style>
      :root {
        --primary-color: var(--gems-primary);
        --primary-dark: var(--gems-primary-dark);
        --light-bg: var(--gems-bg-page);
      }
      .main-content-card { background:#fff; border-radius:.5rem; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
      .main-content-card .card-header { background: var(--gems-bg-page); color:#000; border-top-left-radius:.5rem; border-top-right-radius:.5rem; padding:.75rem 1rem; display:flex; align-items:center; justify-content:space-between; }
      .main-content-card .card-body { padding: 1rem 1.25rem; }
      .header-title { font-weight:600; font-size:1.1rem; letter-spacing:.2px; }
      .icon-btn{ border:1px solid #e5e7eb; background:#fff; color:#374151; padding:6px 8px; border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
      .icon-btn:hover{ background:#f3f4f6; }
      .th-strong th { font-weight: 700; color:#374151; border-bottom:2px solid #e5e7eb; }
      /* Segmented buttons */
      .segmented-group{ display:inline-flex; border:1px solid #e5e7eb; border-radius:10px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.06); }
      .segmented-btn{ background:#fff; color:#374151; padding:8px 12px; border:none; border-right:1px solid #e5e7eb; font-weight:600; letter-spacing:.2px; }
      .segmented-btn:last-child{ border-right:none; }
      .segmented-btn:hover{ background:var(--gems-bg-page); }
      /* Badges */
      .badge-modern { padding: 6px 10px; border-radius: 16px; font-size: .75rem; font-weight: 600; display:inline-block; }
      .badge-success-dark { background: rgba(16, 185, 129, 1); color: #fff; }
      .badge-warning { background: rgba(245, 158, 11, 0.9); color: #fff; }
      .badge-danger-dark { background: rgb(184, 51, 51); color: #fff; }
      
      /* Modern table styling - high specificity to override DataTables */
      .table.dataTable { 
        margin-bottom: 0 !important; 
        border-collapse: separate !important; 
        border-spacing: 0 !important; 
      }
      .table.dataTable thead th,
      table.dataTable thead th { 
        background: var(--gems-bg-page) !important; 
        color: var(--gems-muted) !important; 
        font-weight: 700 !important; 
        font-size: 11px !important; 
        text-transform: uppercase !important; 
        letter-spacing: 0.08em !important; 
        padding: 14px 16px !important; 
        border: none !important; 
        border-bottom: 2px solid #E2E8F0 !important;
        border-top: none !important;
        white-space: nowrap !important;
      }
      .table.dataTable tbody tr,
      table.dataTable tbody tr { 
        background: #fff !important; 
        transition: all 0.15s ease !important; 
        border-bottom: 1px solid var(--gems-bg-page) !important;
      }
      .table.dataTable tbody tr:hover,
      table.dataTable tbody tr:hover { 
        background: #FAFBFC !important; 
        box-shadow: 0 2px 8px rgba(2,6,23,.04) !important; 
        position: relative !important; 
        z-index: 1 !important;
      }
      .table.dataTable tbody td,
      table.dataTable tbody td { 
        padding: 16px !important; 
        vertical-align: middle !important; 
        color: var(--gems-text) !important; 
        border: none !important;
        border-top: none !important;
        font-size: 14px !important;
      }
    </style>
  </head>
<body class="fixed-sn light-blue-skin">
<header>
  <div class="includeHtml" id="h-nav_left"></div>
  <div class="includeHtml" id="h-nav_top"></div>
</header>
<main>
  <div class="container-fluid">
    <section class="mb-5 mt-lg-5">
      <div class="gems-page-header module-page-header">
        <div class="header-text">
          <h2 class="mb-0"><i class="fas fa-cubes mr-3"></i>Space Type</h2>
          <p class="mb-0">Organize shared spaces by category-specific types.</p>
        </div>
        <div class="header-actions align-items-center">
          <button type="button" id="btnSpcTypAdd" class="icon-btn" data-toggle="tooltip" title="Add Type"><i class="fas fa-plus"></i></button>
          <a tabindex="0" role="button" class="icon-btn ml-2" data-toggle="popover" data-trigger="focus" title="Space Type" data-content="Manage space types (create, edit, activate/deactivate, delete)."><i class="fas fa-info"></i></a>
          <button type="button" id="btnSpcTypRefresh" class="icon-btn ml-2" data-toggle="tooltip" title="Refresh"><i class="fas fa-sync"></i></button>
        </div>
      </div>

      <div class="home-table-card">
        <div class="table-header">
          <h5>
            <i class="fas fa-tag"></i>
            Types
          </h5>
          <div class="table-header-actions">
            <button type="button" class="btn-header" data-toggle="tooltip" data-placement="top" title="All space types">
              <i class="fas fa-info-circle"></i>
            </button>
            <button type="button" id="btnSpcTypRefreshTable" class="btn-header" data-toggle="tooltip" data-placement="top" title="Refresh data">
              <i class="fas fa-sync"></i>
            </button>
            <div id="dtSpcTypButtons"></div>
          </div>
        </div>
        <div class="table-controls">
          <div class="table-search-box">
            <form class="form-inline md-form form-sm mt-0 mb-0 pb-0">
              <div class="">
                <i class="fas fa-search mt-2" aria-hidden="true"></i>
                <input type="text" id="txtSpcTypSearch" class="form-control form-control-sm" style="width: 250px; max-width:250px">
                <label for="txtSpcTypSearch" class="ml-4">Search</label>
              </div>
            </form>
          </div>
        </div>
        <div class="table-body">
          <div class="table-responsive">
            <table id="dtSpcTyp" class="table table-hover table-sm mb-0 display responsive" cellspacing="0" width="100%">
              <thead>
                <tr class="th-strong">
                  <th style="width:4%">#</th>
                  <th style="width:24%">Type Name</th>
                  <th style="width:20%">Category</th>
                  <th>Description</th>
                  <th style="width:12%">Status</th>
                  <th style="width:80px"></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
    <div class="includeHtml" id="h-modal_change_password"></div>
    <div class="includeHtml" id="h-modal_confirm_delete"></div>
    <div class="includeHtml" id="h-modal_space_type"></div>
  </div>
</main>

<script type="text/javascript">
  $('.includeHtml').each(function(){ const id=$(this).attr('id'); $('#'+id).load('html/'+id.substr(2)+'.html?'+new Date().valueOf()); });
  </script>
<script type="text/javascript" src="js/popper.min.js"></script>
<script type="text/javascript" src="js/bootstrap.min.js"></script>
<script type="text/javascript" src="js/mdb.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.bootstrap4.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.html5.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.print.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/jszip.min.js"></script>
<script type="text/javascript" src="js/addons/crypto.js"></script>
<script type="text/javascript" src="js/addons/moment.min.js"></script>
<script type="text/javascript" src="js/modules/toastr.js"></script>
<script type="text/javascript" src="js/common.js"></script>
<script type="text/javascript" src="js/pages/modal_confirm_delete.js"></script>
<script type="text/javascript" src="js/pages/modal_space_type.js"></script>
<script type="text/javascript" src="js/pages/main_space_type.js"></script>
</body>
</html>
