<!DOCTYPE html>
<!--
  pages/fca_report.html — Tabler-migrated (P5-8 FCA Report).

  Page-local master. modal_fca_report is this page only.
  Bridges: modal_change_password, modal_confirm_delete, modal_pdf.
  Role 22 (FCA Auditor) still gates Generate New Report.

  NEVER load next to Tabler: css/bootstrap.min.css, css/mdb.min.css,
    css/style.css, css/gems2-ui.css, js/popper.min.js, js/bootstrap*.js,
    js/mdb*.js, js/jquery-migrate-3.4.0.min.js, dataTables.bootstrap4.*,
    js/vendor/tabler/tabler-theme.min.js.
-->
<html lang="en" data-bs-theme="light" data-bs-navbar-position="vertical">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GEMS - FCA PDF Report</title>
  <link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
  <link rel="stylesheet" href="css/fontawesome-pro-6.5.1-web/css/all.min.css">
  <link rel="stylesheet" href="css/vendor/tabler/tabler.min.css">
  <link rel="stylesheet" href="js/vendor/datatables/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="js/vendor/datatables/css/buttons.bootstrap5.min.css">
  <link rel="stylesheet" href="css/gems-theme.css">
  <style>
    /* Page-local mobile stack from the MDB page; table IDs unchanged. */
    @media (max-width: 768px) {
      #dtFcrData thead { display: none; }
      #dtFcrData, #dtFcrData tbody, #dtFcrData tr, #dtFcrData td { display: block; width: 100%; }
      #dtFcrData tr { background: var(--tblr-bg-surface, #fff); border: 1px solid var(--tblr-border-color, #e5e7eb); border-radius: 12px; margin-bottom: 12px; padding: 8px 12px; }
      #dtFcrData td { border: 0; border-bottom: 1px dashed var(--tblr-border-color, #e5e7eb); padding: 8px 0; }
      #dtFcrData td:last-child { border-bottom: 0; }
      #dtFcrData td::before { content: attr(data-label); display: block; color: var(--tblr-secondary, #6c7a91); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
    }
  </style>
</head>
<body class="gems-tabler">
<div class="page">
  <aside class="includeHtml navbar navbar-vertical navbar-expand-lg" id="h-nav_left_tabler"></aside>
  <div class="page-wrapper">
    <header class="includeHtml navbar navbar-expand-md" id="h-nav_top_tabler"></header>
    <div class="page-body">
      <div class="container-xl">

        <div class="page-header">
          <div class="row align-items-center g-2">
            <div class="col-12 col-sm">
              <div class="text-secondary" style="font-size:.75rem">Facility Condition Appraisal</div>
              <h1 class="page-title"><i class="fas fa-file-pdf me-2 text-primary"></i>FCA PDF Report</h1>
              <div class="page-subtitle">Generate and manage Facility Condition Appraisal PDF documents</div>
            </div>
          </div>
        </div>

        <div class="card gems-filter-card mb-3">
          <div class="card-body">
            <div class="gems-form-grid">
              <div class="gems-field gems-field-6">
                <label class="form-label" for="txtFcrSearch">Search</label>
                <input type="search" id="txtFcrSearch" class="form-control" placeholder="Search reports" autocomplete="off">
              </div>
            </div>
          </div>
        </div>

        <div class="card" id="divFcrCard">
          <div class="card-header gems-card-header-compact">
            <div>
              <h3 class="card-title mb-0">Reports</h3>
              <div class="gems-card-subtitle">Auditor role required to generate a new PDF report.</div>
            </div>
            <div class="gems-card-toolbar">
              <div id="btnDtFcrExport" class="d-inline-flex align-items-center"></div>
            </div>
          </div>
          <table id="dtFcrData" class="table table-vcenter card-table table-hover mb-0">
            <thead>
              <tr>
                <th>#</th>
                <th>Site</th>
                <th>Report Name</th>
                <th>Date From</th>
                <th>Date To</th>
                <th>Asset Group</th>
                <th>Exclude List</th>
                <th>Sort By</th>
                <th>Total FCA</th>
                <th>Created By</th>
                <th>Time Created</th>
                <th style="width: 34px; min-width: 34px;">Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

      </div>
    </div>
  </div>
</div>

<div class="includeHtml" id="h-modal_change_password"></div>
<div class="includeHtml" id="h-modal_confirm_delete"></div>
<div class="includeHtml" id="h-modal_fca_report"></div>
<div class="includeHtml" id="h-modal_pdf"></div>

<script src="js/jquery-3.7.0.min.js"></script>
<script src="js/vendor/tabler/tabler.min.js"></script>
<script src="js/gems-bs5-jquery.js"></script>
<script src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script src="js/vendor/datatables/js/dataTables.bootstrap5.min.js"></script>
<script src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script src="js/vendor/datatables/js/buttons.bootstrap5.min.js"></script>
<script src="js/vendor/datatables/js/buttons.html5.min.js"></script>
<script src="js/vendor/datatables/js/buttons.print.min.js"></script>
<script src="js/vendor/datatables/js/buttons.colvis.min.js"></script>
<script src="js/vendor/datatables/js/jszip.min.js"></script>
<script src="js/vendor/datatables/js/pdfmake.min.js"></script>
<script src="js/vendor/datatables/js/vfs_fonts.js"></script>
<script src="js/modules/toastr.js"></script>
<script src="js/addons/crypto.js"></script>
<script src="js/addons/moment.min.js"></script>
<script>
  $('.includeHtml').each(function () {
    const divId = $(this).attr('id');
    $('#' + divId).load('html/' + divId.substr(2) + '.html?' + new Date().valueOf());
  });
</script>
<script>
  document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/gems-tabler-ui.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/modal_confirm_delete.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/modal_fca_report.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/main_fca_report.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

  let versionLocal_;
  let changePasswordClass_;
  let modalConfirmDelete_;
  let modalFcaReportClass_;
  let fcaReportClass_;

  document.addEventListener('DOMContentLoaded', function () {
    ShowLoader();
    setTimeout(function () {
      try {
        initiatePages();
        versionLocal_ = mzGetDataVersion();
        changePasswordClass_ = new ModalChangePassword();
        modalConfirmDelete_ = new ModalConfirmDelete();
        modalFcaReportClass_ = new ModalFcaReport();
        fcaReportClass_ = new MainFcaReport();

        const refSite_ = mzGetLocalArrayV2('gems_site2', versionLocal_, 'site/ref');
        const refAssetGroup_ = mzGetLocalArrayV2('gems_assetGroup2', versionLocal_, 'asset_group/ref');
        const refUser_ = mzGetLocalArrayV2('gems_user2', versionLocal_, 'user/ref');

        modalFcaReportClass_.setRefSite(refSite_);
        modalFcaReportClass_.setRefAssetGroup(refAssetGroup_);
        modalFcaReportClass_.setClassFrom(fcaReportClass_);
        modalFcaReportClass_.init();

        fcaReportClass_.setRefSite(refSite_);
        fcaReportClass_.setRefAssetGroup(refAssetGroup_);
        fcaReportClass_.setRefUser(refUser_);
        fcaReportClass_.setModalFcaReportClass(modalFcaReportClass_);
        fcaReportClass_.setModalConfirmDeleteClass(modalConfirmDelete_);
        fcaReportClass_.init();
      } catch (e) {
        toastr['error'](e.message, _ALERT_TITLE_ERROR);
      }
      HideLoader();
    }, 200);
  });
</script>
</body>
</html>
