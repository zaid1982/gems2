<!DOCTYPE html>
<!--
  pages/kpa_pi_entry.html — Tabler-migrated (P3B KPA).

  Page sheet uses gems-form-grid. Asset stack is a verbatim copy of
  html/head_tabler.html and html/scripts_tabler.html.

  NEVER load next to Tabler: css/bootstrap.min.css, css/mdb.min.css,
  css/style.css, css/gems2-ui.css, js/popper.min.js, js/bootstrap*.js,
  js/mdb*.js, js/jquery-migrate-3.4.0.min.js, dataTables.bootstrap4.*,
  js/vendor/tabler/tabler-theme.min.js.
-->
<html lang="en" data-bs-theme="light" data-bs-navbar-position="vertical">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GEMS 2.0 - PI Entry</title>
  <link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
  <link rel="stylesheet" href="css/fontawesome-pro-6.5.1-web/css/all.min.css">
  <link rel="stylesheet" href="css/vendor/tabler/tabler.min.css">
  <link rel="stylesheet" href="js/vendor/datatables/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="js/vendor/datatables/css/buttons.bootstrap5.min.css">
  <link rel="stylesheet" href="css/gems-theme.css?p3h1">
</head>
<body class="gems-tabler">
<div class="page">
  <aside class="includeHtml navbar navbar-vertical navbar-expand-lg" id="h-nav_left_tabler"></aside>
  <div class="page-wrapper">
    <header class="includeHtml navbar navbar-expand-md" id="h-nav_top_tabler"></header>
    <div class="page-body">
      <div class="container-xl">

        <div class="page-header">
          <div class="row align-items-center g-2">
            <div class="col-12 col-sm">
              <div class="page-subtitle" id="lblKpeGroup">KPI</div>
              <h1 class="page-title" id="lblKpeTitle">PI Entry</h1>
              <div class="page-subtitle" id="lblKpeSub">Loading…</div>
            </div>
            <div class="col-12 col-sm-auto">
              <a class="btn btn-outline-secondary" id="lnkKpeBack" href="p_kpa_evaluation">
                <i class="fas fa-arrow-left me-2"></i>Back
              </a>
            </div>
          </div>
        </div>

        <div class="row row-cards mb-3">
          <div class="col-6 col-lg-3">
            <div class="card"><div class="card-body py-2">
              <div class="text-secondary" style="font-size:.75rem">Target</div>
              <div class="h2 mb-0" id="mKpeTarget">-</div>
              <div class="text-secondary" style="font-size:.75rem" id="mKpeRule">-</div>
            </div></div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="card"><div class="card-body py-2">
              <div class="text-secondary" style="font-size:.75rem">Achievement</div>
              <div class="h2 mb-0" id="mKpeActual">-</div>
              <div class="text-secondary" style="font-size:.75rem" id="mKpeResult">Not calculated</div>
            </div></div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="card"><div class="card-body py-2">
              <div class="text-secondary" style="font-size:.75rem">APD Exposure</div>
              <div class="h2 mb-0" id="mKpeApdValue">-</div>
              <div class="text-secondary" style="font-size:.75rem" id="mKpeWeight">-</div>
            </div></div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="card"><div class="card-body py-2">
              <div class="text-secondary" style="font-size:.75rem">APD Deducted</div>
              <div class="h2 mb-0 text-danger" id="mKpeApdDeducted">-</div>
              <div class="text-secondary" style="font-size:.75rem" id="mKpeDemerit">-</div>
            </div></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="card-title mb-0">Parameters</h3>
              <div class="text-secondary" style="font-size:.75rem" id="lblKpeFormula">Enter the values for this evaluation month.</div>
            </div>
            <div class="gems-card-toolbar">
              <span id="lblKpeStatus"></span>
              <span id="lblKpeSaveState" class="autosave-state" hidden></span>
            </div>
          </div>
          <div class="card-body">
            <div id="divKpeParams" class="gems-form-grid"></div>
            <div class="gems-form-grid mt-3">
              <div class="gems-field gems-field-12">
                <label class="form-label" for="txtKpeRemarks">Remarks</label>
                <input type="text" id="txtKpeRemarks" class="form-control" placeholder="Optional notes for this month">
              </div>
            </div>
            <div class="gems-note mt-3 d-none" id="divKpeMessage">
              <i class="fas fa-triangle-exclamation"></i>
              <div id="lblKpeMessage"></div>
            </div>
          </div>
          <div class="card-footer gems-form-footer">
            <div class="gems-form-footer-note" id="lblKpeFooterNote">Save a draft as often as you like. Submitting locks the values.</div>
            <div class="gems-form-footer-actions">
              <button type="button" class="btn btn-outline-secondary" id="btnKpeSave"><i class="fas fa-save me-2"></i>Save Draft</button>
              <button type="button" class="btn btn-outline-secondary" id="btnKpeReopen" style="display:none"><i class="fas fa-lock-open me-2"></i>Reopen</button>
              <button type="button" class="btn btn-primary" id="btnKpeSubmit"><i class="fas fa-check me-2"></i>Submit PI</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<div class="includeHtml" id="h-modal_change_password"></div>

<script src="js/jquery-3.7.0.min.js"></script>
<script src="js/vendor/tabler/tabler.min.js"></script>
<script src="js/gems-bs5-jquery.js"></script>
<script src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script src="js/vendor/datatables/js/dataTables.bootstrap5.min.js"></script>
<script src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script src="js/vendor/datatables/js/buttons.bootstrap5.min.js"></script>
<script src="js/modules/toastr.js"></script>
<script src="js/addons/crypto.js"></script>
<script src="js/addons/moment.min.js"></script>
<script>
  $('.includeHtml').each(function () {
    const divId = $(this).attr('id');
    $('#' + divId).load('html/' + divId.substr(2) + '.html?' + new Date().valueOf());
  });
</script>
<script>
  document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/gems-tabler-ui.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/kpa_common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="js/pages/main_kpa_pi_entry.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
  let changePasswordClass_;
  document.addEventListener('DOMContentLoaded', function () {
    ShowLoader();
    setTimeout(function () {
      try { initiatePages(); changePasswordClass_ = new ModalChangePassword(); new MainKpaPiEntry().init(); }
      catch (e) { toastr['error'](e.message, _ALERT_TITLE_ERROR); }
      HideLoader();
    }, 250);
  });
</script>
</body>
</html>
