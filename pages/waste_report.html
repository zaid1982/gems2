<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>GEMS 2.0 - JKR Waste Reports</title>
  <link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
  <link rel="stylesheet" href="css/fontawesome-pro-6.5.1-web/css/all.min.css">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/mdb.min.css">
  <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/dataTables.bootstrap4.min.css"/>
  <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/button.dataTables.min.css"/>
  <link href="css/style.css" rel="stylesheet">
  <link href="css/gems2-ui.css" rel="stylesheet">
  <script src="js/jquery-3.7.0.min.js"></script>
  <script src="js/jquery-migrate-3.4.0.min.js"></script>
</head>
<body class="fixed-sn light-blue-skin">
<header><div class="includeHtml" id="h-nav_left"></div><div class="includeHtml" id="h-nav_top"></div></header>
<main>
  <div class="container-fluid module-page module-master waste-page">
    <section>
      <div class="gems-page-header module-page-header">
        <div class="header-text">
          <h2><i class="fas fa-file-alt mr-3"></i>JKR Reports</h2>
          <p>Generate a period snapshot from Final records. New versions never overwrite earlier ones.</p>
        </div>
        <div class="header-actions">
          <button type="button" class="btn btn-light btn-icon" id="btnWrpRefresh" title="Refresh"><i class="fas fa-sync-alt"></i></button>
          <button type="button" class="btn btn-primary btn-icon" id="btnWrpNew" title="Generate"><i class="fas fa-plus"></i></button>
        </div>
      </div>
      <div class="filter-card">
        <div class="filter-grid">
          <div><div class="filter-label">Premise</div><select id="optWrpSite" class="custom-select gems-plain-select browser-default"></select></div>
        </div>
      </div>
      <div class="module-data-card mb-3" id="divPreview" style="display:none">
        <h6>Preview</h6>
        <div class="table-responsive"><table class="table table-sm" id="tblPreview"><thead><tr><th>SW Code</th><th>Description</th><th>Opening</th><th>Produced</th><th>Disposed</th><th>Closing</th></tr></thead><tbody></tbody></table></div>
      </div>
      <div class="module-data-card">
        <h6>Report versions</h6>
        <div class="module-table-wrapper">
          <table id="dtWrp" class="table table-hover mb-0 display mobile-stack">
            <thead><tr><th>#</th><th>Premise</th><th>Period</th><th>Version</th><th>Generated</th><th>Changed since</th><th>Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
  <div class="includeHtml" id="h-modal_change_password"></div>
  <div class="includeHtml" id="h-modal_waste_report_generate"></div>
  <div class="includeHtml" id="h-modal_waste_report_submission"></div>
</main>
<script>$('.includeHtml').each(function(){const i=$(this).attr('id');$('#'+i).load('html/'+i.substr(2)+'.html?'+Date.now());});</script>
<script src="js/popper.min.js"></script><script src="js/bootstrap.js"></script><script src="js/mdb.min.js"></script>
<script src="js/addons/crypto.js"></script><script src="js/addons/moment.min.js"></script>
<script src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script src="js/vendor/datatables/js/dataTables.bootstrap4.min.js"></script>
<script src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script src="js/vendor/datatables/js/buttons.html5.min.js"></script>
<script src="js/vendor/datatables/js/buttons.print.min.js"></script>
<script src="js/vendor/datatables/js/buttons.colvis.min.js"></script>
<script src="js/vendor/datatables/js/jszip.min.js"></script>
<script src="js/vendor/datatables/js/pdfmake.min.js"></script>
<script src="js/vendor/datatables/js/vfs_fonts.js"></script>
<script>
  document.write('<scr'+'ipt src="js/common.js?'+Date.now()+'"></scr'+'ipt>');
  document.write('<scr'+'ipt src="js/pages/waste_common.js?'+Date.now()+'"></scr'+'ipt>');
  document.write('<scr'+'ipt src="js/pages/modal_change_password.js?'+Date.now()+'"></scr'+'ipt>');
  document.write('<scr'+'ipt src="js/pages/main_waste_report.js?'+Date.now()+'"></scr'+'ipt>');
  document.addEventListener('DOMContentLoaded', function(){
    ShowLoader(); setTimeout(function(){ try { initiatePages(); new ModalChangePassword(); new MainWasteReport().init(); } catch(e){ toastr['error'](e.message,_ALERT_TITLE_ERROR);} HideLoader(); }, 300);
  });
</script>
</body></html>
