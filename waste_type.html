<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>GEMS 2.0</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Material Design Bootstrap -->
    <link rel="stylesheet" href="css/mdb.min.css">
    <!-- DataTables.net -->
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/dataTables.bootstrap4.min.css"/>
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/button.dataTables.min.css"/>
    <!-- Your custom styles (optional) -->
    <link href="css/style.css" rel="stylesheet">
    <!-- Your custom styles (optional) -->
    <style>
        .nav-dropdown-a {
            padding: 0.36rem 1.3rem 0 !important;
            font-size: 0.64rem;
        }
        .dropdown-item {
            padding: 0.36rem 0.5rem !important;
            font-size: 0.64rem;
        }
    </style>
    <!-- JQuery -->
    <script type="text/javascript" src="js/jquery-3.4.0.min.js"></script>
</head>
<body class="fixed-sn light-blue-skin">
<!--Main Navigation-->
<header>
    <!-- Sidebar navigation -->
    <div class="includeHtml" id="h-nav_left"></div>
    <!-- Navbar -->
    <div class="includeHtml" id="h-nav_top"></div>
</header>
<!--Main layout-->
<main>
    <div class="container-fluid">
        <section class="mb-4" id="sectionWttMain">
            <div class="row">
                <div class="col-12 p-1 pb-2">
                    <nav class="navbar mdb-color darken-1 z-depth-3 rounded mb-1">
                        <h4 class="navbar-text white-text font-weight-bold ml-3 pb-0 mb-1">
                            <i class="fas fa-dumpster-fire mr-2"></i> Waste Type List
                        </h4>
                    </nav>
                </div>
            </div>
            <div class="row">
                <div class="col-12 p-1 pb-0">
                    <nav class="navbar navbar-expand navbar-dark mdb-color lighten-1 z-depth-3 m-0 p-2">
                        <div class="collapse navbar-collapse">
                            <ul class="navbar-nav mr-auto">
                                <a class="btn btn-sm btn-outline-white my-2 my-sm-0 ml-0 px-3" id="btnWttAddWaste"><i class="fas fa-plus mr-1"></i>Add New Waste Type</a>
                            </ul>
                        </div>
                    </nav>
                </div>
            </div>
            <div class="row">
                <div class="col-12 p-1">
                    <div class="card z-depth-3">
                        <div class="card-body pb-2">
                            <div class="row">
                                <div class="col-12 px-0">
                                    <div class="table-responsive">
                                        <table id="dtWtt" class="table table-hover display responsive">
                                            <thead>
                                            <tr class="th-strong">
                                                <th>#</th>
                                                <th>Waste Type</th>
                                                <th>Date Created</th>
                                                <th>Status</th>
                                                <th>&nbsp;</th>
                                            </tr>
                                            </thead>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div class="includeHtml" id="h-modal_change_password"></div>
    <div class="includeHtml" id="h-modal_waste_type"></div>
</main>

<!-- SCRIPTS -->
<script type="text/javascript">
    $('.includeHtml').each(function () {
        const divId = $(this).attr('id');
        $('#' + divId).load('html/' + divId.substr(2) + '.html?' + new Date().valueOf());
    });
</script>

<!-- Bootstrap tooltips -->
<script type="text/javascript" src="js/popper.min.js"></script>
<!-- Bootstrap core JavaScript -->
<script type="text/javascript" src="js/bootstrap.js"></script>
<!-- MDB core JavaScript -->
<script type="text/javascript" src="js/mdb.js"></script>
<!-- Crypto JS -->
<script type="text/javascript" src="js/addons/crypto.js"></script>
<!-- DataTables.net -->
<script type="text/javascript" src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.bootstrap4.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.html5.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.print.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.colvis.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/jszip.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/pdfmake.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/vfs_fonts.js"></script>
<!-- Moment JavaScript -->
<script type="text/javascript" src="js/addons/moment.min.js"></script>

<!--Custom scripts-->
<script type="text/javascript">
    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let changePasswordClass_;
    let modalWasteTypeClass_;
    let wasteTypeClass_;

    document.addEventListener('DOMContentLoaded', function () {

        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                modalWasteTypeClass_ = new ModalWasteType();
                wasteTypeClass_ = new MainWasteType();

                modalWasteTypeClass_.init();

                wasteTypeClass_.setModalWasteType(modalWasteTypeClass_);
                wasteTypeClass_.init();
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }

            HideLoader();
        }, 200);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_waste_type.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_waste_type.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>

</body>
</html>
