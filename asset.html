<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>GEMS 2.0</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Material Design Bootstrap -->
    <link rel="stylesheet" href="css/mdb.min.css">
    <!-- DataTables.net -->
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/dataTables.bootstrap4.min.css"/>
    <!-- Your custom styles (optional) -->
    <link href="css/style.css" rel="stylesheet">
    <!-- Your custom styles (optional) -->
    <style>

    </style>
    <!-- JQuery -->
    <script type="text/javascript" src="js/jquery-3.4.0.min.js"></script>
</head>

<body class="fixed-sn light-blue-skin">
<!--Main Navigation-->
<header>
    <!-- Sidebar navigation -->
    <div class="includeHtml" id="h-nav_left"></div>
    <!-- Navbar -->
    <div class="includeHtml" id="h-nav_top"></div>
</header>
<!--Main layout-->
<main>
    <div class="container-fluid">
        <!--Section: Main panel-->
        <section class="mb-5 mt-lg-5 sectionAszMain">
            <div class="card card-cascade narrower">
                <!--Section: Search Function & Chart-->
                <section>
                    <div class="row">
                        <!--Search Function-->
                        <div class="col-xl-5 col-lg-12 mr-0">
                            <div class="view view-cascade gradient-card-header rgba-cyan-strong z-depth-4">
                                <h2 class="h2-responsive mb-0">Asset Management</h2>
                            </div>
                            <div class="card-body card-body-cascade">
                                <div class="px-3 pt-3">
                                    <h6>Status:</h6>
                                    <div class="mt-1 pb-2">
                                        <ul class="striped list-unstyled pl-2">
                                            <li><a href="javascript:void(0);" id="linkAszAll"></a></li>
                                            <li><a href="javascript:void(0);" id="linkAsz1"></a></li>
                                            <li><a href="javascript:void(0);" id="linkAsz2"></a></li>
                                            <li><a href="javascript:void(0);" id="linkAsz5"></a></li>
                                        </ul>
                                    </div>
                                    <h6 class="pb-3">Search:</h6>
                                    <div class="row">
                                        <div class="col-md-12 select-outline">
                                            <select id="optAszContractId" class="mdb-select md-form md-outline colorful-select mt-0"></select>
                                            <label for="optAszContractId">Contract *</label>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-12 select-outline">
                                            <select id="optAszGroupId" class="mdb-select md-form md-outline colorful-select mt-0">
                                                <option value="" disabled>All Asset Group</option>
                                            </select>
                                            <label for="optAszGroupId">Asset Group</label>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-12 select-outline">
                                            <select id="optAszCategoryId" class="mdb-select md-form md-outline colorful-select mt-0">
                                                <option value="" disabled>All Asset Category</option>
                                            </select>
                                            <label for="optAszCategoryId">Asset Category</label>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-12 select-outline">
                                            <select id="optAszTypeId" class="mdb-select md-form md-outline colorful-select mt-0">
                                                <option value="" disabled>All Asset Type</option>
                                            </select>
                                            <label for="optAszTypeId">Asset Type</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!--Chart-->
                        <div class="col-xl-7 col-lg-12">
                            <div class="view view-cascade z-depth-4 mb-3">
                                <div id="chartAszAssetByType" style="height: 517px; margin: 0"></div>
                            </div>
                            <div class="card-body">
                                <div class="px-3 pt-3">
                                    <div class="row">
                                        <div class="col-md-7 select-outline">
                                            <select id="optAszColumns" class="mdb-select md-form md-outline colorful-select mt-0" multiple>
                                                <option value="" disabled>Choose Column Visibility</option>
                                                <option value="1" selected>Asset Name</option>
                                                <option value="2">Asset No</option>
                                                <option value="3" selected>Asset Group</option>
                                                <option value="4" selected>Asset Category</option>
                                                <option value="5" selected>Asset Type</option>
                                                <option value="6" selected>Brand</option>
                                                <option value="7" selected>Model</option>
                                                <option value="8">Capacity</option>
                                                <option value="9">Location Code</option>
                                                <option value="10" selected>Status</option>
                                            </select>
                                            <label for="optAszColumns">Columns Visibility</label>
                                        </div>
                                        <div class="col-md-5">
                                            <div class="md-form md-outline mt-0">
                                                <input type="text" id="txtAszAssetSearch" class="form-control">
                                                <label for="txtAszAssetSearch" class="active">Keyword Search</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <!--Section: Table-->
                <section>
                    <div class="card card-cascade narrower z-depth-0">
                        <div class="view view-cascade gradient-card-header aqua-gradient narrower py-2 mx-4 mb-3 d-flex justify-content-between align-items-center z-depth-3">
                            <div>
                                <button type="button" id="btnAszAssetAdd" class="btn btn-outline-white btn-rounded btn-sm px-2 material-tooltip-main" data-toggle="tooltip" data-placement="top" title="Add Asset"><i class="fas fa-plus mt-0"></i></button>
                                <a tabindex="0" role="button" class="btn btn-outline-white btn-rounded btn-sm px-2"
                                   data-toggle="popover" data-trigger="focus" title="Asset List"
                                   data-content="Asset List for all users that use the system."><i class="fas fa-info mt-0 mx-1"></i></a>
                                <button type="button" id="btnDtAszAssetRefresh" class="btn btn-outline-white btn-rounded btn-sm px-2" data-toggle="tooltip" data-placement="top" title="Refresh data"><i class="fas fa-sync mt-0"></i></button>
                            </div>
                            <a href="javascript:void(0);" class="text-white mx-3">Asset List</a>
                            <div>
                                <div id="btnDtAszAssetExport"></div>
                            </div>
                        </div>
                        <div class="px-4 pb-4">
                            <div class="table-responsive">
                                <table id="dtAszAsset" class="table table-hover mb-0 display responsive" cellspacing="0" width="100%">
                                    <thead>
                                    <tr class="th-strong">
                                        <th scope="row" style="max-width: 30px">#</th>
                                        <th style="min-width: 100px">Asset Name</th>
                                        <th style="min-width: 130px">Asset No</th>
                                        <th style="min-width: 80px">Asset Group</th>
                                        <th style="min-width: 80px">Asset Category</th>
                                        <th style="min-width: 80px">Asset Type</th>
                                        <th style="min-width: 80px">Brand</th>
                                        <th style="min-width: 80px">Model</th>
                                        <th style="min-width: 80px">Capacity</th>
                                        <th style="min-width: 100px">Location Code</th>
                                        <th style="max-width: 70px">Status</th>
                                        <th style="min-width: 60px"></th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </section>
        <div class="includeHtml" id="h-section_asset_details"></div>
    </div>
    <div class="includeHtml" id="h-modal_change_password"></div>
    <div class="includeHtml" id="h-modal_user"></div>

</main>

<!-- SCRIPTS -->
<script type="text/javascript">
    $('.includeHtml').each(function () {
        const divId = $(this).attr('id');
        $('#'+divId).load('html/'+divId.substr(2)+'.html?' + new Date().valueOf());
    });
</script>

<!--Custom scripts-->
<script type="text/javascript">
    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let changePasswordClass_;
    let assetClass_;
    let sectionAssetDetails_;

    document.addEventListener('DOMContentLoaded', function () {

        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                assetClass_ = new MainAsset();
                sectionAssetDetails_ = new SectionAssetDetails();

                const refStatus_ = mzGetLocalArray('gems_status', versionLocal_, 'statusId');
                const refContract_ = mzGetLocalArray('gems_contract', versionLocal_, 'contractId', [], 'contract');
                const refAssetGroup_ = mzGetLocalArray('gems_assetGroup', versionLocal_, 'assetGroupId', [], 'asset_group');
                const refAssetCategory_ = mzGetLocalArray('gems_assetCategory', versionLocal_, 'assetCategoryId', [], 'asset_category');
                const refAssetType_ = mzGetLocalArray('gems_assetType', versionLocal_, 'assetTypeId', [], 'asset_type');
                const refAssetBrand_ = mzGetLocalArray('gems_assetBrand', versionLocal_, 'assetBrandId', [], 'asset_brand');
                const refAssetBrandGroup_ = mzGetLocalArray('gems_assetBrandGroup', versionLocal_, 'assetBrandId');
                const refAssetModel_ = mzGetLocalArray('gems_assetModel', versionLocal_, 'assetModelId', [], 'asset_model');
                const refUser_ = mzGetLocalArray('gems_user', versionLocal_, 'userId');

                sectionAssetDetails_.setClassFrom(assetClass_);
                sectionAssetDetails_.setRefStatus(refStatus_);
                sectionAssetDetails_.setRefContract(refContract_);
                sectionAssetDetails_.setRefAssetGroup(refAssetGroup_);
                sectionAssetDetails_.setRefAssetCategory(refAssetCategory_);
                sectionAssetDetails_.setRefAssetType(refAssetType_);
                sectionAssetDetails_.setRefAssetBrand(refAssetBrand_);
                sectionAssetDetails_.setRefAssetBrandGroup(refAssetBrandGroup_);
                sectionAssetDetails_.setRefAssetModel(refAssetModel_);
                sectionAssetDetails_.setRefUser(refUser_);
                sectionAssetDetails_.init();

                assetClass_.setRefStatus(refStatus_);
                assetClass_.setRefContract(refContract_);
                assetClass_.setRefAssetGroup(refAssetGroup_);
                assetClass_.setRefAssetCategory(refAssetCategory_);
                assetClass_.setRefAssetType(refAssetType_);
                assetClass_.setRefAssetBrand(refAssetBrand_);
                assetClass_.setRefAssetModel(refAssetModel_);
                assetClass_.setSectionAssetClass(sectionAssetDetails_);
                assetClass_.init();
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }

            HideLoader();
        }, 300);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/section_asset_details.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_asset.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>
