<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>GEMS 2.0</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Material Design Bootstrap -->
    <link rel="stylesheet" href="css/mdb.min.css">
    <!-- DataTables.net -->
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/dataTables.bootstrap4.min.css"/>
    <!-- Your custom styles (optional) -->
    <link href="css/style.css" rel="stylesheet">
    <!-- Your custom styles (optional) -->
    <style>

    </style>
    <!-- JQuery -->
    <script type="text/javascript" src="js/jquery-3.4.0.min.js"></script>
</head>

<body class="fixed-sn light-blue-skin">
<!--Main Navigation-->
<header>
    <!-- Sidebar navigation -->
    <div class="includeHtml" id="h-nav_left"></div>
    <!-- Navbar -->
    <div class="includeHtml" id="h-nav_top"></div>
</header>
<!--Main layout-->
<main>
    <div class="container-fluid">
        <!--Section: Main panel-->
        <section class="mb-5 mt-lg-5 sectionAszMain">
            <div class="card card-cascade narrower">
                <!--Section: Search Function & Chart-->
                <section>
                    <div class="row">
                        <!--Search Function-->
                        <div class="col-xl-5 col-lg-12 mr-0">
                            <div class="view view-cascade gradient-card-header rgba-cyan-strong z-depth-4">
                                <h2 class="h2-responsive mb-0">Asset Management</h2>
                            </div>
                            <div class="card-body card-body-cascade">
                                <div class="card-body pt-3">
                                    <h6 class="pb-3">Search:</h6>
                                    <div class="row">
                                        <div class="col-md-12 select-outline">
                                            <select id="optAszContractId" class="mdb-select md-form md-outline colorful-select dropdown-info mt-0"></select>
                                            <label for="optAszContractId">Contract</label>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-12 select-outline">
                                            <select id="optAszGroupId" class="mdb-select md-form md-outline colorful-select dropdown-info mt-0"></select>
                                            <label for="optAszGroupId">Asset Group</label>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-12 select-outline">
                                            <select id="optAszCategoryId" class="mdb-select md-form md-outline colorful-select dropdown-info mt-0"></select>
                                            <label for="optAszCategoryId">Asset Category</label>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-12 select-outline">
                                            <select id="optAszTypeId" class="mdb-select md-form md-outline colorful-select dropdown-info mt-0"></select>
                                            <label for="optAszTypeId">Asset Type</label>
                                        </div>
                                    </div>
                                    <div class="md-form md-outline mt-0">
                                        <input type="text" id="txtAszAssetSearch" class="form-control">
                                        <label for="txtAszAssetSearch" class="active">Keyword Search</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!--Chart-->
                        <div class="col-xl-7 col-lg-12 mb-5">
                            <div class="view view-cascade z-depth-4">
                                <div id="chartAszLeaveByStatus" style="height: 450px; margin: 0"></div>
                            </div>
                        </div>
                    </div>
                </section>
                <!--Section: Table-->
                <section>
                    <div class="card card-cascade narrower z-depth-0">
                        <div class="view view-cascade gradient-card-header aqua-gradient narrower py-2 mx-4 mb-3 d-flex justify-content-between align-items-center z-depth-3">
                            <div>
                                <button type="button" id="btnAszAssetAdd" class="btn btn-outline-white btn-rounded btn-sm px-2 material-tooltip-main" data-toggle="tooltip" data-placement="top" title="Add Asset"><i class="fas fa-plus mt-0"></i></button>
                                <a tabindex="0" role="button" class="btn btn-outline-white btn-rounded btn-sm px-2"
                                   data-toggle="popover" data-trigger="focus" title="Asset List"
                                   data-content="Asset List for all users that use the system."><i class="fas fa-info mt-0 mx-1"></i></a>
                                <button type="button" id="btnDtAszAssetRefresh" class="btn btn-outline-white btn-rounded btn-sm px-2" data-toggle="tooltip" data-placement="top" title="Refresh data"><i class="fas fa-sync mt-0"></i></button>
                            </div>
                            <a href="javascript:void(0);" class="text-white mx-3">Asset List</a>
                            <div>
                                <div id="btnDtAszAssetExport"></div>
                            </div>
                        </div>
                        <div class="px-4 pb-4">
                            <div class="table-responsive">
                                <table id="dtAszAsset" class="table table-hover mb-0 display responsive" cellspacing="0" width="100%">
                                    <thead>
                                    <tr class="th-strong">
                                        <th scope="row" style="width: 4%">#</th>
                                        <th>Asset Name</th>
                                        <th>Asset No.</th>
                                        <th>Asset Group</th>
                                        <th>Asset Category</th>
                                        <th>Asset Type</th>
                                        <th>Brand</th>
                                        <th>Model</th>
                                        <th>Capacity</th>
                                        <th>Location Code</th>
                                        <th style="width: 8%">Status</th>
                                        <th style="width: 55px"></th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </section>
    </div>
    <div class="includeHtml" id="h-modal_change_password"></div>
    <div class="includeHtml" id="h-modal_user"></div>

</main>

<!-- SCRIPTS -->
<script type="text/javascript">
    $('.includeHtml').each(function () {
        const divId = $(this).attr('id');
        $('#'+divId).load('html/'+divId.substr(2)+'.html?' + new Date().valueOf());
    });
</script>

<script type="text/javascript" src="js/vendor/highcharts/highcharts.js"></script>

    document.write('<scr' + 'ipt src="js/pages/main_asset.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
