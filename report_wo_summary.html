<body class="fixed-sn light-blue-skin">
<!--Main Navigation-->

<!--Main layout-->

<main>
    <div class="container-fluid">
        <section class="section mb-5 mt-lg-5">
            <div class="row">
                <div class="col-md-12">
                    <div class="card card-cascade cascading-admin-card user-card mt-4">
                        <div class="admin-up d-flex justify-content-start">
                            <i class="fas fa-file-alt rgba-cyan-strong py-4 z-depth-3"></i>
                            <div class="data">
                                <h3 class="font-weight-bold dark-grey-text ml-3">Report: Work Order Summary</h3>
                            </div>
                        </div>
                        <div class="card-body card-body-cascade pb-0">
                            <form id="formRwsSearch">
                                <h6 class="pb-3 pt-3">Filter:</h6>
                                <div class="row">
                                    <div class="col-md-12 select-outline">
                                        <select id="optRwsClientId" class="mdb-select md-form md-outline colorful-select dropdown-info mt-0"></select>
                                        <label for="optRwsClientId">Client</label>
                                    </div>
                                    <!--<div class="col-md-6 select-outline">
                                        <select id="optRwsSiteId" class="mdb-select md-form md-outline colorful-select dropdown-info mt-0"></select>
                                        <label for="optRwsSiteId">Site</label>
                                    </div>-->
                                    <div class="col-lg-3 col-md-4 select-outline">
                                        <select id="optRwsYearId" class="mdb-select md-form md-outline colorful-select dropdown-info mt-0"></select>
                                        <label for="optRwsYearId">Year</label>
                                    </div>
                                    <div class="col-lg-4 col-md-8 select-outline">
                                        <select id="optRwsMonthId" class="mdb-select md-form md-outline colorful-select dropdown-info mt-0"></select>
                                        <label for="optRwsMonthId">Month</label>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="card-footer">
                            <button type="button" id="btnRwsSearch" class="btn btn-outline-orange btn-rounded waves-effect btn-sm float-right" disabled>
                                <i class="fas fa-search mr-1"></i> View
                            </button>
                        </div>
                    </div>

                    <div class="card card-cascade narrower mb-5 mt-5">
                        <div class="view view-cascade gradient-card-header aqua-gradient narrower py-2 mx-4 mb-3 d-flex justify-content-between align-items-center z-depth-3">
                            <div>
                                <a tabindex="0" role="button" class="btn btn-outline-white btn-rounded btn-sm px-2"
                                   data-toggle="popover" data-trigger="focus" title="Report"
                                   data-content="Work Order Summary"><i class="fas fa-info mt-0 mx-1"></i></a>
                                <button type="button" id="btnDtRwsWoSummaryRefresh" class="btn btn-outline-white btn-rounded btn-sm px-2" data-toggle="tooltip" data-placement="top" title="Refresh data"><i class="fas fa-sync mt-0"></i></button>
                            </div>
                            <a href="javascript:void(0);" class="text-white mx-3 pl-5">Work Order Summary</a>
                            <div>
                                <div id="btnDtRwsWoSummaryExport"></div>
                            </div>
                        </div>
                        <div class="p-4">
                            <div class="table-responsive">
                                <table id="dtRwsWoSummary" class="table table-hover table-bordered mb-0 display responsive" cellspacing="0" width="100%">
                                    <thead>
                                    <tr class="th-strong text-center rgba-blue-grey-strong">
                                        <th rowspan="2" style="vertical-align: middle">Work Type</th>
                                        <th colspan="2" id="thRwsSiteDesc0"></th>
                                        <th colspan="2" id="thRwsSiteDesc1"></th>
                                        <th colspan="2" id="thRwsSiteDesc2"></th>
                                        <th colspan="2" id="thRwsSiteDesc3"></th>
                                    </tr>
                                    <tr class="th-strong rgba-blue-grey-light">
                                        <th class="text-center">Open</th>
                                        <th class="text-center">Closed</th>
                                        <th class="text-center">Open</th>
                                        <th class="text-center">Closed</th>
                                        <th class="text-center">Open</th>
                                        <th class="text-center">Closed</th>
                                        <th class="text-center">Open</th>
                                        <th class="text-center">Closed</th>
                                    </tr>
                                    </thead>
                                    <tbody class="rgba-blue-grey-slight"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </div>

    <div class="includeHtml" id="h-modal_change_password"></div>

</main>

<!-- SCRIPTS -->

<!--Custom scripts-->
<script type="text/javascript">
    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let changePasswordClass_;
    let reportWoSummary_;

    document.addEventListener('DOMContentLoaded', function () {

        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                reportWoSummary_ = new MainReportWoSummary();

                const refStatus_ = mzGetLocalArray('gems_status', versionLocal_, 'statusId');
                const refClient_ = mzGetLocalArray('gems_client', versionLocal_, 'clientId', [], 'client');
                const refSite_ = mzGetLocalArray('gems_site', versionLocal_, 'siteId', [], 'site');

                reportWoSummary_.setRefStatus(refStatus_);
                reportWoSummary_.setRefClient(refClient_);
                reportWoSummary_.setRefSite(refSite_);
                reportWoSummary_.init();
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }

            HideLoader();
        }, 300);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_report_wo_summary.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>
