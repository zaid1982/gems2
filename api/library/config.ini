; ------------------------------------------------------------
; Mail configuration (used by PHP mail() wrapper)
; These values control the visible From header and the envelope sender (-f)
; When integrating with Exchange, ensure these identities are permitted (Send As)
[mail]
; Default display/sender address shown to recipients
mail_from = gems-support@globalfm.com.my
; Envelope sender used for Return-Path and bounce handling
mail_envelope_from = gems-support@globalfm.com.my

; ------------------------------------------------------------
; SMTP configuration for direct Exchange Online sending (used by Class_email::send_email_365)
; Do NOT commit real credentials. Use environment overrides or secure vault in production.
[smtp]
; Exchange Online hostname and port
host = smtp.office365.com
port = 587
; Security mode: STARTTLS (recommended), TLS, or PLAIN (not recommended)
security = STARTTLS
; Auth credentials (use an account allowed to send as mail_envelope_from)
m_username = gems-support@globalfm.com.my
m_password = GFMphase@3
; Optional: socket timeout in seconds
timeout = 30

