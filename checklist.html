<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>GEMS 2.0</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Material Design Bootstrap -->
    <link rel="stylesheet" href="css/mdb.min.css">
    <!-- DataTables.net -->
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/dataTables.bootstrap4.min.css"/>
    <!-- Your custom styles (optional) -->
    <link href="css/style.css" rel="stylesheet">
    <!-- Your custom styles (optional) -->
    <style>

    </style>
    <!-- JQuery -->
    <script type="text/javascript" src="js/jquery-3.4.0.min.js"></script>
</head>

<body class="fixed-sn light-blue-skin">
<!--Main Navigation-->
<header>
    <!-- Sidebar navigation -->
    <div class="includeHtml" id="h-nav_left"></div>
    <!-- Navbar -->
    <div class="includeHtml" id="h-nav_top"></div>
</header>
<!--Main layout-->
<main>
    <div class="container-fluid">
        <!--Section: Main panel-->
        <section class="mb-5 mt-lg-5 sectionPcmMain">
            <div class="card card-cascade narrower">
                <!--Section: Search Function-->
                <section>
                    <div class="row">
                        <!--Search Function-->
                        <div class="col-xl-6 col-lg-12 mr-0">
                            <div class="view view-cascade gradient-card-header rgba-cyan-strong z-depth-4">
                                <h2 class="h2-responsive mb-0">Checklist Management</h2>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-8">
                            <div class="card-body card-body-cascade">
                                <div class="px-3 pt-3">
                                    <h6 class="pb-3">Search:</h6>
                                    <div class="row">
                                        <div class="col-md-12 select-outline">
                                            <select id="optPcmGroupId" class="mdb-select md-form md-outline colorful-select mt-0">
                                                <option value="" disabled>All Asset Group</option>
                                            </select>
                                            <label for="optPcmGroupId">Asset Group</label>
                                        </div>
                                        <div class="col-md-12 select-outline">
                                            <select id="optPcmCategoryId" class="mdb-select md-form md-outline colorful-select mt-0" data-stop-refresh="true">
                                                <option value="" disabled>All Asset Category</option>
                                            </select>
                                            <label for="optPcmCategoryId">Asset Category</label>
                                        </div>
                                        <div class="col-md-12 select-outline">
                                            <select id="optPcmTypeId" class="mdb-select md-form md-outline colorful-select mt-0" data-stop-refresh="true">
                                                <option value="" disabled>All Asset Type</option>
                                            </select>
                                            <label for="optPcmTypeId">Asset Type</label>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-12">
                                            <div class="md-form md-outline mt-0">
                                                <input type="text" id="txtPcmChecklistGroupSearch" class="form-control">
                                                <label for="txtPcmChecklistGroupSearch" class="active">Keyword Search</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <!--Section: Table-->
                <section>
                    <div class="card card-cascade narrower z-depth-0">
                        <div class="view view-cascade gradient-card-header aqua-gradient narrower py-2 mx-4 mb-3 d-flex justify-content-between align-items-center z-depth-3">
                            <div>
                                <a tabindex="0" role="button" class="btn btn-outline-white btn-rounded btn-sm px-2"
                                   data-toggle="popover" data-trigger="focus" title="Total Checklist by Asset Type"
                                   data-content="Total Checklist by Asset Type."><i class="fas fa-info mt-0 mx-1"></i></a>
                                <button type="button" id="btnDtPcmChecklistGroupRefresh" class="btn btn-outline-white btn-rounded btn-sm px-2" data-toggle="tooltip" data-placement="top" title="Refresh data"><i class="fas fa-sync mt-0"></i></button>
                            </div>
                            <a href="javascript:void(0);" class="text-white mx-3">Total Checklist by Asset Type</a>
                            <div>
                                <div id="btnDtPcmChecklistGroupExport"></div>
                            </div>
                        </div>
                        <div class="px-4 pb-5">
                            <div class="table-responsive">
                                <table id="dtPcmChecklistGroup" class="table table-hover mb-0 display responsive" cellspacing="0" width="100%">
                                    <thead>
                                    <tr class="th-strong">
                                        <th scope="row" style="width: 4%">#</th>
                                        <th>Asset Group</th>
                                        <th>Asset Category</th>
                                        <th>Asset Type</th>
                                        <th style="width: 15%">Total Checklist</th>
                                        <th style="min-width: 42px"></th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
                <!--Section: Table Checklist-->
                <section id="divPcmChecklistSelected">
                    <div class="card card-cascade narrower z-depth-0">
                        <div class="view view-cascade gradient-card-header aqua-gradient narrower py-2 mx-4 mb-3 d-flex justify-content-between align-items-center z-depth-3">
                            <div>
                                <button type="button" id="btnPcmChecklistAdd" class="btn btn-outline-white btn-rounded btn-sm px-2 material-tooltip-main" data-toggle="tooltip" data-placement="top" title="Add Checklist"><i class="fas fa-plus mt-0"></i></button>
                                <a tabindex="0" role="button" class="btn btn-outline-white btn-rounded btn-sm px-2"
                                   data-toggle="popover" data-trigger="focus" title="Checklist List"
                                   data-content="Checklist list by selected Asset Type."><i class="fas fa-info mt-0 mx-1"></i></a>
                                <button type="button" id="btnDtPcmChecklistRefresh" class="btn btn-outline-white btn-rounded btn-sm px-2" data-toggle="tooltip" data-placement="top" title="Refresh data"><i class="fas fa-sync mt-0"></i></button>
                            </div>
                            <a href="javascript:void(0);" class="text-white mx-3">Checklist List - <span id="lblPcmChecklistTitle" class="font-italic"></span></a>
                            <div>
                                <div id="btnDtPcmChecklistExport"></div>
                            </div>
                        </div>
                        <div class="px-4 pb-4">
                            <div class="table-responsive">
                                <table id="dtPcmChecklist" class="table table-hover mb-0 display responsive" cellspacing="0" width="100%">
                                    <thead>
                                    <tr class="th-strong">
                                        <th scope="row" style="width: 4%">#</th>
                                        <th>Checklist Name</th>
                                        <th>Version</th>
                                        <th>Registered Time</th>
                                        <th style="max-width: 70px">Status</th>
                                        <th style="width: 64px; min-width: 64px"></th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </section>
        <div class="includeHtml" id="h-section_checklist"></div>
    </div>
    <div class="includeHtml" id="h-modal_change_password"></div>
    <div class="includeHtml" id="h-modal_checklist_qual"></div>
    <div class="includeHtml" id="h-modal_checklist_quan"></div>
    <div class="includeHtml" id="h-modal_confirm_delete"></div>

</main>

<!-- SCRIPTS -->
<script type="text/javascript">
    $('.includeHtml').each(function () {
        const divId = $(this).attr('id');
        $('#'+divId).load('html/'+divId.substr(2)+'.html?' + new Date().valueOf());
    });
</script>

<script type="text/javascript" src="js/popper.min.js"></script>

<script type="text/javascript" src="js/bootstrap.js"></script>

<script type="text/javascript" src="js/mdb.js"></script>

<script type="text/javascript" src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>

<script type="text/javascript" src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>

<script type="text/javascript" src="js/vendor/datatables/js/vfs_fonts.js"></script>

<!--Custom scripts-->
<script type="text/javascript">
    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let changePasswordClass_;
    let modalConfirmDelete_;
    let checklistClass_;
    let sectionChecklistClass_;
    let modalChecklistQualClass_;
    let modalChecklistQuanClass_;

    document.addEventListener('DOMContentLoaded', function () {

        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                modalConfirmDelete_ = new ModalConfirmDelete();
                checklistClass_ = new MainChecklist();
                sectionChecklistClass_ = new SectionChecklist();
                modalChecklistQualClass_ = new ModalChecklistQual();
                modalChecklistQuanClass_ = new ModalChecklistQuan();

                const refStatus_ = mzGetLocalArray('gems_status', versionLocal_, 'statusId');
                const refAssetGroup_ = mzGetLocalArray('gems_assetGroup', versionLocal_, 'assetGroupId', [], 'asset_group');
                const refAssetCategory_ = mzGetLocalArray('gems_assetCategory', versionLocal_, 'assetCategoryId', [], 'asset_category');
                const refAssetType_ = mzGetLocalArray('gems_assetType', versionLocal_, 'assetTypeId', [], 'asset_type');
                const refUser_ = mzGetLocalArray('gems_user', versionLocal_, 'userId');
                const refFrequency_ = mzGetLocalArray('gems_frequency', versionLocal_, 'frequencyId');

                modalChecklistQualClass_.setRefFrequency(refFrequency_);
                modalChecklistQualClass_.setClassFrom(sectionChecklistClass_);
                modalChecklistQualClass_.init();

                modalChecklistQuanClass_.setRefFrequency(refFrequency_);
                modalChecklistQuanClass_.setClassFrom(sectionChecklistClass_);
                modalChecklistQuanClass_.init();

                sectionChecklistClass_.setClassFrom(checklistClass_);
                sectionChecklistClass_.setRefStatus(refStatus_);
                sectionChecklistClass_.setRefAssetGroup(refAssetGroup_);
                sectionChecklistClass_.setRefAssetCategory(refAssetCategory_);
                sectionChecklistClass_.setRefAssetType(refAssetType_);
                sectionChecklistClass_.setRefUser(refUser_);
                sectionChecklistClass_.setRefFrequency(refFrequency_);
                sectionChecklistClass_.setModalChecklistQualClass(modalChecklistQualClass_);
                sectionChecklistClass_.setModalChecklistQuanClass(modalChecklistQuanClass_);
                sectionChecklistClass_.setModalConfirmDeleteClass(modalConfirmDelete_);
                sectionChecklistClass_.init();

                checklistClass_.setRefStatus(refStatus_);
                checklistClass_.setRefAssetGroup(refAssetGroup_);
                checklistClass_.setRefAssetCategory(refAssetCategory_);
                checklistClass_.setRefAssetType(refAssetType_);
                checklistClass_.setSectionChecklistClass(sectionChecklistClass_);
                checklistClass_.setModalConfirmDeleteClass(modalConfirmDelete_);
                checklistClass_.init();
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }

            HideLoader();
        }, 300);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_checklist_qual.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_checklist_quan.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/section_checklist.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_confirm_delete.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_checklist.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>
