<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>GEMS 2.0</title>
	<!-- Browser icon -->
	<link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Material Design Bootstrap -->
    <link rel="stylesheet" href="css/mdb.min.css">
    <!-- DataTables.net -->
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/dataTables.bootstrap4.min.css"/>
    <!-- Your custom styles (optional) -->
    <link href="css/style.css?rnd=2" rel="stylesheet">
    <!-- Your custom styles (optional) -->
    <style>

    </style>
	<!-- JQuery -->
    <script type="text/javascript" src="js/jquery-3.7.0.min.js"></script>
	<!--JQuery Migrate-->
	<script type="text/javascript" src="js/jquery-migrate-3.4.0.min.js"></script>
</head>

<body class="fixed-sn light-blue-skin">
<!--Main Navigation-->
<header>
    <!-- Sidebar navigation -->
    <div class="includeHtml" id="h-nav_left"></div>
    <!-- Navbar -->
    <div class="includeHtml" id="h-nav_top"></div>
</header>
<!--Main layout-->
<main>
    <div class="container-fluid">
        <!--Section: Main panel-->
        <section class="mb-5 mt-lg-5 sectionSteMain">
            <div class="card card-cascade narrower">
                <div class="view view-cascade gradient-card-header aqua-gradient narrower py-2 mx-4 mb-3 d-flex justify-content-between align-items-center z-depth-3">
                    <div>
                        <button type="button" id="btnSteSiteAdd" class="btn btn-outline-white btn-rounded btn-sm px-2 material-tooltip-main" data-toggle="tooltip" data-placement="top" title="Add Site"><i class="fas fa-plus mt-0"></i></button>
                        <a tabindex="0" role="button" class="btn btn-outline-white btn-rounded btn-sm px-2"
                           data-toggle="popover" data-trigger="focus" title="Site List"
                           data-content="All site list available."><i class="fas fa-info mt-0 mx-1"></i></a>
                        <button type="button" id="btnDtSteSiteRefresh" class="btn btn-outline-white btn-rounded btn-sm px-2" data-toggle="tooltip" data-placement="top" title="Refresh data"><i class="fas fa-sync mt-0"></i></button>
                    </div>
                    <a href="javascript:void(0);" class="text-white mx-3">Site List</a>
                    <div>
                        <div id="btnDtSteSiteExport"></div>
                    </div>
                </div>
                <div class="px-4 pb-4">
                    <form class="form-inline md-form form-sm mt-4 mb-0 pb-0 float-right">
                        <div class="">
                            <i class="fas fa-search mt-2" aria-hidden="true"></i>
                            <input type="text" id="txtSteSiteSearch" class="form-control form-control-sm" style="width: 250px; max-width:250px">
                            <label for="txtSteSiteSearch" class="ml-4">Search</label>
                        </div>
                    </form>
                    <div class="table-responsive">
                        <table id="dtSteSite" class="table table-hover mb-0 display responsive" cellspacing="0" width="100%">
                            <thead>
                            <tr class="th-strong">
                                <th style="width: 4%">#</th>
                                <th style="width: 16%">Client</th>
                                <th>Site Name</th>
                                <th style="width: 10%">Site Code</th>
                                <th style="width: 12%">Has Work Request</th>
                                <th style="width: 12%">Has Public QR</th>
                                <th style="width: 12%">Status</th>
                                <th style="width: 60px; min-width: 60px"></th>
                            </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div class="includeHtml" id="h-modal_change_password"></div>
    <div class="includeHtml" id="h-modal_site"></div>
        <div class="includeHtml" id="h-modal_site_ptw_public"></div>
    <div class="includeHtml" id="h-modal_confirm_delete"></div>

</main>

<!-- SCRIPTS -->
<script type="text/javascript">
    $('.includeHtml').each(function () {
        const divId = $(this).attr('id');
        $('#'+divId).load('html/'+divId.substr(2)+'.html?' + new Date().valueOf());
    });
    // QR Code script
    document.write('<scr' + 'ipt type="text/javascript" src="js/vendor/qrCode/qrcode.min.js"></scr' + 'ipt>');
</script>

<!-- Bootstrap tooltips -->
<script type="text/javascript" src="js/popper.min.js"></script>
<!-- Bootstrap core JavaScript -->
<script type="text/javascript" src="js/bootstrap.js"></script>
<!-- MDB core JavaScript -->
<script type="text/javascript" src="js/mdb.min.js"></script>
<!-- Crypto JS -->
<script type="text/javascript" src="js/addons/crypto.js"></script>
<!-- DataTables.net -->
<script type="text/javascript" src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.bootstrap4.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.html5.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.print.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/jszip.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/pdfmake.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/vfs_fonts.js"></script>
<!-- Moment JavaScript -->
<script type="text/javascript" src="js/addons/moment.min.js"></script>

<!--Custom scripts-->
<script type="text/javascript">
    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let siteClass_;
    let changePasswordClass_;
    let modalSiteClass_;
    let modalConfirmDelete_;
    let modalSitePtwPublic_;

    document.addEventListener('DOMContentLoaded', function () {

        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                siteClass_ = new MainSite();
                modalSiteClass_ = new ModalSite();
                modalSitePtwPublic_ = new ModalSitePtwPublic();
                modalConfirmDelete_ = new ModalConfirmDelete();

                const refStatus_ = mzGetLocalArray('gems_status', versionLocal_, 'statusId');
                const refClient_ = mzGetLocalArray('gems_client', versionLocal_, 'clientId', [], 'client');

                modalSiteClass_.setRefClient(refClient_);
                modalSiteClass_.setRefStatus(refStatus_);
                modalSiteClass_.setClassFrom(siteClass_);
                modalSiteClass_.init();
                siteClass_.setVersionLocal(versionLocal_);
                siteClass_.setRefStatus(refStatus_);
                siteClass_.setRefClient(refClient_);
                siteClass_.setModalSiteClass(modalSiteClass_);
                siteClass_.setModalConfirmDeleteClass(modalConfirmDelete_);
                siteClass_.init();
                modalSitePtwPublic_.init();
                window.modalSitePtwPublicGlobal = modalSitePtwPublic_;
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }

            HideLoader();
        }, 300);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_site.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
        document.write('<scr' + 'ipt src="js/pages/modal_site_ptw_public.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_confirm_delete.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_site.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>

</body>
</html>
