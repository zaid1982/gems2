<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTW Redirect Test</title>
    <script src="js/jquery-3.7.0.min.js"></script>
</head>
<body>
    <h1>PTW Form Redirect Test</h1>
    <p>Testing the redirect functionality...</p>
    
    <button id="testRedirect">Test Redirect to PTW Management</button>
    
    <div id="output"></div>
    
    <script>
        $('#testRedirect').click(function() {
            $('#output').html('<p>Testing redirect in 2 seconds...</p>');
            
            setTimeout(() => {
                $('#output').append('<p>Redirecting now...</p>');
                window.location.href = 'ptw_management.html';
            }, 2000);
        });
        
        // Test if ptw_management.html exists
        $.get('ptw_management.html')
            .done(function() {
                $('#output').append('<p style="color: green;">✓ ptw_management.html exists and is accessible</p>');
            })
            .fail(function() {
                $('#output').append('<p style="color: red;">✗ ptw_management.html not found or not accessible</p>');
            });
    </script>
</body>
</html>
