<script type="text/javascript">
    $(function () {
        $("#mdb-lightbox-ui").load("mdb-addons/mdb-lightbox-ui.html");
    });

    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let changePasswordClass_;
    let modalConfirmDeleteClass_;
    // Renamed/New modal classes
    let modalPpmSetClass_;
    // let modalPpmSetSelectAssetClass_;
    // New section class if needed for managing assets within a set
    // let sectionPpmSetAssetsClass_;
    let mainPpmSetClass_; // Main controller for this page

    document.addEventListener('DOMContentLoaded', function () {
        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                modalConfirmDeleteClass_ = new ModalConfirmDelete();

                // 1. Instantiate the classes
                modalPpmSetClass_ = new ModalPpmSet();
                modalPpmSetSelectAssetClass_ = new ModalPpmSetSelectAsset(); // UNCOMMENTED THIS LINE

                mainPpmSetClass_ = new MainPpmSet(); // Instantiate Main class

                // 2. Load ALL reference data
                const refStatus_ = mzGetLocalArrayV2('gems_status2', versionLocal_, 'status/ref');
                const refUser_ = mzGetLocalArrayV2('gems_user2', versionLocal_, 'user/ref');
                const refSite_ = mzGetLocalArray('gems_site', versionLocal_, 'siteId', [], 'site');
                const refContract_ = mzGetLocalArray('gems_contract', versionLocal_, 'contractId', [], 'contract');
                const refAssetGroup_ = mzGetLocalArray('gems_assetGroup', versionLocal_, 'assetGroupId', [], 'asset_group');
                const refAssetCategory_ = mzGetLocalArray('gems_assetCategory', versionLocal_, 'assetCategoryId', [], 'asset_category');
                const refAssetType_ = mzGetLocalArray('gems_assetType', versionLocal_, 'assetTypeId', [], 'asset_type');
                const refPpmGroup_ = mzGetLocalArray('gems_ppmGroup', versionLocal_, 'ppmGroupId', [], 'ppm_group');

                // console log all references for debugging
                console.log('References Loaded:');
                console.log('Status:', refStatus_);
                console.log('User:', refUser_);
                console.log('Site:', refSite_);
                console.log('Contract:', refContract_);
                console.log('Asset Group:', refAssetGroup_);
                console.log('Asset Category:', refAssetCategory_);
                console.log('Asset Type:', refAssetType_);
                console.log('PPM Group:', refPpmGroup_);

                // 3. Pass references to modalPpmSetClass_ AND THEN initialize it
                modalPpmSetClass_.setRefAssetGroup(refAssetGroup_);
                modalPpmSetClass_.setRefAssetCategory(refAssetCategory_);
                modalPpmSetClass_.setRefAssetType(refAssetType_);
                modalPpmSetClass_.setRefPpmGroup(refPpmGroup_);
                modalPpmSetClass_.init();

                // 4. Set references for modalPpmSetSelectAssetClass_ AND THEN initialize it
                modalPpmSetSelectAssetClass_.setRefStatus(refStatus_); // Pass status for asset display
                // Add any other refs modalPpmSetSelectAssetClass_ might need (e.g., refAssetType, refAssetGroup for filters in the modal itself)
                modalPpmSetSelectAssetClass_.init(); // UNCOMMENTED THIS LINE

                // 5. Pass references to mainPpmSetClass_ AND THEN initialize it
                mainPpmSetClass_.setRefStatus(refStatus_);
                mainPpmSetClass_.setRefUser(refUser_);
                mainPpmSetClass_.setRefSite(refSite_);
                mainPpmSetClass_.setRefContract(refContract_);
                mainPpmSetClass_.setRefAssetGroup(refAssetGroup_);
                mainPpmSetClass_.setRefAssetCategory(refAssetCategory_);
                mainPpmSetClass_.setRefAssetType(refAssetType_);
                mainPpmSetClass_.setRefPpmGroup(refPpmGroup_);
                mainPpmSetClass_.setModalPpmSetClass(modalPpmSetClass_);
                mainPpmSetClass_.setModalPpmSetSelectAssetClass(modalPpmSetSelectAssetClass_); // UNCOMMENTED THIS LINE
                mainPpmSetClass_.init();

            } catch (e) { toastr['error'](e.message, _ALERT_TITLE_ERROR); }
            HideLoader();
        }, 200);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_confirm_delete.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    // New JS files for PPM Set management
    document.write('<scr' + 'ipt src="js/pages/modal_ppm_set.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_ppm_set_select_asset.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_ppm_set.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    // The old section_ppm_asset.js is not included as we are managing ppm_set here
    // document.write('<scr' + 'ipt src="js/pages/section_ppm_asset.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>
