<!DOCTYPE html>
<html>
<head>
    <title>Test PTW Submission with New Permit Numbers</title>
    <script src="js/jquery-3.7.0.min.js"></script>
</head>
<body>
    <h1>PTW Submission Test</h1>
    <button id="testSubmit">Test Submit PTW</button>
    <div id="result"></div>
    
    <script>
        $('#testSubmit').click(function() {
            $('#result').html('Testing PTW submission...');
            
            // Set test auth token
            sessionStorage.setItem('token', 'test_token_123');
            
            $.ajax({
                url: 'api/ptw.php',
                type: 'POST',
                data: {
                    action: 'create_permit',
                    description: 'Test submission with new permit number format',
                    work_area: 'Test Area',
                    work_type: 'HOT_WORK',
                    risk_level: 'HIGH',
                    valid_from: '2025-08-07',
                    valid_to: '2025-08-08',
                    applicant_name: 'Test User',
                    status: 'PENDING_SUPERVISOR'
                },
                headers: {
                    'Authorization': 'Bearer test_token_123'
                },
                success: function(response) {
                    console.log('Response:', response);
                    if (response.success) {
                        $('#result').html(`
                            <div style="color: green;">
                                ✓ SUCCESS!<br>
                                PTW Created: ${response.result || 'PTW submitted successfully'}<br>
                                Check console for full response details.
                            </div>
                        `);
                    } else {
                        $('#result').html(`
                            <div style="color: red;">
                                ✗ ERROR: ${response.error}<br>
                                Message: ${response.errmsg}
                            </div>
                        `);
                    }
                },
                error: function(xhr, status, error) {
                    console.error('AJAX Error:', xhr.responseText);
                    $('#result').html(`
                        <div style="color: red;">
                            ✗ AJAX ERROR: ${error}<br>
                            Response: ${xhr.responseText}
                        </div>
                    `);
                }
            });
        });
    </script>
</body>
</html>
