    <style>
        :root {
            --module-primary: #4338CA;
            --module-background: #F1F5F9;
            --module-text: #0F172A;
            --module-muted: #64748B;
            --module-radius: 26px;
            --module-shadow: 0 24px 60px -30px rgba(15, 23, 42, 0.45);
        }

        body {
            background: var(--module-background);
            color: var(--module-text);
        }

        .module-master {
            padding: 2.5rem 1.5rem 3.5rem;
        }

        .module-page-header {
            color: #fff;
            border-radius: var(--module-radius);
            padding: 2.4rem 2.9rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: var(--module-shadow);
        }

        .module-page-header::after {
            content: '';
            position: absolute;
            top: -90px;
            right: -70px;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
        }

        .module-page-header .header-text {
            position: relative;
            z-index: 1;
            max-width: 760px;
        }

        .module-page-header .header-subtitle {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: .12em;
            opacity: 0.82;
            margin-bottom: 0.8rem;
        }

        .module-details-card {
            background: #fff;
            border-radius: var(--module-radius);
            box-shadow: var(--module-shadow);
            padding: 2rem 2.4rem;
            margin-bottom: 2rem;
        }

        .module-details-card h5 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1.4rem;
            color: var(--module-text);
        }

        .module-details-card .md-form {
            margin-bottom: 1.4rem;
        }

        .module-details-card label {
            color: var(--module-muted);
        }

        .module-details-card .form-check-label {
            color: var(--module-text);
            font-weight: 600;
        }

        .module-details-card .btn {
            border-radius: 999px;
            font-weight: 600;
            padding: 0.55rem 1.2rem;
        }

        .module-user-card .module-card-header {
            padding-bottom: 1rem;
        }

        .module-user-card .module-table-wrapper {
            padding-bottom: 1.2rem;
        }

        #divPgrMain .dt-buttons {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        #divPgrMain .dt-buttons .btn {
            border-radius: 999px;
            background: rgba(67, 56, 202, 0.12);
            border: none;
            color: var(--module-primary);
        }

        @media (max-width: 992px) {
            .module-master {
                padding: 2.2rem 1.2rem 3rem;
            }

            .module-page-header {
                padding: 2.3rem 2.2rem;
            }

            .module-card-header,
            .module-table-wrapper,
            .results-summary,
            .filter-card,
            .module-details-card {
                padding-left: 1.6rem;
                padding-right: 1.6rem;
            }
        }

        @media (max-width: 768px) {
            .module-page-header {
                padding: 2rem 1.85rem;
            }

            .module-page-header .header-actions {
                width: 100%;
                justify-content: flex-start;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }

            .module-card-header {
                padding: 1.6rem 1.5rem 1.1rem;
            }

            .module-card-actions {
                width: 100%;
            }

            .module-card-actions .btn {
                width: auto;
            }

            .module-table-wrapper {
                padding: 0 1.5rem;
            }

            .module-table-wrapper thead {
                display: none;
            }

            .module-table-wrapper tbody tr {
                display: block;
                margin-bottom: 1.2rem;
                border: 1px solid rgba(15, 23, 42, 0.12);
                border-radius: 18px;
                box-shadow: 0 18px 40px -32px rgba(15, 23, 42, 0.65);
                padding: 0.9rem 1.1rem;
            }

            .module-table-wrapper tbody td {
                display: flex;
                justify-content: space-between;
                border: none;
                padding: 0.48rem 0;
                font-size: 0.95rem;
            }

            .module-table-wrapper tbody td::before {
                content: attr(data-label);
                font-weight: 600;
                color: var(--module-muted);
                margin-right: 1.3rem;
                text-align: left;
            }

            .module-details-card {
                padding: 1.7rem 1.5rem;
            }
        }
    </style>

<script type="text/javascript">
    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let changePasswordClass_;
    let ppmGroupClass_;
    let modalPpmGroupClass_;
    let modalPpmUserClass_;
    let modalConfirmDelete_;

    document.addEventListener('DOMContentLoaded', function () {

        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                ppmGroupClass_ = new MainPpmGroup();
                modalPpmGroupClass_ = new ModalPpmGroup();
                modalPpmUserClass_ = new ModalPpmUser();
                modalConfirmDelete_ = new ModalConfirmDelete();

                const refStatus_ = mzGetLocalArray('gems_status', versionLocal_, 'statusId');
                const refRole_ = mzGetLocalArray('gems_role', versionLocal_, 'roleId');
                const refUser_ = mzGetLocalArray('gems_user', versionLocal_, 'userId');
                const refClient_ = mzGetLocalArray('gems_client', versionLocal_, 'clientId', [], 'client');
                const refSite_ = mzGetLocalArray('gems_site', versionLocal_, 'siteId', [], 'site');

                modalPpmGroupClass_.setClassFrom(ppmGroupClass_);
                modalPpmGroupClass_.setRefRole(refRole_);
                modalPpmGroupClass_.setRefClient(refClient_);
                modalPpmGroupClass_.setRefSite(refSite_);
                modalPpmGroupClass_.init();

                modalPpmUserClass_.setClassFrom(ppmGroupClass_);
                modalPpmUserClass_.setRefRole(refRole_);
                modalPpmUserClass_.setRefClient(refClient_);
                modalPpmUserClass_.setRefSite(refSite_);
                modalPpmUserClass_.setRefUser(refUser_);
                modalPpmUserClass_.init();

                ppmGroupClass_.setRefStatus(refStatus_);
                ppmGroupClass_.setRefRole(refRole_);
                ppmGroupClass_.setRefUser(refUser_);
                ppmGroupClass_.setRefClient(refClient_);
                ppmGroupClass_.setRefSite(refSite_);
                ppmGroupClass_.setModalPpmGroupClass(modalPpmGroupClass_);
                ppmGroupClass_.setModalPpmUserClass(modalPpmUserClass_);
                ppmGroupClass_.setModalConfirmDeleteClass(modalConfirmDelete_);
                ppmGroupClass_.init();
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }

            HideLoader();
        }, 300);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_ppm_group.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_ppm_user.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_confirm_delete.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_ppm_group.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>
