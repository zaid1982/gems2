<!--Main layout-->
<main>
    <div class="container-fluid">
        <nav class="navbar navbar-dark blue-grey darken-3 z-depth-4 rounded mt-2 sectionAtcMain">
            <h5 class="navbar-text white-text font-weight-bold ml-4 mt-1">
                Attendance Configuration - Site List

        </nav>
        <section class="mt-4 mb-4 sectionAtcMain">
            <div class="row">
                <div class="col-md-12">
                    <div class="card z-depth-4">
                        <div class="card-body pb-1 px-3">
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="table-responsive">
                                        <table id="dtAtcData" class="table table-hover table-sm mt-3 mb-0 display responsive" style="width: 100%">

                                                <th>Client</th>
                                                <th>Site Name</th>
                                                <th>Site Code</th>

                                                <th>Site Status</th>

                                                <th>Total Participants</th>
                                                <th>Attendance Enabled</th>

                                            </tr>
                                            </thead>
                                            <tbody>
                                            </tbody>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

</main>

<!-- SCRIPTS -->
<script type="text/javascript">

        $('#' + divId).load('html/' + divId.substr(2) + '.html?' + new Date().valueOf());

</script>

<!--Custom scripts-->
<script type="text/javascript">
    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let changePasswordClass_;
    let confirmSubmitClass_;
    let modalAttendanceGroupClass_;
    let sectionAttendanceConfigSiteClass_;
    let attendanceConfigClass_;

    document.addEventListener('DOMContentLoaded', function () {

        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                confirmSubmitClass_ = new ModalConfirmSubmit();
                modalAttendanceGroupClass_ = new ModalAttendanceGroup();
                sectionAttendanceConfigSiteClass_ = new SectionAttendanceConfigSite();
                attendanceConfigClass_ = new MainAttendanceConfig();

                const refStatus_ = mzGetLocalArray('gems_status', versionLocal_, 'statusId');
                const refClient_ = mzGetLocalArray('gems_client', versionLocal_, 'clientId', [], 'client');

                modalAttendanceGroupClass_.setClassFrom(sectionAttendanceConfigSiteClass_);
                modalAttendanceGroupClass_.init();

                sectionAttendanceConfigSiteClass_.setRefStatus(refStatus_);
                sectionAttendanceConfigSiteClass_.setModalAttendanceGroupClass(modalAttendanceGroupClass_);
                sectionAttendanceConfigSiteClass_.setClassFrom(attendanceConfigClass_);
                sectionAttendanceConfigSiteClass_.init();

                attendanceConfigClass_.setRefStatus(refStatus_);
                attendanceConfigClass_.setRefClient(refClient_);
                attendanceConfigClass_.setModalConfirmSubmitClass(confirmSubmitClass_);
                attendanceConfigClass_.setSectionAttendanceConfigSiteClass(sectionAttendanceConfigSiteClass_);
                attendanceConfigClass_.init();
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }
            HideLoader();
        }, 200);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_confirm_submit.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_attendance_group.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/section_attendance_config_site.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_attendance_config.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>
