<body class="fixed-sn light-blue-skin">
<!--Main Navigation-->
<header>

    <!-- Navbar -->

</header>
<!--Main layout-->

<main>
    <div class="container-fluid">
        <!--Section: Main panel-->
        <section class="mb-5 mt-lg-5 sectionPtwMain">
            <div class="card card-cascade narrower">
                <!--Section: Search Function & Chart-->
                <section>
                    <div class="row">
                        <!--Search Function-->
                        <div class="col-xl-5 col-lg-12 mr-0">
                            <div class="view view-cascade gradient-card-header rgba-cyan-strong z-depth-4">
                                <h2 class="h2-responsive mb-0">PTW Management</h2>
                            </div>
                            <div class="card-body card-body-cascade">
                                <div class="px-3 pt-3">
                                    <h6 id="lblPtwSiteName"></h6>
                                    <h6 class="mt-3">Status:</h6>
                                    <div class="mt-1 pb-2">
                                        <ul class="striped list-unstyled pl-2">
                                            <li><a href="javascript:void(0);" class="linkPtwStatus" id="linkPtwAll"></a></li>
                                            <li><a href="javascript:void(0);" class="linkPtwStatus" id="linkPtwDraft"></a></li>
                                            <li><a href="javascript:void(0);" class="linkPtwStatus" id="linkPtwPendingSupervisor"></a></li>
                                            <li><a href="javascript:void(0);" class="linkPtwStatus" id="linkPtwPendingShe"></a></li>
                                            <li><a href="javascript:void(0);" class="linkPtwStatus" id="linkPtwPendingFm"></a></li>
                                            <li><a href="javascript:void(0);" class="linkPtwStatus" id="linkPtwApproved"></a></li>
                                            <li><a href="javascript:void(0);" class="linkPtwStatus" id="linkPtwActive"></a></li>
                                            <li><a href="javascript:void(0);" class="linkPtwStatus" id="linkPtwCompleted"></a></li>
                                            <li><a href="javascript:void(0);" class="linkPtwStatus" id="linkPtwCancelled"></a></li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!--Chart-->
                        <div class="col-xl-7 col-lg-12">
                            <div class="view view-cascade z-depth-4">
                                <div id="chartPtwByStatus" style="height: 537px; margin: 0"></div>
                            </div>
                            <div class="card-body">
                                <div class="px-3 mt-4_5">
                                    <div class="row">
                                        <div class="col-md-7 select-outline">
                                            <select id="optPtwColumns" class="mdb-select md-form md-outline colorful-select mt-0" multiple>
                                                <option value="" disabled>Choose Column Visibility</option>
                                                <option value="1" selected>Date</option>
                                                <option value="2" selected>Permit No.</option>
                                                <option value="3" selected>Description</option>
                                                <option value="4">Site</option>
                                                <option value="5">Work Area</option>
                                                <option value="6" selected>Work Type</option>
                                                <option value="7" selected>Applicant</option>
                                                <option value="8">Risk Level</option>
                                                <option value="9" selected>Status</option>
                                                <option value="10" selected>Valid From</option>
                                                <option value="11" selected>Valid To</option>
                                                <option value="12">Workers Count</option>
                                                <option value="13">Contractor</option>
                                                <option value="14" selected>Created By</option>
                                                <option value="21">Approved Supervisor</option>
                                                <option value="22">Approved SHE</option>
                                                <option value="23">Approved FM</option>
                                                <option value="24">Supervisor Date</option>
                                                <option value="25">SHE Date</option>
                                                <option value="26">FM Date</option>
                                                <option value="27">Created Date</option>
                                            </select>
                                            <label for="optPtwColumns">Columns Visibility</label>
                                        </div>
                                        <div class="col-md-5">
                                            <div class="md-form md-outline mt-0">
                                                <input type="text" id="txtPtwSearch" class="form-control">
                                                <label for="txtPtwSearch" class="active">Keyword Search</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <!--Section: Table-->
                <section>
                    <div class="card card-cascade narrower z-depth-0">
                        <div class="view view-cascade gradient-card-header aqua-gradient narrower py-2 mx-4 mb-3 d-flex justify-content-between align-items-center z-depth-3">
                            <div>
                                <button type="button" id="btnPtwAdd" class="btn btn-outline-white btn-rounded btn-sm px-2 material-tooltip-main" data-toggle="tooltip" data-placement="top" title="Add New PTW Permit"><i class="fas fa-plus mt-0"></i></button>
                                <a tabindex="0" role="button" class="btn btn-outline-white btn-rounded btn-sm px-2"
                                   data-toggle="popover" data-trigger="focus" title="PTW Permit List"
                                   data-content="PTW Permit List for all permits filtered by selection."><i class="fas fa-info mt-0 mx-1"></i></a>
                                <button type="button" id="btnDtPtwRefresh" class="btn btn-outline-white btn-rounded btn-sm px-2" data-toggle="tooltip" data-placement="top" title="Refresh data"><i class="fas fa-sync mt-0"></i></button>
                            </div>
                            <a href="javascript:void(0);" class="text-white mx-3">PTW Permit List</a>
                            <div>
                                <div id="btnDtPtwExport"></div>
                            </div>
                        </div>
                        <div class="px-4 pb-4">
                            <div class="table-responsive">
                                <table id="dtPtw" class="table table-hover table-sm mb-0 display responsive" cellspacing="0" width="100%">
                                    <thead>
                                    <tr class="th-strong">
                                        <th style="width: 4%">#</th>
                                        <th>Created Date</th>
                                        <th>Permit No.</th>
                                        <th>Description</th>
                                        <th>Site</th>
                                        <th>Work Area</th>
                                        <th>Work Type</th>
                                        <th>Applicant</th>
                                        <th>Risk Level</th>
                                        <th>Status</th>
                                        <th>Valid From</th>
                                        <th>Valid To</th>
                                        <th>Workers Count</th>
                                        <th>Contractor</th>
                                        <th style="width: 8%">Created By</th>
                                        <th style="width: 90px; min-width: 90px"></th>
                                        <th></th>
                                        <th></th>
                                        <th></th>
                                        <th></th>
                                        <th></th>
                                        <th>Approved Supervisor</th>
                                        <th>Approved SHE</th>
                                        <th>Approved FM</th>
                                        <th>Supervisor Date</th>
                                        <th>SHE Date</th>
                                        <th>FM Date</th>
                                        <th>Created Date</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </section>
    </div>

    <div class="includeHtml" id="h-modal_change_password"></div>
    <div class="includeHtml" id="h-modal_pdf"></div>
    <div class="includeHtml" id="h-modal_create_ptw"></div>
</main>

<!--Custom scripts-->
<script type="text/javascript">
    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal;
    let changePasswordClass;
    let ptwClass_;
    let modalCreatePtw_;

    $('.divHmeTopStats_ppm').hide();

    document.addEventListener('DOMContentLoaded', function () {

        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass = new ModalChangePassword();
                ptwClass_ = new MainPtw();
                modalCreatePtw_= new ModalCreatePtw();

                const refSite_ = mzGetLocalArray('gems_site', versionLocal_, 'siteId', [], 'site');
                const refUser_ = mzGetLocalArray('gems_user', versionLocal_, 'userId');
                const refPpmGroup_ = mzGetLocalArray('gems_ppmGroup', versionLocal_, 'ppmGroupId', [], 'ppm_group');
                const refStatus_ = mzGetLocalArray('gems_status', versionLocal_, 'statusId');
                const userSite = mzGetUserInfoByParam('siteId');

                modalCreatePtw_.setClassFrom(ptwClass_);
                modalCreatePtw_.setSiteId(userSite);
                modalCreatePtw_.setRefSite(refSite_);
                modalCreatePtw_.setRefUser(refUser_);
                modalCreatePtw_.setRefPpmGroup(refPpmGroup_);
                modalCreatePtw_.init();

                ptwClass_.setUserSite(userSite);
                ptwClass_.setRefSite(refSite_);
                ptwClass_.setRefUser(refUser_);
                ptwClass_.setRefPpmGroup(refPpmGroup_);
                ptwClass_.setRefStatus(refStatus_);
                ptwClass_.setModalCreatePtw(modalCreatePtw_);
                ptwClass_.init();
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }

            HideLoader();
        }, 300);

        $('#btnPtwAdd').on('click', function () {
            window.location.href = '/ptw_form.html';
        });
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/modal_create_ptw.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_ptw.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>

</body>
</html>
