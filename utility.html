<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>GEMS 2.0</title>
	<!-- Browser icon -->
	<link rel="icon" type="image/png" href="img/icon/gfmicon.png" sizes="16x16">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Material Design Bootstrap -->
    <link rel="stylesheet" href="css/mdb.css?1">
    <!-- DataTables.net -->
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/dataTables.bootstrap4.min.css"/>
    <link rel="stylesheet" type="text/css" href="js/vendor/datatables/css/button.dataTables.min.css"/>
    <!-- Your custom styles (optional) -->
    <link href="css/style.css" rel="stylesheet">
    <!-- Your custom styles (optional) -->
    <style>

    </style>
	<!-- JQuery -->
    <script type="text/javascript" src="js/jquery-3.7.0.min.js"></script>
	<!--JQuery Migrate-->
	<script type="text/javascript" src="js/jquery-migrate-3.4.0.min.js"></script>
</head>
<body class="fixed-sn light-blue-skin">
<!--Main Navigation-->
<header>
    <!-- Sidebar navigation -->
    <div class="includeHtml" id="h-nav_left"></div>
    <!-- Navbar -->
    <div class="includeHtml" id="h-nav_top"></div>
</header>
<!--Main layout-->
<main>
    <div class="container-fluid">
        <nav class="navbar navbar-dark blue-grey darken-3 z-depth-4 rounded mt-2 sectionUtmMain">
            <h5 class="navbar-text white-text font-weight-bold ml-4 mt-1">
                Utility Management
            </h5>
        </nav>

        <section class="mb-4 z-depth-4 sectionUtmMain">
            <div class="mt-4">
                <ul class="nav nav-tabs md-tabs blue-grey lighten-1 mx-0">
                    <li class="nav-item">
                        <a class="nav-link active" id="tabPpgElectricityJust" data-toggle="tab" href="#tabPpgElectricity" role="tab" aria-controls="tabPpgElectricity"
                           aria-selected="true"><i class="fas fa-fire pr-2"></i>Electricity</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="tabPpgWaterJust" data-toggle="tab" href="#tabPpgWater" role="tab" aria-controls="tabPpgWater"
                           aria-selected="true"><i class="fas fa-water pr-2"></i>Water</a>
                    </li>
                </ul>
            </div>
            <div class="tab-content rounded-bottom card pt-5" id="myTabPpg">
                <div class="tab-pane fade show active" id="tabPpgElectricity" role="tabpanel" aria-labelledby="tabPpgElectricityJust">
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="mb-4" id="chartUtmKwh" style="height: 350px; margin: 0;"></div>
                            <div class="mb-4" id="chartUtmMd" style="height: 300px; margin: 0;"></div>
                            <div class="mb-4" id="chartUtmRm" style="height: 350px; margin: 0;"></div>
                        </div>
                        <div class="col-lg-6">
                            <div class="table-responsive">
                                <table id="dtUtmMonthlyData" class="table table-hover table-sm mb-0 display responsive" style="width: 100%">
                                    <thead>
                                    <tr class="th-strong">
                                        <th>Month</th>
                                        <th>Consumption (kWh)</th>
                                        <th>Actual MD</th>
                                        <th>Maximum Demand</th>
                                        <th>CLC</th>
                                        <th>Charges (RM)</th>
                                        <th>Trend</th>
                                        <th>Trend</th>
                                        <th>Year</th>
                                        <th>Month</th>
                                    </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" id="tabPpgWater" role="tabpanel" aria-labelledby="tabPpgWaterJust">
                    <div class="row">
                        <div class="col-lg-7">
                            <div class="mb-4" id="chartUtmWaterM3" style="margin: 0;"></div>
                            <div class="mb-4" id="chartUtmWaterRm" style="margin: 0;"></div>
                        </div>
                        <div class="col-lg-5">
                            <div class="table-responsive">
                                <table id="dtUtmMonthlyWaterData" class="table table-hover table-sm mb-0 display responsive" style="width: 100%">
                                    <thead>
                                    <tr class="th-strong">
                                        <th>Month</th>
                                        <th>Domestic (m<sup>3</sup>)</th>
                                        <th>Charges (RM)</th>
                                        <th>Trend</th>
                                        <th>Trend</th>
                                        <th>Year</th>
                                        <th>Month</th>
                                    </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <div class="includeHtml" id="h-section_monthly_electricity"></div>
        <div class="includeHtml" id="h-section_monthly_water"></div>
    </div>

    <div class="includeHtml" id="h-modal_change_password"></div>
</main>

<!-- SCRIPTS -->
<script type="text/javascript">
    $('.includeHtml').each(function () {
        const divId = $(this).attr('id');
        $('#' + divId).load('html/' + divId.substr(2) + '.html?' + new Date().valueOf());
    });
</script>

<!-- Bootstrap tooltips -->
<script type="text/javascript" src="js/popper.min.js"></script>
<!-- Bootstrap core JavaScript -->
<script type="text/javascript" src="js/bootstrap.js"></script>
<!-- MDB core JavaScript -->
<script type="text/javascript" src="js/mdb.min.js"></script>
<!-- Crypto JS -->
<script type="text/javascript" src="js/addons/crypto.js"></script>
<!-- DataTables.net -->
<script type="text/javascript" src="js/vendor/datatables/js/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.bootstrap4.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.html5.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.print.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/buttons.colvis.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/jszip.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/pdfmake.min.js"></script>
<script type="text/javascript" src="js/vendor/datatables/js/vfs_fonts.js"></script>
<!-- Highchart -->
<script type="text/javascript" src="js/vendor/highcharts/highcharts.js"></script>
<script type="text/javascript" src="js/vendor/highcharts/modules/data.js"></script>
<script type="text/javascript" src="js/vendor/highcharts/modules/drilldown.js"></script>
<script type="text/javascript" src="js/vendor/highcharts/modules/exporting.js"></script>
<script type="text/javascript" src="js/vendor/highcharts/modules/export-data.js"></script>
<!-- Moment JavaScript -->
<script type="text/javascript" src="js/addons/moment.min.js"></script>

<!--Custom scripts-->
<script type="text/javascript">
    document.write('<scr' + 'ipt src="js/common.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

    let versionLocal_;
    let changePasswordClass_;
    let sectionMonthlyElectricityClass_;
    let sectionMonthlyWaterClass_;
    let utilityClass_;

    document.addEventListener('DOMContentLoaded', function () {

        ShowLoader();
        setTimeout(function () {
            try {
                initiatePages();
                versionLocal_ = mzGetDataVersion();
                changePasswordClass_ = new ModalChangePassword();
                sectionMonthlyElectricityClass_ = new SectionMonthlyElectricity();
                sectionMonthlyWaterClass_ = new SectionMonthlyWater();
                utilityClass_ = new MainUtility();

                const refSite_ = mzGetLocalArray('gems_site', versionLocal_, 'siteId', [], 'site');
                const refUser_ = mzGetLocalArray('gems_user', versionLocal_, 'userId');

                sectionMonthlyElectricityClass_.setRefSite(refSite_);
                sectionMonthlyElectricityClass_.setRefUser(refUser_);
                sectionMonthlyElectricityClass_.setClassFrom(utilityClass_);
                sectionMonthlyElectricityClass_.init();

                sectionMonthlyWaterClass_.setRefSite(refSite_);
                sectionMonthlyWaterClass_.setRefUser(refUser_);
                sectionMonthlyWaterClass_.setClassFrom(utilityClass_);
                sectionMonthlyWaterClass_.init();

                utilityClass_.setRefSite(refSite_);
                utilityClass_.setSectionMonthlyElectricityClass(sectionMonthlyElectricityClass_);
                utilityClass_.setSectionMonthlyWaterClass(sectionMonthlyWaterClass_);
                utilityClass_.init();
            } catch (e) {
                toastr['error'](e.message, _ALERT_TITLE_ERROR);
            }

            HideLoader();
        }, 200);
    });

    document.write('<scr' + 'ipt src="js/pages/modal_change_password.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/section_monthly_electricity.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/section_monthly_water.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="js/pages/main_utility.js?' + new Date().valueOf() + '" type="text/javascript"></scr' + 'ipt>');

</script>

</body>
</html>
